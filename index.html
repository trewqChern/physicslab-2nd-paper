<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhysicsLab — পদার্থবিজ্ঞান ২য় পত্র (SoloLearn Style)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Hind Siliguri', 'system-ui', 'sans-serif'],
            bn: ['Hind Siliguri', 'Inter', 'sans-serif'],
          },
          colors: {
            solo: {
              blue: '#2493DF',
              blueDark: '#1B76B8',
              emerald: '#10B981',
              coral: '#EF4444',
              amber: '#F59E0B',
              navy: '#0F172A',
              card: '#1E293B',
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: 'Inter', 'Hind Siliguri', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .katex-display {
      margin: 0.4em 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
    }
    .math-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .math-scroll::-webkit-scrollbar {
      height: 5px;
    }
    .math-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.45);
      border-radius: 9999px;
    }
    .katex {
      font-size: 1.05em;
    }
    .formula-hero .katex {
      font-size: 1.28em;
    }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(36, 147, 223, 0.55); }
      70% { box-shadow: 0 0 0 12px rgba(36, 147, 223, 0); }
      100% { box-shadow: 0 0 0 0 rgba(36, 147, 223, 0); }
    }
    .node-active {
      animation: pulseRing 2.1s infinite;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .animate-shake {
      animation: shake 0.35s ease-in-out;
    }
    @keyframes popUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-pop {
      animation: popUp 0.25s ease-out forwards;
    }
    @keyframes floatXp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-42px) scale(1.15); }
    }
    .xp-float {
      animation: floatXp 0.9s ease-out forwards;
      pointer-events: none;
    }
    .blur-formula {
      filter: blur(8px);
      user-select: none;
      transition: filter 0.2s ease;
    }
    .blur-formula:hover {
      filter: blur(5px);
    }
    .lesson-connector {
      width: 3px;
      height: 22px;
      margin: 0 auto;
    }

    /* === BLACK & NEON NIGHT MODE === */
    html.dark,
    html.dark body,
    html.dark #lesson-overlay,
    html.dark #guide-overlay {
      background-color: #000000 !important;
      color: #e6f7ff !important;
    }
    html.dark header,
    html.dark #mobile-nav,
    html.dark #lesson-footer {
      background-color: rgba(0, 0, 0, 0.92) !important;
      border-color: rgba(0, 240, 255, 0.24) !important;
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.08);
    }
    html.dark .dark\:bg-slate-950,
    html.dark .dark\:bg-slate-950\/30,
    html.dark .dark\:bg-slate-950\/50 {
      background-color: #000000 !important;
    }
    html.dark .dark\:bg-slate-900,
    html.dark .dark\:bg-slate-900\/95,
    html.dark .dark\:bg-slate-900\/70 {
      background-color: #060911 !important;
    }
    html.dark .dark\:bg-slate-800,
    html.dark .dark\:bg-slate-800\/80,
    html.dark .dark\:bg-slate-800\/70,
    html.dark .dark\:bg-slate-800\/60,
    html.dark .dark\:bg-slate-800\/50 {
      background-color: #0c1220 !important;
    }
    html.dark .dark\:border-slate-800,
    html.dark .dark\:border-slate-800\/80,
    html.dark .dark\:border-slate-700,
    html.dark .dark\:border-slate-700\/70 {
      border-color: rgba(0, 240, 255, 0.22) !important;
    }
    html.dark .rounded-2xl.dark\:bg-slate-900 {
      box-shadow: none;
    }
    html.dark .rounded-2xl.dark\:bg-slate-900:hover {
      border-color: rgba(0, 240, 255, 0.48) !important;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.14);
    }
    html.dark .bg-cyan-600 {
      background: linear-gradient(135deg, #00f0ff 0%, #00c2ff 100%) !important;
      color: #000000 !important;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.38);
    }
    html.dark .formula-hero {
      background: radial-gradient(circle at top, rgba(0, 240, 255, 0.14), #04070e 75%) !important;
      border-color: rgba(0, 240, 255, 0.55) !important;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.18), inset 0 0 18px rgba(176, 38, 255, 0.12) !important;
      color: #f0fdff !important;
    }
    html.dark .formula-hero .katex {
      color: #7df9ff !important;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.35);
    }
    html.dark .bg-\[\#2493DF\] {
      background: linear-gradient(135deg, #00d2ff 0%, #7c3aed 100%) !important;
      color: #000000 !important;
      font-weight: 800;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
    }
    html.dark .bg-indigo-600 {
      background: linear-gradient(135deg, #b026ff 0%, #00d2ff 100%) !important;
      color: #000000 !important;
      box-shadow: 0 0 16px rgba(176, 38, 255, 0.4);
    }
    html.dark .text-\[\#2493DF\],
    html.dark .dark\:text-sky-300,
    html.dark .dark\:text-sky-400 {
      color: #00f0ff !important;
    }
    html.dark .dark\:text-emerald-400,
    html.dark .dark\:text-emerald-300 {
      color: #00ff9d !important;
    }
    html.dark .dark\:text-rose-400,
    html.dark .dark\:text-rose-300,
    html.dark .dark\:text-pink-300 {
      color: #ff2a85 !important;
    }
    html.dark .dark\:text-amber-400,
    html.dark .dark\:text-amber-300 {
      color: #ffb800 !important;
    }
    html.dark .dark\:text-indigo-300,
    html.dark .dark\:text-indigo-400,
    html.dark .dark\:text-violet-300 {
      color: #d580ff !important;
    }
    html.dark .node-active {
      box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.75);
      animation: neonPulseRing 2s infinite;
    }
    @keyframes neonPulseRing {
      0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7), 0 0 16px rgba(0, 240, 255, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(0, 240, 255, 0), 0 0 22px rgba(176, 38, 255, 0.35); }
      100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0), 0 0 16px rgba(0, 240, 255, 0.5); }
    }
    html.dark .bg-gradient-to-r.from-indigo-600 {
      background: linear-gradient(135deg, #0b0618 0%, #15072b 50%, #041824 100%) !important;
      border: 1px solid rgba(176, 38, 255, 0.55) !important;
      box-shadow: 0 0 22px rgba(176, 38, 255, 0.22), inset 0 0 20px rgba(0, 240, 255, 0.08) !important;
    }
    html.dark .bg-gradient-to-r.from-\[\#2493DF\],
    html.dark .bg-gradient-to-br.from-\[\#2493DF\] {
      background: linear-gradient(135deg, #031522 0%, #110726 60%, #051c29 100%) !important;
      border: 1px solid rgba(0, 240, 255, 0.45) !important;
      box-shadow: 0 0 26px rgba(0, 240, 255, 0.18) !important;
    }
    html.dark svg.bg-white {
      border-color: rgba(0, 240, 255, 0.5) !important;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.16);
    }
    html.dark .math-scroll::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.45);
    }
  </style>
</head>
<body class="bg-[#F4F6FA] dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 pb-20 md:pb-8">

  <!-- TOP HUD HEADER -->
  <header id="main-header" class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-5xl mx-auto px-3 sm:px-5 h-14 flex items-center justify-between gap-2">
      <!-- Brand -->
      <button id="brand-btn" class="flex items-center gap-2 text-left group focus:outline-none">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#2493DF] to-indigo-600 flex items-center justify-center text-white shadow-sm group-hover:scale-105 transition-transform">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="2.2"></circle>
            <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(35 12 12)"></ellipse>
            <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(-35 12 12)"></ellipse>
          </svg>
        </div>
        <div class="leading-tight">
          <div class="font-extrabold text-sm sm:text-base tracking-tight text-slate-900 dark:text-white">PhysicsLab</div>
          <div class="text-[11px] font-medium text-slate-500 dark:text-slate-400 hidden sm:block">পদার্থবিজ্ঞান ২য় পত্র · ১৪৭ সূত্র · ৮০ ঢাবি প্রশ্ন</div>
        </div>
      </button>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center gap-1 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl">
        <button data-nav="learn" class="nav-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all">শিখুন</button>
        <button data-nav="practice" class="nav-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all">প্র্যাকটিস</button>
        <button data-nav="vault" class="nav-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all">সূত্র ভাণ্ডার</button>
        <button data-nav="profile" class="nav-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all">প্রোফাইল</button>
      </nav>

      <!-- HUD Stats & Toggles -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <div id="hud-streak" title="Streak" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800/60 text-amber-600 dark:text-amber-400 text-xs sm:text-sm font-bold">
          <span>🔥</span><span id="streak-val">0</span>
        </div>
        <div id="hud-xp" title="Total XP" class="relative flex items-center gap-1 px-2.5 py-1 rounded-full bg-sky-50 dark:bg-sky-950/50 border border-sky-200 dark:border-sky-800/60 text-[#2493DF] dark:text-sky-400 text-xs sm:text-sm font-bold">
          <span>⚡</span><span id="xp-val">0</span>
        </div>
        <button id="hearts-btn" title="Hearts (Tap to toggle Unlimited Practice Mode)" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800/60 text-rose-600 dark:text-rose-400 text-xs sm:text-sm font-bold hover:brightness-95 transition">
          <span>❤️</span><span id="hearts-val">5</span>
        </button>
        <button id="sound-toggle" title="Toggle Sound Effects" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <span id="sound-icon">🔊</span>
        </button>
        <button id="theme-toggle" title="Toggle Dark/Light Mode" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main id="app-main" class="max-w-5xl mx-auto px-3 sm:px-5 pt-4 sm:pt-6">
    <!-- Dynamic view injected here -->
  </main>

  <!-- FULL-SCREEN LESSON OVERLAY -->
  <div id="lesson-overlay" class="fixed inset-0 z-50 bg-[#F4F6FA] dark:bg-slate-950 hidden flex-col">
    <!-- Lesson Top Bar -->
    <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-3 sm:px-6 py-3">
      <div class="max-w-2xl mx-auto flex items-center gap-3">
        <button id="lesson-exit-btn" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 text-lg font-bold transition" title="Exit Lesson">✕</button>
        <div class="flex-1">
          <div id="lesson-progress-bars" class="flex gap-1 h-2.5"></div>
          <div class="flex items-center justify-between mt-1">
            <span id="lesson-title-label" class="text-xs font-semibold text-slate-500 dark:text-slate-400 truncate"></span>
            <span id="lesson-step-label" class="text-xs font-bold text-[#2493DF]"></span>
          </div>
        </div>
        <div id="lesson-hearts-badge" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 text-xs font-bold">
          <span>❤️</span><span id="lesson-hearts-count">5</span>
        </div>
      </div>
    </div>

    <!-- Lesson Stage -->
    <div id="lesson-body" class="flex-1 overflow-y-auto px-3 sm:px-6 py-5">
      <div id="lesson-card-wrap" class="max-w-2xl mx-auto"></div>
    </div>

    <!-- Lesson Action Footer / Feedback Drawer -->
    <div id="lesson-footer" class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-3 sm:px-6 py-3.5 transition-colors">
      <div id="lesson-footer-inner" class="max-w-2xl mx-auto"></div>
    </div>
  </div>

  <!-- FULL-SCREEN CHAPTER VARSITY GUIDE OVERLAY -->
  <div id="guide-overlay" class="fixed inset-0 z-50 bg-slate-50 dark:bg-slate-950 hidden flex-col">
    <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-3 sm:px-6 py-3">
      <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          <button id="guide-close-btn" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 text-lg font-bold transition shrink-0" title="Close Guide">✕</button>
          <div class="min-w-0">
            <div id="guide-ch-badge" class="text-[11px] font-extrabold uppercase tracking-wider text-indigo-600 dark:text-indigo-400"></div>
            <h2 id="guide-ch-title" class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white truncate"></h2>
          </div>
        </div>
        <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full bg-indigo-50 dark:bg-indigo-950/70 text-indigo-700 dark:text-indigo-300 text-xs font-extrabold shrink-0">DU 'ক' রিভিশন নোট</span>
      </div>
      <div id="guide-tabs" class="max-w-3xl mx-auto flex gap-1.5 mt-3 overflow-x-auto pb-0.5"></div>
    </div>
    <div id="guide-body" class="flex-1 overflow-y-auto px-3 sm:px-6 py-5">
      <div id="guide-content-wrap" class="max-w-3xl mx-auto space-y-4"></div>
    </div>
  </div>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <nav id="mobile-nav" class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 px-2 py-1.5 flex justify-around">
    <button data-nav="learn" class="m-nav-tab flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-xs font-semibold">
      <span class="text-lg leading-none">🗺️</span><span>শিখুন</span>
    </button>
    <button data-nav="practice" class="m-nav-tab flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-xs font-semibold">
      <span class="text-lg leading-none">⚡</span><span>প্র্যাকটিস</span>
    </button>
    <button data-nav="vault" class="m-nav-tab flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-xs font-semibold">
      <span class="text-lg leading-none">📚</span><span>ভাণ্ডার</span>
    </button>
    <button data-nav="profile" class="m-nav-tab flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-xs font-semibold">
      <span class="text-lg leading-none">🏆</span><span>প্রোফাইল</span>
    </button>
  </nav>

  <!-- IN-PAGE MODAL -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div id="modal-box" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl max-w-md w-full p-5 shadow-2xl animate-pop">
      <h3 id="modal-title" class="text-lg font-bold text-slate-900 dark:text-white mb-2"></h3>
      <div id="modal-content" class="text-sm text-slate-600 dark:text-slate-300 mb-5"></div>
      <div id="modal-actions" class="flex justify-end gap-2"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-4 py-2 rounded-full text-sm font-semibold shadow-lg opacity-0 pointer-events-none transition-opacity duration-200"></div>

  <script>
    // =========================================================================

text{K}^{-1}\\)", "context": "<b>সংজ্ঞা:<\/b> \\(1\\text{ kg}\\) ভরের বস্তুর তাপমাত্রা \\(1\\text{ K}\\) বাড়াতে প্রয়োজনীয় তাপ।<br><b>মনে রাখো:<\/b> এটি শুধু উপাদানের ধর্ম (ভরের ওপর নির্ভর করে না)। পানির আপেক্ষিক তাপ খুব বেশি বলে এটি উত্তম শীতলীকারক।", "intuition": "আপেক্ষিক তাপ হলো পদার্থের 'তাপীয় জেদ'—একই \\(1\\text{ kg}\\) লোহা আর \\(1\\text{ kg}\\) পানিকে একই রোদে রাখলে লোহা দ্রুত তেতে ওঠে কিন্তু পানি সহজে গরম হয় না। কারণ পানির আপেক্ষিক তাপ (\\(4200\\)) অনেক বেশি; এটি তাপ ধরে রাখার এক দারুণ স্পঞ্জ, তাই গাড়ির রেডিয়েটরে পানি ব্যবহৃত হয়।", "trap": "বরফ (\\(2100\\)) ও জলীয় বাষ্পের (\\(2000\\)) বদলে ভুলে পানির মান \\(4200\\text{ J kg}^{-1}\\text{K}^{-1}\\) বসানো এবং সমোষ্ণ বা অবস্থা পরিবর্তনে \\(\\Delta T = 0\\) হওয়ায় কার্যকর \\(s = \\infty\\) ভুলে যাওয়া।", "quickExample": "\\(2\\text{ kg}\\) ভরের কোনো ধাতব খণ্ডের তাপমাত্রা \\(10\\text{ K}\\) বাড়াতে \\(8000\\text{ J}\\) তাপ লাগলে, \\(s = \\frac{8000}{2 \\times 10} = 400\\text{ J kg}^{-1}\\text{K}^{-1}\\)।"}, {"id": 8, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "কৃতকাজ ও তাপের সমতা", "question": "যান্ত্রিক শক্তি, তাপ ও তড়িৎ শক্তির সাথে কৃতকাজ \\(W\\) এর সম্পর্কসমূহ কী?", "answer": "\\(W = JH = mgh = \\frac{1}{2}mv^2 = ms\\Delta\\theta = I^2Rt = VIt = \\frac{V^2}{R}t\\)", "context": "<b>প্রতীক:<\/b> \\(J = 4.2\\text{ J cal}^{-1}\\) (তাপের যান্ত্রিক সমতা), \\(H\\) = ক্যালরি এককে তাপ।<br><b>প্রয়োগ:<\/b> জলপ্রপাত থেকে পানি পড়লে তাপমাত্রা বৃদ্ধি (\\(mgh = ms\\Delta\\theta\\)) বা বুলেট থামলে তাপ উৎপাদন (\\(\\frac{1}{2}mv^2 = ms\\Delta\\theta\\)) নির্ণয়ে ব্যবহৃত হয়।", "intuition": "শক্তি যেন এক দেশের টাকা থেকে অন্য দেশের টাকায় ভাঙানো—উঁচু জলপ্রপাত থেকে পড়া পানির বিভবশক্তি (\\(mgh\\)), ছুটন্ত বুলেটের গতিশক্তি (\\(\\frac{1}{2}mv^2\\)) বা হিটারের তড়িৎ শক্তি (\\(I^2Rt\\)) থেমে গেলে হারায় না, পুরোটা তাপে (\\(ms\\Delta\\theta\\)) রূপান্তরিত হয়। আর ক্যালরি থেকে জুলে ভাঙানোর বিনিময় হারই হলো \\(J = 4.2\\text{ J cal}^{-1}\\)।", "trap": "যান্ত্রিক শক্তির মাত্র একটি অংশ (যেমন \\(50\\%\\)) তাপে রূপান্তরিত হলে সেই ভগ্নাংশ গুণ করতে ভুলে যাওয়া, অথবা তাপ আগেই জুলে দেওয়া থাকলে অযথা \\(4.2\\) দিয়ে গুণ করা।", "quickExample": "\\(420\\text{ m}\\) উঁচু জলপ্রপাত থেকে পানি নিচে পড়লে সম্পূর্ণ বিভবশক্তি তাপে রূপান্তরিত হলে \\(mgh = ms\\Delta\\theta \\Rightarrow \\Delta\\theta = \\frac{9.8 \\times 420}{4200} = 0.98^\\circ\\text{C}\\)।"}, {"id": 9, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "যেকোনো প্রক্রিয়া", "question": "যেকোনো তাপগতীয় প্রক্রিয়ার জন্য আদর্শ গ্যাস সমীকরণ, ১ম সূত্র (\\(dQ\\)), অভ্যন্তরীণ শক্তি (\\(dU\\)) ও এন্ট্রপি পরিবর্তন (\\(dS\\)) কী?", "answer": "i. \\(PV = nRT\\) ও \\(\\frac{P_1V_1}{T_1} = \\frac{P_2V_2}{T_2}\\)<br>ii. \\(dQ = dU + dW\\)<br>iii. \\(dU = nC_VdT\\)<br>iv. \\(dS = nC_V\\ln\\left(\\frac{T_2}{T_1}\\right) + nR\\ln\\left(\\frac{V_2}{V_1}\\right)\\)", "context": "<b>চিহ্ন প্রথা:<\/b> তাপ শোষিত হলে \\(dQ \\gt  0\\), বর্জিত হলে \\(dQ \\lt  0\\); গ্যাস প্রসারিত হলে \\(dW \\gt  0\\), সংকুচিত হলে \\(dW \\lt  0\\)।<br><b>মূল কথা:<\/b> আদর্শ গ্যাসের অভ্যন্তরীণ শক্তি \\(U\\) কেবল তাপমাত্রা \\(T\\)-এর ওপর নির্ভরশীল।", "intuition": "তাপগতিবিদ্যার প্রথম সূত্র ঠিক মাসিক বেতনের হিসাবের মতো: তোমার পকেটে যে তাপ (\\(dQ\\)) ঢুকল, তার এক অংশ জমে সঞ্চয় বা অভ্যন্তরীণ শক্তি (\\(dU\\)) বাড়ায়, আর বাকি অংশ খরচ হয়ে বাইরের কাজে (\\(dW\\)) বেরিয়ে যায়। আদর্শ গ্যাসের সঞ্চয় \\(U\\) শুধুই তাপমাত্রার ওপর নির্ভর করে।", "trap": "গ্যাস নিজে প্রসারিত হলে \\(dW \\gt 0\\), কিন্তু বাইরে থেকে গ্যাসকে চাপ দিলে \\(dW \\lt 0\\); আর তাপ বর্জন করলে \\(dQ \\lt 0\\)—এই চিহ্ন প্রথা উল্টে ফেললেই \\(dU\\) ভুল আসে।", "quickExample": "কোনো সিস্টেমে \\(500\\text{ J}\\) তাপ সরবরাহ করলে এটি \\(200\\text{ J}\\) কাজ সম্পাদন করে; ফলে অভ্যন্তরীণ শক্তি বৃদ্ধি \\(dU = dQ - dW = 500 - 200 = 300\\text{ J}\\)।"}, {"id": 10, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "সমচাপ প্রক্রিয়া", "question": "সমচাপ প্রক্রিয়ায় (\\(P = \\text{const.}\\)) \\(V\\text{–}T\\) সম্পর্ক, এনথালপি পরিবর্তন (\\(dH\\)), কৃতকাজ (\\(dW\\)) ও এন্ট্রপি পরিবর্তন (\\(dS\\)) কী?", "answer": "i. \\(\\frac{V_1}{T_1} = \\frac{V_2}{T_2}\\)<br>ii. এনথালপি পরিবর্তন: \\(dH = nC_PdT\\)<br>iii. কৃতকাজ: \\(dW = PdV = nRdT\\)<br>iv. এন্ট্রপি পরিবর্তন: \\(dS = nC_P\\ln\\left(\\frac{T_2}{T_1}\\right)\\)", "context": "<b>শর্ত:<\/b> চাপ স্থির থাকে (\\(\\Delta P = 0\\))। এখানে সরবরাহকৃত তাপের একাংশ অভ্যন্তরীণ শক্তি বাড়ায় এবং বাকি অংশ কাজে রূপান্তরিত হয় (\\(dQ = nC_PdT\\))।", "intuition": "খোলা হাঁড়ির ওপরে একটা হালকা ঢাকনা রেখে গ্যাস গরম করার কথা ভাবো—চাপ সবসময় বায়ুচাপের সমান থাকে। তাপ দিলে গ্যাসের অণুগুলো যেমন দ্রুত ছোটে (\\(dU\\) বাড়ে), তেমনি ঢাকনাটাকে ওপরে ঠেলে তুলে কাজও করে (\\(dW = P\\,dV\\))। তাই এখানে দেওয়া তাপ দুটি ভাগে খরচ হয়।", "trap": "সমচাপ প্রক্রিয়ায় তাপমাত্রা \\(T\\) সেলসিয়াসে বসানো এবং মোট তাপ \\(dQ = nC_P\\,dT\\)-এর বদলে \\(nC_V\\,dT\\) বসানো খুব সাধারণ ভুল।", "quickExample": "\\(10^5\\text{ Pa}\\) স্থির চাপে কোনো গ্যাসের আয়তন \\(2\\text{ m}^3\\) থেকে \\(5\\text{ m}^3\\) হলে কৃতকাজ \\(W = P\\Delta V = 10^5 \\times (5 - 2) = 3 \\times 10^5\\text{ J}\\)।"}, {"id": 11, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "সমআয়তন প্রক্রিয়া", "question": "সমআয়তন প্রক্রিয়ায় (\\(V = \\text{const.}\\)) \\(P\\text{–}T\\) সম্পর্ক, তাপের পরিবর্তন, কৃতকাজ ও এন্ট্রপি পরিবর্তন কী?", "answer": "i. \\(\\frac{P_1}{T_1} = \\frac{P_2}{T_2}\\)<br>ii. \\(dQ = dU = nC_VdT\\)<br>iii. কৃতকাজ: \\(dW = PdV = 0\\text{ J}\\)<br>iv. এন্ট্রপি পরিবর্তন: \\(dS = nC_V\\ln\\left(\\frac{T_2}{T_1}\\right)\\)", "context": "<b>শর্ত:<\/b> আয়তন স্থির (\\(\\Delta V = 0\\)), তাই কোনো যান্ত্রিক কাজ হয় না (\\(dW = 0\\))। সম্পূর্ণ তাপই অভ্যন্তরীণ শক্তি পরিবর্তনে ব্যয় হয়।", "intuition": "মুখ বন্ধ শক্ত প্রেশার কুকারে গ্যাস গরম করার কথা ভাবো—দেয়াল নড়তে পারে না বলে আয়তন বদলায় না (\\(dV = 0\\)), তাই গ্যাস বাইরের কোনো কাজ করতে পারে না (\\(dW = 0\\))। ফলে চুলা থেকে দেওয়া প্রতিটি জুল তাপ সরাসরি অণুগুলোর গতিশক্তি (\\(dU\\)) ও ভেতরের চাপ বাড়াতে কাজে লাগে।", "trap": "চাপ দ্বিগুণ হলে কেলভিন তাপমাত্রা দ্বিগুণ হয়; সেলসিয়াস তাপমাত্রাকে সরাসরি দ্বিগুণ (যেমন \\(27^\\circ\\text{C} \\to 54^\\circ\\text{C}\\)) করাই সবচেয়ে বড় ফাঁদ।", "quickExample": "স্থির আয়তনে \\(27^\\circ\\text{C}\\) (\\(300\\text{ K}\\)) তাপমাত্রার গ্যাসের চাপ দ্বিগুণ করলে চূড়ান্ত তাপমাত্রা \\(T_2 = 2 \\times 300 = 600\\text{ K} = 327^\\circ\\text{C}\\)।"}, {"id": 12, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "সমোষ্ণ প্রক্রিয়া", "question": "সমোষ্ণ প্রক্রিয়ায় (\\(T = \\text{const.}\\)) চাপ-আয়তন সম্পর্ক, \\(dQ\\), \\(dU\\), কৃতকাজ (\\(W\\)) ও এন্ট্রপি পরিবর্তন (\\(dS\\)) কী?", "answer": "i. \\(P_1V_1 = P_2V_2\\)<br>ii. \\(dQ = dW\\), \\(dU = 0\\)<br>iii. \\(W = nRT\\ln\\left(\\frac{V_2}{V_1}\\right) = nRT\\ln\\left(\\frac{P_1}{P_2}\\right) = P_1V_1\\ln\\left(\\frac{V_2}{V_1}\\right) = P_1V_1\\ln\\left(\\frac{P_1}{P_2}\\right)\\)<br>iv. \\(dS = nR\\ln\\left(\\frac{V_2}{V_1}\\right) = nR\\ln\\left(\\frac{P_1}{P_2}\\right)\\)", "context": "<b>শর্ত:<\/b> তাপমাত্রা স্থির (\\(dT = 0\\)), এটি খুব ধীর প্রক্রিয়া এবং তাপ-সুপরিবাহী পাত্রে ঘটে।<br><b>মূল কথা:<\/b> \\(T\\) স্থির বলে \\(dU = 0\\), তাই শোষিত তাপের পুরোটাই কাজে পরিণত হয়। \\(R = 8.314\\text{ J mol}^{-1}\\text{K}^{-1}\\)।", "intuition": "সমোষ্ণ প্রক্রিয়া যেন খুব ধীরগতির এক ব্যালেন্স খেলা—গ্যাস প্রসারিত হয়ে কাজ করতে গিয়ে একটু ঠান্ডা হতে চাইলেই পরিবাহী দেয়াল দিয়ে বাইরে থেকে ঠিক ততটাই তাপ ঢুকে তাপমাত্রা স্থির রাখে। তাপমাত্রা না বদলানোয় গ্যাসের নিজস্ব সঞ্চয় \\(dU = 0\\), অর্থাৎ যতটুকু তাপ ঢুকল, পুরোটাই কাজে রূপান্তরিত হলো।", "trap": "কাজের সূত্রে আয়তনের অনুপাত \\(\\frac{V_2}{V_1}\\) হলেও চাপের ক্ষেত্রে তা উল্টে \\(\\frac{P_1}{P_2}\\) হয়। আর ক্যালকুলেটরে \\(\\ln\\)-এর বদলে \\(\\log_{10}\\) বসালে \\(2.303\\) দিয়ে গুণ করতে ভুলবে না।", "quickExample": "\\(27^\\circ\\text{C}\\) (\\(300\\text{ K}\\)) স্থির তাপমাত্রায় \\(1\\text{ mol}\\) আদর্শ গ্যাসের আয়তন দ্বিগুণ হলে কৃতকাজ \\(W = 1 \\times 8.314 \\times 300 \\times \\ln 2 \\approx 1728.5\\text{ J}\\)।"}, {"id": 13, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "রুদ্ধতাপীয় প্রক্রিয়া", "question": "রুদ্ধতাপীয় প্রক্রিয়ায় \\(P, V, T\\) সম্পর্ক, \\(dU\\), কৃতকাজ (\\(W\\)) এবং এন্ট্রপি পরিবর্তন (\\(dS\\)) কী?", "answer": "i. \\(P_1V_1^\\gamma = P_2V_2^\\gamma\\); \\(T_1V_1^{\\gamma-1} = T_2V_2^{\\gamma-1}\\); \\(T_1P_1^{\\frac{1-\\gamma}{\\gamma}} = T_2P_2^{\\frac{1-\\gamma}{\\gamma}}\\)<br>ii. \\(dU = -dW\\), \\(dS = 0\\)<br>iii. \\(W = nC_V(T_1 - T_2) = \\frac{nR}{\\gamma - 1}(T_1 - T_2) = \\frac{P_1V_1 - P_2V_2}{\\gamma - 1}\\)", "context": "<b>শর্ত:<\/b> তাপের আদান-প্রদান শূন্য (\\(dQ = 0\\)), এটি খুব দ্রুত প্রক্রিয়া (যেমন টায়ার ফাটা, শব্দ সঞ্চালন)।<br><b>ধারণা:<\/b> প্রত্যাবর্তী রুদ্ধতাপীয় প্রক্রিয়ায় এন্ট্রপি স্থির থাকে (\\(dS = 0\\))। প্রসারণে গ্যাস শীতল হয় (\\(T_2 \\lt  T_1\\))।", "intuition": "সাইকেলের টায়ার হঠাৎ ফেটে গেলে বের হওয়া বাতাস ঠান্ডা লাগে কেন? কারণ ঘটনাটি এত দ্রুত ঘটে যে বাইরে থেকে তাপ ঢোকার সময়ই পায় না (\\(dQ = 0\\))। তাই গ্যাসকে প্রসারিত হওয়ার কাজ নিজের পকেট (অভ্যন্তরীণ শক্তি) ভেঙে করতে হয়—ফলে গ্যাসের তাপমাত্রা ঝপ করে নেমে যায়।", "trap": "কৃতকাজের সূত্রে \\(T_1 - T_2\\)-এর বদলে \\(T_2 - T_1\\) বসালে চিহ্ন উল্টে যায়; আর \\(PV^\\gamma = \\text{const.}\\) ও \\(TV^{\\gamma-1} = \\text{const.}\\) সূত্রের ঘাত \\(\\gamma\\) ও \\(\\gamma - 1\\) গুলিয়ে ফেলা খুব সাধারণ ভুল।", "quickExample": "দ্বি-পরমাণুক \\(1\\text{ mol}\\) গ্যাস (\\(\\gamma = 1.4\\)) রুদ্ধতাপীয় প্রক্রিয়ায় \\(400\\text{ K}\\) থেকে \\(300\\text{ K}\\) এ প্রসারিত হলে কৃতকাজ \\(W = \\frac{1 \\times 8.314}{1.4 - 1}(400 - 300) = 2078.5\\text{ J}\\)।"}, {"id": 14, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "মোলার আপেক্ষিক তাপ", "question": "\\(C_P, C_V, R, \\gamma\\) এবং স্বাধীনতার মাত্রা \\(f\\) এর মধ্যে সম্পর্কগুলো কী?", "answer": "\\(C_P - C_V = R\\); \\(\\gamma = \\frac{C_P}{C_V}\\); \\(C_V = \\frac{R}{\\gamma - 1}\\); \\(\\gamma = 1 + \\frac{2}{f}\\)", "context": "<b>প্রতীক:<\/b> \\(C_P\\) = স্থির চাপে মোলার আপেক্ষিক তাপ; \\(C_V\\) = স্থির আয়তনে মোলার আপেক্ষিক তাপ; \\(R\\) = মোলার গ্যাস ধ্রুবক।<br><b>তথ্য:<\/b> সর্বদা \\(C_P \\gt  C_V\\) এবং \\(\\gamma \\gt  1\\)। \\(C_P - C_V = R\\) হলো মেয়ারের সম্পর্ক।", "intuition": "একই \\(1\\text{ mol}\\) গ্যাসের তাপমাত্রা \\(1\\text{ K}\\) বাড়াতে স্থির আয়তনে শুধু ভেতরের তাপমাত্রা বাড়ালেই চলে (\\(C_V\\)), কিন্তু স্থির চাপে তাপমাত্রা বাড়ানোর পাশাপাশি পিস্টন ঠেলার বাড়তি কাজও (\\(P\\Delta V = R\\)) করতে হয়। সেই বাড়তি কাজের দামই হলো \\(R\\), তাই সবসময় \\(C_P - C_V = R\\)।", "trap": "মোলার আপেক্ষিক তাপ \\(C_P, C_V\\) (\\(\\text{J mol}^{-1}\\text{K}^{-1}\\)) এবং ভরের আপেক্ষিক তাপ \\(c_p, c_v\\) (\\(\\text{J kg}^{-1}\\text{K}^{-1}\\)) গুলিয়ে ফেলো না; ভরের ক্ষেত্রে \\(c_p - c_v = \\frac{R}{M}\\) হয়।", "quickExample": "কোনো আদর্শ গ্যাসের \\(\\gamma = 1.5\\) হলে, \\(C_V = \\frac{R}{1.5 - 1} = 2R\\) এবং \\(C_P = C_V + R = 3R\\)।"}, {"id": 15, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "স্বাধীনতার মাত্রা", "question": "এক-পরমাণুক, দ্বি-পরমাণুক ও বহু-পরমাণুক গ্যাসের স্বাধীনতার মাত্রা (\\(f\\)) কত?", "answer": "এক-পরমাণুক: \\(3\\) • দ্বি-পরমাণুক: \\(5\\) • বহু-পরমাণুক: \\(6\\)", "context": "<b>\\(\\gamma\\)-এর মান:<\/b> এক-পরমাণুক (\\(\\text{He, Ne, Ar}\\)): \\(f=3 \\Rightarrow \\gamma = 1.67\\) • দ্বি-পরমাণুক (\\(\\text{O}_2, \\text{N}_2, \\text{H}_2\\)): \\(f=5 \\Rightarrow \\gamma = 1.40\\) • বহু-পরমাণুক (\\(\\text{CO}_2, \\text{CH}_4\\)): \\(f=6 \\Rightarrow \\gamma = 1.33\\)।", "intuition": "এক-পরমাণুক গ্যাস যেন একটি মসৃণ মার্বেল—সে শুধু তিন দিকে ছুটতে পারে (\\(f = 3\\))। দ্বি-পরমাণুক গ্যাস একটি ডাম্বেলের মতো—ছুটতেও পারে, আবার দুটি অক্ষের চারদিকে ঘুরতেও পারে (\\(f = 3 + 2 = 5\\))। বহু-পরমাণুক গ্যাস তিন অক্ষেই ঘুরতে পারে (\\(f = 6\\))। যত বেশি নাচন-কোঁদন (\\(f\\)), \\(\\gamma = 1 + \\frac{2}{f}\\) ততই কমে আসে।", "trap": "পারমাণবিকতা বাড়লে \\(f\\) বাড়ে কিন্তু \\(\\gamma\\) কমে (\\(1.67 \\gt 1.40 \\gt 1.33\\))—এই ক্রম উল্টে ফেলা এবং \\(\\text{CO}_2\\) বা \\(\\text{CH}_4\\)-কে দ্বি-পরমাণুক ভেবে ভুল করা।", "quickExample": "অক্সিজেন (\\(\\text{O}_2\\)) দ্বি-পরমাণুক গ্যাস হওয়ায় এর স্বাধীনতার মাত্রা \\(f = 5\\); সুতরাং \\(\\gamma = 1 + \\frac{2}{5} = 1.40\\)।"}, {"id": 16, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "রেখার ঢাল", "question": "\\(P\\text{–}V\\) লেখচিত্রে সমোষ্ণ ও রুদ্ধতাপীয় রেখার ঢাল কত?", "answer": "সমোষ্ণ রেখার ঢাল \\(= -\\frac{P}{V}\\)<br>রুদ্ধতাপীয় রেখার ঢাল \\(= \\gamma\\left(-\\frac{P}{V}\\right)\\)", "context": "<b>ধারণা:<\/b> যেহেতু \\(\\gamma \\gt  1\\), তাই রুদ্ধতাপীয় রেখা সমোষ্ণ রেখার চেয়ে \\(\\gamma\\) গুণ বেশি খাড়া (steeper)। উভয় ঢালই ঋণাত্মক।", "intuition": "একই বিন্দু থেকে দুটি গ্যাস প্রসারিত হচ্ছে: সমোষ্ণ প্রক্রিয়ায় তাপমাত্রা স্থির থাকায় চাপ ধীরে কমে, কিন্তু রুদ্ধতাপীয় প্রক্রিয়ায় আয়তন বাড়ার সাথে সাথে গ্যাস ঠান্ডাও হয়ে যায় বলে চাপ দ্বিগুণ গতিতে ধপ করে নেমে পড়ে। তাই \\(P\\text{–}V\\) গ্রাফে রুদ্ধতাপীয় রেখা সবসময় সমোষ্ণ রেখার চেয়ে \\(\\gamma\\) গুণ বেশি খাড়া ঢালে নামে।", "trap": "উভয় ঢালই ঋণাত্মক (আয়তন বাড়লে চাপ কমে), তাই চিহ্ন বাদ দেওয়া এবং রুদ্ধতাপীয় ও সমোষ্ণ ঢালের অনুপাত \\(\\gamma\\)-এর বদলে \\(\\frac{1}{\\gamma}\\) দাগানো এড়াতে হবে।", "quickExample": "কোনো বিন্দুতে \\(P = 200\\text{ Pa}, V = 4\\text{ m}^3\\) হলে দ্বি-পরমাণুক গ্যাসের (\\(\\gamma = 1.4\\)) সমোষ্ণ ঢাল \\(= -\\frac{200}{4} = -50\\text{ Pa m}^{-3}\\) এবং রুদ্ধতাপীয় ঢাল \\(= 1.4 \\times (-50) = -70\\text{ Pa m}^{-3}\\)।"}, {"id": 17, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "গ্যাস মিশ্রণ", "question": "একাধিক গ্যাসের মিশ্রণের তুল্য \\(\\gamma_{\\text{mix}}\\), তাপমাত্রা \\(T_{\\text{mix}}\\) এবং চাপ \\(P_{\\text{mix}}\\) নির্ণয়ের সূত্র কী?", "answer": "\\(\\frac{n_1+n_2+\\dots}{\\gamma_{\\text{mix}}-1} = \\frac{n_1}{\\gamma_1-1} + \\frac{n_2}{\\gamma_2-1} + \\dots\\)<br>\\(T_{\\text{mix}} = \\frac{n_1T_1 + n_2T_2 + \\dots}{n_1+n_2+\\dots}\\)<br>\\(P_{\\text{mix}} = \\frac{n_1P_1 + n_2P_2 + \\dots}{n_1+n_2+\\dots}\\)", "context": "<b>প্রতীক:<\/b> \\(n_1, n_2, \\dots\\) = উপাদান গ্যাসগুলোর মোল সংখ্যা; \\(\\gamma_1, \\gamma_2, \\dots\\) = তাদের আপেক্ষিক তাপের অনুপাত।<br><b>প্রয়োগ:<\/b> দুটি ভিন্ন পারমাণবিকতার আদর্শ গ্যাস মেশালে মিশ্রণের কার্যকর \\(\\gamma\\) বের করতে ব্যবহৃত হয়।", "intuition": "দুটি ভিন্ন গ্যাস এক পাত্রে মেশালে তাদের মোট শক্তি ও তাপ ধারণ ক্ষমতা (\\(nC_V\\)) সরাসরি যোগ হয়। যেহেতু \\(C_V = \\frac{R}{\\gamma - 1}\\), তাই আসলে \\(\\frac{n}{\\gamma - 1}\\) রাশিগুলো যোগ হয়—\\(\\gamma\\) নিজে সরাসরি গড় হয় না। এটাই মিশ্রণের \\(\\gamma_{\\text{mix}}\\) সূত্রের মূল যুক্তি।", "trap": "মিশ্রণের \\(\\gamma_{\\text{mix}}\\) বের করতে গিয়ে সরাসরি \\(\\frac{n_1\\gamma_1 + n_2\\gamma_2}{n_1 + n_2}\\) বসালে ভুল উত্তর আসবে—সবসময় \\(\\frac{n}{\\gamma - 1}\\) যোগ করে বের করতে হয়।", "quickExample": "\\(1\\text{ mol}\\) এক-পরমাণুক (\\(\\gamma_1 = \\frac{5}{3}\\)) ও \\(1\\text{ mol}\\) দ্বি-পরমাণুক (\\(\\gamma_2 = \\frac{7}{5}\\)) গ্যাস মেশালে \\(\\frac{2}{\\gamma_{\\text{mix}} - 1} = \\frac{1}{2/3} + \\frac{1}{2/5} = 1.5 + 2.5 = 4 \\Rightarrow \\gamma_{\\text{mix}} = 1.5\\)।"}, {"id": 18, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "এন্ট্রপি পরিবর্তন", "question": "একই তাপমাত্রায় (অবস্থার পরিবর্তনে) এবং পরিবর্তনশীল তাপমাত্রায় এন্ট্রপি পরিবর্তন \\(dS\\) এর সূত্র কী?", "answer": "i. একই তাপমাত্রায়: \\(dS = \\frac{dQ}{T} = \\frac{mL}{T}\\)<br>ii. পরিবর্তনশীল তাপমাত্রায়: \\(dS = \\int_{T_1}^{T_2}\\frac{dQ}{T} = \\int_{T_1}^{T_2}\\frac{ms\\,dT}{T} = ms\\ln\\left(\\frac{T_2}{T_1}\\right)\\)", "context": "<b>সতর্কতা:<\/b> \\(T, T_1, T_2\\) অবশ্যই <b>কেলভিন (K)<\/b> এককে বসাতে হবে।<br><b>একক:<\/b> \\(\\text{J K}^{-1}\\)। স্বতঃস্ফূর্ত ও অপ্রত্যাবর্তী প্রক্রিয়ায় মহাবিশ্বের এন্ট্রপি সর্বদা বৃদ্ধি পায় (\\(\\Delta S \\gt  0\\))।", "intuition": "এন্ট্রপি হলো অণুদের বিশৃঙ্খলার হিসাব। শান্ত লাইব্রেরিতে (কম তাপমাত্রা \\(T\\)) একটু শব্দ (তাপ \\(dQ\\)) করলে যতটা হইচই বা বিশৃঙ্খলা বাড়ে, কোলাহলপূর্ণ বাজারে (বেশি \\(T\\)) একই শব্দ করলে ততটা বোঝা যায় না। ঠিক তেমনি একই তাপ \\(dQ\\) কম তাপমাত্রায় যোগ করলে \\(\\frac{dQ}{T}\\) অর্থাৎ এন্ট্রপি বৃদ্ধি বেশি হয়।", "trap": "তাপমাত্রা বদলালে \\(ms\\ln\\left(\\frac{T_2}{T_1}\\right)\\) সূত্রে \\(T_1, T_2\\) অবশ্যই কেলভিনে বসাতে হবে; সেলসিয়াসে বসালে অনুপাতটি সম্পূর্ণ ভুল হয় (যেমন \\(0^\\circ\\text{C}\\) বসালে অসংজ্ঞায়িত হয়ে যায়)।", "quickExample": "\\(0^\\circ\\text{C}\\) (\\(273\\text{ K}\\)) তাপমাত্রার \\(1\\text{ kg}\\) বরফ গলে \\(0^\\circ\\text{C}\\) পানিতে পরিণত হলে এন্ট্রপি বৃদ্ধি \\(\\Delta S = \\frac{mL_f}{T} = \\frac{1 \\times 336000}{273} \\approx 1230.8\\text{ J K}^{-1}\\)।"}, {"id": 19, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "কার্নো ইঞ্জিন", "question": "কার্নো ইঞ্জিনের তাপ-তাপমাত্রার সম্পর্ক, কৃতকাজ \\(W\\) ও দক্ষতা \\(\\eta\\) এর সূত্র কী?", "answer": "i. \\(\\frac{T_1}{T_2} = \\frac{Q_1}{Q_2}\\)<br>ii. কৃতকাজ: \\(W = Q_1 - Q_2\\) [\\(Q_1 = W + Q_2\\)]<br>iii. দক্ষতা: \\(\\eta = \\left(1 - \\frac{T_2}{T_1}\\right)\\times 100\\% = \\left(1 - \\frac{Q_2}{Q_1}\\right)\\times 100\\%\\)", "context": "<b>প্রতীক:<\/b> \\(T_1, Q_1\\) = তাপ উৎসের তাপমাত্রা (K) ও শোষিত তাপ; \\(T_2, Q_2\\) = তাপ গ্রাহকের তাপমাত্রা (K) ও বর্জিত তাপ।<br><b>ধারণা:<\/b> \\(T_2 = 0\\text{ K}\\) না হলে \\(\\eta = 100\\%\\) সম্ভব নয়। দক্ষতা শুধু \\(T_1, T_2\\)-এর ওপর নির্ভরশীল।", "intuition": "তাপ ইঞ্জিন যেন একটি জলবিদ্যুৎ টারবাইন—পানি উঁচু পাহাড় (উৎস \\(T_1\\)) থেকে নিচু নদীতে (গ্রাহক \\(T_2\\)) নামার সময় চাকা ঘুরিয়ে কাজ (\\(W\\)) করে, আর বাকি পানি নিচে (\\(Q_2\\)) চলে যায়। পাহাড় আর নদীর উচ্চতার পার্থক্য (\\(T_1 - T_2\\)) যত বেশি, কাজের হার বা দক্ষতা \\(\\eta\\) ততই বেশি—কিন্তু \\(T_2 = 0\\text{ K}\\) না হলে \\(100\\%\\) দক্ষতা অসম্ভব।", "trap": "\\(T_1\\) ও \\(T_2\\) সেলসিয়াসে বসানো এবং উৎসের তাপমাত্রা \\(T_1\\) (বড় মান) ও গ্রাহকের তাপমাত্রা \\(T_2\\) (ছোট মান) অদলবদল করে ফেলা সবচেয়ে সাধারণ ভুল।", "quickExample": "একটি কার্নো ইঞ্জিন \\(500\\text{ K}\\) তাপ উৎস এবং \\(300\\text{ K}\\) তাপ গ্রাহকের মধ্যে কাজ করলে দক্ষতা \\(\\eta = \\left(1 - \\frac{300}{500}\\right) \\times 100\\% = 40\\%\\)।"}, {"id": 20, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "রেফ্রিজারেটর", "question": "রেফ্রিজারেটরের তাপ-তাপমাত্রার সম্পর্ক, কৃতকাজ \\(W\\) ও কর্মসম্পাদন সহগ (\\(\\text{COP}\\)) নির্ণয়ের সূত্র কী?", "answer": "i. \\(\\frac{T_H}{T_L} = \\frac{Q_H}{Q_L}\\)<br>ii. কৃতকাজ: \\(W = Q_H - Q_L\\)<br>iii. \\(\\text{COP} = \\frac{\\text{desired output}}{\\text{input}} = \\frac{Q_L}{W} = \\frac{Q_L}{Q_H - Q_L} = \\frac{T_L}{T_H - T_L}\\)", "context": "<b>প্রতীক:<\/b> \\(T_L, Q_L\\) = শীতল প্রকোষ্ঠের (খাবার) তাপমাত্রা ও অপসারিত তাপ; \\(T_H, Q_H\\) = পরিবেশের তাপমাত্রা ও বর্জিত তাপ; \\(W\\) = কম্প্রেসরের কাজ।<br><b>তথ্য:<\/b> \\(\\text{COP}\\) এর মান \\(1\\)-এর চেয়ে বড় হতে পারে এবং এর কোনো একক নেই।", "intuition": "রেফ্রিজারেটর যেন পাহাড়ের নিচ থেকে ওপরে পানি তোলার মোটর—স্বাভাবিকভাবে তাপ গরম থেকে ঠান্ডায় যায়, কিন্তু বিদ্যুতের কাজ (\\(W\\)) খরচ করে ফ্রিজ ঠান্ডা প্রকোষ্ঠ (\\(T_L\\)) থেকে তাপ (\\(Q_L\\)) টেনে গরম ঘরে (\\(T_H\\)) ফেলে দেয়। তাই প্রতি জুল বিদ্যুৎ খরচে কত জুল ঠান্ডা করা গেল, সেই অনুপাতই \\(\\text{COP} = \\frac{Q_L}{W}\\)।", "trap": "রেফ্রিজারেটরের \\(\\text{COP} = \\frac{T_L}{T_H - T_L}\\)-এ লবে ছোট তাপমাত্রা \\(T_L\\) বসে (\\(T_H\\) বসালে তা হিট পাম্প হয়ে যায়), এবং \\(T_L\\) অবশ্যই কেলভিনে বসাতে হয়।", "quickExample": "কোনো রেফ্রিজারেটরের শীতল প্রকোষ্ঠ \\(270\\text{ K}\\) ও পরিবেশ \\(300\\text{ K}\\) তাপমাত্রায় থাকলে \\(\\text{COP} = \\frac{270}{300 - 270} = \\frac{270}{30} = 9\\)।"}, {"id": 21, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "চার্জের কোয়ান্টায়ন", "question": "চার্জের কোয়ান্টায়নের সূত্র কী?", "answer": "\\(q = ne\\) [যেখানে \\(n = 0, 1, 2, \\dots\\)]", "context": "<b>প্রতীক:<\/b> \\(e = 1.6 \\times 10^{-19}\\text{ C}\\) (একটি ইলেকট্রনের চার্জ), \\(n\\) = পূর্ণসংখ্যা।<br><b>ধারণা:<\/b> কোনো বস্তুর চার্জ সর্বদা \\(e\\)-এর পূর্ণ গুণিতক হয়, ভগ্নাংশ হতে পারে না।", "intuition": "প্রকৃতিতে চার্জ পানির মতো নিরবচ্ছিন্ন প্রবাহ নয়, বরং ১ টাকার কয়েন বা অখণ্ড প্যাকেটের মতো করে স্থানান্তরিত হয়—যার প্রতিটি কয়েনের মান একটি ইলেকট্রনের চার্জ \\(e\\)। যেমন দেড়টি বা আড়াইটি কয়েন দিয়ে লেনদেন করা যায় না, তেমনি কোনো বস্তুর মোট চার্জ সর্বদা \\(e\\)-এর পূর্ণ গুণিতক (\\(q = ne\\)) হয়।", "trap": "পরীক্ষায় \\(q = 2.4 \\times 10^{-19}\\text{ C}\\) বা \\(q = 4.0 \\times 10^{-19}\\text{ C}\\) দিলে অনেকেই তা সম্ভাব্য চার্জ মনে করে ভুল করে—সবসময় \\(n = \\frac{q}{e}\\) ভাগ করে দেখবে পূর্ণসংখ্যা আসে কি না; আর ইলেকট্রন হারালে বস্তু ধনাত্মক ও গ্রহণ করলে ঋণাত্মক চার্জিত হয়।", "quickExample": "কোনো বস্তুতে \\(1\\text{ C}\\) চার্জ তৈরি করতে কতটি ইলেকট্রন প্রয়োজন? \\(n = \\frac{q}{e} = \\frac{1}{1.6 \\times 10^{-19}} = 6.25 \\times 10^{18}\\) টি ইলেকট্রন।"}, {"id": 22, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "কুলম্বের সূত্র", "question": "শূন্য মাধ্যমে ও \\(k\\) পরাবৈদ্যুতিক ধ্রুবক বিশিষ্ট মাধ্যমে কুলম্বের বল \\(F\\) এবং \\(k\\) এর সংজ্ঞা কী?", "answer": "শূন্য মাধ্যমে: \\(F = \\frac{1}{4\\pi\\epsilon_0}\\left(\\frac{q_1q_2}{r^2}\\right) = 9\\times 10^9\\left(\\frac{q_1q_2}{r^2}\\right)\\)<br>\\(k\\) মাধ্যমে: \\(F = \\frac{1}{4\\pi\\epsilon_0 k}\\left(\\frac{q_1q_2}{r^2}\\right)\\) এবং \\(k = \\frac{\\epsilon}{\\epsilon_0} = \\frac{F_0}{F_m}\\)", "context": "<b>প্রতীক:<\/b> \\(\\epsilon_0 = 8.854\\times 10^{-12}\\text{ C}^2\\text{N}^{-1}\\text{m}^{-2}\\) (শূন্য মাধ্যমের ভেদনযোগ্যতা); \\(r\\) = চার্জদ্বয়ের মধ্যবর্তী দূরত্ব।<br><b>ধারণা:<\/b> শূন্য মাধ্যমের জন্য \\(k=1\\), পানির \\(k \\approx 80\\), ধাতুর \\(k = \\infty\\)। অন্য মাধ্যমে বল \\(k\\) গুণ কমে যায়।", "intuition": "একটি বিন্দু চার্জের প্রভাব গোলকের পৃষ্ঠতল \\(4\\pi r^2\\) জুড়ে চারদিকে সমানভাবে ছড়িয়ে পড়ে বলে দূরত্ব বাড়লে বল ঠিক বর্গের ব্যস্তানুপাতে (\\(\\propto \\frac{1}{r^2}\\)) দুর্বল হয়। মাঝখানে কোনো পরাবৈদ্যুতিক মাধ্যম (যেমন পানি) রাখলে মাধ্যমের অণুগুলো বিপরীতমুখী হয়ে একটি 'স্ক্রিনিং পর্দা' তৈরি করে, ফলে কার্যকর কুলম্ব বল \\(k\\) গুণ কমে যায়।", "trap": "মাধ্যম পরিবর্তন করলে \\(F\\) কমে \\(k\\) গুণ—ভুল করে \\(k\\) দিয়ে গুণ করে ফেলো না। এছাড়া কুলম্ব ধ্রুবক \\(\\frac{1}{4\\pi\\varepsilon_0}\\)-এর একক \\(\\text{N m}^2\\text{C}^{-2}\\), আর \\(\\varepsilon_0\\)-এর একক ঠিক তার উল্টো \\(\\text{C}^2\\text{N}^{-1}\\text{m}^{-2}\\)।", "quickExample": "শূন্য মাধ্যমে \\(2\\ \\mu\\text{C}\\) ও \\(3\\ \\mu\\text{C}\\) চার্জ \\(0.3\\text{ m}\\) দূরত্বে থাকলে \\(F_0 = 9 \\times 10^9 \\times \\frac{2 \\times 10^{-6} \\times 3 \\times 10^{-6}}{(0.3)^2} = 0.6\\text{ N}\\)। \\(k = 3\\) মাধ্যমে রাখলে \\(F_m = \\frac{0.6}{3} = 0.2\\text{ N}\\)।"}, {"id": 23, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "তড়িৎ প্রাবল্য", "question": "বিন্দু চার্জের জন্য শূন্য ও \\(k\\) মাধ্যমে প্রাবল্য \\(E\\) এবং বল, তলমাত্রিক ঘনত্ব ও বিভবের সাথে \\(E\\) এর সম্পর্ক কী?", "answer": "\\(E = \\frac{1}{4\\pi\\epsilon_0}\\frac{q}{r^2} = 9\\times 10^9\\frac{q}{r^2}\\) (\\(k\\) মাধ্যমে \\(\\frac{1}{k}\\) গুণ)<br>\\(E = \\frac{F}{q} = \\frac{\\sigma}{\\epsilon_0} = \\frac{V}{d} = -\\frac{dV}{dr}\\)", "context": "<b>একক:<\/b> \\(\\text{N C}^{-1}\\) বা \\(\\text{V m}^{-1}\\) (ভেক্টর রাশি)।<br><b>দিক:<\/b> ধনাত্মক চার্জ থেকে বাইরের দিকে এবং ঋণাত্মক চার্জের দিকে। ঋণাত্মক চিহ্ন (\\(-\\frac{dV}{dr}\\)) বোঝায় প্রাবল্যের দিকে বিভব কমে।", "intuition": "তড়িৎ বিভব \\(V\\)-কে যদি 'বৈদ্যুতিক উচ্চতা' (পাহাড়ের উচ্চতা) ভাবো, তবে তড়িৎ প্রাবল্য \\(E = -\\frac{dV}{dr}\\) হলো সেই পাহাড়ের 'ঢাল' বা খাড়াভাব। বল যেমন পাহাড়ের ঢাল বেয়ে উঁচু থেকে নিচুতে গড়িয়ে পড়ে, ধনাত্মক চার্জও তেমনি প্রাবল্যের দিকে উচ্চ বিভব থেকে নিম্ন বিভবে যেতে চায়—ঋণাত্মক চিহ্নটি ঠিক এই নিম্নমুখী ঢালকেই নির্দেশ করে।", "trap": "\\(E = \\frac{F}{q}\\) দেখে অনেকেই ভাবে \\(E\\) পরীক্ষা চার্জ \\(q\\)-এর ওপর নির্ভরশীল—আসলে \\(q\\) বাড়ালে \\(F\\)-ও সমানুপাতে বাড়ে বলে \\(E\\) কেবল উৎস চার্জ ও দূরত্বের ওপর নির্ভর করে। আবার \\(\\text{N C}^{-1}\\) এবং \\(\\text{V m}^{-1}\\) একই ভৌত রাশির সমতুল্য একক।", "quickExample": "দুটি সমান্তরাল পাতের মধ্যবর্তী দূরত্ব \\(2\\text{ cm} = 0.02\\text{ m}\\) এবং বিভব পার্থক্য \\(100\\text{ V}\\) হলে প্রাবল্য \\(E = \\frac{V}{d} = \\frac{100}{0.02} = 5000\\text{ V m}^{-1}\\)।"}, {"id": 24, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "চার্জের তলমাত্রিক ঘনত্ব", "question": "চার্জের তলমাত্রিক ঘনত্ব \\(\\sigma\\) এবং গোলকের ক্ষেত্রে এর সূত্র কী?", "answer": "সাধারণ ক্ষেত্রে: \\(\\sigma = \\frac{q}{A}\\)<br>গোলকের ক্ষেত্রে: \\(\\sigma = \\frac{q}{4\\pi r^2}\\)", "context": "<b>সংজ্ঞা:<\/b> পরিবাহীর পৃষ্ঠের প্রতি একক ক্ষেত্রফলে সঞ্চিত চার্জের পরিমাণ।<br><b>একক:<\/b> \\(\\text{C m}^{-2}\\)। সূঁচালো প্রান্তে বক্রতার ব্যাসার্ধ \\(r\\) কম বলে \\(\\sigma\\) সবচেয়ে বেশি হয়।", "intuition": "তলমাত্রিক চার্জ ঘনত্ব \\(\\sigma\\) হলো পরিবাহীর পৃষ্ঠে চার্জের 'ভিড় বা জনঘনত্ব'। একই সংখ্যক মানুষ খোলা মাঠে ছড়ালে ভিড় পাতলা হয়, কিন্তু সরু কোণায় দাঁড়ালে ঘনত্ব বহুগুণ বেড়ে যায়। তেমনি গোলক ছোট হলে বা পরিবাহীর প্রান্ত সূঁচালো হলে (বক্রতার ব্যাসার্ধ \\(r\\) কম) সেখানে চার্জের ঘনত্ব \\(\\sigma = \\frac{q}{4\\pi r^2}\\) অনেক বেশি হয়—তাই বজ্রনিরোধক দণ্ডের মাথা সূঁচালো করা হয়।", "trap": "গোলকের ব্যাসার্ধ দ্বিগুণ করলে অনেকেই \\(\\sigma\\) অর্ধেক হবে ভাবে—কিন্তু \\(A = 4\\pi r^2\\) হওয়ায় একই চার্জের জন্য ব্যাসার্ধ দ্বিগুণ হলে \\(\\sigma\\) এক-চতুর্থাংশ (\\(\\frac{1}{4}\\) গুণ) হয়।", "quickExample": "\\(0.1\\text{ m}\\) ব্যাসার্ধের একটি গোলকে \\(4\\pi \\times 10^{-6}\\text{ C}\\) চার্জ দিলে \\(\\sigma = \\frac{q}{4\\pi r^2} = \\frac{4\\pi \\times 10^{-6}}{4\\pi (0.1)^2} = 10^{-4}\\text{ C m}^{-2}\\)।"}, {"id": 25, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "লব্ধি প্রাবল্য", "question": "\\(\\theta\\) কোণে ক্রিয়াশীল দুটি তড়িৎ প্রাবল্য \\(E_1\\) ও \\(E_2\\) এর লব্ধি প্রাবল্য \\(E\\) কত?", "answer": "\\(E = \\sqrt{E_1^2 + E_2^2 + 2E_1E_2\\cos\\theta}\\)", "context": "<b>বিশেষ ক্ষেত্র:<\/b> \\(\\theta = 0^\\circ\\) (একই দিকে) \\(\\Rightarrow E = E_1 + E_2\\); \\(\\theta = 180^\\circ\\) (বিপরীত দিকে) \\(\\Rightarrow E = |E_1 - E_2|\\); \\(\\theta = 90^\\circ \\Rightarrow E = \\sqrt{E_1^2 + E_2^2}\\)।", "intuition": "কোনো বিন্দুতে রাখা \\(+1\\text{ C}\\) চার্জকে একাধিক চার্জ বিভিন্ন দিক থেকে দড়ি বেঁধে টানার মতো বল প্রয়োগ করে। দড়িগুলো একই দিকে টানলে বল সরাসরি যোগ হয় (\\(\\theta = 0^\\circ\\)), বিপরীত দিকে টানলে বিয়োগ হয় (\\(\\theta = 180^\\circ\\)), আর যেকোনো কোণে \\(\\theta\\) টানলে সামান্তরিক সূত্র মেনে লব্ধি প্রাবল্য পাওয়া যায়।", "trap": "দুটি সমান প্রাবল্য \\(E_0\\) পরস্পর \\(120^\\circ\\) কোণে ক্রিয়া করলে লব্ধি শূন্য নয় বরং \\(E_0\\)-এর সমান হয়, এবং \\(\\theta\\) নির্ণয়ে ধনাত্মক চার্জের প্রাবল্য বাইরের দিকে ও ঋণাত্মক চার্জের প্রাবল্য চার্জের দিকে ধরতে ভুল করা যাবে না।", "quickExample": "\\(E_1 = 6\\text{ N C}^{-1}\\) ও \\(E_2 = 8\\text{ N C}^{-1}\\) পরস্পর \\(90^\\circ\\) কোণে ক্রিয়া করলে লব্ধি প্রাবল্য \\(E = \\sqrt{6^2 + 8^2} = \\sqrt{100} = 10\\text{ N C}^{-1}\\)।"}, {"id": 26, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "SVSL: শূন্য প্রাবল্য বিন্দু", "question": "\\(d\\) দূরত্বে অবস্থিত \\(q_1\\) ও \\(q_2\\) সমধর্মী ও বিপরীতধর্মী চার্জের ক্ষেত্রে \\(q_1\\) থেকে কত দূরত্বে (\\(x\\)) প্রাবল্য শূন্য হয়?", "answer": "i. সমধর্মী (ভেতরে): \\(x = \\frac{d}{1 + \\sqrt{\\frac{q_2}{q_1}}}\\)<br>ii. বিপরীতধর্মী ও \\(q_1 \\lt  q_2\\) হলে (বাইরে): \\(x = \\frac{d}{\\sqrt{\\frac{q_2}{q_1}} - 1}\\) [\\(q_1, q_2\\) এর কেবল মান বসবে]", "context": "<b>সতর্কতা:<\/b> চার্জের চিহ্ন (\\(+\\) বা \\(-\\)) সূত্রে বসাবে না, শুধু মান বসাও।<br><b>অবস্থান:<\/b> শূন্য প্রাবল্য বিন্দু সর্বদা <b>মানের দিক থেকে ছোট চার্জের<\/b> কাছাকাছি থাকে।", "intuition": "একজন শক্তিশালী ও একজন দুর্বল মানুষ দড়ি টানাটানি করলে সমান টান অনুভব করার ভারসাম্য বিন্দুটি সবসময় দুর্বল মানুষটির কাছেই থাকে, যাতে শক্তিশালীর দূরত্ব বেড়ে তার প্রভাব কমে যায়। ঠিক তেমনি শূন্য প্রাবল্য বিন্দু সর্বদা মানের দিক থেকে ছোট চার্জের কাছেই অবস্থান করে—সমধর্মী চার্জে দুটির মাঝখানে, আর বিপরীতধর্মী চার্জে সংযোগ রেখার বাইরে।", "trap": "বিপরীতধর্মী চার্জের ক্ষেত্রে সূত্রে চার্জের ঋণাত্মক চিহ্ন বসালে বর্গমূলের ভেতর ঋণাত্মক সংখ্যা চলে আসে—তাই সূত্রে সর্বদা কেবল মান বসাতে হবে এবং বিন্দুটি সংযোগ রেখার বাইরে ছোট চার্জের পাশে খুঁজতে হবে।", "quickExample": "\\(12\\text{ cm}\\) দূরত্বে অবস্থিত \\(+4\\ \\mu\\text{C}\\) ও \\(+16\\ \\mu\\text{C}\\) চার্জের ক্ষেত্রে \\(+4\\ \\mu\\text{C}\\) থেকে ভেতরে \\(x = \\frac{12}{1 + \\sqrt{16/4}} = \\frac{12}{3} = 4\\text{ cm}\\) দূরত্বে প্রাবল্য শূন্য হবে।"}, {"id": 27, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "তড়িৎ ফ্লাক্স", "question": "তড়িৎ ফ্লাক্স \\(\\phi\\) নির্ণয়ের সূত্র কী?", "answer": "\\(\\phi = \\frac{q}{\\epsilon_0} = \\vec{A}\\cdot\\vec{E} = AE\\cos\\theta\\)", "context": "<b>প্রতীক:<\/b> \\(\\theta\\) = তড়িৎ ক্ষেত্র \\(\\vec{E}\\) এবং তলের <b>অভিলম্বের (ক্ষেত্রফল ভেক্টর \\(\\vec{A}\\))<\/b> মধ্যবর্তী কোণ (তলের সাথে কোণ নয়!)।<br><b>একক:<\/b> \\(\\text{N m}^2\\text{C}^{-1}\\) বা \\(\\text{V m}\\) (স্কেলার রাশি)।", "intuition": "প্রবল বৃষ্টির মধ্যে একটি খালি জানালার ফ্রেম ধরার কথা ভাবো: ফ্রেমটিকে বৃষ্টির লম্বভাবে ধরলে সর্বোচ্চ ফোঁটা ভেতর দিয়ে যায় (\\(\\theta = 0^\\circ\\)), আর বৃষ্টির সমান্তরালে ধরলে কোনো ফোঁটাই ঢোকে না (\\(\\theta = 90^\\circ\\))। তড়িৎ ফ্লাক্স \\(\\phi = AE\\cos\\theta\\) ঠিক তেমনি কোনো তল ভেদ করে যাওয়া বলরেখার মোট প্রবাহ; আর বদ্ধ তলের ভেতর চার্জ থাকলে মোট ফ্লাক্স কেবল ভেতরের চার্জের (\\(\\frac{q}{\\varepsilon_0}\\)) ওপর নির্ভর করে, তলের আকারের ওপর নয়।", "trap": "প্রশ্নে তড়িৎ ক্ষেত্র ও তলের মধ্যবর্তী কোণ \\(30^\\circ\\) দেওয়া থাকলে \\(\\theta = 30^\\circ\\) বসানো সবচেয়ে বড় ভুল—কারণ \\(\\theta\\) হলো \\(\\vec{E}\\) ও তলের অভিলম্বের মধ্যবর্তী কোণ, অর্থাৎ এখানে \\(\\theta = 90^\\circ - 30^\\circ = 60^\\circ\\)।", "quickExample": "\\(0.5\\text{ m}^2\\) ক্ষেত্রফলের একটি তলের অভিলম্বের সাথে \\(60^\\circ\\) কোণে \\(200\\text{ N C}^{-1}\\) প্রাবল্য ক্রিয়া করলে ফ্লাক্স \\(\\phi = 0.5 \\times 200 \\times \\cos 60^\\circ = 50\\text{ N m}^2\\text{C}^{-1}\\)।"}, {"id": 28, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "তড়িৎ দ্বিমেরু", "question": "তড়িৎ দ্বিমেরুর প্রাবল্য (\\(E\\)), বিভব (\\(V\\)), ভ্রামক (\\(p\\)), টর্ক (\\(\\tau\\)) ও ঘুরাতে কৃতকাজ (\\(W\\)) এর সূত্রগুলো কী?", "answer": "i. \\(E = \\frac{1}{4\\pi\\epsilon_0}\\frac{p}{r^3}\\sqrt{1 + 3\\cos^2\\theta}\\)<br>ii. \\(V = \\frac{1}{4\\pi\\epsilon_0}\\frac{p\\cos\\theta}{r^2}\\)<br>iii. \\(p = 2lq\\)<br>iv. \\(\\tau = |\\vec{p}\\times\\vec{E}| = pE\\sin\\theta\\)<br>v. \\(W = pE[\\cos\\theta_1 - \\cos\\theta_2]\\)", "context": "<b>প্রতীক:<\/b> \\(2l\\) = দ্বিমেরুর দৈর্ঘ্য, \\(p\\) = দ্বিমেরু ভ্রামক (\\(\\text{C m}\\), দিক \\(-q \\to +q\\))।<br><b>বিশেষ ক্ষেত্র:<\/b> অক্ষের ওপর (\\(\\theta = 0^\\circ\\)): \\(E = \\frac{2p}{4\\pi\\epsilon_0 r^3}\\); লম্বদ্বিখণ্ডকে (\\(\\theta = 90^\\circ\\)): \\(E = \\frac{p}{4\\pi\\epsilon_0 r^3}\\) ও \\(V = 0\\)।", "intuition": "সুষম তড়িৎ ক্ষেত্রে একটি দ্বিমেরু ঠিক চৌম্বক ক্ষেত্রের কম্পাসের কাঁটার মতো আচরণ করে—এর দুই প্রান্তে সমান ও বিপরীত বল কাজ করায় এটি কোথাও সরে যায় না (লব্ধি বল শূন্য), বরং টর্ক (\\(\\tau = pE\\sin\\theta\\)) এটিকে ঘুরিয়ে ক্ষেত্রের সমান্তরালে (স্থিতিশীল সাম্যাবস্থায়) আনতে চায়। আর বিপরীত চার্জ দুটি খুব কাছাকাছি থাকায় দূর থেকে তাদের প্রভাব অনেকটা নাকচ হয়ে প্রাবল্য দ্রুত (\\(\\propto \\frac{1}{r^3}\\)) কমে যায়।", "trap": "দ্বিমেরুর লম্বদ্বিখণ্ডকে (\\(\\theta = 90^\\circ\\)) বিভব \\(V = 0\\) হলেও প্রাবল্য শূন্য নয় (\\(E = \\frac{p}{4\\pi\\varepsilon_0 r^3}\\))। এছাড়া \\(\\theta = 0^\\circ\\) স্থিতিশীল ও \\(\\theta = 180^\\circ\\) অস্থিতিশীল সাম্যাবস্থা, এবং \\(0^\\circ\\) থেকে \\(180^\\circ\\) ঘুরাতে কৃতকাজ \\(pE\\) নয় বরং \\(2pE\\)।", "quickExample": "\\(p = 2 \\times 10^{-6}\\text{ C m}\\) ভ্রামকের একটি দ্বিমেরু \\(E = 5 \\times 10^4\\text{ N C}^{-1}\\) সুষম ক্ষেত্রে \\(30^\\circ\\) কোণে থাকলে টর্ক \\(\\tau = pE\\sin 30^\\circ = 2 \\times 10^{-6} \\times 5 \\times 10^4 \\times 0.5 = 0.05\\text{ N m}\\)।"}, {"id": 29, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "তড়িৎ বিভব", "question": "বিন্দু চার্জ ও বহু-চার্জের জন্য তড়িৎ বিভব \\(V\\) এর সূত্র কী?", "answer": "\\(V = \\frac{1}{4\\pi\\epsilon_0}\\frac{q}{r} = 9\\times 10^9\\frac{q}{r}\\) এবং \\(V = \\sum V_n = \\frac{1}{4\\pi\\epsilon_0 k}\\sum \\frac{q}{r}\\)", "context": "<b>বৈশিষ্ট্য:<\/b> বিভব স্কেলার রাশি, একক ভোল্ট (\\(\\text{V} = \\text{J C}^{-1}\\))।<br><b>সতর্কতা:<\/b> মোট বিভব নির্ণয়ে প্রতিটি চার্জের <b>চিহ্ন (\\(+\\) বা \\(-\\)) সহ<\/b> বীজগাণিতিক যোগ করতে হয়।", "intuition": "মহাকর্ষে কোনো বিন্দুর উচ্চতা \\(h\\) যেমন বলে দেয় একক ভরকে মাটি থেকে তুলতে কত কাজ করতে হয়েছে, তড়িৎ বিভব \\(V\\) ঠিক তেমনি 'বৈদ্যুতিক উচ্চতা'—অসীম (\\(V = 0\\)) থেকে \\(+1\\text{ C}\\) চার্জকে ওই বিন্দুতে আনতে কৃতকাজ। উচ্চতা যেমন স্কেলার রাশি, বিভবও স্কেলার; তাই বহু চার্জের মোট বিভব বের করতে দিক না ভেবেই চিহ্নসহ সরাসরি যোগ করা যায়।", "trap": "বিভব নির্ণয়ে দূরত্বের বর্গ (\\(r^2\\)) বসানো এবং ঋণাত্মক চার্জের মাইনাস চিহ্ন বাদ দেওয়া সবচেয়ে সাধারণ ভুল—মনে রাখবে \\(V \\propto \\frac{1}{r}\\) এবং চিহ্নসহ বীজগাণিতিক যোগ করতে হয়।", "quickExample": "\\(0.3\\text{ m}\\) দূরে অবস্থিত \\(+2\\ \\mu\\text{C}\\) ও \\(-1\\ \\mu\\text{C}\\) চার্জের জন্য ওই বিন্দুতে মোট বিভব \\(V = 9 \\times 10^9 \\times \\frac{(2 - 1) \\times 10^{-6}}{0.3} = 3 \\times 10^4\\text{ V}\\)।"}, {"id": 30, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "SVSL: কেন্দ্রে বিভব শূন্য", "question": "বর্গের তিন কোণায় \\(q_1, q_2, q_3\\) এবং সমবাহু ত্রিভুজের দুই কোণায় \\(q_1, q_2\\) রাখলে কেন্দ্রে বিভব শূন্য করতে শেষ কোণায় কত চার্জ রাখতে হবে?", "answer": "বর্গের চতুর্থ কোণায়: \\(q_4 = -(q_1 + q_2 + q_3)\\)<br>সমবাহু ত্রিভুজের তৃতীয় কোণায়: \\(q_3 = -(q_1 + q_2)\\)", "context": "<b>কারণ:<\/b> বর্গ বা সমবাহু ত্রিভুজের কেন্দ্র থেকে প্রতিটি শীর্ষবিন্দুর দূরত্ব \\(r\\) সমান। তাই \\(V = 0\\) হতে হলে সব চার্জের বীজগাণিতিক যোগফল \\(\\sum q = 0\\) হতে হবে।", "intuition": "বর্গ বা সমবাহু ত্রিভুজের কেন্দ্র থেকে প্রতিটি কোণার দূরত্ব \\(r\\) সমান হওয়ায় প্রতিটি চার্জই ঠিক একই ওজনে (\\(\\frac{1}{r}\\)) কেন্দ্রের বৈদ্যুতিক উচ্চতায় (বিভবে) অবদান রাখে। তাই কেন্দ্রে বিভব শূন্য করা মানে ব্যাংক অ্যাকাউন্টে জমা (\\(+q\\)) ও খরচের (\\(-q\\)) মোট ব্যালেন্স শূন্য করা (\\(\\sum q = 0\\))।", "trap": "এই শর্টকাটটি কেবল বিভবের (স্কেলার) ক্ষেত্রেই প্রযোজ্য, লব্ধি প্রাবল্য শূন্য করার জন্য নয়—এবং যোগ করার সময় প্রতিটি চার্জের \\(+\\) বা \\(-\\) চিহ্ন সঠিকভাবে নিতে হবে।", "quickExample": "একটি বর্গের তিন কোণায় \\(+2\\ \\mu\\text{C}\\), \\(-5\\ \\mu\\text{C}\\) ও \\(+6\\ \\mu\\text{C}\\) চার্জ থাকলে কেন্দ্রে বিভব শূন্য করতে চতুর্থ কোণায় \\(q_4 = -(2 - 5 + 6) = -3\\ \\mu\\text{C}\\) চার্জ রাখতে হবে।"}, {"id": 31, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "গোলকের বিভব ও প্রাবল্য", "question": "\\(R\\) ব্যাসার্ধের \\(Q\\) চার্জিত ফাঁপা ও নিরেট গোলকের পৃষ্ঠে, বাইরে এবং অভ্যন্তরে (\\(r \\lt  R\\)) বিভব \\(V\\) ও প্রাবল্য \\(E\\) কত?", "answer": "• ফাঁপা গোলকের পৃষ্ঠে ও অভ্যন্তরে বিভব: \\(V = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{R}\\); অভ্যন্তরে প্রাবল্য: \\(E = 0\\text{ NC}^{-1}\\)<br>• বাইরে বিভব (ফাঁপা/নিরেট): \\(V = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{r}\\); পৃষ্ঠে প্রাবল্য: \\(E = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{R^2}\\)<br>• নিরেট গোলকের অভ্যন্তরে: \\(E = \\frac{Q}{4\\pi\\epsilon_0 R^3}r\\) ও \\(V = \\frac{Q}{4\\pi\\epsilon_0}\\frac{3R^2 - r^2}{2R^3}\\)", "context": "<b>মূল ধারণা:<\/b> ফাঁপা বা পরিবাহী গোলকের ভেতরে কোনো চার্জ থাকে না, তাই ভেতরে \\(E = 0\\) এবং সর্বত্র বিভব পৃষ্ঠের বিভবের সমান (সমবিভব)।<br>নিরেট অপরিবাহী গোলকের কেন্দ্রে (\\(r=0\\)) বিভব পৃষ্ঠের বিভবের \\(1.5\\) গুণ (\\(V_{\\text{center}} = 1.5 V_{\\text{surface}}\\))।", "intuition": "ফাঁপা বা পরিবাহী গোলকের সব চার্জ পৃষ্ঠে থাকায় ভেতরে কোনো ঢাল (\\(E = 0\\)) নেই—অর্থাৎ এর ভেতরটা পাহাড়ের চূড়ার একটি 'সমতল মালভূমির' মতো, যেখানে সর্বত্র বৈদ্যুতিক উচ্চতা (বিভব) পৃষ্ঠের সমান। অন্যদিকে নিরেট অপরিবাহী গোলকের ভেতরেও চার্জ ছড়ানো থাকায় এর বিভব একটি 'গম্বুজের' মতো—কেন্দ্রে উচ্চতা সর্বোচ্চ (\\(1.5V_{\\text{surface}}\\)) এবং কেন্দ্র থেকে পৃষ্ঠের দিকে ঢাল (\\(E \\propto r\\)) বাড়তে থাকে।", "trap": "ফাঁপা বা পরিবাহী গোলকের ভেতরে \\(E = 0\\) দেখে অনেকেই বিভবকেও \\(V = 0\\) ভেবে ভুল করে—মনে রাখবে ভেতরে \\(V = V_{\\text{surface}} \\neq 0\\) (সমবিভব)। আর নিরেট পরিবাহী গোলকের সব চার্জও পৃষ্ঠে চলে আসে বলে এর আচরণ হুবহু ফাঁপা গোলকের মতোই।", "quickExample": "একটি ফাঁপা গোলকের পৃষ্ঠে বিভব \\(120\\text{ V}\\) হলে অভ্যন্তরে বিভব \\(120\\text{ V}\\) ও প্রাবল্য \\(0\\text{ N C}^{-1}\\)। কিন্তু নিরেট অপরিবাহী গোলকের পৃষ্ঠে বিভব \\(120\\text{ V}\\) হলে কেন্দ্রে বিভব \\(1.5 \\times 120 = 180\\text{ V}\\)।"}, {"id": 32, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "চার্জ স্থানান্তরে কৃতকাজ", "question": "\\(r_2\\) থেকে \\(r_1\\) অবস্থানে \\(q\\) চার্জ স্থানান্তরে কৃতকাজ \\(W_{2\\to 1}\\) কত?", "answer": "\\(W_{2\\to 1} = \\Delta V q = (V_1 - V_2)q = \\frac{Q}{4\\pi\\epsilon_0}\\left(\\frac{1}{r_1} - \\frac{1}{r_2}\\right)q\\)", "context": "<b>ধারণা:<\/b> স্থির তড়িৎ ক্ষেত্র সংরক্ষণশীল বলে কৃতকাজ পথের ওপর নির্ভর করে না, কেবল আদি (\\(r_2\\)) ও শেষ (\\(r_1\\)) অবস্থানের বিভব পার্থক্যের ওপর নির্ভর করে।", "intuition": "পাহাড়ের নিচ থেকে চূড়ায় তুমি সোজা খাড়া পথে ওঠো আর আঁকাবাঁকা পথে ঘুরেই ওঠো, অভিকর্ষের বিরুদ্ধে মোট কাজ কেবল উচ্চতার পার্থক্যের ওপর নির্ভর করে। স্থির তড়িৎ ক্ষেত্রও সংরক্ষণশীল হওয়ায় চার্জ স্থানান্তরে কৃতকাজ \\(W = q(V_1 - V_2)\\) কেবল আদি ও শেষ বিন্দুর 'বৈদ্যুতিক উচ্চতার পার্থক্যের' সমান—কোন পথে চার্জ নেওয়া হলো তার ওপর নয়।", "trap": "আদি ও শেষ অবস্থান উল্টে ফেললে (\\(V_2 - V_1\\) বসালে) কৃতকাজের চিহ্ন ভুল হয়ে যায়—মনে রাখবে \\(A\\) থেকে \\(B\\)-তে নিতে কাজ সর্বদা \\(W_{A \\to B} = q(V_B - V_A)\\), আর সমবিভব তলে কৃতকাজ শূন্য।", "quickExample": "\\(+3\\ \\mu\\text{C}\\) চার্জকে \\(20\\text{ V}\\) বিভবের বিন্দু থেকে \\(50\\text{ V}\\) বিভবের বিন্দুতে নিতে কৃতকাজ \\(W = (50 - 20) \\times 3 \\times 10^{-6} = 9 \\times 10^{-5}\\text{ J}\\)।"}, {"id": 33, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "ধারকত্ব", "question": "পরিবাহীর ধারকত্ব, গোলকীয় পরিবাহীর ধারকত্ব এবং সমান্তরাল পাত ধারকের ধারকত্বের সূত্র কী?", "answer": "\\(C = \\frac{Q}{V}\\) • গোলকীয়: \\(C = 4\\pi\\epsilon_0 r\\) • সমান্তরাল পাত: \\(C = \\frac{\\epsilon_0 A}{d} = \\frac{\\epsilon_0 k A}{d}\\)", "context": "<b>প্রতীক:<\/b> \\(A\\) = পাতের ক্ষেত্রফল, \\(d\\) = পাতদ্বয়ের মধ্যবর্তী দূরত্ব, \\(k\\) = পরাবৈদ্যুতিক ধ্রুবক; একক ফ্যারাড (\\(\\text{F}\\))।<br><b>ধারণা:<\/b> \\(C\\) চার্জ \\(Q\\) বা বিভব \\(V\\)-এর ওপর নয়, বরং জ্যামিতিক আকার ও মাধ্যমের (\\(k\\)) ওপর নির্ভর করে।", "intuition": "ধারককে একটি পানির ট্যাংক বা 'চার্জ-স্প্রিং' ভাবো: চওড়া ট্যাংকে অনেক পানি ঢাললেও উচ্চতা কম বাড়ে, তেমনি বড় ধারকত্বের (\\(C = \\frac{Q}{V}\\)) ধারকে বেশি চার্জ জমা করলেও বিভব কম বাড়ে। পাতের ক্ষেত্রফল \\(A\\) বাড়ালে বা দূরত্ব \\(d\\) কমালে কিংবা মাঝে পরাবৈদ্যুতিক পর্দা (\\(k\\)) ঢোকালে চার্জ ধরে রাখার এই জ্যামিতিক ক্ষমতা \\(C\\) বেড়ে যায়।", "trap": "\\(C = \\frac{Q}{V}\\) দেখে অনেকেই ভাবে \\(Q\\) দ্বিগুণ করলে \\(C\\) দ্বিগুণ হয়—আসলে \\(Q\\) দ্বিগুণ হলে \\(V\\)-ও দ্বিগুণ হয়, ফলে \\(C\\) অপরিবর্তিত থাকে; \\(C\\) বদলাতে হলে \\(A\\), \\(d\\) বা \\(k\\) বদলাতে হবে।", "quickExample": "একটি সমান্তরাল পাত ধারকের ধারকত্ব \\(4\\ \\mu\\text{F}\\)। পাতদ্বয়ের দূরত্ব অর্ধেক করে মাঝে \\(k = 3\\) মাধ্যম ঢোকালে নতুন ধারকত্ব \\(C' = 3 \\times 2 \\times 4 = 24\\ \\mu\\text{F}\\)।"}, {"id": 34, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "ধারকের সমবায়", "question": "ধারকের শ্রেণী ও সমান্তরাল সমবায়ে তুল্য ধারকত্ব কত? (\\(n\\) সংখ্যক সমান \\(C\\) ধারকের ক্ষেত্রে কী হয়?)", "answer": "শ্রেণী: \\(\\frac{1}{C_s} = \\frac{1}{C_1} + \\frac{1}{C_2} + \\dots + \\frac{1}{C_n}\\) (সমান হলে \\(C_s = \\frac{C}{n}\\))<br>সমান্তরাল: \\(C_p = C_1 + C_2 + \\dots + C_n\\) (সমান হলে \\(C_p = nC\\))", "context": "<b>মনে রাখো:<\/b> ধারকের সমবায়ের সূত্র রোধের সমবায়ের ঠিক বিপরীত! শ্রেণী সমবায়ে তুল্য ধারকত্ব কমে (সব ধারকে চার্জ \\(Q\\) সমান), সমান্তরালে বাড়ে (বিভব \\(V\\) সমান)।", "intuition": "সমান্তরাল সমবায়ে ধারকগুলোকে পাশাপাশি যুক্ত করা মানে পাতের মোট ক্ষেত্রফল \\(A\\) বাড়িয়ে বড় ট্যাংক বানানো—তাই ধারকত্ব সরাসরি যোগ হয় (\\(C_p = \\sum C_i\\))। আর শ্রেণী সমবায়ে পরপর বসানো মানে কার্যকর পাত-দূরত্ব \\(d\\) বাড়িয়ে দেওয়া, ফলে চার্জ ধারণের ক্ষমতা কমে তুল্য ধারকত্ব সবচেয়ে ছোট ধারকটির চেয়েও কমে যায়।", "trap": "তাড়াহুড়োয় অনেকেই রোধের সূত্র বসিয়ে শ্রেণী সমবায়ে ধারকত্ব যোগ করে ফেলে—মনে রাখবে ধারকের শ্রেণী ও সমান্তরাল সূত্র রোধের ঠিক উল্টো, এবং \\(n\\) টি সমান ধারকের ক্ষেত্রে \\(\\frac{C_p}{C_s} = n^2\\)।", "quickExample": "\\(6\\ \\mu\\text{F}\\) ও \\(3\\ \\mu\\text{F}\\) দুটি ধারক শ্রেণীতে যুক্ত থাকলে \\(C_s = \\frac{6 \\times 3}{6 + 3} = 2\\ \\mu\\text{F}\\), আর সমান্তরালে যুক্ত থাকলে \\(C_p = 6 + 3 = 9\\ \\mu\\text{F}\\)।"}, {"id": 35, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "বিভব ও আধান বিভাজন নীতি", "question": "ধারকের শ্রেণী সমবায়ে বিভব বিভাজন (\\(V_1, V_2\\)) এবং সমান্তরাল সমবায়ে আধান বিভাজন (\\(Q_1, Q_2\\)) এর সূত্র কী?", "answer": "শ্রেণী: \\(V_1 = \\frac{C_2}{C_1 + C_2}V\\), \\(V_2 = \\frac{C_1}{C_1 + C_2}V\\)<br>সমান্তরাল: \\(Q_1 = \\frac{C_1}{C_1 + C_2}Q\\), \\(Q_2 = \\frac{C_2}{C_1 + C_2}Q\\)", "context": "<b>যুক্তি:<\/b> শ্রেণীতে \\(Q\\) সমান বলে \\(V \\propto \\frac{1}{C}\\) (কম ধারকত্বে বেশি বিভব)। সমান্তরালে \\(V\\) সমান বলে \\(Q \\propto C\\) (বেশি ধারকত্বে বেশি চার্জ)।", "intuition": "দুটি ভিন্ন প্রস্থের পানির ট্যাংক ভাবো: শ্রেণী সমবায়ে উভয় ধারকে সমান চার্জ \\(Q\\) (সমান পানি) ঢাললে সরু ট্যাংকে (কম \\(C\\)) পানির উচ্চতা বা বিভব \\(V\\) বেশি ওঠে (\\(V \\propto \\frac{1}{C}\\))। আর সমান্তরাল সমবায়ে উভয়ের উচ্চতা বা বিভব \\(V\\) সমান রাখলে চওড়া ট্যাংকে (বেশি \\(C\\)) বেশি চার্জ জমা হয় (\\(Q \\propto C\\))।", "trap": "শ্রেণী সমবায়ে \\(V_1\\) বের করার সময় লবে \\(C_1\\) বসানো সবচেয়ে বড় ফাঁদ—মনে রাখবে শ্রেণীতে বিভব ধারকত্বের ব্যস্তানুপাতিক বলে লবে বিপরীত ধারক \\(C_2\\) বসে।", "quickExample": "\\(2\\ \\mu\\text{F}\\) ও \\(4\\ \\mu\\text{F}\\) ধারক শ্রেণীতে \\(12\\text{ V}\\) উৎসের সাথে যুক্ত থাকলে \\(2\\ \\mu\\text{F}\\) ধারকের বিভব \\(V_1 = \\frac{4}{2 + 4} \\times 12 = 8\\text{ V}\\) এবং \\(4\\ \\mu\\text{F}\\) ধারকের বিভব \\(4\\text{ V}\\)।"}, {"id": 36, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "ধারকের সঞ্চিত শক্তি", "question": "ধারকের সঞ্চিত মোট শক্তি \\(W\\) এবং একক আয়তনে সঞ্চিত শক্তি \\(u\\) এর সূত্র কী?", "answer": "মোট শক্তি: \\(W = \\frac{1}{2}QV = \\frac{1}{2}CV^2 = \\frac{Q^2}{2C}\\)<br>একক আয়তনে: \\(u = \\frac{W}{V} = \\frac{1}{2}\\epsilon_0 E^2\\)", "context": "<b>প্রয়োগ:<\/b> ব্যাটারি সংযুক্ত থাকলে (\\(V\\) স্থির) \\(\\frac{1}{2}CV^2\\) এবং ব্যাটারি বিচ্ছিন্ন থাকলে (\\(Q\\) স্থির) \\(\\frac{Q^2}{2C}\\) ব্যবহার করা সুবিধাজনক। \\(u\\)-এর একক \\(\\text{J m}^{-3}\\)।", "intuition": "ধারক চার্জ করা ঠিক একটি স্প্রিংকে সংকুচিত করার মতো: স্প্রিং যত চাপা হয় বাধা তত বাড়ে বলে মোট সঞ্চিত শক্তি \\(Fx\\) না হয়ে \\(\\frac{1}{2}Fx = \\frac{1}{2}kx^2\\) হয়। তেমনি ধারকে চার্জ জমতে জমতে বিভব \\(0\\) থেকে \\(V\\) পর্যন্ত বাড়ে বলে সঞ্চিত শক্তি \\(\\frac{1}{2}QV = \\frac{1}{2}CV^2 = \\frac{Q^2}{2C}\\) হয়, এবং এই শক্তি পাতদ্বয়ের মধ্যবর্তী তড়িৎ ক্ষেত্রে স্প্রিংয়ের স্থিতিশক্তির মতো সঞ্চিত থাকে।", "trap": "ব্যাটারি সংযুক্ত রেখে পরাবৈদ্যুতিক মাধ্যম (\\(k\\)) ঢোকালে \\(V\\) স্থির থাকায় শক্তি \\(k\\) গুণ বাড়ে (\\(\\frac{1}{2}CV^2\\)), কিন্তু ব্যাটারি বিচ্ছিন্ন করে \\(k\\) ঢোকালে \\(Q\\) স্থির থাকায় শক্তি \\(k\\) গুণ কমে (\\(\\frac{Q^2}{2C}\\))।", "quickExample": "\\(10\\ \\mu\\text{F}\\) ধারককে \\(100\\text{ V}\\) বিভবে চার্জিত করলে সঞ্চিত শক্তি \\(W = \\frac{1}{2}CV^2 = \\frac{1}{2} \\times 10 \\times 10^{-6} \\times (100)^2 = 0.05\\text{ J}\\)।"}, {"id": 37, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "SVSL: গোলক সংযোগ", "question": "\\(r_1, r_2\\) ব্যাসার্ধ ও \\(q_1, q_2\\) চার্জযুক্ত দুটি ধাতব গোলক পরিবাহী তার দিয়ে যুক্ত করলে সাধারণ বিভব \\(V_{\\text{com}}\\) ও নতুন চার্জ \\(q_1', q_2'\\) কত?", "answer": "\\(V_{\\text{com}} = \\frac{1}{4\\pi\\epsilon_0}\\frac{q_1 + q_2}{r_1 + r_2}\\)<br>\\(q_1' = \\frac{r_1}{r_1 + r_2}(q_1 + q_2)\\), \\(q_2' = \\frac{r_2}{r_1 + r_2}(q_1 + q_2)\\)", "context": "<b>ধারণা:<\/b> যুক্ত করলে উচ্চ বিভব থেকে নিম্ন বিভবে চার্জ প্রবাহিত হয়ে উভয়ের বিভব সমান (\\(V_{\\text{com}}\\)) হয় এবং চার্জ ব্যাসার্ধের অনুপাতে (\\(q' \\propto r\\)) বণ্টিত হয়।", "intuition": "ভিন্ন উচ্চতার দুটি পানির ট্যাংক নিচ দিয়ে একটি নল দিয়ে জুড়ে দিলে উঁচু স্তর থেকে নিচু স্তরে পানি বয়ে গিয়ে উভয়ের পানির উচ্চতা সমান হয়, আর চওড়া ট্যাংকে বেশি পানি থাকে। ঠিক তেমনি দুটি চার্জিত ধাতব গোলক তার দিয়ে জুড়লে উচ্চ বিভব থেকে নিম্ন বিভবে চার্জ প্রবাহিত হয়ে সাধারণ বিভব \\(V_{\\text{com}}\\) তৈরি হয় এবং বড় ব্যাসার্ধের গোলক বেশি চার্জ (\\(q' \\propto r\\)) ধরে রাখে।", "trap": "দুটি গোলক যুক্ত করলে চার্জ সমান দুই ভাগে ভাগ হয় কেবল ব্যাসার্ধ সমান হলেই—ব্যাসার্ধ অসমান হলে চার্জ ব্যাসার্ধের অনুপাতে (\\(r_1 : r_2\\)) এবং তলমাত্রিক ঘনত্ব ব্যাসার্ধের ব্যস্তানুপাতে (\\(r_2 : r_1\\)) বণ্টিত হয়।", "quickExample": "\\(2\\text{ cm}\\) ও \\(4\\text{ cm}\\) ব্যাসার্ধের দুটি গোলকে যথাক্রমে \\(20\\ \\mu\\text{C}\\) ও \\(10\\ \\mu\\text{C}\\) চার্জ দিয়ে যুক্ত করলে ছোটটির নতুন চার্জ \\(q_1' = \\frac{2}{2 + 4}(20 + 10) = 10\\ \\mu\\text{C}\\) এবং বড়টির \\(20\\ \\mu\\text{C}\\)।"}, {"id": 38, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "গাউসের সূত্র ও প্রয়োগ", "question": "গাউসের সূত্র এবং অসীম অপরিবাহী পাত, পরিবাহী পাত ও অসীম দৈর্ঘ্যের চার্জিত তারের নিকটে প্রাবল্য \\(E\\) কত?", "answer": "গাউসের সূত্র: \\(\\oint \\vec{E}\\cdot d\\vec{A} = \\frac{q}{\\epsilon_0}\\)<br>অপরিবাহী পাত: \\(E = \\frac{\\sigma}{2\\epsilon_0}\\) • পরিবাহী পাত: \\(E = \\frac{\\sigma}{\\epsilon_0}\\)<br>অসীম তার থেকে \\(r\\) দূরত্বে: \\(E = \\frac{\\lambda}{2\\pi\\epsilon_0 r}\\)", "context": "<b>প্রতীক:<\/b> \\(\\sigma = \\frac{q}{A}\\) (তলমাত্রিক চার্জ ঘনত্ব), \\(\\lambda = \\frac{q}{l}\\) (রৈখিক চার্জ ঘনত্ব)।<br><b>মনে রাখো:<\/b> অসীম পাতের কাছে \\(E\\) দূরত্বের ওপর নির্ভর করে না (সুষম প্রাবল্য); পরিবাহী পাতের ভেতরে \\(E=0\\)।", "intuition": "একটি জ্বলন্ত বাল্বকে গোলক, ঘনক বা যেকোনো বাঁকা কাচের বাক্স দিয়ে ঢেকে দাও—বাক্সের দেয়াল ভেদ করে বের হওয়া মোট আলোর পরিমাণ কেবল ভেতরের বাল্বের ক্ষমতার ওপর নির্ভর করে, বাক্সের আকারের ওপর নয়। গাউসের সূত্রও তা-ই বলে: বদ্ধ তলের মোট ফ্লাক্স কেবল আবদ্ধ চার্জ \\(\\frac{q}{\\varepsilon_0}\\)-এর সমান; আর অসীম চার্জিত পাতের বলরেখাগুলো সমান্তরাল বলে দূরত্ব বাড়লেও প্রাবল্য কমে না।", "trap": "অসীম অপরিবাহী পাতের প্রাবল্য \\(\\frac{\\sigma}{2\\epsilon_0}\\) আর পরিবাহী পাতের প্রাবল্য \\(\\frac{\\sigma}{\\epsilon_0}\\)—এই \\(2\\)-এর ফ্যাক্টরটি ভর্তি পরীক্ষায় প্রায়ই গুলিয়ে যায়, আর অসীম তারের ক্ষেত্রে \\(E \\propto \\frac{1}{r}\\) (\\(\\frac{1}{r^2}\\) নয়)।", "quickExample": "একটি অসীম অপরিবাহী পাতের চার্জ ঘনত্ব \\(\\sigma = 1.7708 \\times 10^{-10}\\text{ C m}^{-2}\\) হলে এর নিকটে প্রাবল্য \\(E = \\frac{\\sigma}{2\\epsilon_0} = \\frac{1.7708 \\times 10^{-10}}{2 \\times 8.854 \\times 10^{-12}} = 10\\text{ N C}^{-1}\\)।"}, {"id": 39, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "তড়িৎ প্রবাহ ও তাড়নবেগ", "question": "তড়িৎ প্রবাহমাত্রা \\(I\\) এবং ইলেকট্রনের তাড়নবেগ \\(v eta)\\) • \\(\\rho_\\theta = \\rho_0(1 + \\alpha\\theta)\\)", "context": "<b>প্রতীক:<\/b> \\(L\\) = দৈর্ঘ্য, \\(A\\) = প্রস্থচ্ছেদের ক্ষেত্রফল, \\(R_0\\) = \\(0^\\circ\\text{C}\\) তাপমাত্রায় রোধ, \\(\\alpha\\) = রোধের উষ্ণতা গুণাঙ্ক (\\(\\text{K}^{-1}\\) বা \\(^\\circ\\text{C}^{-1}\\))।<br><b>ধারণা:<\/b> ধাতুর \\(\\alpha \\gt  0\\) (তাপ বাড়লে রোধ বাড়ে), কিন্তু অর্ধপরিবাহীর \\(\\alpha \\lt  0\\) (তাপ বাড়লে রোধ কমে)।", "intuition": "একটি ভিড়ভাট্টা করিডোর কল্পনা করো: করিডোর যত লম্বা (\\(L\\)) হবে পার হতে তত বেশি বাধা, আর যত চওড়া (\\(A\\)) হবে তত সহজে মানুষ হাঁটতে পারবে—এটাই \\(R = \\rho \\frac{L}{A}\\)। ধাতুর তাপমাত্রা বাড়লে ভেতরের পরমাণুগুলো আরও জোরে কাঁপতে থাকে (ভিড়ের মানুষের অস্থির ছোটাছুটির মতো), ফলে ইলেকট্রনের সংঘর্ষ বেড়ে রোধ বাড়ে (\\(\\alpha \\gt 0\\))। কিন্তু অর্ধপরিবাহীতে তাপ দিলে নতুন অনেক মুক্ত ইলেকট্রন-হোল তৈরি হয়ে যায়, ফলে পরিবাহিতা বেড়ে রোধ কমে (\\(\\alpha \\lt 0\\))।", "trap": "আপেক্ষিক রোধ \\(\\rho\\) তারের দৈর্ঘ্য বা প্রস্থচ্ছেদের ওপর নির্ভর করে না—তার কাটলে বা টানলে \\(R\\) বদলায়, \\(\\rho\\) স্থির থাকে (কেবল উপাদান ও তাপমাত্রায় বদলায়)। আবার অর্ধপরিবাহী ও তড়িৎ-বিশ্লেষ্যের ক্ষেত্রে \\(\\alpha \\lt 0\\) হওয়ায় তাপমাত্রা বাড়লে রোধ কমে।", "quickExample": "\\(0^\\circ\\text{C}\\) তাপমাত্রায় কোনো ধাতব তারের রোধ \\(R_0 = 10\\ \\Omega\\) এবং \\(\\alpha = 4 \\times 10^{-3}\\ ^\\circ\\text{C}^{-1}\\) হলে \\(50^\\circ\\text{C}\\) তাপমাত্রায় রোধ \\(R_{50} = 10(1 + 4 \\times 10^{-3} \\times 50) = 12\\ \\Omega\\)।"}, {"id": 42, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "রোধের কালার কোড", "question": "রোধের কালার কোডের মান (\\(0\\)–\\(9\\)), গুণিতক, টলারেন্স এবং রোধ নির্ণয়ের সূত্র কী?", "answer": "কালো=0, বাদামী=1, লাল=2 (\\(\\pm 2\\%\\)), কমলা=3, হলুদ=4, সবুজ=5, নীল=6, বেগুনী=7, ধূসর=8, সাদা=9; সোনালী=\\(10^{-1}(\\pm 5\\%)\\), রূপালী=\\(10^{-2}(\\pm 10\\%)\\), বর্ণহীন=\\(10^{-3}(\\pm 20\\%)\\)<br>সূত্র: \\(R = xy \\times 10^z \\pm \\text{tolerance}\\)", "context": "<b>মনে রাখার ছন্দ:<\/b> <b>BB ROY<\/b> <b>G<\/b>reat <b>B<\/b>ritain <  মাঝে পাশাপাশি একাধিক পাইপ বসানো—পানির চলাচলের রাস্তা বেড়ে যাওয়ায় মোট বাধা \\(R_p\\) কমে সবচেয়ে ছোট রোধের চেয়েও কম হয়ে যায়। আর একটি তারকে সম-আয়তনে টেনে \\(n\\) গুণ লম্বা করলে সেটি একই সাথে \\(n\\) গুণ লম্বা ও \\(n\\) গুণ সরু হয়, তাই বাধা দুই দিক থেকে বেড়ে \\(n^2\\) গুণ হয়ে যায়।", "trap": "তার টেনে \\(n\\) গুণ লম্বা করলে রোধ \\(n\\) গুণ নয় বরং \\(n^2\\) গুণ হয় (\\(R' = n^2R\\)), আর ব্যাসার্ধ \\(\\frac{1}{k}\\) গুণ করলে \\(R \\propto \\frac{1}{r^4}\\) হওয়ায় রোধ \\(k^4\\) গুণ (ব্যাসার্ধ অর্ধেক করলে \\(16\\) গুণ) হয়। সমান্তরাল সমবায়ে \\(\\frac{1}{R_p}\\) বের করে শেষে উল্টাতে (reciprocal নিতে) অনেকেই ভুলে যায়।", "quickExample": "\\(5\\ \\Omega\\) রোধের একটি তারকে সম-আয়তনে টেনে দৈর্ঘ্য \\(3\\) গুণ করলে নতুন রোধ \\(R' = n^2R = 3^2 \\times 5 = 45\\ \\Omega\\); আবার \\(6\\ \\Omega\\) ও \\(3\\ \\Omega\\) সমান্তরালে যুক্ত হলে \\(R_p = \\frac{6 \\times 3}{6 + 3} = 2\\ \\Omega\\) (যা ছোট রোধ \\(3\\ \\Omega\\)-এর চেয়েও কম)।"}, {"id": 44, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "তড়িৎকোষ ও হারানো বিভব", "question": "অভ্যন্তরীণ রোধ \\(r\\) বিশিষ্ট কোষের বর্তনী প্রবাহমাত্রা \\(I\\), তড়িচ্চালক শক্তি \\(E\\) এবং হারানো বিভব \\(V'\\) এর সূত্র কী?", "answer": "\\(I = \\frac{E}{R+r}\\) • \\(E = V + Ir = IR + Ir = I(R+r)\\)<br>হারানো বিভব: \\(V' = E - V = Ir\\)", "context": "<b>প্রতীক:<\/b> \\(E\\) = কোষের তড়িচ্চালক শক্তি (EMF), \\(V = IR\\) = প্রান্তীয় বিভব পার্থক্য, \\(r\\) = কোষের অভ্যন্তরীণ রোধ।<br><b>ধারণা:<\/b> বর্তনী খোলা থাকলে (\\(I=0\\)) \\(V = E\\)। প্রবাহ চললে অভ্যন্তরীণ রোধে \\(Ir\\) বিভব নষ্ট হয়।", "intuition": "ব্যাটারিকে একটি পানির পাম্প ভাবো যার সর্বোচ্চ চাপ তৈরির ক্ষমতা হলো তড়িচ্চালক শক্তি \\(E\\)। পাম্প চালু করে পানি (প্রবাহ \\(I\\)) পাঠালে পাম্পের ভেতরের সরু নলের ঘর্ষণেই (অভ্যন্তরীণ রোধ \\(r\\)) কিছুটা চাপ \\(Ir\\) নষ্ট হয়ে যায়—এটাই হারানো বিভব। ফলে লোড যুক্ত থাকলে বাইরের প্রান্তে প্রকৃত চাপ বা প্রান্তীয় বিভব \\(V = E - Ir\\) সবসময় \\(E\\)-এর চেয়ে কম হয় (\\(V \\lt E\\)); কেবল কল বন্ধ রাখলে (মুক্ত বর্তনী, \\(I = 0\\)) ভেতরে কোনো ঘর্ষণ না থাকায় \\(V = E\\) পাওয়া যায়।", "trap": "ডিসচার্জিং (স্বাভাবিক ব্যবহার) অবস্থায় \\(V = E - Ir \\lt E\\), কিন্তু ব্যাটারি চার্জ করার সময় বাইরের উৎস জোর করে বিপরীত দিকে প্রবাহ ঢোকায় বলে \\(V = E + Ir \\gt E\\) হয়। শর্ট সার্কিটে (\\(R = 0\\)) প্রান্তীয় বিভব \\(V = 0\\) এবং প্রবাহ সর্বোচ্চ \\(I_{\\max} = \\frac{E}{r}\\) হয়।", "quickExample": "\\(E = 12\\text{ V}\\) ও \\(r = 1\\ \\Omega\\) বিশিষ্ট কোষে \\(R = 5\\ \\Omega\\) লোড যুক্ত করলে \\(I = \\frac{12}{5 + 1} = 2\\text{ A}\\), হারানো বিভব \\(V' = Ir = 2\\text{ V}\\) এবং প্রান্তীয় বিভব \\(V = 12 - 2 = 10\\text{ V} \\lt 12\\text{ V}\\)।"}, {"id": 45, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "বিভব ও প্রবাহ বিভাজন", "question": "রোধের শ্রেণী সমবায়ে ভোল্টেজ বিভাজন (\\(V_1, V_2\\)) এবং সমান্তরাল সমবায়ে কারেন্ট বিভাজন (\\(I_1, I_2\\)) এর সূত্র কী?", "answer": "শ্রেণী (কারেন্ট সমান): \\(V_1 = \\frac{R_1}{R_1+R_2}V\\), \\(V_2 = \\frac{R_2}{R_1+R_2}V\\)<br>সমান্তরাল (ভোল্টেজ সমান): \\(I_1 = \\frac{R_2}{R_1+R_2}I\\), \\(I_2 = \\frac{R_1}{R_1+R_2}I\\)", "context": "<b>সতর্কতা:<\/b> শ্রেণীতে নিজের রোধ ওপরে থাকে (\\(V \\propto R\\)), কিন্তু সমান্তরালে <b>বিপরীত শাখার রোধ<\/b> ওপরে থাকে (\\(I \\propto \\frac{1}{R}\\))।", "intuition": "শ্রেণী সমবায় যেন একই রাস্তায় পরপর দুটি টোলগেট: সব গাড়ি (প্রবাহ \\(I\\)) উভয় গেট দিয়েই যায়, তাই যার বাধা (রোধ) বেশি সেখানেই বেশি টোল (বিভব পতন, \\(V \\propto R\\)) দিতে হয়। অন্যদিকে সমান্তরাল সমবায় যেন দুটি বিকল্প হাইওয়ে: যে রাস্তা বেশি প্রশস্ত ও বাধাহীন (কম রোধ), স্বাভাবিকভাবেই বেশিরভাগ গাড়ি (প্রবাহ \\(I \\propto \\frac{1}{R}\\)) সেই পথ বেছে নেয়।", "trap": "ভোল্টেজ ডিভাইডারে লবে নিজের রোধ বসে (\\(V_1 = \\frac{R_1}{R_1+R_2}V\\)), কিন্তু কারেন্ট ডিভাইডারে লবে বিপরীত শাখার রোধ বসে (\\(I_1 = \\frac{R_2}{R_1+R_2}I\\))—এই দুটো গুলিয়ে ফেললেই উত্তর উল্টে যায়।", "quickExample": "\\(6\\ \\Omega\\) ও \\(3\\ \\Omega\\) সমান্তরালে যুক্ত হয়ে মোট \\(9\\text{ A}\\) প্রবাহ নিলে \\(6\\ \\Omega\\)-এ প্রবাহ \\(I_1 = \\frac{3}{6 + 3} \\times 9 = 3\\text{ A}\\) এবং \\(3\\ \\Omega\\)-এ \\(I_2 = 6\\text{ A}\\) (কম রোধে বেশি প্রবাহ)।"}, {"id": 46, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "ওহম ও কার্শপের সূত্র", "question": "ওহমের সূত্র এবং কার্শপের প্রথম (KCL) ও দ্বিতীয় (KVL) সূত্র কী?", "answer": "ওহমের সূত্র: \\(V = IR\\)<br>KCL: \\(\\sum I = 0\\) (মোট আগত প্রবাহ = মোট নির্গত প্রবাহ)<br>KVL: \\(\\sum V = \\sum IR\\)", "context": "<b>সংরক্ষণশীলতা:<\/b> KCL <b>চার্জের সংরক্ষণ<\/b> নীতির ওপর এবং KVL <b>শক্তির সংরক্ষণ<\/b> নীতির ওপর প্রতিষ্ঠিত। জটিল বর্তনী সমাধানে ব্যবহৃত হয়।", "intuition": "ওহমের সূত্র বলে, পাইপের বাধা \\(R\\) স্থির থাকলে পানির চাপ \\(V\\) দ্বিগুণ করলে প্রবাহ \\(I\\)-ও দ্বিগুণ হয়। কার্শপের প্রথম সূত্র (KCL) হলো পানির জংশনের নিয়ম—কোনো সংযোগস্থলে যতটুকু পানি (আধান) ঢুকবে, ঠিক ততটুকুই বেরিয়ে যাবে, কোথাও জমা হবে না (চার্জের সংরক্ষণ)। আর দ্বিতীয় সূত্র (KVL) হলো পাহাড়ে বদ্ধ পথে ঘুরে আগের জায়গায় ফেরার মতো—যতটুকু উঁচুতে উঠবে (ব্যাটারির বিভব বৃদ্ধি) ঠিক ততটুকুই নামতে হবে (রোধে বিভব পতন), ফলে নিট উচ্চতা পরিবর্তন শূন্য (শক্তির সংরক্ষণ)।", "trap": "\\(I\\) বনাম \\(V\\) লেখচিত্রে (\\(I\\) উল্লম্ব অক্ষে) ঢাল হলো পরিবাহিতা \\(\\frac{1}{R}\\), রোধ \\(R\\) নয়; কেবল \\(V\\) বনাম \\(I\\) লেখচিত্রের ঢালই \\(R\\)। এছাড়া ওহমের সূত্র কেবল ধ্রুব তাপমাত্রায় ওহমীয় পরিবাহীর জন্য প্রযোজ্য, ডায়োড বা ট্রানজিস্টরের জন্য নয়।", "quickExample": "কোনো জংশনে \\(4\\text{ A}\\) ও \\(3\\text{ A}\\) প্রবাহ ঢুকে একটি শাখা দিয়ে \\(2\\text{ A}\\) বের হলে KCL অনুযায়ী অপর শাখা দিয়ে নির্গত প্রবাহ \\(I = (4 + 3) - 2 = 5\\text{ A}\\)।"}, {"id": 47, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "কোষের সমবায়", "question": "কোষের শ্রেণী, সমান্তরাল ও মিশ্র (\\(m\\) সারি, প্রতি সারিতে \\(n\\) কোষ) সমবায়ে প্রবাহমাত্রা এবং সর্বোচ্চ প্রবাহের শর্ত কী?", "answer": "শ্রেণী: \\(I = \\frac{nE}{R + nr}\\) • সমান্তরাল: \\(I = \\frac{nE}{nR + r}\\)<br>মিশ্র: \\(I = \\frac{mnE}{mR + nr}\\) • সর্বোচ্চ প্রবাহের শর্ত: \\(mR = nr\\)", "context": "<b>কখন কোনটি ভালো?<\/b> বহিঃরোধ \\(R \\gg r\\) হলে শ্রেণী সমবায়; \\(r \\gg R\\) হলে সমান্তরাল সমবায়। মিশ্র সমবায়ে মোট অভ্যন্তরীণ রোধ \\(\\frac{nr}{m} = R\\) হলে প্রবাহ সর্বোচ্চ হয়।", "intuition": "একাধিক পানির পাম্পকে শ্রেণীতে (একটার পেছনে আরেকটা) বসালে পানির চাপ (\\(nE\\)) বাড়ে—তাই বাইরের পাইপ খুব সরু ও দীর্ঘ হলে (\\(R \\gg r\\)) শ্রেণী সমবায় সেরা। আর পাম্পগুলোকে পাশাপাশি (সমান্তরালে) বসালে চাপ একই (\\(E\\)) থাকে কিন্তু ভেতরের মোট বাধা (\\(\\frac{r}{n}\\)) কমে যায়—তাই বাইরের বাধা কম ও পাম্পের নিজস্ব বাধা বেশি হলে (\\(r \\gg R\\)) সমান্তরাল সমবায় সেরা। মিশ্র সমবায়ে ভেতরের মোট রোধ বাইরের রোধের সমান (\\(\\frac{nr}{m} = R\\)) হলেই সর্বোচ্চ প্রবাহ মেলে।", "trap": "\\(R \\gg r\\) হলে শ্রেণী সমবায় এবং \\(r \\gg R\\) হলে সমান্তরাল সমবায় সুবিধাজনক—শর্ত দুটি উল্টে ফেললে ভুল হয়। আর মিশ্র সমবায়ে মোট কোষ সংখ্যা \\(N = mn\\) এবং সর্বোচ্চ প্রবাহের শর্ত \\(mR = nr\\) একসাথে সমাধান করতে হয়।", "quickExample": "\\(r = 1\\ \\Omega\\) বিশিষ্ট \\(12\\)টি কোষকে \\(R = 3\\ \\Omega\\) বহিঃরোধে সর্বোচ্চ প্রবাহের জন্য সাজালে \\(mn = 12\\) ও \\(3m = n \\Rightarrow 3m^2 = 12 \\Rightarrow m = 2\\) সারি ও প্রতি সারিতে \\(n = 6\\)টি কোষ।"}, {"id": 48, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "হুইটস্টোন ব্রিজ", "question": "হুইটস্টোন ব্রিজের মূলনীতি এবং ব্রিজটি সাম্যাবস্থায় থাকার শর্ত কী?", "answer": "\\(\\frac{P}{Q} = \\frac{R}{S}\\) এবং সাম্যাবস্থায় গ্যালভানোমিটার প্রবাহ \\(I_G = 0\\text{ A}\\)", "context": "<b>ধারণা:<\/b> \\(P, Q, R, S\\) চারটি বাহুর রোধ। সাম্যাবস্থায় মাঝের শাখা (গ্যালভানোমিটার) দিয়ে কোনো প্রবাহ যায় না, তাই তুল্য রোধ নির্ণয়ে মাঝের রোধটি বাদ দেওয়া যায়।", "intuition": "উঁচু থেকে নিচুতে নামা দুটি সমান্তরাল খাল (উপরের বাহু \\(P, Q\\) এবং নিচের বাহু \\(R, S\\)) কল্পনা করো, যাদের মাঝখানে আড়াআড়ি একটি সংযোগ-নল (গ্যালভানোমিটার) আছে। দুই খালে যদি ঠিক একই অনুপাতে (\\(\\frac{P}{Q} = \\frac{R}{S}\\)) বাধা থাকে, তবে সংযোগ-নলের দুই প্রান্তের পানির উচ্চতা (বিভব) হুবহু সমান হয়ে যায়। উচ্চতার কোনো পার্থক্য না থাকায় সংযোগ-নল দিয়ে এক ফোঁটা পানিও (তড়িৎ প্রবাহ) গড়ায় না—অর্থাৎ \\(I_G = 0\\) হয়, এবং মাঝের শাখাটি না থাকার মতোই কাজ করে।", "trap": "অসাম্য ব্রিজকে সাম্যে আনতে চতুর্থ বাহুতে প্রয়োজনীয় রোধ \\(S'\\) যদি বর্তমান রোধ \\(S\\)-এর চেয়ে বেশি হয় তবে শ্রেণীতে, আর কম হলে সমান্তরালে অতিরিক্ত রোধ যোগ করতে হয়। এছাড়া ব্যাটারি ও গ্যালভানোমিটার পরস্পর অদলবদল করলে সাম্যাবস্থা নষ্ট হয় না।", "quickExample": "\\(P = 4\\ \\Omega\\), \\(Q = 8\\ \\Omega\\), \\(R = 6\\ \\Omega\\) ও \\(S = 15\\ \\Omega\\) হলে সাম্যের জন্য দরকার \\(S' = \\frac{8 \\times 6}{4} = 12\\ \\Omega\\)। মান কমাতে \\(15\\ \\Omega\\)-এর সাথে সমান্তরালে \\(x\\) যোগ করলে \\(\\frac{1}{12} = \\frac{1}{15} + \\frac{1}{x} \\Rightarrow x = 60\\ \\Omega\\)।"}, {"id": 49, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "শান্ট ও পাল্লা বৃদ্ধি", "question": "শান্টের প্রবাহ \\(I_S\\), গ্যালভানোমিটার প্রবাহ \\(I_G\\) এবং অ্যামিটার ও ভোল্টমিটারের পাল্লা \\(n\\) গুণ বৃদ্ধির সূত্র কী?", "answer": "\\(I_S = \\left(\\frac{G}{G+S}\\right)I\\) • \\(I_G = \\left(\\frac{S}{G+S}\\right)I\\)<br>অ্যামিটারের পাল্লা \\(n\\) গুণ করতে শান্ট: \\(S = \\frac{G}{n-1}\\)<br>ভোল্টমিটারের পাল্লা \\(n\\) গুণ করতে রোধ: \\(R = G(n-1)\\)", "context": "<b>ধারণা:<\/b> শান্ট (\\(S\\)) হলো খুব কম মানের রোধ যা গ্যালভানোমিটারের (\\(G\\)) সাথে <b>সমান্তরালে<\/b> যুক্ত হয় (অ্যামিটার বানাতে)। ভোল্টমিটারের পাল্লা বাড়াতে উচ্চ মানের রোধ \\(R\\) <b>শ্রেণীতে<\/b> যুক্ত হয়।", "intuition": "গ্যালভানোমিটার হলো খুব সূক্ষ্ম একটি কাঠের সাঁকো, যার ওপর দিয়ে বেশি প্রবাহ গেলে ভেঙে (পুড়ে) যাবে। একে অ্যামিটার বানাতে পাশে একটি প্রশস্ত বাইপাস হাইওয়ে (খুব কম রোধের শান্ট \\(S\\)) সমান্তরালে জুড়ে দেওয়া হয়, যাতে বাড়তি প্রবাহ বাইপাস দিয়ে চলে যায় এবং মোট রোধ আরও কমে যায়। আর ভোল্টমিটার বানাতে এর সামনে বিশাল এক স্পিড-ব্রেকার (উচ্চ রোধ \\(R\\)) শ্রেণীতে বসানো হয়, যাতে বাড়তি ভোল্টেজ সেখানেই শোষিত হয় এবং বর্তনী থেকে প্রায় কোনো প্রবাহ না টানে।", "trap": "পাল্লা \\(n\\) গুণ করার সূত্রে সবসময় \\((n - 1)\\) বসে, \\(n\\) নয়: অ্যামিটারে \\(S = \\frac{G}{n-1}\\) (সমান্তরালে) এবং ভোল্টমিটারে \\(R = G(n-1)\\) (শ্রেণীতে)। মনে রাখবে, আদর্শ অ্যামিটারের রোধ \\(0\\) এবং আদর্শ ভোল্টমিটারের রোধ \\(\\infty\\)।", "quickExample": "\\(G = 9 }\\)-এর সমান্তরালে, \\(\\theta = 0^\\circ\\)) ধরলে সবচেয়ে বেশি ফোঁটা ভেতর দিয়ে যায়, আর তলটি বৃষ্টির সমান্তরালে (\\(\\theta = 90^\\circ\\)) ঘুরালে একটিও ফোঁটা ভেদ করে না। অন্যদিকে বায়োট-স্যাভার্ট সূত্র দেখায় কীভাবে ক্ষুদ্র তড়িৎবাহী অংশ \\(I\\,dl\\) চারপাশে দূরত্বের বর্গের ব্যস্তানুপাতে (\\(\\propto \\frac{1}{r^2}\\)) বৃত্তাকার চৌম্বক ক্ষেত্র ছড়ায়—তারের ঠিক পাশের দিকে (\\(\\theta = 90^\\circ\\)) ক্ষেত্র সর্বোচ্চ এবং তারের নিজ অক্ষ বরাবর (\\(\\theta = 0^\\circ\\)) শূন্য হয়।", "trap": "ফ্লাক্সের সূত্রে \\(\\theta\\) হলো \\(\\vec{B}\\) এবং তলের অভিলম্বের মধ্যবর্তী কোণ, তলের নিজের সাথে কোণ নয়—তাই তলের সাথে \\(30^\\circ\\) কোণ দেওয়া থাকলে \\(\\theta = 90^\\circ - 30^\\circ = 60^\\circ\\) বসাতে হবে!", "quickExample": "\\(0.05\\text{ m}^2\\) ক্ষেত্রফলের একটি তলের সাথে \\(0.4\\text{ T}\\) চৌম্বক ক্ষেত্র \\(30^\\circ\\) কোণে আনত থাকলে অভিলম্বের সাথে কোণ \\(\\theta = 90^\\circ - 30^\\circ = 60^\\circ\\)। সুতরাং, \\(\\phi = AB\\cos\\theta = 0.05 \\times 0.4 \\times \\cos 60^\\circ = 0.02 \\times 0.5 = 0.01\\text{ Wb}\\)।"}, {"id": 53, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "তার, কুণ্ডলী ও টরয়েডের B", "question": "সোজা তার থেকে \\(a\\) দূরত্বে, বৃত্তাকার কুণ্ডলীর কেন্দ্রে এবং টরয়েডের কেন্দ্রে চৌম্বক ক্ষেত্র \\(B\\) কত?", "answer": "সোজা তার: \\(B = \\frac{\\mu_0 I}{2\\pi a}\\)<br>বৃত্তাকার কুণ্ডলীর কেন্দ্রে: \\(B = \\frac{\\mu_0 NI}{2r} = \\mu_0 n I\\) [\\(n\\) = একক দৈর্ঘ্যে পাক সংখ্যা]<br>টরয়েডের কেন্দ্রে: \\(B = \\frac{\\mu_0 NI}{2\\pi r} = \\mu_0 n I\\)", "context": "<b>প্রতীক:<\/b> \\(N\\) = মোট পাক সংখ্যা, \\(r\\) = ব্যাসার্ধ, \\(a\\) = তার থেকে লম্ব দূরত্ব।<br><b>সতর্কতা:<\/b> সোজা তারে \\(2\\pi a\\), কিন্তু বৃত্তাকার কুণ্ডলীর কেন্দ্রে \\(2r\\) (\\(\\pi\\) নেই)। টরয়েড ও দীর্ঘ সলিনয়েডের ভেতরে \\(B = \\mu_0 n I\\)।", "intuition": "সোজা তারের চারপাশে চৌম্বক বলরেখা \\(2\\pi a\\) পরিধির সমকেন্দ্রিক বৃত্তে ছড়িয়ে পড়ে বলে দূরত্ব বাড়লে ক্ষেত্র \\(\\frac{1}{a}\\) হারে পাতলা হয়। তারটিকে বৃত্তাকার কুণ্ডলীতে বাঁকালে প্রতিটি ক্ষুদ্র অংশের সৃষ্ট ক্ষেত্র কেন্দ্রে একই দিকে মুখ করে যোগ হয় (পরিধি \\(2\\pi r\\) হরের \\(4\\pi\\)-এর \\(\\pi\\) কেটে দেয় বলেই কেন্দ্রে \\(\\pi\\) থাকে না)। আর দীর্ঘ সলিনয়েড বা টরয়েডের ভেতরে পাশাপাশি থাকা অসংখ্য পাকের ব্যাসার্ধ বরাবর উপাংশ পরস্পরকে নাকচ করে এবং অক্ষ বরাবর উপাংশ একত্রে যোগ হয়—ফলে ভেতরের চৌম্বক ক্ষেত্র \\(B = \\mu_0 n I\\) সম্পূর্ণ সুষম ও সমান্তরাল থাকে এবং বাইরের ক্ষেত্র প্রায় শূন্য হয়ে যায়।", "trap": "বৃত্তাকার কুণ্ডলীর কেন্দ্রে হরে \\(2r\\) থাকে (\\(\\pi\\) নেই), কিন্তু সোজা তার ও টরয়েডের সূত্রে হরে \\(2\\pi\\) থাকে—এই \\(\\pi\\) বসানো বা বাদ দেওয়ার ভুলেই ভর্তি পরীক্ষায় সবচেয়ে বেশি নম্বর কাটা যায়!", "quickExample": "\\(100\\) পাকের ও \\(10\\text{ cm}\\) ব্যাসার্ধের একটি বৃত্তাকার কুণ্ডলীতে \\(2\\text{ A}\\) প্রবাহ চললে কেন্দ্রে \\(B = \\frac{\\mu_0 NI}{2r} = \\frac{4\\pi \\times 10^{-7} \\times 100 \\times 2}{2 \\times 0.1} = 4\\pi \\times 10^{-4}\\text{ T} \\approx 1.26 \\times 10^{-3}\\text{ T}\\)।"}, {"id": 54, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "গতিশীল চার্জ ও অক্ষীয় B", "question": "গতিশীল চার্জের জন্য \\(B\\), বৃত্তাকার কুণ্ডলীর অক্ষে \\(x\\) দূরত্বে \\(B\\) এবং সসীম দৈর্ঘ্যের \\(AB\\) তারের জন্য \\(C\\) বিন্দুতে \\(B\\) কত?", "answer": "গতিশীল চার্জ: \\(B = \\frac{\\mu_0}{4\\pi}\\frac{ev\\sin\\theta}{r^2}\\)<br>কুণ্ডলীর অক্ষে: \\(B = \\frac{\\mu_0 NI a^2}{2(a^2+x^2)^{3/2}}\\)<br>সসীম তার: \\(B = \\frac{\\mu_0 I}{4\\pi a}(\\sin\\phi_1 + \\sin\\phi_2)\\)", "context": "<b>বিশেষ ক্ষেত্র:<\/b> কুণ্ডলীর কেন্দ্রে \\(x = 0\\) বসালে \\(B = \\frac{\\mu_0 NI}{2a}\\) পাওয়া যায়। অসীম তারের ক্ষেত্রে \\(\\phi_1 = \\phi_2 = 90^\\circ\\) বসালে \\(B = \\frac{\\mu_0 I}{2\\pi a}\\) হয়।", "intuition": "একটি চলমান চার্জ নিজেই ক্ষুদ্রতম তড়িৎ প্রবাহ—তাই চার্জ স্থির থাকলে (\\(v = 0\\)) বা গতির রেখা বরাবর সামনে-পেছনে (\\(\\theta = 0^\\circ, 180^\\circ\\)) কোনো চৌম্বক ক্ষেত্র তৈরি হয় না। বৃত্তাকার কুণ্ডলীর অক্ষের কোনো বিন্দুতে কুণ্ডলীর বিপরীত দুই প্রান্তের ক্ষেত্রের লম্ব উপাংশ পরস্পরকে বাতিল করে
