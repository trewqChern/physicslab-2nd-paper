<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhysicsLab — পদার্থবিজ্ঞান ২য় পত্র (SoloLearn Style)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Hind Siliguri', 'system-ui', 'sans-serif'],
            bn: ['Hind Siliguri', 'Inter', 'sans-serif'],
          },
          colors: {
            solo: {
              blue: '#2493DF',
              blueDark: '#1B76B8',
              emerald: '#10B981',
              coral: '#EF4444',
              amber: '#F59E0B',
              navy: '#0F172A',
              card: '#1E293B',
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: 'Inter', 'Hind Siliguri', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .katex-display {
      margin: 0.4em 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
    }
    .math-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .math-scroll::-webkit-scrollbar {
      height: 5px;
    }
    .math-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.45);
      border-radius: 9999px;
    }
    .katex {
      font-size: 1.05em;
    }
    .formula-hero .katex {
      font-size: 1.28em;
    }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(36, 147, 223, 0.55); }
      70% { box-shadow: 0 0 0 12px rgba(36, 147, 223, 0); }
      100% { box-shadow: 0 0 0 0 rgba(36, 147, 223, 0); }
    }
    .node-active {
      animation: pulseRing 2.1s infinite;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .animate-shake {
      animation: shake 0.35s ease-in-out;
    }
    @keyframes popUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-pop {
      animation: popUp 0.25s ease-out forwards;
    }
    @keyframes floatXp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-42px) scale(1.15); }
    }
    .xp-float {
      animation: floatXp 0.9s ease-out forwards;
      pointer-events: none;
    }
    .blur-formula {
      filter: blur(8px);
      user-select: none;
      transition: filter 0.2s ease;
    }
    .blur-formula:hover {
      filter: blur(5px);
    }
    .lesson-connector {
      width: 3px;
      height: 22px;
      margin: 0 auto;
    }

    /* === BLACK & NEON NIGHT MODE === */
    html.dark,
    html.dark body,
    html.dark #lesson-overlay,
    html.dark #guide-overlay {
      background-color: #000000 !important;
      color: #e6f7ff !important;
    }
    html.dark header,
    html.dark #mobile-nav,
    html.dark #lesson-footer {
      background-color: rgba(0, 0, 0, 0.92) !important;
      border-color: rgba(0, 240, 255, 0.24) !important;
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.08);
    }
    html.dark .dark\:bg-slate-950,
    html.dark .dark\:bg-slate-950\/30,
    html.dark .dark\:bg-slate-950\/50 {
      background-color: #000000 !important;
    }
    html.dark .dark\:bg-slate-900,
    html.dark .dark\:bg-slate-900\/95,
    html.dark .dark\:bg-slate-900\/70 {
      background-color: #060911 !important;
    }
    html.dark .dark\:bg-slate-800,
    html.dark .dark\:bg-slate-800\/80,
    html.dark .dark\:bg-slate-800\/70,
    html.dark .dark\:bg-slate-800\/60,
    html.dark .dark\:bg-slate-800\/50 {
      background-color: #0c1220 !important;
    }
    html.dark .dark\:border-slate-800,
    html.dark .dark\:border-slate-800\/80,
    html.dark .dark\:border-slate-700,
    html.dark .dark\:border-slate-700\/70 {
      border-color: rgba(0, 240, 255, 0.22) !important;
    }
    html.dark .rounded-2xl.dark\:bg-slate-900 {
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.06);
    }
    html.dark .rounded-2xl.dark\:bg-slate-900:hover {
      border-color: rgba(0, 240, 255, 0.45) !important;
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.14);
    }
    html.dark .formula-hero {
      background: radial-gradient(circle at top, rgba(0, 240, 255, 0.14), #04070e 75%) !important;
      border-color: rgba(0, 240, 255, 0.55) !important;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.18), inset 0 0 18px rgba(176, 38, 255, 0.12) !important;
      color: #f0fdff !important;
    }
    html.dark .formula-hero .katex {
      color: #7df9ff !important;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.35);
    }
    html.dark .bg-\[\#2493DF\] {
      background: linear-gradient(135deg, #00d2ff 0%, #7c3aed 100%) !important;
      color: #000000 !important;
      font-weight: 800;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
    }
    html.dark .bg-indigo-600 {
      background: linear-gradient(135deg, #b026ff 0%, #00d2ff 100%) !important;
      color: #000000 !important;
      box-shadow: 0 0 16px rgba(176, 38, 255, 0.4);
    }
    html.dark .text-\[\#2493DF\],
    html.dark .dark\:text-sky-300,
    html.dark .dark\:text-sky-400 {
      color: #00f0ff !important;
    }
    html.dark .dark\:text-emerald-400,
    html.dark .dark\:text-emerald-300 {
      color: #00ff9d !important;
    }
    html.dark .dark\:text-rose-400,
    html.dark .dark\:text-rose-300,
    html.dark .dark\:text-pink-300 {
      color: #ff2a85 !important;
    }
    html.dark .dark\:text-amber-400,
    html.dark .dark\:text-amber-300 {
      color: #ffb800 !important;
    }
    html.dark .dark\:text-indigo-300,
    html.dark .dark\:text-indigo-400,
    html.dark .dark\:text-violet-300 {
      color: #d580ff !important;
    }
    html.dark .node-active {
      box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.75);
      animation: neonPulseRing 2s infinite;
    }
    @keyframes neonPulseRing {
      0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7), 0 0 16px rgba(0, 240, 255, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(0, 240, 255, 0), 0 0 22px rgba(176, 38, 255, 0.35); }
      100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0), 0 0 16px rgba(0, 240, 255, 0.5); }
    }
    html.dark .bg-gradient-to-r.from-indigo-600 {
      background: linear-gradient(135deg, #0b0618 0%, #15072b 50%, #041824 100%) !important;
      border: 1px solid rgba(176, 38, 255, 0.55) !important;
      box-shadow: 0 0 22px rgba(176, 38, 255, 0.22), inset 0 0 20px rgba(0, 240, 255, 0.08) !important;
    }
    html.dark .bg-gradient-to-r.from-\[\#2493DF\],
    html.dark .bg-gradient-to-br.from-\[\#2493DF\] {
      background: linear-gradient(135deg, #031522 0%, #110726 60%, #051c29 100%) !important;
      border: 1px solid rgba(0, 240, 255, 0.45) !important;
      box-shadow: 0 0 26px rgba(0, 240, 255, 0.18) !important;
    }
    html.dark svg.bg-white {
      border-color: rgba(0, 240, 255, 0.5) !important;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.16);
    }
    html.dark .math-scroll::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.45);
    }
  </style>
</head>
<body class="bg-[#F4F6FA] dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 pb-20 md:pb-8">

  <!-- TOP HUD HEADER -->
  <header id="main-header" class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-5xl mx-auto px-3 sm:px-5 h-14 flex items-center justify-between gap-2">
      <!-- Brand -->
      <button id="brand-btn" class="flex items-center gap-2 text-left group focus:outline-none">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#2493DF] to-indigo-600 flex items-center justify-center text-white shadow-sm group-hover:scale-105 transition-transform">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="2.2"></circle>
            <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(35 12 12)"></ellipse>
            <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(-35 12 12)"></ellipse>
          </svg>
        </div>
        <div class="leading-tight">
          <div class="font-extrabold text-sm sm:text-base tracking-tight text-slate-900 dark:text-white">PhysicsLab</div>
          <div class="text-[11px] font-medium text-slate-500 dark:text-slate-400 hidden sm:block">পদার্থবিজ্ঞান ২য় পত্র · ১৪৭ সূত্র · ৮০ ঢাবি প্রশ্ন</div>
        </div>
      </button>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center gap-1 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl">
        <button data-nav="learn" class="nav-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all">শিখুন</button>
        <button data-nav="practice" class="nav-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all">প্র্যাকটিস</button>
        <button data-nav="vault" class="nav-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all">সূত্র ভাণ্ডার</button>
        <button data-nav="profile" class="nav-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all">প্রোফাইল</button>
      </nav>

      <!-- HUD Stats & Toggles -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <div id="hud-streak" title="Streak" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800/60 text-amber-600 dark:text-amber-400 text-xs sm:text-sm font-bold">
          <span>🔥</span><span id="streak-val">0</span>
        </div>
        <div id="hud-xp" title="Total XP" class="relative flex items-center gap-1 px-2.5 py-1 rounded-full bg-sky-50 dark:bg-sky-950/50 border border-sky-200 dark:border-sky-800/60 text-[#2493DF] dark:text-sky-400 text-xs sm:text-sm font-bold">
          <span>⚡</span><span id="xp-val">0</span>
        </div>
        <button id="hearts-btn" title="Hearts (Tap to toggle Unlimited Practice Mode)" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800/60 text-rose-600 dark:text-rose-400 text-xs sm:text-sm font-bold hover:brightness-95 transition">
          <span>❤️</span><span id="hearts-val">5</span>
        </button>
        <button id="sound-toggle" title="Toggle Sound Effects" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <span id="sound-icon">🔊</span>
        </button>
        <button id="theme-toggle" title="Toggle Dark/Light Mode" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main id="app-main" class="max-w-5xl mx-auto px-3 sm:px-5 pt-4 sm:pt-6">
    <!-- Dynamic view injected here -->
  </main>

  <!-- FULL-SCREEN LESSON OVERLAY -->
  <div id="lesson-overlay" class="fixed inset-0 z-50 bg-[#F4F6FA] dark:bg-slate-950 hidden flex-col">
    <!-- Lesson Top Bar -->
    <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-3 sm:px-6 py-3">
      <div class="max-w-2xl mx-auto flex items-center gap-3">
        <button id="lesson-exit-btn" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 text-lg font-bold transition" title="Exit Lesson">✕</button>
        <div class="flex-1">
          <div id="lesson-progress-bars" class="flex gap-1 h-2.5"></div>
          <div class="flex items-center justify-between mt-1">
            <span id="lesson-title-label" class="text-xs font-semibold text-slate-500 dark:text-slate-400 truncate"></span>
            <span id="lesson-step-label" class="text-xs font-bold text-[#2493DF]"></span>
          </div>
        </div>
        <div id="lesson-hearts-badge" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 text-xs font-bold">
          <span>❤️</span><span id="lesson-hearts-count">5</span>
        </div>
      </div>
    </div>

    <!-- Lesson Stage -->
    <div id="lesson-body" class="flex-1 overflow-y-auto px-3 sm:px-6 py-5">
      <div id="lesson-card-wrap" class="max-w-2xl mx-auto"></div>
    </div>

    <!-- Lesson Action Footer / Feedback Drawer -->
    <div id="lesson-footer" class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-3 sm:px-6 py-3.5 transition-colors">
      <div id="lesson-footer-inner" class="max-w-2xl mx-auto"></div>
    </div>
  </div>

  <!-- FULL-SCREEN CHAPTER VARSITY GUIDE OVERLAY -->
  <div id="guide-overlay" class="fixed inset-0 z-50 bg-slate-50 dark:bg-slate-950 hidden flex-col">
    <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-3 sm:px-6 py-3">
      <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          <button id="guide-close-btn" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 text-lg font-bold transition shrink-0" title="Close Guide">✕</button>
          <div class="min-w-0">
            <div id="guide-ch-badge" class="text-[11px] font-extrabold uppercase tracking-wider text-indigo-600 dark:text-indigo-400"></div>
            <h2 id="guide-ch-title" class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white truncate"></h2>
          </div>
        </div>
        <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full bg-indigo-50 dark:bg-indigo-950/70 text-indigo-700 dark:text-indigo-300 text-xs font-extrabold shrink-0">DU 'ক' রিভিশন নোট</span>
      </div>
      <div id="guide-tabs" class="max-w-3xl mx-auto flex gap-1.5 mt-3 overflow-x-auto pb-0.5"></div>
    </div>
    <div id="guide-body" class="flex-1 overflow-y-auto px-3 sm:px-6 py-5">
      <div id="guide-content-wrap" class="max-w-3xl mx-auto space-y-4"></div>
    </div>
  </div>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <nav id="mobile-nav" class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 px-2 py-1.5 flex justify-around">
    <button data-nav="learn" class="m-nav-tab flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-xs font-semibold">
      <span class="text-lg leading-none">🗺️</span><span>শিখুন</span>
    </button>
    <button data-nav="practice" class="m-nav-tab flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-xs font-semibold">
      <span class="text-lg leading-none">⚡</span><span>প্র্যাকটিস</span>
    </button>
    <button data-nav="vault" class="m-nav-tab flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-xs font-semibold">
      <span class="text-lg leading-none">📚</span><span>ভাণ্ডার</span>
    </button>
    <button data-nav="profile" class="m-nav-tab flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-xs font-semibold">
      <span class="text-lg leading-none">🏆</span><span>প্রোফাইল</span>
    </button>
  </nav>

  <!-- IN-PAGE MODAL -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div id="modal-box" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl max-w-md w-full p-5 shadow-2xl animate-pop">
      <h3 id="modal-title" class="text-lg font-bold text-slate-900 dark:text-white mb-2"></h3>
      <div id="modal-content" class="text-sm text-slate-600 dark:text-slate-300 mb-5"></div>
      <div id="modal-actions" class="flex justify-end gap-2"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-4 py-2 rounded-full text-sm font-semibold shadow-lg opacity-0 pointer-events-none transition-opacity duration-200"></div>

  <script>
    // =========================================================================

\text{C}\\) (\\(300\\text{ K}\\)) স্থির তাপমাত্রায় \\(1\\text{ mol}\\) আদর্শ গ্যাসের আয়তন দ্বিগুণ হলে কৃতকাজ \\(W = 1 \\times 8.314 \\times 300 \\times \\ln 2 \\approx 1728.5\\text{ J}\\)।"}, {"id": 13, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "রুদ্ধতাপীয় প্রক্রিয়া", "question": "রুদ্ধতাপীয় প্রক্রিয়ায় \\(P, V, T\\) সম্পর্ক, \\(dU\\), কৃতকাজ (\\(W\\)) এবং এন্ট্রপি পরিবর্তন (\\(dS\\)) কী?", "answer": "i. \\(P_1V_1^\\gamma = P_2V_2^\\gamma\\); \\(T_1V_1^{\\gamma-1} = T_2V_2^{\\gamma-1}\\); \\(T_1P_1^{\\frac{1-\\gamma}{\\gamma}} = T_2P_2^{\\frac{1-\\gamma}{\\gamma}}\\)<br>ii. \\(dU = -dW\\), \\(dS = 0\\)<br>iii. \\(W = nC_V(T_1 - T_2) = \\frac{nR}{\\gamma - 1}(T_1 - T_2) = \\frac{P_1V_1 - P_2V_2}{\\gamma - 1}\\)", "context": "<b>শর্ত:<\/b> তাপের আদান-প্রদান শূন্য (\\(dQ = 0\\)), এটি খুব দ্রুত প্রক্রিয়া (যেমন টায়ার ফাটা, শব্দ সঞ্চালন)।<br><b>ধারণা:<\/b> প্রত্যাবর্তী রুদ্ধতাপীয় প্রক্রিয়ায় এন্ট্রপি স্থির থাকে (\\(dS = 0\\))। প্রসারণে গ্যাস শীতল হয় (\\(T_2 \\lt  T_1\\))।", "intuition": "বাইরে থেকে তাপের আদান-প্রদান বন্ধ থাকায় (\\(dQ = 0\\)) গ্যাস প্রসারিত হতে হলে নিজের অভ্যন্তরীণ শক্তি খরচ করে কাজ করে, ফলে গ্যাসটি দ্রুত শীতল হয়ে যায়।", "trap": "কৃতকাজের সূত্রে \\(T_1 - T_2\\) এর বদলে \\(T_2 - T_1\\) বসিয়ে চিহ্ন ভুল করা এবং সূচকে \\(\\gamma\\) ও \\(\\gamma - 1\\) গুলিয়ে ফেলা সবচেয়ে বেশি ঘটে।", "quickExample": "দ্বি-পরমাণুক \\(1\\text{ mol}\\) গ্যাস (\\(\\gamma = 1.4\\)) রুদ্ধতাপীয় প্রক্রিয়ায় \\(400\\text{ K}\\) থেকে \\(300\\text{ K}\\) এ প্রসারিত হলে কৃতকাজ \\(W = \\frac{1 \\times 8.314}{1.4 - 1}(400 - 300) = 2078.5\\text{ J}\\)।"}, {"id": 14, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "মোলার আপেক্ষিক তাপ", "question": "\\(C_P, C_V, R, \\gamma\\) এবং স্বাধীনতার মাত্রা \\(f\\) এর মধ্যে সম্পর্কগুলো কী?", "answer": "\\(C_P - C_V = R\\); \\(\\gamma = \\frac{C_P}{C_V}\\); \\(C_V = \\frac{R}{\\gamma - 1}\\); \\(\\gamma = 1 + \\frac{2}{f}\\)", "context": "<b>প্রতীক:<\/b> \\(C_P\\) = স্থির চাপে মোলার আপেক্ষিক তাপ; \\(C_V\\) = স্থির আয়তনে মোলার আপেক্ষিক তাপ; \\(R\\) = মোলার গ্যাস ধ্রুবক।<br><b>তথ্য:<\/b> সর্বদা \\(C_P \\gt  C_V\\) এবং \\(\\gamma \\gt  1\\)। \\(C_P - C_V = R\\) হলো মেয়ারের সম্পর্ক।", "intuition": "স্থির চাপে গ্যাসের তাপমাত্রা \\(1\\text{ K}\\) বাড়াতে অভ্যন্তরীণ শক্তি বৃদ্ধির পাশাপাশি প্রসারণ কাজও করতে হয়, তাই \\(C_P\\) সর্বদা \\(C_V\\) এর চেয়ে ঠিক \\(R\\) পরিমাণ বেশি হয়।", "trap": "মোলার আপেক্ষিক তাপ \\(C_P, C_V\\) (একক \\(\\text{J mol}^{-1}\\text{K}^{-1}\\)) এবং ভরের আপেক্ষিক তাপ \\(c_p, c_v\\) গুলিয়ে ফেলা; ভরের ক্ষেত্রে সম্পর্কটি \\(c_p - c_v = \\frac{R}{M}\\)।", "quickExample": "কোনো আদর্শ গ্যাসের \\(\\gamma = 1.5\\) হলে, \\(C_V = \\frac{R}{1.5 - 1} = 2R\\) এবং \\(C_P = C_V + R = 3R\\)।"}, {"id": 15, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "স্বাধীনতার মাত্রা", "question": "এক-পরমাণুক, দ্বি-পরমাণুক ও বহু-পরমাণুক গ্যাসের স্বাধীনতার মাত্রা (\\(f\\)) কত?", "answer": "এক-পরমাণুক: \\(3\\) • দ্বি-পরমাণুক: \\(5\\) • বহু-পরমাণুক: \\(6\\)", "context": "<b>\\(\\gamma\\)-এর মান:<\/b> এক-পরমাণুক (\\(\\text{He, Ne, Ar}\\)): \\(f=3 \\Rightarrow \\gamma = 1.67\\) • দ্বি-পরমাণুক (\\(\\text{O}_2, \\text{N}_2, \\text{H}_2\\)): \\(f=5 \\Rightarrow \\gamma = 1.40\\) • বহু-পরমাণুক (\\(\\text{CO}_2, \\text{CH}_4\\)): \\(f=6 \\Rightarrow \\gamma = 1.33\\)।", "intuition": "অণুর গঠন যত জটিল হয়, তা রৈখিক গতির পাশাপাশি ঘূর্ণন ও কম্পন গতিতেও শক্তি সঞ্চয় করতে পারে; ফলে স্বাধীনতার মাত্রা \\(f\\) বাড়ে এবং \\(\\gamma = 1 + \\frac{2}{f}\\) কমে যায়।", "trap": "এক-পরমাণুক (\\(1.67\\)), দ্বি-পরমাণুক (\\(1.40\\)) ও বহু-পরমাণুক (\\(1.33\\)) গ্যাসের \\(\\gamma\\)-এর ক্রম উল্টে ফেলা এবং \\(\\text{CO}_2\\) বা \\(\\text{CH}_4\\) কে দ্বি-পরমাণুক ভেবে ভুল করা।", "quickExample": "অক্সিজেন (\\(\\text{O}_2\\)) দ্বি-পরমাণুক গ্যাস হওয়ায় এর স্বাধীনতার মাত্রা \\(f = 5\\); সুতরাং \\(\\gamma = 1 + \\frac{2}{5} = 1.40\\)।"}, {"id": 16, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "রেখার ঢাল", "question": "\\(P\\text{–}V\\) লেখচিত্রে সমোষ্ণ ও রুদ্ধতাপীয় রেখার ঢাল কত?", "answer": "সমোষ্ণ রেখার ঢাল \\(= -\\frac{P}{V}\\)<br>রুদ্ধতাপীয় রেখার ঢাল \\(= \\gamma\\left(-\\frac{P}{V}\\right)\\)", "context": "<b>ধারণা:<\/b> যেহেতু \\(\\gamma \\gt  1\\), তাই রুদ্ধতাপীয় রেখা সমোষ্ণ রেখার চেয়ে \\(\\gamma\\) গুণ বেশি খাড়া (steeper)। উভয় ঢালই ঋণাত্মক।", "intuition": "রুদ্ধতাপীয় প্রসারণে আয়তন বাড়ার সাথে তাপমাত্রাও কমে বলে চাপ সমোষ্ণ প্রক্রিয়ার চেয়ে দ্রুত হ্রাস পায়; তাই \\(P\\text{–}V\\) লেখচিত্রে রুদ্ধতাপীয় রেখা \\(\\gamma\\) গুণ বেশি খাড়া হয়।", "trap": "উভয় ঢালই ঋণাত্মক হওয়া সত্ত্বেও অনেকেই ঋণাত্মক চিহ্ন বাদ দেয় অথবা অনুপাত বের করতে গিয়ে \\(\\frac{1}{\\gamma}\\) ও \\(\\gamma\\) উল্টে ফেলে।", "quickExample": "কোনো বিন্দুতে \\(P = 200\\text{ Pa}, V = 4\\text{ m}^3\\) হলে দ্বি-পরমাণুক গ্যাসের (\\(\\gamma = 1.4\\)) সমোষ্ণ ঢাল \\(= -\\frac{200}{4} = -50\\text{ Pa m}^{-3}\\) এবং রুদ্ধতাপীয় ঢাল \\(= 1.4 \\times (-50) = -70\\text{ Pa m}^{-3}\\)।"}, {"id": 17, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "গ্যাস মিশ্রণ", "question": "একাধিক গ্যাসের মিশ্রণের তুল্য \\(\\gamma_{\\text{mix}}\\), তাপমাত্রা \\(T_{\\text{mix}}\\) এবং চাপ \\(P_{\\text{mix}}\\) নির্ণয়ের সূত্র কী?", "answer": "\\(\\frac{n_1+n_2+\\dots}{\\gamma_{\\text{mix}}-1} = \\frac{n_1}{\\gamma_1-1} + \\frac{n_2}{\\gamma_2-1} + \\dots\\)<br>\\(T_{\\text{mix}} = \\frac{n_1T_1 + n_2T_2 + \\dots}{n_1+n_2+\\dots}\\)<br>\\(P_{\\text{mix}} = \\frac{n_1P_1 + n_2P_2 + \\dots}{n_1+n_2+\\dots}\\)", "context": "<b>প্রতীক:<\/b> \\(n_1, n_2, \\dots\\) = উপাদান গ্যাসগুলোর মোল সংখ্যা; \\(\\gamma_1, \\gamma_2, \\dots\\) = তাদের আপেক্ষিক তাপের অনুপাত।<br><b>প্রয়োগ:<\/b> দুটি ভিন্ন পারমাণবিকতার আদর্শ গ্যাস মেশালে মিশ্রণের কার্যকর \\(\\gamma\\) বের করতে ব্যবহৃত হয়।", "intuition": "দুটি ভিন্ন গ্যাস মেশালে তাদের মোট অভ্যন্তরীণ শক্তি ও মোলার তাপ ধারণ ক্ষমতা যোগ হয় বলেই মিশ্রণের তুল্য \\(\\gamma_{\\text{mix}}\\) সাধারণ গড় না হয়ে \\(\\frac{1}{\\gamma - 1}\\) এর ভারযুক্ত গড় মেনে চলে।", "trap": "মিশ্রণের \\(\\gamma_{\\text{mix}}\\) বের করতে গিয়ে সরাসরি \\(\\frac{n_1\\gamma_1 + n_2\\gamma_2}{n_1 + n_2}\\) বসানো ভর্তি পরীক্ষার অন্যতম প্রিয় ফাঁদ।", "quickExample": "\\(1\\text{ mol}\\) এক-পরমাণুক (\\(\\gamma_1 = \\frac{5}{3}\\)) ও \\(1\\text{ mol}\\) দ্বি-পরমাণুক (\\(\\gamma_2 = \\frac{7}{5}\\)) গ্যাস মেশালে \\(\\frac{2}{\\gamma_{\\text{mix}} - 1} = \\frac{1}{2/3} + \\frac{1}{2/5} = 1.5 + 2.5 = 4 \\Rightarrow \\gamma_{\\text{mix}} = 1.5\\)।"}, {"id": 18, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "এন্ট্রপি পরিবর্তন", "question": "একই তাপমাত্রায় (অবস্থার পরিবর্তনে) এবং পরিবর্তনশীল তাপমাত্রায় এন্ট্রপি পরিবর্তন \\(dS\\) এর সূত্র কী?", "answer": "i. একই তাপমাত্রায়: \\(dS = \\frac{dQ}{T} = \\frac{mL}{T}\\)<br>ii. পরিবর্তনশীল তাপমাত্রায়: \\(dS = \\int_{T_1}^{T_2}\\frac{dQ}{T} = \\int_{T_1}^{T_2}\\frac{ms\\,dT}{T} = ms\\ln\\left(\\frac{T_2}{T_1}\\right)\\)", "context": "<b>সতর্কতা:<\/b> \\(T, T_1, T_2\\) অবশ্যই <b>কেলভিন (K)<\/b> এককে বসাতে হবে।<br><b>একক:<\/b> \\(\\text{J K}^{-1}\\)। স্বতঃস্ফূর্ত ও অপ্রত্যাবর্তী প্রক্রিয়ায় মহাবিশ্বের এন্ট্রপি সর্বদা বৃদ্ধি পায় (\\(\\Delta S \\gt  0\\))।", "intuition": "এন্ট্রপি হলো সিস্টেমের আণবিক বিশৃঙ্খলার পরিমাপ—তাপ শোষিত হলে অণুগুলোর এলোমেলো গতি বাড়ে বলে এন্ট্রপি বাড়ে, আর একই পরিমাণ তাপ কম তাপমাত্রায় যোগ করলে বিশৃঙ্খলা আরও বেশি বাড়ে।", "trap": "তাপমাত্রা পরিবর্তনশীল হলে \\(ms\\ln\\left(\\frac{T_2}{T_1}\\right)\\) সূত্রে \\(T_1, T_2\\) অবশ্যই কেলভিনে বসাতে হয়; সেলসিয়াসে বসালে অনুপাতটি সম্পূর্ণ ভুল হয়ে যায়।", "quickExample": "\\(0^\\circ\\text{C}\\) (\\(273\\text{ K}\\)) তাপমাত্রার \\(1\\text{ kg}\\) বরফ গলে \\(0^\\circ\\text{C}\\) পানিতে পরিণত হলে এন্ট্রপি বৃদ্ধি \\(\\Delta S = \\frac{mL_f}{T} = \\frac{1 \\times 336000}{273} \\approx 1230.8\\text{ J K}^{-1}\\)।"}, {"id": 19, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "কার্নো ইঞ্জিন", "question": "কার্নো ইঞ্জিনের তাপ-তাপমাত্রার সম্পর্ক, কৃতকাজ \\(W\\) ও দক্ষতা \\(\\eta\\) এর সূত্র কী?", "answer": "i. \\(\\frac{T_1}{T_2} = \\frac{Q_1}{Q_2}\\)<br>ii. কৃতকাজ: \\(W = Q_1 - Q_2\\) [\\(Q_1 = W + Q_2\\)]<br>iii. দক্ষতা: \\(\\eta = \\left(1 - \\frac{T_2}{T_1}\\right)\\times 100\\% = \\left(1 - \\frac{Q_2}{Q_1}\\right)\\times 100\\%\\)", "context": "<b>প্রতীক:<\/b> \\(T_1, Q_1\\) = তাপ উৎসের তাপমাত্রা (K) ও শোষিত তাপ; \\(T_2, Q_2\\) = তাপ গ্রাহকের তাপমাত্রা (K) ও বর্জিত তাপ।<br><b>ধারণা:<\/b> \\(T_2 = 0\\text{ K}\\) না হলে \\(\\eta = 100\\%\\) সম্ভব নয়। দক্ষতা শুধু \\(T_1, T_2\\)-এর ওপর নির্ভরশীল।", "intuition": "তাপ ইঞ্জিন কখনোই শোষিত সম্পূর্ণ তাপকে কাজে পরিণত করতে পারে না; উৎস ও গ্রাহকের তাপমাত্রার পার্থক্য যত বেশি, ইঞ্জিনের তাত্ত্বিক সর্বোচ্চ দক্ষতাও তত বেশি হয়।", "trap": "\\(T_1\\) ও \\(T_2\\) সেলসিয়াসে বসানো এবং গ্রাহকের তাপমাত্রা \\(T_2\\) এর সাথে উৎসের তাপমাত্রা \\(T_1\\) অদলবদল করে ফেলা কার্নো ইঞ্জিনের সবচেয়ে সাধারণ ভুল।", "quickExample": "একটি কার্নো ইঞ্জিন \\(500\\text{ K}\\) তাপ উৎস এবং \\(300\\text{ K}\\) তাপ গ্রাহকের মধ্যে কাজ করলে দক্ষতা \\(\\eta = \\left(1 - \\frac{300}{500}\\right) \\times 100\\% = 40\\%\\)।"}, {"id": 20, "ch": 1, "chapter": "অধ্যায় ১: তাপগতিবিদ্যা", "topic": "রেফ্রিজারেটর", "question": "রেফ্রিজারেটরের তাপ-তাপমাত্রার সম্পর্ক, কৃতকাজ \\(W\\) ও কর্মসম্পাদন সহগ (\\(\\text{COP}\\)) নির্ণয়ের সূত্র কী?", "answer": "i. \\(\\frac{T_H}{T_L} = \\frac{Q_H}{Q_L}\\)<br>ii. কৃতকাজ: \\(W = Q_H - Q_L\\)<br>iii. \\(\\text{COP} = \\frac{\\text{desired output}}{\\text{input}} = \\frac{Q_L}{W} = \\frac{Q_L}{Q_H - Q_L} = \\frac{T_L}{T_H - T_L}\\)", "context": "<b>প্রতীক:<\/b> \\(T_L, Q_L\\) = শীতল প্রকোষ্ঠের (খাবার) তাপমাত্রা ও অপসারিত তাপ; \\(T_H, Q_H\\) = পরিবেশের তাপমাত্রা ও বর্জিত তাপ; \\(W\\) = কম্প্রেসরের কাজ।<br><b>তথ্য:<\/b> \\(\\text{COP}\\) এর মান \\(1\\)-এর চেয়ে বড় হতে পারে এবং এর কোনো একক নেই।", "intuition": "রেফ্রিজারেটর উল্টো কার্নো ইঞ্জিনের মতো কাজ করে—বাইরে থেকে যান্ত্রিক কাজ \\(W\\) দিয়ে এটি শীতল প্রকোষ্ঠ থেকে তাপ \\(Q_L\\) টেনে নিয়ে উষ্ণ পরিবেশে \\(Q_H = Q_L + W\\) তাপ বর্জন করে।", "trap": "\\(\\text{COP} = \\frac{T_L}{T_H - T_L}\\) সূত্রে লবে \\(T_L\\)-এর বদলে \\(T_H\\) বসানো (যা হিট পাম্পের সূত্র) এবং \\(T_L\\) কেলভিনে না নিয়ে সেলসিয়াসে বসানো।", "quickExample": "কোনো রেফ্রিজারেটরের শীতল প্রকোষ্ঠ \\(270\\text{ K}\\) ও পরিবেশ \\(300\\text{ K}\\) তাপমাত্রায় থাকলে \\(\\text{COP} = \\frac{270}{300 - 270} = \\frac{270}{30} = 9\\)।"}, {"id": 21, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "চার্জের কোয়ান্টায়ন", "question": "চার্জের কোয়ান্টায়নের সূত্র কী?", "answer": "\\(q = ne\\) [যেখানে \\(n = 0, 1, 2, \\dots\\)]", "context": "<b>প্রতীক:<\/b> \\(e = 1.6 \\times 10^{-19}\\text{ C}\\) (একটি ইলেকট্রনের চার্জ), \\(n\\) = পূর্ণসংখ্যা।<br><b>ধারণা:<\/b> কোনো বস্তুর চার্জ সর্বদা \\(e\\)-এর পূর্ণ গুণিতক হয়, ভগ্নাংশ হতে পারে না।", "intuition": "প্রকৃতিতে চার্জ অবিচ্ছিন্ন নয়, বরং ইলেকট্রনের চার্জ \\(e\\)-এর অখণ্ড প্যাকেটের মতো করে স্থানান্তরিত হয়। তাই কোনো বস্তুর মোট চার্জ সর্বদা \\(e\\)-এর পূর্ণ গুণিতক হয়, ভগ্নাংশ হতে পারে না।", "trap": "পরীক্ষায় \\(q = 2.4 \\times 10^{-19}\\text{ C}\\) বা \\(n = 1.5\\) দিলে অনেকেই তা সম্ভাব্য চার্জ মনে করে ভুল করে—মনে রাখবে \\(n\\) ভগ্নাংশ হলে সেই চার্জ বাস্তবে সম্ভব নয়, আর ইলেকট্রন হারালে বস্তু ধনাত্মক ও গ্রহণ করলে ঋণাত্মক চার্জিত হয়।", "quickExample": "কোনো বস্তুতে \\(1\\text{ C}\\) চার্জ তৈরি করতে কতটি ইলেকট্রন প্রয়োজন? \\(n = \\frac{q}{e} = \\frac{1}{1.6 \\times 10^{-19}} = 6.25 \\times 10^{18}\\) টি ইলেকট্রন।"}, {"id": 22, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "কুলম্বের সূত্র", "question": "শূন্য মাধ্যমে ও \\(k\\) পরাবৈদ্যুতিক ধ্রুবক বিশিষ্ট মাধ্যমে কুলম্বের বল \\(F\\) এবং \\(k\\) এর সংজ্ঞা কী?", "answer": "শূন্য মাধ্যমে: \\(F = \\frac{1}{4\\pi\\epsilon_0}\\left(\\frac{q_1q_2}{r^2}\\right) = 9\\times 10^9\\left(\\frac{q_1q_2}{r^2}\\right)\\)<br>\\(k\\) মাধ্যমে: \\(F = \\frac{1}{4\\pi\\epsilon_0 k}\\left(\\frac{q_1q_2}{r^2}\\right)\\) এবং \\(k = \\frac{\\epsilon}{\\epsilon_0} = \\frac{F_0}{F_m}\\)", "context": "<b>প্রতীক:<\/b> \\(\\epsilon_0 = 8.854\\times 10^{-12}\\text{ C}^2\\text{N}^{-1}\\text{m}^{-2}\\) (শূন্য মাধ্যমের ভেদনযোগ্যতা); \\(r\\) = চার্জদ্বয়ের মধ্যবর্তী দূরত্ব।<br><b>ধারণা:<\/b> শূন্য মাধ্যমের জন্য \\(k=1\\), পানির \\(k \\approx 80\\), ধাতুর \\(k = \\infty\\)। অন্য মাধ্যমে বল \\(k\\) গুণ কমে যায়।", "intuition": "দুটি বিন্দু চার্জের মধ্যকার আকর্ষণ বা বিকর্ষণ বল তাদের চার্জের গুণফলের সমানুপাতিক এবং দূরত্বের বর্গের ব্যস্তানুপাতিক। শূন্য মাধ্যমের বদলে অন্য কোনো পরাবৈদ্যুতিক মাধ্যমে রাখলে মাধ্যমের পোলারায়নের ফলে কার্যকর বল \\(k\\) গুণ কমে যায়।", "trap": "মাধ্যম পরিবর্তন করলে \\(F\\) কমে \\(k\\) গুণ—ভুল করে \\(k\\) দিয়ে গুণ করে ফেলো না, এবং \\(\\epsilon_0\\)-এর একক \\(\\text{C}^2\\text{N}^{-1}\\text{m}^{-2}\\) যা কুলম্ব ধ্রুবকের এককের ঠিক উল্টো।", "quickExample": "শূন্য মাধ্যমে \\(2\\ \\mu\\text{C}\\) ও \\(3\\ \\mu\\text{C}\\) চার্জ \\(0.3\\text{ m}\\) দূরত্বে থাকলে \\(F_0 = 9 \\times 10^9 \\times \\frac{2 \\times 10^{-6} \\times 3 \\times 10^{-6}}{(0.3)^2} = 0.6\\text{ N}\\)। \\(k = 3\\) মাধ্যমে রাখলে \\(F_m = \\frac{0.6}{3} = 0.2\\text{ N}\\)।"}, {"id": 23, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "তড়িৎ প্রাবল্য", "question": "বিন্দু চার্জের জন্য শূন্য ও \\(k\\) মাধ্যমে প্রাবল্য \\(E\\) এবং বল, তলমাত্রিক ঘনত্ব ও বিভবের সাথে \\(E\\) এর সম্পর্ক কী?", "answer": "\\(E = \\frac{1}{4\\pi\\epsilon_0}\\frac{q}{r^2} = 9\\times 10^9\\frac{q}{r^2}\\) (\\(k\\) মাধ্যমে \\(\\frac{1}{k}\\) গুণ)<br>\\(E = \\frac{F}{q} = \\frac{\\sigma}{\\epsilon_0} = \\frac{V}{d} = -\\frac{dV}{dr}\\)", "context": "<b>একক:<\/b> \\(\\text{N C}^{-1}\\) বা \\(\\text{V m}^{-1}\\) (ভেক্টর রাশি)।<br><b>দিক:<\/b> ধনাত্মক চার্জ থেকে বাইরের দিকে এবং ঋণাত্মক চার্জের দিকে। ঋণাত্মক চিহ্ন (\\(-\\frac{dV}{dr}\\)) বোঝায় প্রাবল্যের দিকে বিভব কমে।", "intuition": "তড়িৎ ক্ষেত্রের কোনো বিন্দুতে \\(+1\\text{ C}\\) পরীক্ষা চার্জ রাখলে সেটি যে বল অনুভব করে, তা-ই ওই বিন্দুর তড়িৎ প্রাবল্য। ঋণাত্মক চিহ্ন (\\(E = -\\frac{dV}{dr}\\)) বোঝায় যে প্রাবল্যের অভিমুখে এগিয়ে গেলে তড়িৎ বিভব ক্রমশ হ্রাস পায়।", "trap": "\\(E = \\frac{F}{q}\\) দেখে অনেকেই ভাবে \\(E\\) পরীক্ষা চার্জ \\(q\\)-এর ওপর নির্ভরশীল—আসলে \\(E\\) কেবল উৎস চার্জ ও দূরত্বের ওপর নির্ভর করে, আর \\(\\text{V m}^{-1}\\) ও \\(\\text{N C}^{-1}\\) একই ভৌত রাশির একক।", "quickExample": "দুটি সমান্তরাল পাতের মধ্যবর্তী দূরত্ব \\(2\\text{ cm} = 0.02\\text{ m}\\) এবং বিভব পার্থক্য \\(100\\text{ V}\\) হলে প্রাবল্য \\(E = \\frac{V}{d} = \\frac{100}{0.02} = 5000\\text{ V m}^{-1}\\)।"}, {"id": 24, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "চার্জের তলমাত্রিক ঘনত্ব", "question": "চার্জের তলমাত্রিক ঘনত্ব \\(\\sigma\\) এবং গোলকের ক্ষেত্রে এর সূত্র কী?", "answer": "সাধারণ ক্ষেত্রে: \\(\\sigma = \\frac{q}{A}\\)<br>গোলকের ক্ষেত্রে: \\(\\sigma = \\frac{q}{4\\pi r^2}\\)", "context": "<b>সংজ্ঞা:<\/b> পরিবাহীর পৃষ্ঠের প্রতি একক ক্ষেত্রফলে সঞ্চিত চার্জের পরিমাণ।<br><b>একক:<\/b> \\(\\text{C m}^{-2}\\)। সূঁচালো প্রান্তে বক্রতার ব্যাসার্ধ \\(r\\) কম বলে \\(\\sigma\\) সবচেয়ে বেশি হয়।", "intuition": "পরিবাহীর পৃষ্ঠের প্রতি একক ক্ষেত্রফলে কতটুকু চার্জ জমে আছে, তা-ই তলমাত্রিক চার্জ ঘনত্ব \\(\\sigma\\)। গোলকের ক্ষেত্রফল \\(4\\pi r^2\\) হওয়ায় একই চার্জে ব্যাসার্ধ যত ছোট বা প্রান্ত যত সূঁচালো হয়, \\(\\sigma\\) তত বেশি হয়।", "trap": "গোলকের ব্যাসার্ধ দ্বিগুণ করলে অনেকেই \\(\\sigma\\) অর্ধেক হবে ভাবে—কিন্তু \\(A = 4\\pi r^2\\) হওয়ায় একই চার্জের জন্য ব্যাসার্ধ দ্বিগুণ হলে \\(\\sigma\\) এক-চতুর্থাংশ (\\(\\frac{1}{4}\\) গুণ) হয়।", "quickExample": "\\(0.1\\text{ m}\\) ব্যাসার্ধের একটি গোলকে \\(4\\pi \\times 10^{-6}\\text{ C}\\) চার্জ দিলে \\(\\sigma = \\frac{q}{4\\pi r^2} = \\frac{4\\pi \\times 10^{-6}}{4\\pi (0.1)^2} = 10^{-4}\\text{ C m}^{-2}\\)।"}, {"id": 25, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "লব্ধি প্রাবল্য", "question": "\\(\\theta\\) কোণে ক্রিয়াশীল দুটি তড়িৎ প্রাবল্য \\(E_1\\) ও \\(E_2\\) এর লব্ধি প্রাবল্য \\(E\\) কত?", "answer": "\\(E = \\sqrt{E_1^2 + E_2^2 + 2E_1E_2\\cos\\theta}\\)", "context": "<b>বিশেষ ক্ষেত্র:<\/b> \\(\\theta = 0^\\circ\\) (একই দিকে) \\(\\Rightarrow E = E_1 + E_2\\); \\(\\theta = 180^\\circ\\) (বিপরীত দিকে) \\(\\Rightarrow E = |E_1 - E_2|\\); \\(\\theta = 90^\\circ \\Rightarrow E = \\sqrt{E_1^2 + E_2^2}\\)।", "intuition": "তড়িৎ প্রাবল্য ভেক্টর রাশি বলে একাধিক চার্জের সম্মিলিত প্রাবল্য সাধারণ যোগে পাওয়া যায় না, বরং ভেক্টর সামান্তরিক সূত্র মেনে চলে। প্রাবল্যদ্বয় একই দিকে থাকলে লব্ধি সর্বোচ্চ এবং বিপরীত দিকে থাকলে সর্বনিম্ন হয়।", "trap": "দুটি সমান প্রাবল্য \\(E_0\\) পরস্পর \\(120^\\circ\\) কোণে ক্রিয়া করলে লব্ধি শূন্য নয় বরং \\(E_0\\)-এর সমান হয়, এবং \\(\\theta\\) নির্ণয়ে ধনাত্মক চার্জের প্রাবল্য বাইরের দিকে ও ঋণাত্মক চার্জের প্রাবল্য চার্জের দিকে ধরতে ভুল করা যাবে না।", "quickExample": "\\(E_1 = 6\\text{ N C}^{-1}\\) ও \\(E_2 = 8\\text{ N C}^{-1}\\) পরস্পর \\(90^\\circ\\) কোণে ক্রিয়া করলে লব্ধি প্রাবল্য \\(E = \\sqrt{6^2 + 8^2} = \\sqrt{100} = 10\\text{ N C}^{-1}\\)।"}, {"id": 26, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "SVSL: শূন্য প্রাবল্য বিন্দু", "question": "\\(d\\) দূরত্বে অবস্থিত \\(q_1\\) ও \\(q_2\\) সমধর্মী ও বিপরীতধর্মী চার্জের ক্ষেত্রে \\(q_1\\) থেকে কত দূরত্বে (\\(x\\)) প্রাবল্য শূন্য হয়?", "answer": "i. সমধর্মী (ভেতরে): \\(x = \\frac{d}{1 + \\sqrt{\\frac{q_2}{q_1}}}\\)<br>ii. বিপরীতধর্মী ও \\(q_1 \\lt  q_2\\) হলে (বাইরে): \\(x = \\frac{d}{\\sqrt{\\frac{q_2}{q_1}} - 1}\\) [\\(q_1, q_2\\) এর কেবল মান বসবে]", "context": "<b>সতর্কতা:<\/b> চার্জের চিহ্ন (\\(+\\) বা \\(-\\)) সূত্রে বসাবে না, শুধু মান বসাও।<br><b>অবস্থান:<\/b> শূন্য প্রাবল্য বিন্দু সর্বদা <b>মানের দিক থেকে ছোট চার্জের<\/b> কাছাকাছি থাকে।", "intuition": "যে বিন্দুতে দুটি চার্জের সৃষ্ট প্রাবল্য মানের দিক থেকে সমান ও বিপরীতমুখী হয়, সেখানে লব্ধি প্রাবল্য শূন্য হয়। ছোট চার্জের প্রভাব দূরত্বের সাথে দ্রুত দুর্বল হয়ে যায় বলে শূন্য প্রাবল্য বিন্দু সর্বদা মানের দিক থেকে ছোট চার্জের কাছেই থাকে।", "trap": "বিপরীতধর্মী চার্জের ক্ষেত্রে সূত্রে চার্জের ঋণাত্মক চিহ্ন বসালে বর্গমূলের ভেতর ঋণাত্মক সংখ্যা চলে আসে—তাই সূত্রে সর্বদা কেবল মান বসাতে হবে এবং বিন্দুটি সংযোগ রেখার বাইরে ছোট চার্জের পাশে খুঁজতে হবে।", "quickExample": "\\(12\\text{ cm}\\) দূরত্বে অবস্থিত \\(+4\\ \\mu\\text{C}\\) ও \\(+16\\ \\mu\\text{C}\\) চার্জের ক্ষেত্রে \\(+4\\ \\mu\\text{C}\\) থেকে ভেতরে \\(x = \\frac{12}{1 + \\sqrt{16/4}} = \\frac{12}{3} = 4\\text{ cm}\\) দূরত্বে প্রাবল্য শূন্য হবে।"}, {"id": 27, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "তড়িৎ ফ্লাক্স", "question": "তড়িৎ ফ্লাক্স \\(\\phi\\) নির্ণয়ের সূত্র কী?", "answer": "\\(\\phi = \\frac{q}{\\epsilon_0} = \\vec{A}\\cdot\\vec{E} = AE\\cos\\theta\\)", "context": "<b>প্রতীক:<\/b> \\(\\theta\\) = তড়িৎ ক্ষেত্র \\(\\vec{E}\\) এবং তলের <b>অভিলম্বের (ক্ষেত্রফল ভেক্টর \\(\\vec{A}\\))<\/b> মধ্যবর্তী কোণ (তলের সাথে কোণ নয়!)।<br><b>একক:<\/b> \\(\\text{N m}^2\\text{C}^{-1}\\) বা \\(\\text{V m}\\) (স্কেলার রাশি)।", "intuition": "কোনো তলের মধ্য দিয়ে লম্বভাবে কত সংখ্যক তড়িৎ বলরেখা অতিক্রম করছে, তার পরিমাপই হলো তড়িৎ ফ্লাক্স। বদ্ধ তলের ক্ষেত্রে ফ্লাক্স কেবল ভেতরে আবদ্ধ মোট চার্জের ওপর নির্ভর করে, তলের আকার বা আয়তনের ওপর নয়।", "trap": "প্রশ্নে তড়িৎ ক্ষেত্র ও তলের মধ্যবর্তী কোণ \\(30^\\circ\\) দেওয়া থাকলে \\(\\theta = 30^\\circ\\) বসানো সবচেয়ে বড় ভুল—কারণ \\(\\theta\\) হলো \\(\\vec{E}\\) ও তলের অভিলম্বের মধ্যবর্তী কোণ, অর্থাৎ এখানে \\(\\theta = 90^\\circ - 30^\\circ = 60^\\circ\\)।", "quickExample": "\\(0.5\\text{ m}^2\\) ক্ষেত্রফলের একটি তলের অভিলম্বের সাথে \\(60^\\circ\\) কোণে \\(200\\text{ N C}^{-1}\\) প্রাবল্য ক্রিয়া করলে ফ্লাক্স \\(\\phi = 0.5 \\times 200 \\times \\cos 60^\\circ = 50\\text{ N m}^2\\text{C}^{-1}\\)।"}, {"id": 28, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "তড়িৎ দ্বিমেরু", "question": "তড়িৎ দ্বিমেরুর প্রাবল্য (\\(E\\)), বিভব (\\(V\\)), ভ্রামক (\\(p\\)), টর্ক (\\(\\tau\\)) ও ঘুরাতে কৃতকাজ (\\(W\\)) এর সূত্রগুলো কী?", "answer": "i. \\(E = \\frac{1}{4\\pi\\epsilon_0}\\frac{p}{r^3}\\sqrt{1 + 3\\cos^2\\theta}\\)<br>ii. \\(V = \\frac{1}{4\\pi\\epsilon_0}\\frac{p\\cos\\theta}{r^2}\\)<br>iii. \\(p = 2lq\\)<br>iv. \\(\\tau = |\\vec{p}\\times\\vec{E}| = pE\\sin\\theta\\)<br>v. \\(W = pE[\\cos\\theta_1 - \\cos\\theta_2]\\)", "context": "<b>প্রতীক:<\/b> \\(2l\\) = দ্বিমেরুর দৈর্ঘ্য, \\(p\\) = দ্বিমেরু ভ্রামক (\\(\\text{C m}\\), দিক \\(-q \\to +q\\))।<br><b>বিশেষ ক্ষেত্র:<\/b> অক্ষের ওপর (\\(\\theta = 0^\\circ\\)): \\(E = \\frac{2p}{4\\pi\\epsilon_0 r^3}\\); লম্বদ্বিখণ্ডকে (\\(\\theta = 90^\\circ\\)): \\(E = \\frac{p}{4\\pi\\epsilon_0 r^3}\\) ও \\(V = 0\\)।", "intuition": "সমমানের দুটি বিপরীত চার্জ খুব কাছাকাছি থাকায় তাদের প্রভাব পরস্পরকে আংশিক নাকচ করে, ফলে দ্বিমেরুর প্রাবল্য দূরত্বের ঘনের ব্যস্তানুপাতে (\\(\\frac{1}{r^3}\\)) দ্রুত কমে যায়। সুষম তড়িৎ ক্ষেত্রে দ্বিমেরুর ওপর লব্ধি বল শূন্য হলেও টর্ক ক্রিয়া করে তাকে ক্ষেত্রের সমান্তরালে আনতে চায়।", "trap": "দ্বিমেরুর লম্বদ্বিখণ্ডকে (\\(\\theta = 90^\\circ\\)) বিভব \\(V = 0\\) হলেও প্রাবল্য শূন্য নয় (\\(E = \\frac{p}{4\\pi\\epsilon_0 r^3}\\)), এবং সাম্যাবস্থা (\\(\\theta = 0^\\circ\\)) থেকে \\(180^\\circ\\) ঘুরাতে কৃতকাজ \\(pE\\) নয় বরং \\(2pE\\)।", "quickExample": "\\(p = 2 \\times 10^{-6}\\text{ C m}\\) ভ্রামকের একটি দ্বিমেরু \\(E = 5 \\times 10^4\\text{ N C}^{-1}\\) সুষম ক্ষেত্রে \\(30^\\circ\\) কোণে থাকলে টর্ক \\(\\tau = pE\\sin 30^\\circ = 2 \\times 10^{-6} \\times 5 \\times 10^4 \\times 0.5 = 0.05\\text{ N m}\\)।"}, {"id": 29, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "তড়িৎ বিভব", "question": "বিন্দু চার্জ ও বহু-চার্জের জন্য তড়িৎ বিভব \\(V\\) এর সূত্র কী?", "answer": "\\(V = \\frac{1}{4\\pi\\epsilon_0}\\frac{q}{r} = 9\\times 10^9\\frac{q}{r}\\) এবং \\(V = \\sum V_n = \\frac{1}{4\\pi\\epsilon_0 k}\\sum \\frac{q}{r}\\)", "context": "<b>বৈশিষ্ট্য:<\/b> বিভব স্কেলার রাশি, একক ভোল্ট (\\(\\text{V} = \\text{J C}^{-1}\\))।<br><b>সতর্কতা:<\/b> মোট বিভব নির্ণয়ে প্রতিটি চার্জের <b>চিহ্ন (\\(+\\) বা \\(-\\)) সহ<\/b> বীজগাণিতিক যোগ করতে হয়।", "intuition": "অসীম দূরত্ব থেকে একক ধনাত্মক চার্জকে তড়িৎ ক্ষেত্রের কোনো বিন্দুতে আনতে যে কাজ করতে হয়, তা-ই ওই বিন্দুর তড়িৎ বিভব। স্কেলার রাশি হওয়ায় বহু-চার্জের মোট বিভব বের করতে দিক বিবেচনা করতে হয় না, কেবল চিহ্নসহ যোগ করলেই হয়।", "trap": "বিভব নির্ণয়ে দূরত্বের বর্গ (\\(r^2\\)) বসানো এবং ঋণাত্মক চার্জের মাইনাস চিহ্ন বাদ দেওয়া সবচেয়ে সাধারণ ভুল—মনে রাখবে \\(V \\propto \\frac{1}{r}\\) এবং চিহ্নসহ বীজগাণিতিক যোগ করতে হয়।", "quickExample": "\\(0.3\\text{ m}\\) দূরে অবস্থিত \\(+2\\ \\mu\\text{C}\\) ও \\(-1\\ \\mu\\text{C}\\) চার্জের জন্য ওই বিন্দুতে মোট বিভব \\(V = 9 \\times 10^9 \\times \\frac{(2 - 1) \\times 10^{-6}}{0.3} = 3 \\times 10^4\\text{ V}\\)।"}, {"id": 30, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "SVSL: কেন্দ্রে বিভব শূন্য", "question": "বর্গের তিন কোণায় \\(q_1, q_2, q_3\\) এবং সমবাহু ত্রিভুজের দুই কোণায় \\(q_1, q_2\\) রাখলে কেন্দ্রে বিভব শূন্য করতে শেষ কোণায় কত চার্জ রাখতে হবে?", "answer": "বর্গের চতুর্থ কোণায়: \\(q_4 = -(q_1 + q_2 + q_3)\\)<br>সমবাহু ত্রিভুজের তৃতীয় কোণায়: \\(q_3 = -(q_1 + q_2)\\)", "context": "<b>কারণ:<\/b> বর্গ বা সমবাহু ত্রিভুজের কেন্দ্র থেকে প্রতিটি শীর্ষবিন্দুর দূরত্ব \\(r\\) সমান। তাই \\(V = 0\\) হতে হলে সব চার্জের বীজগাণিতিক যোগফল \\(\\sum q = 0\\) হতে হবে।", "intuition": "বর্গ বা সমবাহু ত্রিভুজের কেন্দ্র থেকে প্রতিটি শীর্ষবিন্দু সমদূরবর্তী হওয়ায় কেন্দ্রে মোট বিভব সব চার্জের বীজগাণিতিক যোগফলের সমানুপাতিক। তাই কেন্দ্রে বিভব শূন্য করতে হলে সব চার্জের যোগফল শূন্য হতে হবে।", "trap": "এই শর্টকাটটি কেবল বিভবের (স্কেলার) ক্ষেত্রেই প্রযোজ্য, লব্ধি প্রাবল্য শূন্য করার জন্য নয়—এবং যোগ করার সময় প্রতিটি চার্জের \\(+\\) বা \\(-\\) চিহ্ন সঠিকভাবে নিতে হবে।", "quickExample": "একটি বর্গের তিন কোণায় \\(+2\\ \\mu\\text{C}\\), \\(-5\\ \\mu\\text{C}\\) ও \\(+6\\ \\mu\\text{C}\\) চার্জ থাকলে কেন্দ্রে বিভব শূন্য করতে চতুর্থ কোণায় \\(q_4 = -(2 - 5 + 6) = -3\\ \\mu\\text{C}\\) চার্জ রাখতে হবে।"}, {"id": 31, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "গোলকের বিভব ও প্রাবল্য", "question": "\\(R\\) ব্যাসার্ধের \\(Q\\) চার্জিত ফাঁপা ও নিরেট গোলকের পৃষ্ঠে, বাইরে এবং অভ্যন্তরে (\\(r \\lt  R\\)) বিভব \\(V\\) ও প্রাবল্য \\(E\\) কত?", "answer": "• ফাঁপা গোলকের পৃষ্ঠে ও অভ্যন্তরে বিভব: \\(V = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{R}\\); অভ্যন্তরে প্রাবল্য: \\(E = 0\\text{ NC}^{-1}\\)<br>• বাইরে বিভব (ফাঁপা/নিরেট): \\(V = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{r}\\); পৃষ্ঠে প্রাবল্য: \\(E = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{R^2}\\)<br>• নিরেট গোলকের অভ্যন্তরে: \\(E = \\frac{Q}{4\\pi\\epsilon_0 R^3}r\\) ও \\(V = \\frac{Q}{4\\pi\\epsilon_0}\\frac{3R^2 - r^2}{2R^3}\\)", "context": "<b>মূল ধারণা:<\/b> ফাঁপা বা পরিবাহী গোলকের ভেতরে কোনো চার্জ থাকে না, তাই ভেতরে \\(E = 0\\) এবং সর্বত্র বিভব পৃষ্ঠের বিভবের সমান (সমবিভব)।<br>নিরেট অপরিবাহী গোলকের কেন্দ্রে (\\(r=0\\)) বিভব পৃষ্ঠের বিভবের \\(1.5\\) গুণ (\\(V_{\\text{center}} = 1.5 V_{\\text{surface}}\\))।", "intuition": "ফাঁপা বা পরিবাহী গোলকের সব চার্জ পৃষ্ঠে অবস্থান করে বলে ভেতরে কোনো প্রাবল্য থাকে না (\\(E = 0\\)), ফলে ভেতরে সর্বত্র বিভব পৃষ্ঠের বিভবের সমান থাকে। কিন্তু নিরেট অপরিবাহী গোলকে চার্জ ভেতরেও সুষমভাবে ছড়ানো থাকায় কেন্দ্র থেকে পৃষ্ঠের দিকে প্রাবল্য সরলরৈখিকভাবে বাড়ে।", "trap": "ফাঁপা গোলকের ভেতরে \\(E = 0\\) দেখে অনেকেই বিভবকেও \\(V = 0\\) মনে করে ভুল করে—মনে রাখবে ভেতরে \\(V = V_{\\text{surface}} \\neq 0\\), আর নিরেট পরিবাহী গোলকের আচরণও ফাঁপা গোলকের মতোই।", "quickExample": "একটি ফাঁপা গোলকের পৃষ্ঠে বিভব \\(120\\text{ V}\\) হলে অভ্যন্তরে বিভব \\(120\\text{ V}\\) ও প্রাবল্য \\(0\\text{ N C}^{-1}\\)। কিন্তু নিরেট অপরিবাহী গোলকের পৃষ্ঠে বিভব \\(120\\text{ V}\\) হলে কেন্দ্রে বিভব \\(1.5 \\times 120 = 180\\text{ V}\\)।"}, {"id": 32, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "চার্জ স্থানান্তরে কৃতকাজ", "question": "\\(r_2\\) থেকে \\(r_1\\) অবস্থানে \\(q\\) চার্জ স্থানান্তরে কৃতকাজ \\(W_{2\\to 1}\\) কত?", "answer": "\\(W_{2\\to 1} = \\Delta V q = (V_1 - V_2)q = \\frac{Q}{4\\pi\\epsilon_0}\\left(\\frac{1}{r_1} - \\frac{1}{r_2}\\right)q\\)", "context": "<b>ধারণা:<\/b> স্থির তড়িৎ ক্ষেত্র সংরক্ষণশীল বলে কৃতকাজ পথের ওপর নির্ভর করে না, কেবল আদি (\\(r_2\\)) ও শেষ (\\(r_1\\)) অবস্থানের বিভব পার্থক্যের ওপর নির্ভর করে।", "intuition": "তড়িৎ ক্ষেত্রে কোনো চার্জকে এক বিন্দু থেকে অন্য বিন্দুতে সরাতে কৃতকাজ কেবল দুই বিন্দুর বিভব পার্থক্য ও চার্জের গুণফলের সমান। স্থির তড়িৎ বল সংরক্ষণশীল হওয়ায় চার্জটিকে কোন পথে নেওয়া হলো, তার ওপর কাজের মান নির্ভর করে না।", "trap": "আদি ও শেষ অবস্থান উল্টে ফেললে (\\(V_2 - V_1\\) বসালে) কৃতকাজের চিহ্ন ভুল হয়ে যায়—মনে রাখবে \\(A\\) থেকে \\(B\\)-তে নিতে কাজ সর্বদা \\(W_{A \\to B} = q(V_B - V_A)\\), আর সমবিভব তলে কৃতকাজ শূন্য।", "quickExample": "\\(+3\\ \\mu\\text{C}\\) চার্জকে \\(20\\text{ V}\\) বিভবের বিন্দু থেকে \\(50\\text{ V}\\) বিভবের বিন্দুতে নিতে কৃতকাজ \\(W = (50 - 20) \\times 3 \\times 10^{-6} = 9 \\times 10^{-5}\\text{ J}\\)।"}, {"id": 33, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "ধারকত্ব", "question": "পরিবাহীর ধারকত্ব, গোলকীয় পরিবাহীর ধারকত্ব এবং সমান্তরাল পাত ধারকের ধারকত্বের সূত্র কী?", "answer": "\\(C = \\frac{Q}{V}\\) • গোলকীয়: \\(C = 4\\pi\\epsilon_0 r\\) • সমান্তরাল পাত: \\(C = \\frac{\\epsilon_0 A}{d} = \\frac{\\epsilon_0 k A}{d}\\)", "context": "<b>প্রতীক:<\/b> \\(A\\) = পাতের ক্ষেত্রফল, \\(d\\) = পাতদ্বয়ের মধ্যবর্তী দূরত্ব, \\(k\\) = পরাবৈদ্যুতিক ধ্রুবক; একক ফ্যারাড (\\(\\text{F}\\))।<br><b>ধারণা:<\/b> \\(C\\) চার্জ \\(Q\\) বা বিভব \\(V\\)-এর ওপর নয়, বরং জ্যামিতিক আকার ও মাধ্যমের (\\(k\\)) ওপর নির্ভর করে।", "intuition": "কোনো পরিবাহীর বিভব \\(1\\text{ V}\\) বাড়াতে যতটুকু চার্জ লাগে, তা-ই তার ধারকত্ব বা চার্জ ধারণের ক্ষমতা। এটি পানির ট্যাংকের প্রস্থচ্ছেদের মতো—ভেতরে কতটুকু চার্জ বা বিভব আছে তার ওপর নয়, বরং ধারকের জ্যামিতিক আকার ও মধ্যবর্তী মাধ্যমের ওপর নির্ভর করে।", "trap": "\\(C = \\frac{Q}{V}\\) দেখে অনেকেই ভাবে \\(Q\\) দ্বিগুণ করলে \\(C\\) দ্বিগুণ হয়—আসলে \\(Q\\) দ্বিগুণ হলে \\(V\\)-ও দ্বিগুণ হয়, ফলে \\(C\\) অপরিবর্তিত থাকে; \\(C\\) বদলাতে হলে \\(A\\), \\(d\\) বা \\(k\\) বদলাতে হবে।", "quickExample": "একটি সমান্তরাল পাত ধারকের ধারকত্ব \\(4\\ \\mu\\text{F}\\)। পাতদ্বয়ের দূরত্ব অর্ধেক করে মাঝে \\(k = 3\\) মাধ্যম ঢোকালে নতুন ধারকত্ব \\(C' = 3 \\times 2 \\times 4 = 24\\ \\mu\\text{F}\\)।"}, {"id": 34, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "ধারকের সমবায়", "question": "ধারকের শ্রেণী ও সমান্তরাল সমবায়ে তুল্য ধারকত্ব কত? (\\(n\\) সংখ্যক সমান \\(C\\) ধারকের ক্ষেত্রে কী হয়?)", "answer": "শ্রেণী: \\(\\frac{1}{C_s} = \\frac{1}{C_1} + \\frac{1}{C_2} + \\dots + \\frac{1}{C_n}\\) (সমান হলে \\(C_s = \\frac{C}{n}\\))<br>সমান্তরাল: \\(C_p = C_1 + C_2 + \\dots + C_n\\) (সমান হলে \\(C_p = nC\\))", "context": "<b>মনে রাখো:<\/b> ধারকের সমবায়ের সূত্র রোধের সমবায়ের ঠিক বিপরীত! শ্রেণী সমবায়ে তুল্য ধারকত্ব কমে (সব ধারকে চার্জ \\(Q\\) সমান), সমান্তরালে বাড়ে (বিভব \\(V\\) সমান)।", "intuition": "সমান্তরাল সমবায়ে পাতের কার্যকর ক্ষেত্রফল বেড়ে যায় বলে তুল্য ধারকত্ব সরাসরি যোগ হয়। অন্যদিকে শ্রেণী সমবায়ে কার্যকর পাত-দূরত্ব বেড়ে যায় বলে তুল্য ধারকত্ব ক্ষুদ্রতম ধারকের চেয়েও কমে যায়।", "trap": "তাড়াহুড়োয় অনেকেই রোধের সূত্র বসিয়ে শ্রেণী সমবায়ে ধারকত্ব যোগ করে ফেলে—মনে রাখবে ধারকের শ্রেণী ও সমান্তরাল সূত্র রোধের ঠিক উল্টো, এবং \\(n\\) টি সমান ধারকের ক্ষেত্রে \\(\\frac{C_p}{C_s} = n^2\\)।", "quickExample": "\\(6\\ \\mu\\text{F}\\) ও \\(3\\ \\mu\\text{F}\\) দুটি ধারক শ্রেণীতে যুক্ত থাকলে \\(C_s = \\frac{6 \\times 3}{6 + 3} = 2\\ \\mu\\text{F}\\), আর সমান্তরালে যুক্ত থাকলে \\(C_p = 6 + 3 = 9\\ \\mu\\text{F}\\)।"}, {"id": 35, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "বিভব ও আধান বিভাজন নীতি", "question": "ধারকের শ্রেণী সমবায়ে বিভব বিভাজন (\\(V_1, V_2\\)) এবং সমান্তরাল সমবায়ে আধান বিভাজন (\\(Q_1, Q_2\\)) এর সূত্র কী?", "answer": "শ্রেণী: \\(V_1 = \\frac{C_2}{C_1 + C_2}V\\), \\(V_2 = \\frac{C_1}{C_1 + C_2}V\\)<br>সমান্তরাল: \\(Q_1 = \\frac{C_1}{C_1 + C_2}Q\\), \\(Q_2 = \\frac{C_2}{C_1 + C_2}Q\\)", "context": "<b>যুক্তি:<\/b> শ্রেণীতে \\(Q\\) সমান বলে \\(V \\propto \\frac{1}{C}\\) (কম ধারকত্বে বেশি বিভব)। সমান্তরালে \\(V\\) সমান বলে \\(Q \\propto C\\) (বেশি ধারকত্বে বেশি চার্জ)।", "intuition": "শ্রেণী সমবায়ে প্রতিটি ধারকে চার্জ সমান থাকে বলে যার ধারকত্ব কম, তাকে বেশি বিভব বহন করতে হয় (\\(V \\propto \\frac{1}{C}\\))। সমান্তরাল সমবায়ে বিভব সমান থাকে বলে বড় ধারক বেশি চার্জ ধরে রাখে (\\(Q \\propto C\\))।", "trap": "শ্রেণী সমবায়ে \\(V_1\\) বের করার সময় লবে \\(C_1\\) বসানো সবচেয়ে বড় ফাঁদ—মনে রাখবে শ্রেণীতে বিভব ধারকত্বের ব্যস্তানুপাতিক বলে লবে বিপরীত ধারক \\(C_2\\) বসে।", "quickExample": "\\(2\\ \\mu\\text{F}\\) ও \\(4\\ \\mu\\text{F}\\) ধারক শ্রেণীতে \\(12\\text{ V}\\) উৎসের সাথে যুক্ত থাকলে \\(2\\ \\mu\\text{F}\\) ধারকের বিভব \\(V_1 = \\frac{4}{2 + 4} \\times 12 = 8\\text{ V}\\) এবং \\(4\\ \\mu\\text{F}\\) ধারকের বিভব \\(4\\text{ V}\\)।"}, {"id": 36, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "ধারকের সঞ্চিত শক্তি", "question": "ধারকের সঞ্চিত মোট শক্তি \\(W\\) এবং একক আয়তনে সঞ্চিত শক্তি \\(u\\) এর সূত্র কী?", "answer": "মোট শক্তি: \\(W = \\frac{1}{2}QV = \\frac{1}{2}CV^2 = \\frac{Q^2}{2C}\\)<br>একক আয়তনে: \\(u = \\frac{W}{V} = \\frac{1}{2}\\epsilon_0 E^2\\)", "context": "<b>প্রয়োগ:<\/b> ব্যাটারি সংযুক্ত থাকলে (\\(V\\) স্থির) \\(\\frac{1}{2}CV^2\\) এবং ব্যাটারি বিচ্ছিন্ন থাকলে (\\(Q\\) স্থির) \\(\\frac{Q^2}{2C}\\) ব্যবহার করা সুবিধাজনক। \\(u\\)-এর একক \\(\\text{J m}^{-3}\\)।", "intuition": "ধারক চার্জ করার সময় বিভব শূন্য থেকে ধীরে ধীরে \\(V\\) পর্যন্ত বাড়ে বলে গড় বিভব \\(\\frac{V}{2}\\) হয়, তাই সঞ্চিত শক্তি \\(QV\\) না হয়ে \\(\\frac{1}{2}QV\\) হয়। এই শক্তি মূলত পাতদ্বয়ের মধ্যবর্তী স্থানের তড়িৎ ক্ষেত্রে জমা থাকে।", "trap": "ব্যাটারি সংযুক্ত রেখে পরাবৈদ্যুতিক মাধ্যম (\\(k\\)) ঢোকালে \\(V\\) স্থির থাকায় শক্তি \\(k\\) গুণ বাড়ে (\\(\\frac{1}{2}CV^2\\)), কিন্তু ব্যাটারি বিচ্ছিন্ন করে \\(k\\) ঢোকালে \\(Q\\) স্থির থাকায় শক্তি \\(k\\) গুণ কমে (\\(\\frac{Q^2}{2C}\\))।", "quickExample": "\\(10\\ \\mu\\text{F}\\) ধারককে \\(100\\text{ V}\\) বিভবে চার্জিত করলে সঞ্চিত শক্তি \\(W = \\frac{1}{2}CV^2 = \\frac{1}{2} \\times 10 \\times 10^{-6} \\times (100)^2 = 0.05\\text{ J}\\)।"}, {"id": 37, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "SVSL: গোলক সংযোগ", "question": "\\(r_1, r_2\\) ব্যাসার্ধ ও \\(q_1, q_2\\) চার্জযুক্ত দুটি ধাতব গোলক পরিবাহী তার দিয়ে যুক্ত করলে সাধারণ বিভব \\(V_{\\text{com}}\\) ও নতুন চার্জ \\(q_1', q_2'\\) কত?", "answer": "\\(V_{\\text{com}} = \\frac{1}{4\\pi\\epsilon_0}\\frac{q_1 + q_2}{r_1 + r_2}\\)<br>\\(q_1' = \\frac{r_1}{r_1 + r_2}(q_1 + q_2)\\), \\(q_2' = \\frac{r_2}{r_1 + r_2}(q_1 + q_2)\\)", "context": "<b>ধারণা:<\/b> যুক্ত করলে উচ্চ বিভব থেকে নিম্ন বিভবে চার্জ প্রবাহিত হয়ে উভয়ের বিভব সমান (\\(V_{\\text{com}}\\)) হয় এবং চার্জ ব্যাসার্ধের অনুপাতে (\\(q' \\propto r\\)) বণ্টিত হয়।", "intuition": "দুটি চার্জিত ধাতব গোলককে তার দিয়ে যুক্ত করলে উচ্চ বিভবের গোলক থেকে নিম্ন বিভবের গোলকে চার্জ প্রবাহিত হয়ে উভয়ের বিভব সমান হয়। যেহেতু গোলকের ধারকত্ব ব্যাসার্ধের সমানুপাতিক (\\(C \\propto r\\)), তাই মোট চার্জ ব্যাসার্ধের অনুপাতে ভাগ হয়।", "trap": "দুটি গোলক যুক্ত করলে চার্জ সমান দুই ভাগে ভাগ হয় কেবল ব্যাসার্ধ সমান হলেই—ব্যাসার্ধ অসমান হলে চার্জ ব্যাসার্ধের অনুপাতে (\\(r_1 : r_2\\)) এবং তলমাত্রিক ঘনত্ব ব্যাসার্ধের ব্যস্তানুপাতে (\\(r_2 : r_1\\)) বণ্টিত হয়।", "quickExample": "\\(2\\text{ cm}\\) ও \\(4\\text{ cm}\\) ব্যাসার্ধের দুটি গোলকে যথাক্রমে \\(20\\ \\mu\\text{C}\\) ও \\(10\\ \\mu\\text{C}\\) চার্জ দিয়ে যুক্ত করলে ছোটটির নতুন চার্জ \\(q_1' = \\frac{2}{2 + 4}(20 + 10) = 10\\ \\mu\\text{C}\\) এবং বড়টির \\(20\\ \\mu\\text{C}\\)।"}, {"id": 38, "ch": 2, "chapter": "অধ্যায় ২: স্থির তড়িৎ", "topic": "গাউসের সূত্র ও প্রয়োগ", "question": "গাউসের সূত্র এবং অসীম অপরিবাহী পাত, পরিবাহী পাত ও অসীম দৈর্ঘ্যের চার্জিত তারের নিকটে প্রাবল্য \\(E\\) কত?", "answer": "গাউসের সূত্র: \\(\\oint \\vec{E}\\cdot d\\vec{A} = \\frac{q}{\\epsilon_0}\\)<br>অপরিবাহী পাত: \\(E = \\frac{\\sigma}{2\\epsilon_0}\\) • পরিবাহী পাত: \\(E = \\frac{\\sigma}{\\epsilon_0}\\)<br>অসীম তার থেকে \\(r\\) দূরত্বে: \\(E = \\frac{\\lambda}{2\\pi\\epsilon_0 r}\\)", "context": "<b>প্রতীক:<\/b> \\(\\sigma = \\frac{q}{A}\\) (তলমাত্রিক চার্জ ঘনত্ব), \\(\\lambda = \\frac{q}{l}\\) (রৈখিক চার্জ ঘনত্ব)।<br><b>মনে রাখো:<\/b> অসীম পাতের কাছে \\(E\\) দূরত্বের ওপর নির্ভর করে না (সুষম প্রাবল্য); পরিবাহী পাতের ভেতরে \\(E=0\\)।", "intuition": "গাউসের সূত্র প্রতিসাম্যপূর্ণ চার্জ বিন্যাসের (গোলক, অসীম পাত বা তার) প্রাবল্য অতি সহজে বের করার শক্তিশালী উপায়। অসীম চার্জিত পাতের বলরেখাগুলো পরস্পর সমান্তরাল বলে দূরত্ব বাড়লেও প্রাবল্য কমে না।", "trap": "অসীম অপরিবাহী পাতের প্রাবল্য \\(\\frac{\\sigma}{2\\epsilon_0}\\) আর পরিবাহী পাতের প্রাবল্য \\(\\frac{\\sigma}{\\epsilon_0}\\)—এই \\(2\\)-এর ফ্যাক্টরটি ভর্তি পরীক্ষায় প্রায়ই গুলিয়ে যায়, আর অসীম তারের ক্ষেত্রে \\(E \\propto \\frac{1}{r}\\) (\\(\\frac{1}{r^2}\\) নয়)।", "quickExample": "একটি অসীম অপরিবাহী পাতের চার্জ ঘনত্ব \\(\\sigma = 1.7708 \\times 10^{-10}\\text{ C m}^{-2}\\) হলে এর নিকটে প্রাবল্য \\(E = \\frac{\\sigma}{2\\epsilon_0} = \\frac{1.7708 \\times 10^{-10}}{2 \\times 8.854 \\times 10^{-12}} = 10\\text{ N C}^{-1}\\)।"}, {"id": 39, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "তড়িৎ প্রবাহ ও তাড়নবেগ", "question": "তড়িৎ প্রবাহমাত্রা \\(I\\) এবং ইলেকট্রনের তাড়নবেগ \\(v\\) নির্ণয়ের সূত্রসমূহ কী?", "answer": "\\(I = \\frac{Q}{t} = \\frac{ne}{t} = \\frac{NVe}{\\frac{l}{v}} = \\frac{NAle}{\\frac{l}{v}} = NAve\\)<br>তাড়নবেগ: \\(v = \\frac{I}{NAe} = \\frac{J}{Ne}\\)", "context": "<b>প্রতীক:<\/b> \\(N\\) = একক আয়তনে মুক্ত ইলেকট্রন সংখ্যা (\\(\\text{m}^{-3}\\)), \\(A\\) = প্রস্থচ্ছেদের ক্ষেত্রফল, \\(e = 1.6\\times 10^{-19}\\text{ C}\\), \\(J = \\frac{I}{A}\\) (প্রবাহ ঘনত্ব)।<br><b>তথ্য:<\/b> তাড়নবেগের মান খুবই কম (প্রায় \\(10^{-4}\\text{ m s}^{-1}\\))।", "intuition": "তড়িৎ প্রবাহমাত্রা হলো পরিবাহীর যেকোনো প্রস্থচ্ছেদ দিয়ে প্রতি সেকেন্ডে প্রবাহিত মোট চার্জের হার। মুক্ত ইলেকট্রনগুলো অত্যন্ত ধীরে (তাড়নবেগে) এগোলেও প্রতি ঘনমিটারে তাদের সংখ্যা বিশাল হওয়ায় উল্লেখযোগ্য তড়িৎ প্রবাহ সৃষ্টি হয়।", "trap": "অসম প্রস্থচ্ছেদের তারে তড়িৎ প্রবাহমাত্রা \\(I\\) সর্বত্র সমান থাকে, কিন্তু তাড়নবেগ \\(v \\propto \\frac{1}{A} \\propto \\frac{1}{r^2}\\) হওয়ায় সরু প্রান্তে তাড়নবেগ বেড়ে যায়—অনেকেই ভুল করে \\(v\\)-কে ধ্রুব ধরে নেয়।", "quickExample": "কোনো তারে \\(I = 3.2\\text{ A}\\), \\(A = 2 \\times 10^{-6}\\text{ m}^2\\) এবং \\(N = 10^{28}\\text{ m}^{-3}\\) হলে তাড়নবেগ \\(v = \\frac{I}{NAe} = \\frac{3.2}{10^{28} \\times 2 \\times 10^{-6} \\times 1.6 \\times 10^{-19}} = 10^{-3}\\text{ m s}^{-1}\\)।"}, {"id": 40, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "তড়িৎ শক্তি, ক্ষমতা ও তাপ", "question": "তাপের যান্ত্রিক সমতা \\(J\\), তড়িৎ শক্তি \\(W\\) ও তড়িৎ ক্ষমতা \\(P\\) এর সূত্রগুলো কী?", "answer": "\\(J = \\frac{W}{H} = \\frac{VIt}{H} = \\frac{V^2t}{RH} = \\frac{I^2Rt}{H} = \\frac{ms\\Delta\\theta}{H}\\)<br>শক্তি: \\(W = I^2Rt = \\frac{V^2}{R}t = VIt = ms\\Delta\\theta\\)<br>ক্ষমতা: \\(P = VI = \\frac{V^2}{R} = I^2R\\)", "context": "<b>প্রয়োগ:<\/b> শ্রেণী সমবায়ে (\\(I\\) সমান) \\(P = I^2R \\Rightarrow P \\propto R\\); সমান্তরাল সমবায়ে (\\(V\\) সমান) \\(P = \\frac{V^2}{R} \\Rightarrow P \\propto \\frac{1}{R}\\)।<br><b>একক:<\/b> \\(1\\text{ kWh (BOT unit)} = 3.6\\times 10^6\\text{ J}\\)।", "intuition": "পরিবাহীর রোধের বিরুদ্ধে চার্জ প্রবাহিত হতে যে তড়িৎ শক্তি ব্যয় হয়, তা জুলের সূত্র অনুযায়ী তাপশক্তিতে রূপান্তরিত হয়। ক্ষমতা হলো এই শক্তি ব্যয়ের বা তাপ উৎপাদনের হার।", "trap": "শ্রেণী সমবায়ে \\(P = I^2R\\) (\\(P \\propto R\\)) এবং সমান্তরাল সমবায়ে \\(P = \\frac{V^2}{R}\\) (\\(P \\propto \\frac{1}{R}\\)) ব্যবহার করতে হয়; তাই শ্রেণীতে কম ওয়াটের (বেশি রোধের) বাল্ব বেশি উজ্জ্বলভাবে জ্বলে।", "quickExample": "\\(220\\text{ V}-100\\text{ W}\\) বাল্বের রোধ \\(R = \\frac{V^2}{P} = \\frac{220^2}{100} = 484\\ \\Omega\\)। এটি দৈনিক \\(5\\text{ h}\\) করে \\(30\\) দিন জ্বললে ব্যয়িত শক্তি \\(W = \\frac{100 \\times 5 \\times 30}{1000} = 15\\text{ kWh}\\)।"}, {"id": 41, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "রোধ ও তাপমাত্রার প্রভাব", "question": "রোধ \\(R\\), আপেক্ষিক রোধ \\(\\rho\\), রোধের উষ্ণতা গুণাঙ্ক \\(\\alpha\\) এবং \\(\\theta\\) তাপমাত্রায় রোধ ও আপেক্ষিক রোধের সূত্র কী?", "answer": "\\(R = \\frac{\\rho L}{A}\\) • \\(\\rho = \\frac{RA}{L}\\) • \\(\\alpha = \\frac{R_\\theta - R_0}{R_0\\theta}\\)<br>\\(R_\\theta = R_0(1 + \\alpha\\theta)\\) • \\(\\rho_\\theta = \\rho_0(1 + \\alpha\\theta)\\)", "context": "<b>প্রতীক:<\/b> \\(L\\) = দৈর্ঘ্য, \\(A\\) = প্রস্থচ্ছেদের ক্ষেত্রফল, \\(R_0\\) = \\(0^\\circ\\text{C}\\) তাপমাত্রায় রোধ, \\(\\alpha\\) = রোধের উষ্ণতা গুণাঙ্ক (\\(\\text{K}^{-1}\\) বা \\(^\\circ\\text{C}^{-1}\\))।<br><b>ধারণা:<\/b> ধাতুর \\(\\alpha \\gt  0\\) (তাপ বাড়লে রোধ বাড়ে), কিন্তু অর্ধপরিবাহীর \\(\\alpha \\lt  0\\) (তাপ বাড়লে রোধ কমে)।", "intuition": "কোনো পরিবাহীর রোধ এর দৈর্ঘ্যের সমানুপাতিক ও প্রস্থচ্ছেদের ক্ষেত্রফলের ব্যস্তানুপাতিক, আর আপেক্ষিক রোধ \\(\\rho\\) কেবল উপাদান ও তাপমাত্রার ওপর নির্ভর করে। তাপমাত্রা
