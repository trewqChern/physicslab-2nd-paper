\frac{\\theta}{\\delta} = \\frac{\\delta_v - \\delta_r}{\\delta} = \\frac{\\mu_v - \\mu_r}{\\mu - 1}\\)", "context": "<b>প্রতীক:<\/b> \\(v\\) = বেগুনি (Violet), \\(r\\) = লাল (Red), \\(\\delta\\) ও \\(\\mu\\) = মধ্যবর্তী হলুদ আলোর বিচ্যুতি ও প্রতিসরাঙ্ক।<br><b>ধারণা:<\/b> \\(\\omega\\) এককবিহীন এবং এটি শুধু প্রিজমের উপাদানের ওপর নির্ভর করে (প্রিজম কোণ \\(A\\)-এর ওপর নয়)।", "intuition": "সাদা আলোর বিভিন্ন বর্ণের জন্য কাচের প্রতিসরাঙ্ক ভিন্ন হওয়ায় প্রিজমে বেগুনি আলো সবচেয়ে বেশি ও লাল আলো সবচেয়ে কম বেঁকে বর্ণালি তৈরি করে। এই কৌণিক বিচ্ছুরণ এবং মধ্যবর্তী হলুদ আলোর গড় বিচ্যুতির অনুপাতই উপাদানের বিচ্ছুরণ ক্ষমতা।", "trap": "বিচ্ছুরণ ক্ষমতা \\(\\omega\\) একটি এককবিহীন রাশি এবং এটি কেবল প্রিজমের উপাদানের ওপর নির্ভর করে—প্রিজম কোণ \\(A\\) বাড়ালে বিচ্ছুরণ \\(\\theta\\) বাড়লেও \\(\\omega\\) অপরিবর্তিত থাকে।", "quickExample": "একটি প্রিজমের উপাদানের জন্য \\(\\mu_v = 1.523\\), \\(\\mu_r = 1.513\\) এবং \\(\\mu = 1.518\\) হলে বিচ্ছুরণ ক্ষমতা \\(\\omega = \\frac{1.523 - 1.513}{1.518 - 1} = \\frac{0.010}{0.518} \\approx 0.0193\\)।"}, {"id": 82, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "তড়িৎচুম্বকীয় তরঙ্গ", "question": "তড়িৎ ও চৌম্বক ক্ষেত্রের তরঙ্গ সমীকরণ এবং শূন্য ও অন্য মাধ্যমে তড়িৎচুম্বকীয় তরঙ্গের বেগ কত?", "answer": "\\(E = E_0\\sin(ct - x)\\), \\(B = B_0\\sin(ct - x)\\)<br>শূন্য মাধ্যমে: \\(c = \\frac{1}{\\sqrt{\\mu_0\\epsilon_0}} = \\frac{E_0}{B_0}\\) • অন্য মাধ্যমে: \\(v = \\frac{1}{\\sqrt{\\mu\\epsilon}} = \\frac{E}{B}\\)", "context": "<b>মান:<\/b> শূন্য মাধ্যমে \\(c = 3\\times 10^8\\text{ m s}^{-1}\\)।<br><b>ধারণা:<\/b> তড়িৎচুম্বকীয় তরঙ্গ অনুপ্রস্থ (আড়) তরঙ্গ; এতে \\(\\vec{E}\\), \\(\\vec{B}\\) এবং তরঙ্গ সঞ্চালনের দিক পরস্পর লম্ব।", "intuition": "পরিবর্তনশীল তড়িৎ ক্ষেত্র ও চৌম্বক ক্ষেত্র পরস্পরকে সৃষ্টি করে এবং কোনো মাধ্যম ছাড়াই শূন্যস্থানে আলোর বেগে অনুপ্রস্থ তরঙ্গ হিসেবে ছড়িয়ে পড়ে। মাধ্যমের ভেদ্যতা ও প্রবেদ্যতা যত বেশি হয় তরঙ্গের বেগ তত কমে যায়, আর যেকোনো মুহূর্তে তড়িৎ ও চৌম্বক ক্ষেত্রের অনুপাত ঐ মাধ্যমে তরঙ্গের বেগের সমান হয়।", "trap": "ভর্তি পরীক্ষায় অনেকেই \\(c = \\frac{E_0}{B_0}\\) না লিখে উল্টো \\(\\frac{B_0}{E_0}\\) বসিয়ে দেন অথবা \\(\\frac{1}{\\sqrt{\\mu_0\\epsilon_0}}\\) এর একক বা মাত্রা বের করার সময় বর্গমূল (\\(\\sqrt{\\;}\\)) দিতে ভুলে যান।", "quickExample": "শূন্য মাধ্যমে কোনো তড়িৎচুম্বকীয় তরঙ্গের তড়িৎ ক্ষেত্রের সর্বোচ্চ মান \\(E_0 = 60\\text{ V m}^{-1}\\) হলে চৌম্বক ক্ষেত্রের সর্বোচ্চ মান \\(B_0 = \\frac{E_0}{c} = \\frac{60}{3\\times 10^8} = 2\\times 10^{-7}\\text{ T}\\)।"}, {"id": 83, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "কৃষ্ণবস্তু ও পয়েন্টিং ভেক্টর", "question": "কৃষ্ণবস্তুর বিকিরণ ও পয়েন্টিং ভেক্টর \\(\\vec{S}\\) এর সূত্র কী?", "answer": "কৃষ্ণবস্তুর বিকিরণ: \\(E \\propto T^4 \\Rightarrow \\frac{E_1}{E_2} = \\frac{T_1^4}{T_2^4}\\)<br>পয়েন্টিং ভেক্টর: \\(\\vec{S} = \\frac{1}{\\mu_0}\\vec{E}\\times\\vec{B} = \\vec{E}\\times\\vec{H}\\)", "context": "<b>ধারণা:<\/b> \\(E = \\sigma T^4\\) হলো স্টিফান-বোল্টজম্যান সূত্র (\\(T\\) কেলভিনে)।<br><b>পয়েন্টিং ভেক্টর:<\/b> প্রতি সেকেন্ডে একক ক্ষেত্রফল দিয়ে প্রবাহিত তড়িৎচুম্বকীয় শক্তির হার ও দিক নির্দেশ করে (একক \\(\\text{W m}^{-2}\\))।", "intuition": "কোনো কৃষ্ণবস্তুর পরম তাপমাত্রা সামান্য বাড়ালেই তার বিকিরণ ক্ষমতা চতুর্থ ঘাতে নাটকীয়ভাবে বেড়ে যায়। অন্যদিকে পয়েন্টিং ভেক্টর \\(\\vec{S}\\) নির্দেশ করে তড়িৎ ও চৌম্বক ক্ষেত্রের মাধ্যমে শক্তি কোন দিকে এবং একক ক্ষেত্রফল দিয়ে প্রতি সেকেন্ডে কী হারে প্রবাহিত হচ্ছে।", "trap": "স্টিফান-বোল্টজম্যান সূত্রে সেলসিয়াস তাপমাত্রা সরাসরি বসিয়ে অনুপাত বের করলে উত্তর ভুল হয়—তাপমাত্রাকে অবশ্যই কেলভিনে (\\(T = t + 273\\)) রূপান্তর করে চতুর্থ ঘাত নিতে হয়।", "quickExample": "কোনো কৃষ্ণবস্তুর পরম তাপমাত্রা \\(300\\text{ K}\\) থেকে বাড়িয়ে \\(600\\text{ K}\\) করলে বিকিরণ হারের অনুপাত \\(\\frac{E_2}{E_1} = \\left(\\frac{600}{300}\\right)^4 = 2^4 = 16\\) গুণ হয়।"}, {"id": 84, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "দশা ও পথ পার্থক্য (ব্যতিচার)", "question": "দশা পার্থক্য \\(\\delta\\) ও পথ পার্থক্য \\(\\Delta x\\) এর সম্পর্ক এবং গঠনমূলক ও ধ্বংসাত্মক ব্যতিচারের শর্ত কী?", "answer": "\\(\\delta = \\frac{2\\pi}{\\lambda}\\times\\Delta x\\)<br>গঠনমূলক: \\(x_2 - x_1 = 2n\\frac{\\lambda}{2}\\) [\\(n=0,1,2,\\dots\\)]<br>ধ্বংসাত্মক: \\(x_2 - x_1 = (2n+1)\\frac{\\lambda}{2}\\) [\\(n=0,1,2,\\dots\\)] বা \\((2n-1)\\frac{\\lambda}{2}\\) [\\(n=1,2,\\dots\\)]", "context": "<b>শর্ত:<\/b> স্থায়ী ব্যতিচারের জন্য উৎস দুটি সুসংগত (coherent—সমান কম্পাঙ্ক ও ধ্রুব দশা পার্থক্য) হতে হবে।<br><b>দশা পার্থক্য:<\/b> গঠনমূলকে \\(\\delta = 2n\\pi\\) (উজ্জ্বল) এবং ধ্বংসাত্মকে \\(\\delta = (2n+1)\\pi\\) (অন্ধকার)।", "intuition": "দুটি সুসংগত তরঙ্গ একটি পূর্ণ তরঙ্গদৈর্ঘ্য \\(\\lambda\\) পথ অতিক্রম করলে তাদের দশা \\(2\\pi\\) রেডিয়ান পরিবর্তিত হয়—এই অনুপাত থেকেই \\(\\delta = \\frac{2\\pi}{\\lambda}\\Delta x\\) পাওয়া যায়। তরঙ্গ দুটি সমদশায় মিলিত হলে পরস্পরকে শক্তিশালী করে উজ্জ্বল ডোরা (গঠনমূলক) এবং বিপরীত দশায় মিলিত হলে পরস্পরকে নাকচ করে অন্ধকার ডোরা (ধ্বংসাত্মক) তৈরি করে।", "trap": "দশা পার্থক্য ও পথ পার্থক্যের সূত্রে \\(\\frac{2\\pi}{\\lambda}\\) এর বদলে \\(\\frac{\\lambda}{2\\pi}\\) গুণ করে ফেলা এবং ধ্বংসাত্মক ব্যতিচারে \\(\\frac{\\lambda}{2}\\) এর জোড় না বিজোড় গুণিতক তা গুলিয়ে ফেলা সবচেয়ে সাধারণ ভুল।", "quickExample": "দুটি সুসংগত তরঙ্গের পথ পার্থক্য \\(\\Delta x = \\frac{\\lambda}{4}\\) হলে তাদের দশা পার্থক্য \\(\\delta = \\frac{2\\pi}{\\lambda}\\times\\frac{\\lambda}{4} = \\frac{\\pi}{2}\\text{ rad}\\)।"}, {"id": 85, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "লব্ধি বিস্তার ও তীব্রতা", "question": "তরঙ্গের উপরিপাতনে লব্ধি বিস্তার \\(A, A_{\\max}, A_{\\min}\\) এবং লব্ধি তীব্রতা \\(I, I_{\\max}, I_{\\min}\\) এর সূত্র কী?", "answer": "\\(A = \\sqrt{A_1^2 + A_2^2 + 2A_1A_2\\cos\\delta}\\); \\(A_{\\max} = A_1 + A_2\\); \\(A_{\\min} = A_1 \\sim A_2\\)<br>\\(I = I_1 + I_2 + 2\\sqrt{I_1I_2}\\cos\\delta\\); \\(I_{\\max} = (\\sqrt{I_1} + \\sqrt{I_2})^2\\); \\(I_{\\min} = (\\sqrt{I_1} - \\sqrt{I_2})^2\\)", "context": "<b>সম্পর্ক:<\/b> তীব্রতা বিস্তারের বর্গের সমানুপাতিক (\\(I \\propto A^2\\))।<br><b>সমান উৎস হলে (\\(I_1=I_2=I_0\\)):<\/b> \\(I_{\\max} = 4I_0\\) এবং \\(I_{\\min} = 0\\)।", "intuition": "দুটি তরঙ্গের উপরিপাতনে লব্ধি বিস্তার ঠিক ভেক্টরের সামান্তরিক সূত্রের মতো কাজ করে, যেখানে দুই ভেক্টরের মধ্যবর্তী কোণের ভূমিকা পালন করে দশা পার্থক্য \\(\\delta\\)। যেহেতু তীব্রতা বিস্তারের বর্গের সমানুপাতিক (\\(I \\propto A^2\\)), তাই সমান তীব্রতার (\\(I_0\\)) দুটি তরঙ্গ গঠনমূলক ব্যতিচারে \\(2I_0\\) নয় বরং \\(4I_0\\) তীব্রতা তৈরি করে।", "trap": "তীব্রতার অনুপাত \\(I_1 : I_2\\) দেওয়া থাকলে \\(\\frac{I_{\\max}}{I_{\\min}}\\) বের করার সময় সরাসরি \\(\\frac{I_1+I_2}{I_1-I_2}\\) বসালে ভুল হয়—আগে বর্গমূল নিয়ে \\(\\left(\\frac{\\sqrt{I_1}+\\sqrt{I_2}}{\\sqrt{I_1}-\\sqrt{I_2}}\\right)^2\\) ব্যবহার করতে হয়।", "quickExample": "দুটি সুসংগত উৎসের তীব্রতার অনুপাত \\(I_1 : I_2 = 9 : 1\\) হলে সর্বোচ্চ ও সর্বনিম্ন তীব্রতার অনুপাত \\(\\frac{I_{\\max}}{I_{\\min}} = \\left(\\frac{\\sqrt{9}+\\sqrt{1}}{\\sqrt{9}-\\sqrt{1}}\\right)^2 = \\left(\\frac{4}{2}\\right)^2 = 4 : 1\\)।"}, {"id": 86, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "ইয়ং-এর দ্বি-চিড় পরীক্ষা", "question": "দ্বি-চিড় পরীক্ষায় পথ পার্থক্য, \\(n\\)-তম উজ্জ্বল ও অন্ধকার ডোরার দূরত্ব, ডোরা ব্যবধান \\(\\Delta x\\) ও প্রস্থ \\(x\\) (এবং \\(\\mu\\) তরলে ডোবালে) কত?", "answer": "পথ পার্থক্য \\(= a\\sin\\theta\\) • \\(n\\)-তম উজ্জ্বল: \\(x_n = \\frac{n\\lambda D}{a}\\) • \\(n\\)-তম অন্ধকার: \\(x_n = (2n-1)\\frac{\\lambda D}{2a}\\)<br>\\(\\Delta x = \\frac{\\lambda D}{a}\\), \\(x = \\frac{\\lambda D}{2a}\\) • \\(\\mu\\) তরলে: \\(\\Delta x' = \\frac{\\Delta x}{\\mu} = \\frac{\\lambda D}{\\mu a}\\), \\(x' = \\frac{x}{\\mu} = \\frac{\\lambda D}{2\\mu a}\\)", "context": "<b>প্রতীক:<\/b> \\(a\\) = চিড়দ্বয়ের মধ্যবর্তী দূরত্ব, \\(D\\) = চিড় থেকে পর্দার দূরত্ব, \\(\\lambda\\) = আলোর তরঙ্গদৈর্ঘ্য।<br><b>পার্থক্য:<\/b> ডোরা ব্যবধান (\\(\\Delta x\\)) = দুটি পরপর উজ্জ্বল/অন্ধকার ডোরার মধ্যবর্তী দূরত্ব; ডোরার প্রস্থ (\\(x\\)) = একটি ডোরার বেধ (\\(\\frac{\\Delta x}{2}\\))।", "intuition": "পর্দার কোনো বিন্দুতে দুটি চিড় থেকে আসা আলোর পথ পার্থক্য \\(a\\sin\\theta\\) পূর্ণ বা অর্ধ-তরঙ্গদৈর্ঘ্যের গুণিতক হওয়ার মাধ্যমে সমদূরত্বের উজ্জ্বল ও অন্ধকার ডোরা সৃষ্টি হয়। পুরো যন্ত্রকে \\(\\mu\\) প্রতিসরাঙ্কের তরলে ডোবালে আলোর তরঙ্গদৈর্ঘ্য \\(\\mu\\) গুণ কমে যায় বলে ডোরাগুলোও \\(\\mu\\) গুণ কাছাকাছি চেপে আসে।", "trap": "HSC পাঠ্যবইয়ে 'ডোরা ব্যবধান' (\\(\\Delta x = \\frac{\\lambda D}{a}\\)) হলো দুটি পরপর উজ্জ্বল বা অন্ধকার ডোরার দূরত্ব, আর 'ডোরার প্রস্থ' (\\(x = \\frac{\\lambda D}{2a}\\)) হলো এর ঠিক অর্ধেক—প্রশ্নে কোনটি চেয়েছে তা খেয়াল না করলে উত্তর দ্বিগুণ বা অর্ধেক হয়ে যায়।", "quickExample": "বায়ুতে ইয়ং-এর দ্বি-চিড় পরীক্ষায় ডোরা ব্যবধান \\(\\Delta x = 0.6\\text{ mm}\\) হলে পুরো ব্যবস্থাটিকে \\(\\mu = 1.5\\) প্রতিসরাঙ্কের তরলে ডোবালে নতুন ডোরা ব্যবধান \\(\\Delta x' = \\frac{0.6}{1.5} = 0.4\\text{ mm}\\) হবে।"}, {"id": 87, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "একক চিড় ও গ্রেটিং", "question": "একক চিড়ে চরম ও অবমের শর্ত, গ্রেটিং ধ্রুবক \\(d\\), একক দৈর্ঘ্যে রেখার সংখ্যা \\(N\\) এবং গ্রেটিং সমীকরণ কী?", "answer": "একক চিড়ে চরম: \\(a\\sin\\theta = (2n+1)\\frac{\\lambda}{2}\\); অবম: \\(a\\sin\\theta = n\\lambda\\)<br>গ্রেটিং: \\(N = \\frac{1}{d} = \\frac{1}{a+b}\\), \\(d = \\frac{1}{N} = (a+b)\\) এবং \\(d\\sin\\theta = n\\lambda\\)", "context": "<b>সতর্কতা:<\/b> একক চিড়ের অপবর্তনে চরম ও অবমের শর্ত ব্যতিচারের ঠিক <b>উল্টো<\/b>! এখানে \\(a\\) হলো চিড়ের প্রস্থ, \\(b\\) হলো অস্বচ্ছ অংশের প্রস্থ, \\(n\\) = অপবর্তন ক্রম (Order)।", "intuition": "একক চিড়ের ভেতর দিয়ে আলো যাওয়ার সময় চিড়ের বিভিন্ন অংশের গৌণ তরঙ্গগুলো একে অপরের সাথে ব্যতিচার ঘটিয়ে চওড়া কেন্দ্রীয় চরম ও ক্রমহ্রাসমান গৌণ চরম তৈরি করে। অন্যদিকে অপবর্তন গ্রেটিংয়ে হাজার হাজার সূক্ষ্ম চিড় থাকায় \\(d\\sin\\theta = n\\lambda\\) শর্তে নির্দিষ্ট কোণে অত্যন্ত তীক্ষ্ণ ও উজ্জ্বল বর্ণালি রেখা পাওয়া যায়।", "trap": "একক চিড়ের অপবর্তনে অবমের শর্ত \\(a\\sin\\theta = n\\lambda\\) দ্বি-চিড় ব্যতিচারের চরমের শর্তের ঠিক উল্টো; এছাড়া গ্রেটিংয়ের রেখার সংখ্যা \\(N\\) প্রতি সেন্টিমিটারে দেওয়া থাকলে মিটারে রূপান্তর (\\(\\times 100\\)) না করলে \\(d\\) এর মান \\(100\\) গুণ ভুল হয়।", "quickExample": "একটি অপবর্তন গ্রেটিংয়ের প্রতি সেন্টিমিটারে \\(5000\\) টি রেখা থাকলে গ্রেটিং ধ্রুবক \\(d = \\frac{1\\text{ cm}}{5000} = \\frac{10^{-2}\\text{ m}}{5000} = 2\\times 10^{-6}\\text{ m}\\)।"}, {"id": 88, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "সমবর্তন (ম্যালাস ও ব্রুস্টার)", "question": "ম্যালাসের সূত্র, ব্রুস্টারের সূত্র এবং প্রতিসরণ ও সমবর্তন কোণের সম্পর্ক কী?", "answer": "ম্যালাসের সূত্র: \\(I = I_0\\cos^2\\theta\\) • ব্রুস্টারের সূত্র: \\(\\mu = \\tan\\theta_p\\) • সম্পর্ক: \\(r + \\theta_p = 90^\\circ\\)", "context": "<b>প্রতীক:<\/b> \\(\\theta\\) = সমবর্তক ও বিশ্লেষকের অক্ষের কোণ; \\(\\theta_p\\) = সমবর্তন/ব্রুস্টার কোণ।<br><b>ধারণা:<\/b> কেবল অনুপ্রস্থ (আড়) তরঙ্গের সমবর্তন ঘটে (শব্দ তরঙ্গের ঘটে না)। ব্রুস্টার কোণে প্রতিফলিত ও প্রতিসরিত রশ্মি পরস্পর লম্ব থাকে।", "intuition": "সমবর্তক আলোক তরঙ্গের কম্পনকে একটি নির্দিষ্ট তলে সীমাবদ্ধ করে এবং বিশ্লেষক \\(\\theta\\) কোণে থাকলে বিস্তারের \\(\\cos\\theta\\) উপাংশ পার হতে পারে বলে তীব্রতা \\(I_0\\cos^2\\theta\\) হারে কমে। ব্রুস্টার কোণে আলো আপতিত হলে প্রতিফলিত ও প্রতিসরিত রশ্মি পরস্পর লম্ব (\\(r + \\theta_p = 90^\\circ\\)) হয়, ফলে প্রতিফলিত আলো সম্পূর্ণ সমতল-সমবর্তিত হয়ে যায়।", "trap": "অসমবর্তিত আলো \\(I_0\\) প্রথম পোলারয়েড ভেদ করলে তীব্রতা অর্ধেক (\\(\\frac{I_0}{2}\\)) হয়ে যায় এবং তারপর দ্বিতীয় পোলারয়েডে ম্যালাসের সূত্র প্রয়োগ করতে হয়—অনেকে প্রথম ধাপে অর্ধেক করতে ভুলে সরাসরি \\(I_0\\cos^2\\theta\\) বসিয়ে দেন।", "quickExample": "কাচের প্রতিসরাঙ্ক \\(\\mu = \\sqrt{3}\\) হলে ব্রুস্টার কোণ \\(\\theta_p = \\tan^{-1}(\\sqrt{3}) = 60^\\circ\\) এবং সংশ্লিষ্ট প্রতিসরণ কোণ \\(r = 90^\\circ - 60^\\circ = 30^\\circ\\)।"}, {"id": 89, "ch": 8, "chapter": "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "topic": "ফোটন ও ইলেকট্রনের বেগ", "question": "ফোটনের শক্তি \\(E\\), ভরবেগ \\(p\\) এবং \\(V\\) বিভব পার্থক্যে ত্বরিত ইলেকট্রনের বেগ \\(v\\) এর সূত্র কী?", "answer": "শক্তি: \\(E = h\\nu = h\\frac{c}{\\lambda}\\) • ভরবেগ: \\(p = \\frac{h}{\\lambda} = \\frac{h\\nu}{c} = \\frac{E}{c}\\) • বেগ: \\(v = \\sqrt{\\frac{2eV}{m}}\\)", "context": "<b>ধ্রুবক:<\/b> প্ল্যাঙ্কের ধ্রুবক \\(h = 6.626\\times 10^{-34}\\text{ J s}\\), \\(1\\text{ eV} = 1.6\\times 10^{-19}\\text{ J}\\)।<br><b>তথ্য:<\/b> ফোটনের স্থির ভর শূন্য (\\(m_0 = 0\\)) এবং এটি চার্জ নিরপেক্ষ। \\(v\\) সূত্রটি \\(\\frac{1}{2}mv^2 = eV\\) থেকে আসে।", "intuition": "আলো ক্ষুদ্র ক্ষুদ্র শক্তির প্যাকেট বা ফোটন রূপে প্রবাহিত হয়, যার স্থির ভর শূন্য হলেও গতিশীল অবস্থায় নির্দিষ্ট শক্তি ও ভরবেগ থাকে। অন্যদিকে কোনো ইলেকট্রনকে বিভব পার্থক্যের মধ্য দিয়ে ত্বরিত করলে এর তড়িৎ বিভব শক্তি সরাসরি গতিশক্তিতে রূপান্তরিত হয়।", "trap": "ভর্তি পরীক্ষায় অনেকেই ফোটনের শক্তি \\(\\text{eV}\\) এককে রেখেই সরাসরি \\(\\text{SI}\\) এককের \\(h\\) বা \\(c\\) দিয়ে হিসাব করে ফেলেন—সঠিক উত্তরের জন্য \\(1\\text{ eV} = 1.6\\times 10^{-19}\\text{ J}\\) ব্যবহার করে অবশ্যই জুলে রূপান্তর করতে হবে।", "quickExample": "\\(\\lambda = 600\\text{ nm} = 6\\times 10^{-7}\\text{ m}\\) তরঙ্গদৈর্ঘ্যের একটি ফোটনের শক্তি \\(E = \\frac{hc}{\\lambda} = \\frac{6.626\\times 10^{-34}\\times 3\\times 10^8}{6\\times 10^{-7}} = 3.313\\times 10^{-19}\\text{ J} \\approx 2.07\\text{ eV}\\) এবং ভরবেগ \\(p = \\frac{E}{c} \\approx 1.10\\times 10^{-27}\\text{ kg m s}^{-1}\\)।"}, {"id": 90, "ch": 8, "chapter": "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "topic": "ফটো-তড়িৎ ক্রিয়া ও এক্স-রে", "question": "ফটো ইলেকট্রনের সর্বোচ্চ গতিশক্তি, সূচন কম্পাঙ্ক \\(\\nu_0\\), সূচন তরঙ্গদৈর্ঘ্য \\(\\lambda_0\\), নিবৃত্তি বিভব \\(V_s\\), কার্যাপেক্ষক \\(W_0\\) ও এক্স-রে শক্তির সূত্র কী?", "answer": "\\(\\frac{1}{2}mv_{\\max}^2 = h\\nu - W_0 = h\\nu - h\\nu_0 = \\frac{hc}{\\lambda} - \\frac{hc}{\\lambda_0} = eV_s\\)<br>\\(\\nu_0 = \\frac{W_0}{h}\\), \\(\\lambda_0 = \\frac{c}{\\nu_0} = \\frac{hc}{W_0}\\), \\(W_0 = h\\nu_{\\min} = h\\frac{c}{\\lambda_{\\max}}\\)<br>এক্স-রে: \\(E = h\\nu = h\\frac{c}{\\lambda} = W_0 + \\frac{1}{2}mv_{\\max}^2\\)", "context": "<b>শর্ত:<\/b> ইলেকট্রন নির্গমনের জন্য আপতিত কম্পাঙ্ক \\(\\nu \\gt  \\nu_0\\) (অর্থাৎ \\(\\lambda \\lt  \\lambda_0\\)) হতে হবে।<br><b>ধারণা:<\/b> গতিশক্তি ও \\(V_s\\) আলোর কম্পাঙ্কের ওপর নির্ভর করে, কিন্তু ফটো-তড়িৎ প্রবাহ আলোর তীব্রতার সমানুপাতিক।", "intuition": "আপতিত ফোটন তার সম্পূর্ণ শক্তি একটি ইলেকট্রনকে প্রদান করে; এর একটি অংশ ধাতব পৃষ্ঠ থেকে ইলেকট্রন মুক্ত করতে (কার্যাপেক্ষক \\(W_0\\)) ব্যয় হয় এবং অবশিষ্ট অংশ ইলেকট্রনের সর্বোচ্চ গতিশক্তি হিসেবে প্রকাশ পায়। এক্স-রে উৎপাদনে এর বিপরীত প্রক্রিয়ায় ত্বরিত ইলেকট্রনের গতিশক্তি উচ্চশক্তির ফোটনে রূপান্তরিত হয়।", "trap": "আলোর তীব্রতা বাড়ালে ফটো-ইলেকট্রনের সর্বোচ্চ গতিশক্তি বা নিবৃত্তি বিভব \\(V_s\\) বাড়ে বলে অনেকেই ভুল করেন—আসলে তীব্রতা কেবল ফটো-তড়িৎ প্রবাহ বাড়ায়, আর \\(V_s\\) নির্ভর করে কেবল আপতিত আলোর কম্পাঙ্কের ওপর।", "quickExample": "কোনো ধাতুর কার্যাপেক্ষক \\(W_0 = 2.2\\text{ eV}\\) এবং আপতিত ফোটনের শক্তি \\(E = 3.7\\text{ eV}\\) হলে সর্বোচ্চ গতিশক্তি \\(K_{\\max} = E - W_0 = 3.7 - 2.2 = 1.5\\text{ eV}\\) এবং নিবৃত্তি বিভব \\(V_s = \\frac{K_{\\max}}{e} = 1.5\\text{ V}\\)।"}, {"id": 91, "ch": 8, "chapter": "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "topic": "ডি-ব্রগলি তরঙ্গদৈর্ঘ্য", "question": "ডি-ব্রগলি তরঙ্গদৈর্ঘ্য \\(\\lambda\\) নির্ণয়ের সূত্রসমূহ কী?", "answer": "\\(\\lambda = \\frac{h}{mv} = \\frac{h}{p} = \\frac{h}{\\sqrt{2mE_k}} = \\frac{h}{\\sqrt{2meV_s}}\\)", "context": "<b>ধারণা:<\/b> এটি পদার্থের কণা-তরঙ্গ দ্বৈত প্রকৃতি প্রকাশ করে।<br><b>শর্টকাট:<\/b> \\(V\\) ভোল্টে ত্বরিত ইলেকট্রনের জন্য \\(\\lambda \\approx \\frac{12.27}{\\sqrt{V}}\\text{ \\AA}\\)।", "intuition": "আলোর মতো পদার্থেরও দ্বৈত প্রকৃতি রয়েছে—গতিশীল প্রতিটি কণার সাথে একটি তরঙ্গ যুক্ত থাকে, যার তরঙ্গদৈর্ঘ্য কণার ভরবেগের ব্যস্তানুপাতিক। দৈনন্দিন বড় বস্তুর ভর অনেক বেশি হওয়ায় এই তরঙ্গদৈর্ঘ্য নগণ্য হয়, কিন্তু ইলেকট্রনের মতো অতিপারমাণবিক কণার ক্ষেত্রে এটি স্পষ্টভাবে পরিমাপযোগ্য।", "trap": "\\(\\lambda \\approx \\frac{12.27}{\\sqrt{V}}\\text{ Å}\\) শর্টকাট সূত্রটি কেবল ইলেকট্রনের জন্য প্রযোজ্য—প্রোটন বা আলফা কণার ক্ষেত্রে এটি সরাসরি প্রয়োগ করলে উত্তর সম্পূর্ণ ভুল হবে।", "quickExample": "\\(V = 100\\text{ V}\\) বিভব পার্থক্যে ত্বরিত একটি ইলেকট্রনের ডি-ব্রগলি তরঙ্গদৈর্ঘ্য \\(\\lambda \\approx \\frac{12.27}{\\sqrt{100}}\\text{ Å} = 1.227\\text{ Å} = 0.1227\\text{ nm}\\)।"}, {"id": 92, "ch": 8, "chapter": "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "topic": "আপেক্ষিকতা (দৈর্ঘ্য, কাল, ভর)", "question": "আপেক্ষিকতা তত্ত্ব অনুসারে গতিশীল দৈর্ঘ্য \\(L\\), সময় \\(t\\), ভর \\(m\\), ক্ষেত্রফল \\(A\\) এবং ঘনত্ব \\(\\rho\\) এর সূত্র কী?", "answer": "\\(L = L_0\\sqrt{1 - \\frac{v^2}{c^2}}\\) • \\(t = \\frac{t_0}{\\sqrt{1 - \\frac{v^2}{c^2}}}\\) • \\(m = \\frac{m_0}{\\sqrt{1 - \\frac{v^2}{c^2}}}\\)<br>\\(A = A_0\\sqrt{1 - \\frac{v^2}{c^2}}\\) • \\(\\rho = \\frac{\\rho_0}{1 - \\frac{v^2}{c^2}}\\)", "context": "<b>প্রতীক:<\/b> \\(L_0, t_0, m_0, A_0, \\rho_0\\) = স্থির অবস্থার (Proper) মান।<br><b>ধারণা:<\/b> গতির দিকে দৈর্ঘ্য সংকুচিত হয় (\\(L \\lt  L_0\\)), সময় দীর্ঘায়িত হয় (\\(t \\gt  t_0\\)) এবং ভর ও ঘনত্ব বৃদ্ধি পায় (\\(m \\gt  m_0, \\rho \\gt  \\rho_0\\))।", "intuition": "আইনস্টাইনের বিশেষ আপেক্ষিকতা তত্ত্ব অনুযায়ী আলোর বেগ সকল জড় প্রসঙ্গ কাঠামোতে ধ্রুবক থাকায়, অতি উচ্চ বেগে গতিশীল বস্তুর ক্ষেত্রে স্থান ও কাল আর পরম থাকে না। পর্যবেক্ষকের সাপেক্ষে গতিশীল বস্তুর দৈর্ঘ্য গতির দিকে সংকুচিত হয়, ঘড়ি ধীরে চলে এবং আপেক্ষিক ভর বৃদ্ধি পায়।", "trap": "দৈর্ঘ্য সংকোচন ও কাল দীর্ঘায়নে লরেন্টজ গুণক \\(\\sqrt{1 - \\frac{v^2}{c^2}}\\) গুণ নাকি ভাগ হবে তা অনেকেই গুলিয়ে ফেলেন—মনে রাখবেন গতিশীল দৈর্ঘ্য সবসময় কমে (\\(L \\lt  L_0\\)), আর গতিশীল সময় ও ভর সবসময় বাড়ে (\\(t \\gt  t_0,\\; m \\gt  m_0\\))।", "quickExample": "\\(L_0 = 10\\text{ m}\\) স্থির দৈর্ঘ্যের একটি দণ্ড \\(v = 0.6c\\) বেগে দৈর্ঘ্য বরাবর গতিশীল হলে \\(\\sqrt{1 - \\frac{v^2}{c^2}} = \\sqrt{1 - 0.36} = 0.8\\), ফলে এর আপেক্ষিক দৈর্ঘ্য \\(L = 10\\times 0.8 = 8\\text{ m}\\)।"}, {"id": 93, "ch": 8, "chapter": "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "topic": "আপেক্ষিক ভরবেগ ও শক্তি", "question": "আপেক্ষিক ভরবেগ \\(p\\), বস্তুর মোট শক্তি \\(E\\) এবং আপেক্ষিক গতিশক্তি \\(E_k\\) এর সূত্র কী?", "answer": "\\(p = mv = \\frac{m_0v}{\\sqrt{1 - \\frac{v^2}{c^2}}} = \\frac{p_0}{\\sqrt{1 - \\frac{v^2}{c^2}}}\\)<br>\\(E = mc^2 = \\sqrt{p^2c^2 + m_0^2c^4} = \\frac{E_0}{\\sqrt{1 - \\frac{v^2}{c^2}}}\\) • \\(E_k = (m - m_0)c^2\\)", "context": "<b>প্রতীক:<\/b> \\(E_0 = m_0c^2\\) (স্থির ভর শক্তি)।<br><b>সতর্কতা:<\/b> \\(v\\) আলোর বেগের কাছাকাছি হলে \\(E_k = \\frac{1}{2}mv^2\\) ব্যবহার করা যাবে না; তখন \\(E_k = (m - m_0)c^2 = E - E_0\\) ব্যবহার করতে হবে।", "intuition": "আপেক্ষিকতা তত্ত্বে ভর ও শক্তি পরস্পর সমতুল্য, তাই স্থির অবস্থায়ও একটি বস্তুর নিজস্ব স্থির ভর শক্তি \\(E_0 = m_0c^2\\) থাকে। বস্তুটি অতি উচ্চ বেগে চললে এর মোট শক্তি বাড়ে এবং এই অতিরিক্ত শক্তিই বস্তুর আপেক্ষিক গতিশক্তি রূপে সঞ্চিত হয়।", "trap": "বেগ আলোর বেগের কাছাকাছি হলে চিরায়ত সূত্র \\(E_k = \\frac{1}{2}mv^2\\) ব্যবহার করা একটি সাধারণ ফাঁদ—সঠিক উত্তর পেতে অবশ্যই আপেক্ষিক গতিশক্তি \\(E_k = (m - m_0)c^2 = E - E_0\\) ব্যবহার করতে হবে।", "quickExample": "একটি ইলেকট্রনের স্থির ভর শক্তি \\(E_0 = m_0c^2 \\approx 0.511\\text{ MeV}\\)। এটি \\(v = 0.6c\\) বেগে গতিশীল হলে \\(\\gamma = \\frac{1}{\\sqrt{1 - 0.36}} = 1.25\\), ফলে মোট শক্তি \\(E = 1.25 E_0 \\approx 0.639\\text{ MeV}\\) এবং গতিশক্তি \\(E_k = E - E_0 = 0.25 E_0 \\approx 0.128\\text{ MeV}\\)।"}, {"id": 94, "ch": 8, "chapter": "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "topic": "কম্পটন ও অনিশ্চয়তা নীতি", "question": "কম্পটন ক্রিয়ার তরঙ্গদৈর্ঘ্য পরিবর্তন \\(\\Delta\\lambda\\) এবং হাইজেনবার্গের অনিশ্চয়তা নীতির সমীকরণ কী?", "answer": "কম্পটন ক্রিয়া: \\(\\Delta\\lambda = \\lambda' - \\lambda = \\frac{h}{m_0c}(1 - \\cos\\phi)\\)<br>অনিশ্চয়তা নীতি: \\(\\Delta x\\times\\Delta p \\ge \\frac{h}{4\\pi}\\) এবং \\(\\Delta E\\times\\Delta t \\ge \\frac{h}{4\\pi}\\) [\\(h = 6.626\\times 10^{-34}\\text{ J s}\\)]", "context": "<b>কম্পটন তরঙ্গদৈর্ঘ্য:<\/b> ইলেকট্রনের জন্য \\(\\frac{h}{m_0c} = 0.02426\\text{ \\AA}\\)। বিক্ষেপণ কোণ \\(\\phi = 180^\\circ\\) হলে \\(\\Delta\\lambda\\) সর্বোচ্চ হয়।<br><b>অনিশ্চয়তা নীতি:<\/b> একই সাথে অবস্থান (\\(\\Delta x\\)) ও ভরবেগ (\\(\\Delta p\\)) শতভাগ নির্ভুলভাবে মাপা অসম্ভব।", "intuition": "কম্পটন ক্রিয়ায় উচ্চশক্তির ফোটন মুক্ত ইলেকট্রনের সাথে স্থিতিস্থাপক সংঘর্ষে লিপ্ত হয়ে কিছু শক্তি হারায়, ফলে বিক্ষিপ্ত ফোটনের তরঙ্গদৈর্ঘ্য বেড়ে যায়—এটি আলোর কণা ধর্মের অকাট্য প্রমাণ। অন্যদিকে হাইজেনবার্গের অনিশ্চয়তা নীতি বলে, কোয়ান্টাম জগতে কোনো কণার অবস্থান ও ভরবেগ একই সাথে শতভাগ নির্ভুলভাবে মাপা মৌলিকভাবেই অসম্ভব।", "trap": "কম্পটন তরঙ্গদৈর্ঘ্য পরিবর্তন \\(\\Delta\\lambda\\) সর্বোচ্চ হয় \\(\\phi = 90^\\circ\\) কোণে বলে অনেকেই ভুল করেন—আসলে \\(\\phi = 180^\\circ\\) কোণে \\(1 - \\cos 180^\\circ = 2\\) হওয়ায় \\(\\Delta\\lambda\\) সর্বোচ্চ (\\(\\frac{2h}{m_0c}\\)) হয়।", "quickExample": "একটি এক্স-রে ফোটন মুক্ত ইলেকট্রনের সাথে সংঘর্ষে \\(\\phi = 90^\\circ\\) কোণে বিক্ষিপ্ত হলে তরঙ্গদৈর্ঘ্য পরিবর্তন \\(\\Delta\\lambda = \\frac{h}{m_0c}(1 - \\cos 90^\\circ) = 0.02426\\times (1 - 0) = 0.02426\\text{ Å}\\)।"}, {"id": 95, "ch": 9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "বোর মডেল: ব্যাসার্ধ, বেগ, পর্যায়কাল", "question": "ইলেকট্রনের কৌণিক ভরবেগ \\(L\\), \\(n\\)-তম কক্ষপথের ব্যাসার্ধ \\(r_n\\), বেগ \\(v_n\\), পর্যায়কাল \\(T_n\\) ও আবর্তন সংখ্যা কত?", "answer": "\\(L = mv_nr_n = \\frac{nh}{2\\pi}\\); \\(r_n = \\frac{n^2h^2\\epsilon_0}{\\pi m Z e^2} \\propto \\frac{n^2}{Z}\\); \\(v_n = \\frac{Ze^2}{2\\epsilon_0 nh} \\propto \\frac{Z}{n}\\)<br>\\(T_n = \\frac{2\\pi r_n}{v_n} = \\frac{4\\epsilon_0^2 n^3 h^3}{m Z^2 e^4} \\propto \\frac{n^3}{Z^2}\\); আবর্তন সংখ্যা \\(= \\frac{1}{T_n}\\)", "context": "<b>প্রতীক:<\/b> \\(n = 1, 2, 3, \\dots\\) (কক্ষপথ সংখ্যা), \\(Z\\) = পারমাণবিক সংখ্যা।<br><b>মূল অনুপাত:<\/b> বাইরের কক্ষপথে গেলে ব্যাসার্ধ বাড়ে (\\(n^2\\)), বেগ কমে (\\(\\frac{1}{n}\\)), পর্যায়কাল বাড়ে (\\(n^3\\))।", "intuition": "নিউক্লিয়াসের কুলম্ব আকর্ষণ বল ইলেকট্রনকে কক্ষপথে ঘোরার প্রয়োজনীয় কেন্দ্রমুখী বল জোগায়, আর কৌণিক ভরবেগ কোয়ান্টায়িত থাকায় শুধু নির্দিষ্ট ব্যাসার্ধের কক্ষপথই অনুমোদিত হয়। বাইরের কক্ষপথে গেলে আকর্ষণ বল কমে যাওয়ায় ইলেকট্রনের বেগ কমে এবং বড় পথ ঘুরতে পর্যায়কাল দ্রুত বেড়ে যায়।", "trap": "অনেকেই মনে করেন ব্যাসার্ধ বাড়লে বেগও বাড়ে, কিন্তু আসলে \\(r_n \\propto n^2\\), \\(v_n \\propto \\frac{1}{n}\\) এবং পর্যায়কাল \\(T_n \\propto n^3\\)—এছাড়াও \\(Z\\) বাড়লে ব্যাসার্ধ কমে (\\(\\propto \\frac{1}{Z}\\)) কিন্তু বেগ বাড়ে (\\(\\propto Z\\))।", "quickExample": "হাইড্রোজেন পরমাণুর (\\(Z=1\\)) প্রথম কক্ষপথের ব্যাসার্ধ \\(r_1 = 0.53 \\text{ Å}\\) হলে তৃতীয় কক্ষপথের (\\(n=3\\)) ব্যাসার্ধ \\(r_3 = 3^2 \\times 0.53 = 4.77 \\text{ Å}\\)। আর \\(\\text{He}^+\\) (\\(Z=2\\)) আয়নের প্রথম কক্ষপথের ব্যাসার্ধ \\(r_1' = \\frac{0.53}{2} = 0.265 \\text{ Å}\\)।"}, {"id": 96, "ch": 9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "বোর মডেল: শক্তি", "question": "\\(n\\)-তম কক্ষপথে আবর্তনশীল ইলেকট্রনের গতিশক্তি \\(E_{k_n}\\), বিভবশক্তি \\(E_{p_n}\\) এবং মোট শক্তি \\(E_n\\) এর সূত্র কী?", "answer": "\\(E_{k_n} = \\frac{m Z^2 e^4}{8n^2h^2\\epsilon_0^2}\\) • \\(E_{p_n} = -\\frac{m Z^2 e^4}{4n^2h^2\\epsilon_0^2}\\) • \\(E_n = -\\frac{m Z^2 e^4}{8n^2h^2\\epsilon_0^2} \\propto -\\frac{Z^2}{n^2}\\)", "context": "<b>সুপার শর্টকাট সম্পর্ক:<\/b> \\(E_k = -E_{\\text{total}}\\) এবং \\(E_p = 2E_{\\text{total}}\\) (অর্থাৎ \\(E_p = -2E_k\\))।<br><b>ধারণা:<\/b> মোট শক্তি ঋণাত্মক মানে ইলেকট্রন নিউক্লিয়াসের সাথে আবদ্ধ। \\(n\\) বাড়লে মোট শক্তি বাড়ে (কম ঋণাত্মক হয়)।", "intuition": "নিউক্লিয়াসের আকর্ষণ ক্ষেত্রের মধ্যে আবদ্ধ থাকায় ইলেকট্রনের বিভবশক্তি ঋণাত্মক হয় এবং এর মান গতিশক্তির দ্বিগুণ হওয়ায় মোট শক্তিও ঋণাত্মক থাকে। কক্ষপথ সংখ্যা \\(n\\) বাড়লে ইলেকট্রন নিউক্লিয়াস থেকে দূরে সরে গিয়ে কম ঋণাত্মক অর্থাৎ অধিকতর উচ্চ শক্তিস্তরে পৌঁছায়।", "trap": "পরীক্ষায় প্রায়ই গতিশক্তি \\(E_k\\) ও বিভবশক্তি \\(E_p\\)-এর চিহ্ন ও অনুপাত নিয়ে বিভ্রান্তি হয়—মনে রাখবে \\(E_k = -E_{\\text{total}}\\) (সর্বদা ধনাত্মক) কিন্তু \\(E_p = 2E_{\\text{total}} = -2E_k\\) (সর্বদা ঋণাত্মক এবং পরিমাণে গতিশক্তির দ্বিগুণ)।", "quickExample": "কোনো বোর কক্ষপথে ইলেকট্রনের মোট শক্তি \\(E = -3.4 \\text{ eV}\\) হলে গতিশক্তি \\(E_k = -E = +3.4 \\text{ eV}\\) এবং বিভবশক্তি \\(E_p = 2E = 2 \\times (-3.4) = -6.8 \\text{ eV}\\)। যাচাই: \\(E_k + E_p = 3.4 - 6.8 = -3.4 \\text{ eV}\\)।"}, {"id": 97, "ch": 9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "হাইড্রোজেন পরমাণু", "question": "হাইড্রোজেন পরমাণুর \\(n\\)-তম কক্ষপথের ব্যাসার্ধ, বেগ, শক্তি, পর্যায়কাল ও প্রতি সেকেন্ডে আবর্তন সংখ্যার সংক্ষিপ্ত সূত্র কী?", "answer": "\\(r_n = n^2 r_1\\) (\\(r_1 = 0.51\\text{ \\AA}\\)), \\(v_n = \\frac{v_1}{n}\\) (\\(v_1 = 2.18\\times 10^6\\text{ m s}^{-1}\\)), \\(E_n = \\frac{E_1}{n^2}\\) (\\(E_1 = -13.6\\text{ eV}\\)), \\(T_n = n^3 T_1\\) (\\(T_1 = 1.51\\times 10^{-16}\\text{ s}\\)), আবর্তন সংখ্যা \\(= \\frac{6.56\\times 10^{15}}{n^3}\\)", "context": "<b>দ্রুত হিসাব (H-পরমাণু, \\(Z=1\\)):<\/b> \\(E_1 = -13.6\\text{ eV}\\), \\(E_2 = -3.4\\text{ eV}\\), \\(E_3 = -1.51\\text{ eV}\\)। আয়নীকরণ শক্তি \\(= +13.6\\text{ eV}\\)।", "intuition": "হাইড্রোজেন পরমাণুর জন্য \\(Z = 1\\) হওয়ায় প্রথম কক্ষপথের ধ্রুব মানগুলো (\\(r_1, v_1, E_1, T_1\\)) জানা থাকলে শুধু \\(n\\)-এর ঘাত দিয়ে গুণ বা ভাগ করেই যেকোনো কক্ষপথের সব ভৌত রাশি মুহূর্তে বের করা যায়।", "trap": "হাইড্রোজেনের প্রথম উত্তেজিত অবস্থা বলতে \\(n = 1\\) নয় বরং \\(n = 2\\) বোঝায় (\\(E_2 = -3.4 \\text{ eV}\\)), এবং ভূমি স্তর থেকে আয়নীকরণ শক্তি \\(-13.6 \\text{ eV}\\) নয় বরং ধনাত্মক \\(+13.6 \\text{ eV}\\)।", "quickExample": "হাইড্রোজেন পরমাণুর দ্বিতীয় কক্ষপথে (\\(n=2\\)) ইলেকট্রনের বেগ \\(v_2 = \\frac{v_1}{2} = \\frac{2.18 \\times 10^6}{2} = 1.09 \\times 10^6 \\text{ m s}^{-1}\\) এবং মোট শক্তি \\(E_2 = \\frac{-13.6}{2^2} = -3.4 \\text{ eV}\\)।"}, {"id": 98, "ch": 9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "কক্ষ স্থানান্তর ও রীডবার্গ", "question": "ইলেকট্রনের কক্ষ স্থানান্তরের নিঃসৃত শক্তি ও একক দৈর্ঘ্যে তরঙ্গ সংখ্যা (\\(\\bar{\\nu}\\)) নির্ণয়ের সূত্র কী?", "answer": "\\(E_2 - E_1 = h\\nu = \\frac{hc}{\\lambda}\\) • \\(\\bar{\\nu} = \\frac{1}{\\lambda} = R_H\\left(\\frac{1}{n_1^2} - \\frac{1}{n_2^2}\\right)Z^2\\) [\\(R_H = 109678\\text{ cm}^{-1}\\)]", "context": "<b>প্রতীক:<\/b> \\(n_1\\) = নিম্ন কক্ষপথ, \\(n_2\\) = উচ্চ কক্ষপথ, \\(R_H = 1.097\\times 10^7\\text{ m}^{-1}\\)।<br><b>বর্ণালি সারি:<\/b> \\(n_1=1\\) লাইম্যান (UV), \\(n_1=2\\) বামার (দৃশ্যমান), \\(n_1=3\\) প্যাশ্চেন (IR)।", "intuition": "ইলেকট্রন উচ্চ শক্তিস্তর (\\(n_2\\)) থেকে নিম্ন শক্তিস্তরে (\\(n_1\\)) লাফ দিলে দুই স্তরের শক্তির পার্থক্য ঠিক একটি ফোটন হিসেবে বিকিরিত হয়। এই শক্তির পার্থক্য যত বেশি হয়, নির্গত আলোর কম্পাঙ্ক তত বেশি এবং তরঙ্গদৈর্ঘ্য তত ছোট হয়।", "trap": "রীডবার্গ সূত্র থেকে সরাসরি তরঙ্গদৈর্ঘ্য \\(\\lambda\\) নয় বরং তরঙ্গ সংখ্যা \\(\\frac{1}{\\lambda}\\) পাওয়া যায়—শেষ ধাপে মানটি উল্টাতে ভুলে যাওয়া এবং \\(n_1, n_2\\) অদলবদল করে ঋণাত্মক মান আনা সবচেয়ে বড় ভুল।", "quickExample": "হাইড্রোজেনের বামার সারির প্রথম রেখার (\\(n_2 = 3 \\to n_1 = 2\\)) তরঙ্গ সংখ্যা \\(\\frac{1}{\\lambda} = R_H \\left(\\frac{1}{2^2} - \\frac{1}{3^2}\\right) = \\frac{5}{36} R_H\\)। এখানে \\(R_H = 1.097 \\times 10^7 \\text{ m}^{-1}\\) বসালে \\(\\lambda = \\frac{36}{5 \\times 1.097 \\times 10^7} \\approx 656 \\text{ nm}\\)।"}, {"id": 99, "ch": 9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "তেজস্ক্রিয় ক্ষয় ও অর্ধায়ু", "question": "অর্ধায়ু \\(T_{1/2}\\), গড় আয়ু \\(\\tau\\), তেজস্ক্রিয় ক্ষয় সূত্র, ভাঙনের হার \\(\\frac{dN}{dt}\\), অবশিষ্ট পরমাণু \\(N\\) ও তেজস্ক্রিয়তা \\(A\\) এর সূত্র কী?", "answer": "\\(T_{1/2} = \\frac{\\ln 2}{\\lambda} = \\frac{0.693}{\\lambda}\\) • \\(\\tau = \\frac{1}{\\lambda} = 1.44\\times T_{1/2}\\)<br>\\(N = N_0e^{-\\lambda t}\\); \\(\\frac{N}{N_0} = \\frac{1}{2^n}\\) [\\(n = \\frac{t}{T_{1/2}}\\)]; \\(\\frac{dN}{dt} = N\\lambda = nN_A\\lambda\\)<br>\\(A = A_0e^{-\\lambda t} = \\frac{A_0}{2^n}\\); প্রতি সেকেন্ডে ফিশন \\(N = \\frac{P}{E}\\)", "context": "<b>প্রতীক:<\/b> \\(\\lambda\\) = ক্ষয় ধ্রুবক, \\(N_0\\) = আদি পরমাণু সংখ্যা, \\(N\\) = \\(t\\) সময় পর অবশিষ্ট (অক্ষত) পরমাণু, \\(N_A = 6.023\\times 10^{23}\\)।<br><b>সতর্কতা:<\/b> \\(N\\) হলো <b>অবশিষ্ট<\/b> অংশ; ক্ষয়প্রাপ্ত অংশ \\(= N_0 - N\\)। \\(A\\)-এর SI একক বেকেরেল (\\(\\text{Bq} = 1\\text{ decay/s}\\))।", "intuition": "তেজস্ক্রিয় ভাঙন একটি স্বতঃস্ফূর্ত প্রক্রিয়া যেখানে প্রতি মুহূর্তে ভাঙনের হার তৎক্ষণাৎ উপস্থিত অক্ষত পরমাণুর সংখ্যার সমানুপাতিক। ফলে প্রতিটি অর্ধায়ু সময় পর পর অবশিষ্ট পরমাণুর সংখ্যা আগের অর্ধেক হয়ে যায়, কিন্তু তাত্ত্বিকভাবে কখনো শূন্য হয় না।", "trap": "\\(N = N_0 \\left(\\frac{1}{2}\\right)^n\\) সূত্রে \\(N\\) হলো অবশিষ্ট (অক্ষত) পরমাণু, ক্ষয়প্রাপ্ত অংশ (\\(N_0 - N\\)) নয়; আর গড় আয়ু \\(\\tau = 1.443\\,T_{1/2}\\) হওয়ায় \\(\\tau\\) সর্বদা অর্ধায়ু \\(T_{1/2}\\)-এর চেয়ে বড় হয়।", "quickExample": "কোনো তেজস্ক্রিয় মৌলের অর্ধায়ু \\(T_{1/2} = 10 \\text{ min}\\) হলে \\(30 \\text{ min}\\) পর \\(n = \\frac{30}{10} = 3\\)। অবশিষ্ট অংশ \\(\\frac{N}{N_0} = \\frac{1}{2^3} = \\frac{1}{8} = 12.5\\%\\), তাই ক্ষয়প্রাপ্ত অংশ \\(= 100\\% - 12.5\\% = 87.5\\%\\)।"}, {"id": 100, "ch": 9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "নিউক্লিয়াস ও বন্ধন শক্তি", "question": "নিউক্লিয়াসের ব্যাসার্ধ \\(R\\), ভর ত্রুটি \\(\\Delta m\\), বন্ধন শক্তি \\(E\\) এবং প্রতি নিউক্লিয়নে বন্ধন শক্তির সূত্র কী?", "answer": "\\(R = R_0 A^{1/3}\\) [\\(R_0 = 1.2\\times 10^{-15}\\text{ m}\\)]<br>\\(\\Delta m = m_{\\text{nucleus}} - [Zm_p + (A-Z)m_n]\\)<br>বন্ধন শক্তি: \\(E = \\Delta m c^2\\) • প্রতি নিউক্লিয়নে: \\(\\frac{E}{A} = \\frac{\\Delta m c^2}{A}\\)", "context": "<b>প্রতীক:<\/b> \\(A\\) = ভর সংখ্যা, \\(Z\\) = প্রোটন সংখ্যা, \\((A-Z)\\) = নিউট্রন সংখ্যা।<br><b>শর্টকাট:<\/b> \\(1\\text{ amu} \\approx 931.5\\text{ MeV}\\)। প্রতি নিউক্লিয়নে বন্ধন শক্তি যত বেশি, নিউক্লিয়াস তত বেশি স্থায়ী (লোহা \\(\\text{Fe-56}\\) সবচেয়ে স্থায়ী)।", "intuition": "নিউক্লিয়াসের আয়তন এর মোট নিউক্লিয়ন সংখ্যা \\(A\\)-এর সমানুপাতিক হওয়ায় ব্যাসার্ধ \\(R \\propto A^{1/3}\\) হয়, যার ফলে সব নিউক্লিয়াসের ঘনত্ব প্রায় সমান থাকে। প্রোটন ও নিউট্রন মিলে নিউক্লিয়াস গঠনের সময় যে ভর ত্রুটি হয় তা \\(E = \\Delta m c^2\\) অনুযায়ী বন্ধন শক্তিতে রূপান্তরিত হয়ে নিউক্লিয়াসকে দৃঢ়ভাবে ধরে রাখে।", "trap": "নিউক্লিয়াসের স্থায়িত্ব মোট বন্ধন শক্তি \\(E\\) দিয়ে নয় বরং প্রতি নিউক্লিয়নে বন্ধন শক্তি \\(\\frac{E}{A}\\) দিয়ে নির্ধারিত হয়, এবং ভর ত্রুটি \\(\\text{amu}\\) এককে থাকলে \\(931.5 \\text{ MeV}\\) দিয়ে গুণ করতে হয়।", "quickExample": "\\({}^{27}\\text{Al}\\) ও \\({}^{125}\\text{Te}\\) নিউক্লিয়াসের ব্যাসার্ধের অনুপাত \\(\\frac{R_1}{R_2} = \\left(\\frac{27}{125}\\right)^{1/3} = \\frac{3}{5}\\)। আর ভর ত্রুটি \\(\\Delta m = 0.03 \\text{ amu}\\) হলে বন্ধন শক্তি \\(E = 0.03 \\times 931.5 = 27.945 \\text{ MeV}\\)।"}, {"id": 101, "ch": 10, "chapter": "অধ্যায় ১০: সেমিকন্ডাক্টর ও ইলেকট্রনিক্স", "topic": "ডায়োড ও ট্রানজিস্টর", "question": "ডায়োডের গতীয় রোধ \\(R\\), নিঃসারক প্রবাহ \\(I_E\\), প্রবাহ লাভ \\(\\beta\\) এবং প্রবাহ বিবর্ধক গুণক \\(\\alpha\\) এর সূত্র কী?", "answer": "\\(R = \\frac{\\Delta V}{\\Delta I}\\) • \\(I_E = I_B + I_C\\) (\\(\\Delta I_E = \\Delta I_B + \\Delta I_C\\))<br>\\(\\beta = \\frac{I_C}{I_B} = \\frac{\\alpha}{1 - \\alpha}\\) • \\(\\alpha = \\frac{I_C}{I_E} = \\frac{I_C}{I_B + I_C} = \\frac{\\beta}{1 + \\beta}\\)", "context": "<b>প্রতীক:<\/b> \\(I_E\\) = নিঃসারক (Emitter), \\(I_B\\) = পীঠ (Base, সবচেয়ে কম), \\(I_C\\) = সংগ্রাহক (Collector) প্রবাহ।<br><b>মানের সীমা:<\/b> সর্বদা \\(\\alpha \\lt  1\\) (প্রায় \\(0.95\\text{–}0.99\\)) এবং \\(\\beta \\gg 1\\) (সাধারণত \\(20\\text{–}500\\))।", "intuition": "ডায়োডের রোধ ধ্রুব নয় বলে বিভবের ক্ষুদ্র পরিবর্তনের সাপেক্ষে প্রবাহের পরিবর্তনের অনুপাতই এর গতীয় রোধ নির্দেশ করে। আর ট্রানজিস্টরে নিঃসারক থেকে আগত মোট প্রবাহের সামান্য অংশ পীঠে এবং বাকি প্রায় সবটুকুই সংগ্রাহকে পৌঁছায়, যার ফলে পীঠ প্রবাহের অতি ক্ষুদ্র পরিবর্তনে সংগ্রাহক প্রবাহে বিশাল বিবর্ধন ঘটে।", "trap": "ভর্তি পরীক্ষায় \\(I_B\\) প্রায়ই \\(\\mu\\text{A}\\)-এ এবং \\(I_C\\) বা \\(I_E\\) দেওয়া থাকে \\(\\text{mA}\\)-এ—একক না মিলিয়ে সরাসরি যোগ-বিয়োগ বা ভাগ করলে উত্তর \\(1000\\) গুণ ভুল হয়, আবার অনেকেই \\(\\alpha \\lt  1\\) ও \\(\\beta \\gg 1\\)-এর সম্পর্ক উল্টে ফেলেন।", "quickExample": "একটি ট্রানজিস্টরে \\(I_B = 50\\ \\mu\\text{A} = 0.05\\ \\text{mA}\\) এবং \\(I_C = 2.45\\ \\text{mA}\\) হলে নিঃসারক প্রবাহ \\(I_E = 0.05 + 2.45 = 2.50\\ \\text{mA}\\)। এখানে প্রবাহ লাভ \\(\\beta = \\frac{2.45}{0.05} = 49\\) এবং প্রবাহ বিবর্ধক গুণক \\(\\alpha = \\frac{49}{1+49} = 0.98\\)।"}, {"id": 102, "ch": 10, "chapter": "অধ্যায় ১০: সেমিকন্ডাক্টর ও ইলেকট্রনিক্স", "topic": "বুলিয়ান ও ডি-মর্গ্যান", "question": "মৌলিক বুলিয়ান উপপাদ্যসমূহ এবং ডি-মর্গ্যানের উপপাদ্য দুটি কী?", "answer": "বুলিয়ান: \\(A+0=A\\), \\(A+\\bar{A}=1\\), \\(A+A=A\\), \\(A+1=1\\), \\(A\\cdot 1=A\\), \\(A\\cdot\\bar{A}=0\\), \\(A\\cdot A=A\\), \\(A\\cdot 0=0\\)<br>ডি-মর্গ্যান: \\(\\overline{(A+B)} = \\bar{A}\\cdot\\bar{B}\\) এবং \\(\\overline{(A\\cdot B)} = \\bar{A} + \\bar{B}\\)", "context": "<b>প্রয়োগ:<\/b> ডিজিটাল লজিক সার্কিট ও বুলিয়ান ফাংশন সরলীকরণে ব্যবহৃত হয়।<br><b>মনে রাখার উপায়:<\/b> ডি-মর্গ্যানে 'বার ভাঙলে চিহ্ন বদলায়' (Break the bar, change the sign: \\(+\\) হয় \\(\\cdot\\), আর \\(\\cdot\\) হয় \\(+\\))।", "intuition": "বুলিয়ান বীজগণিতে কেবল দুটি অবস্থা (\\(0\\) বা মিথ্যা এবং \\(1\\) বা সত্য) থাকায় যোগ মানে যৌক্তিক OR এবং গুণ মানে যৌক্তিক AND বোঝায়। ডি-মর্গ্যানের উপপাদ্য দেখায় যে কোনো যৌগিক লজিক অপারেশনের সামগ্রিক পূরক নিলে প্রতিটি চলক পূরক হয়ে যায় এবং OR ও AND অপারেশন পরস্পরে রূপান্তরিত হয়।", "trap": "ডি-মর্গ্যানের উপপাদ্যে পূর্ণ বার (\\(\\overline{A+B}\\)) ভাঙার সময় অনেকেই কেবল চলকগুলোর ওপর আলাদা বার বসিয়ে মাঝের \\(+\\) বা \\(\\cdot\\) চিহ্ন পরিবর্তন করতে ভুলে যান, ফলে \\(\\overline{A+B} = \\bar{A}+\\bar{B}\\) লিখে মারাত্মক ভুল করেন।", "quickExample": "\\(Y = \\overline{A \\cdot \\bar{B}} + A\\) সরলীকরণ করলে ডি-মর্গ্যানের সূত্রানুসারে \\(\\overline{A \\cdot \\bar{B}} = \\bar{A} + \\overline{\\bar{B}} = \\bar{A} + B\\)। ফলে \\(Y = \\bar{A} + B + A = (A + \\bar{A}) + B = 1 + B = 1\\)।"}, {"id": 103, "ch": 11, "chapter": "অধ্যায় ১১: জ্যোতির্বিজ্ঞান", "topic": "হাবল, সংকট ঘনত্ব ও শোয়ার্জশিল্ড", "question": "হাবল বিধি, মহাবিশ্বের সংকট ঘনত্ব \\(\\rho_c\\), ঘনত্ব \\(\\rho\\) এবং শোয়ার্জশিল্ড ব্যাসার্ধ \\(R_s\\) এর সূত্র কী?", "answer": "হাবল বিধি: \\(v = Hd\\) [\\(H = 55\\text{ (km/s)/Mpc}\\)]<br>সংকট ঘনত্ব: \\(\\rho_c = \\frac{3H^2}{8\\pi G}\\) • ঘনত্ব: \\(\\rho = \\frac{M}{V} = \\frac{M}{\\frac{4}{3}\\pi R^3}\\) • \\(R_s = \\frac{2GM}{c^2}\\)", "context": "<b>প্রতীক:<\/b> \\(v\\) = গ্যালাক্সির অপসারণ বেগ, \\(d\\) = দূরত্ব, \\(H\\) = হাবল ধ্রুবক, \\(G = 6.673\\times 10^{-11}\\text{ N m}^2\\text{kg}^{-2}\\)।<br><b>ধারণা:<\/b> \\(R_s\\) হলো কৃষ্ণগহ্বরের (Black hole) ঘটনা দিগন্তের ব্যাসার্ধ; মহাবিশ্বের ঘনত্ব \\(\\rho \\gt  \\rho_c\\) হলে তা সংকুচিত হবে।", "intuition": "মহাবিশ্ব ক্রমাগত প্রসারিত হচ্ছে বলেই কোনো গ্যালাক্সি যত দূরে থাকে, তা তত বেশি বেগে আমাদের থেকে দূরে সরে যায় (\\(v = Hd\\)), আর মহাকর্ষীয় টান এই প্রসারণকে থামাতে পারবে কি না তা নির্ধারণ করে সংকট ঘনত্ব \\(\\rho_c\\)। অন্যদিকে, কোনো নক্ষত্রের সমস্ত ভর যদি শোয়ার্জশিল্ড ব্যাসার্ধ \\(R_s\\)-এর ভেতরে সংকুচিত হয়, তবে এর পৃষ্ঠে মুক্তিবেগ আলোর বেগের সমান হয়ে যায় এবং তা কৃষ্ণগহ্বরে পরিণত হয়।", "trap": "শোয়ার্জশিল্ড ব্যাসার্ধের সূত্রে \\(R_s = \\frac{2GM}{c^2}\\) অনেকেই \\(2\\) বা \\(c\\)-এর বর্গ বাদ দিয়ে ভুল করেন, আবার হাবল ধ্রুবক \\(H\\)-এর এসআই একক \\(\\text{s}^{-1}\\) হওয়ায় মহাবিশ্বের বয়স \\(T = \\frac{1}{H}\\) হিসাবের আগে \\(\\text{km}\\) ও \\(\\text{Mpc}\\) একক রূপান্তর না করলে মান সম্পূর্ণ ভুল হয়।", "quickExample": "একটি গ্যালাক্সির দূরত্ব \\(d = 40\\ \\text{Mpc}\\) এবং হাবল ধ্রুবক \\(H = 55\\ \\text{km s}^{-1}\\text{Mpc}^{-1}\\) হলে এর অপসারণ বেগ \\(v = Hd = 55 \\times 40 = 2200\\ \\text{km s}^{-1}\\)। আবার সূর্যের ভর \\(M = 2 \\times 10^{30}\\ \\text{kg}\\) হলে এর শোয়ার্জশিল্ড ব্যাসার্ধ \\(R_s = \\frac{2 \\times 6.67 \\times 10^{-11} \\times 2 \\times 10^{30}}{(3 \\times 10^8)^2} \\approx 2.96\\ \\text{km}\\)।"}, {"id": 104, "ch": 11, "chapter": "অধ্যায় ১১: জ্যোতির্বিজ্ঞান", "topic": "ডপলার, মুক্তিবেগ ও উপগ্রহ", "question": "জ্যোতির্বিজ্ঞানে ডপলারের সমীকরণ, মুক্তিবেগ \\(v_e\\), কৃত্রিম উপগ্রহের বেগ \\(v\\), আবর্তনকাল \\(T\\) ও কেপলারের ৩য় সূত্র কী?", "answer": "ডপলার: \\(\\frac{v}{c} = \\frac{\\Delta l}{l}\\) ুটি শর্ত: (১) আলোকে ঘন মাধ্যম থেকে হালকা মাধ্যমে যেতে হবে, (২) আপতন কোণ \\(i \\gt  C\\) হতে হবে। উদাহরণ: অপটিক্যাল ফাইবার ও মরীচিকা।<br>• সতর্কতা: \\(\\mu \\gt  1\\) হওয়ায় প্রকৃত গভীরতা সবসময় আপাত গভীরতার চেয়ে বেশি হয়।", "intuition": "আলো এক মাধ্যম থেকে অন্য মাধ্যমে গেলে দিক পরিবর্তন করে (প্রতিসরণ)। ঘন মাধ্যমের ভেতরের কোনো বস্তুকে হালকা মাধ্যম থেকে খাড়া নিচে দেখলে প্রকৃত গভীরতার চেয়ে ওপরে দেখা যায়। আবার আলো ঘন থেকে হালকা মাধ্যমে যাওয়ার সময় আপতন কোণ সংকট কোণের বেশি হলে পূর্ণ অভ্যন্তরীণ প্রতিফলন ঘটে।", "trap": "", "quickExample": "<b>প্রশ্ন:<\/b> \\(1.5\\) প্রতিসরাঙ্কের কাঁচের নিচে দাগ উপর থেকে \\(6\\text{ cm}\\) নিচে দেখা যায়। কাঁচের পুরুত্ব কত?<br>• আপাত গভীরতা \\(= 6\\text{ cm}\\); প্রকৃত গভীরতা \\(= \\mu \\times\\) আপাত গভীরতা।<br>• প্রকৃত পুরুত্ব \\(= 1.5 \\times 6 = 9\\text{ cm}\\)।<br><b>উত্তর:<\/b> \\(9\\text{ cm}\\)<br><br><b>প্রশ্ন:<\/b> কাঁচের সংকট কোণ \\(42^\\circ\\) হলে প্রতিসরাঙ্ক কত?<br>• \\(\\sin C = \\frac{1}{\\mu} \\Rightarrow \\mu = \\frac{1}{\\sin 42^\\circ} = \\frac{1}{0.669}\\)<br><b>উত্তর:<\/b> \\(1.49 \\approx 1.5\\)<br><br><b>প্রশ্ন:<\/b> পানির প্রতিসরাঙ্ক \\(\\frac{4}{3}\\)। \\(2\\text{ m}\\) গভীর পুকুরের তলদেশ উপর থেকে কত গভীরে দেখা যাবে?<br>• আপাত গভীরতা \\(=\\) প্রকৃত গভীরতা \\(/ \\mu = \\frac{2}{4/3} = 1.5\\text{ m}\\)<br><b>উত্তর:<\/b> \\(1.5\\text{ m}\\)", "svg": "<svg viewBox=\"0 0 720 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"আপাত গভীরতা এবং পূর্ণ অভ্যন্তরীণ প্রতিফলনের রশ্মি চিত্র\" style=\"width:100%;max-width:720px;height:auto;font-family:sans-serif;\">\n  <defs>\n    <marker id=\"rayArr1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M 0 1 L 10 5 L 0 9 z\" fill=\"#2563eb\"/>\n    <\/marker>\n    <marker id=\"rayArr2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M 0 1 L 10 5 L 0 9 z\" fill=\"#d97706\"/>\n    <\/marker>\n    <mark ্বের চিহ্ন: উত্তল (অভিসারী) লেন্সের \\(f\\) ধনাত্মক; অবতল (অপসারী) লেন্সের \\(f\\) ঋণাত্মক।<br>• আয়না/লেন্স সমীকরণ: \\(\\frac{1}{f} = \\frac{1}{u} + \\frac{1}{v}\\), বিবর্ধন \\(m = \\frac{v}{u} =\\) প্রতিবিম্বের উচ্চতা / বস্তুর উচ্চতা।<br>• লেন্সের ক্ষমতা \\(P = \\frac{1}{f}\\) (যেখানে \\(f\\) মিটারে, একক ডায়প্টার \\(\\text{D}\\))। দুটি লেন্স সংযুক্ত রাখলে তুল্য ক্ষমতা \\(P = P_1 + P_2\\)।<br>• লেন্সকে বেশি প্রতিসরাঙ্কের মাধ্যমে ডোবালে আপেক্ষিক প্রতিসরাঙ্ক কমে বলে ফোকাস দূরত্ব বাড়ে।<br>• সমতল আয়নায় প্রতিবিম্ব অসদ ও সমান আকারের হয়; বস্তু আয়না থেকে \\(d\\) দূরে থাকলে বস্তু ও প্রতিবিম্বের মধ্যবর্তী দূরত্ব \\(2d\\)।", "intuition": "আয়না ও লেন্সের গাণিতিক সমস্যায় বাস্তব-ধনাত্মক চিহ্ন প্রথা সঠিকভাবে প্রয়োগ করলে প্রতিবিম্বের অবস্থান, প্রকৃতি ও বিবর্ধন নির্ভুলভাবে নির্ণয় করা যায়।", "trap": "", "quickExample": "<b>প্রশ্ন:<\/b> \\(20\\text{ cm}\\) ফোকাস দূরত্বের উত্তল লেন্সের সামনে \\(30\\text{ cm}\\) দূরে বস্তু। প্রতিবিম্ব কোথায় ও কত বিবর্ধন?<br>• \\(\\frac{1}{v} = \\frac{1}{f} - \\frac{1}{u} = \\frac{1}{20} - \\frac{1}{30} = \\frac{1}{60}\\)<br>• \\(v = 60\\text{ cm}\\) (বাস্তব, উল্টো)।<br>• \\(m = \\frac{v}{u} = \\frac{60}{30} = 2\\)<br><b>উত্তর:<\/b> \\(v = 60\\text{ cm}\\), দ্বিগুণ বিবর্ধিত বাস্তব উল্টো প্রতিবিম্ব", "svg": "", "isNewPdfSection": true}, {"id": 128, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "ব্যতিচার বনাম অপবর্তন তুলনা ও ইয়ং-এর দ্বি-চিড় পরীক্ষা", "question": "ব্যতিচার বনাম অপবর্তন তুলনা ও ইয়ং-এর দ্বি-চিড় পরীক্ষা", "answer": "পথ পার্থক্য \\(\\Delta = \\left(\\frac{\\lambda}{2\\pi}\\right)\\delta\\)<br>গঠনমূলক: \\(\\Delta = n\\lambda\\) (দশা পার্থক্য \\(2n\\pi\\)); ধ্বংসাত্মক: \\(\\Delta = (2n+1)\\frac{\\lambda}{2}\\)<br>ডোরার প্রস্থ: \\(\\beta = \\frac{\\lambda D}{d}\\); প্রতি একক দৈর্ঘ্যে ডোরার সংখ্যা \\(= \\frac{1}{\\beta} = \\frac{d}{\\lambda D}\\)", "context": "• সুসঙ্গত উৎস: একই কম্পাঙ্ক ও স্থির দশা পার্থক্যের উৎস। অসংসক্ত দুটি বাল্বের আলোতে দশা পার্থক্য দ্রুত পরিবর্তিত হওয়ায় ব্যতিচার দেখা যায় না।<br>• \\(D/d\\) অনুপাত স্থির রাখলে ডোরা-প্রস্থ \\(\\beta\\) ও প্রতি একক দৈর্ঘ্যে ডোরার সংখ্যা \\(1/\\beta\\) স্থির থাকে (\\(d \\to 2d\\) করলে \\(D \\to 2D\\))।<br>• কম্পাঙ্ক \\(f\\) দ্বিগুণ করলে \\(\\lambda = c/f\\) অর্ধেক হয়, ফলে ডোরার প্রস্থ \\(\\beta\\) অর্ধেক হয়; লাল থেকে নীল আলোয় গেলে ডোরা সরু হয়।<br>• সাদা আলোতে ইয়ংয়ের পরীক্ষায় কেন্দ্রীয় ডোরা সাদা এবং পাশে রঙিন ডোরা গঠিত হয়; সাবানের ফেনার রঙ পাতলা পর্দার ব্যতিচারের ফল।<br><div class=\"overflow-x-auto mt-2\"><table class=\"w-full text-xs border-collapse bg-white dark:bg-slate-900 rounded-lg overflow-hidden\"><thead><tr class=\"bg-slate-100 dark:bg-slate-800\"><th class=\"px-2.5 py-1.5 text-left font-bold border-b border-slate-200 dark:border-slate-700\">বৈশিষ্ট্য<\/th><th class=\"px-2.5 py-1.5 text-left font-bold border-b border-slate-200 dark:border-slate-700\">ব্যতিচার<\/th><th class=\"px-2.5 py-1.5 text-left font-bold border-b border-slate-200 dark:border-slate-700\">অপবর্তন<\/th><\/tr><\/thead><tbody><tr><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">উৎস<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">দুটি সুসঙ্গত উৎস<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">একই তরঙ্গফ্রন্টের বিভিন্ন অংশ<\/td><\/tr><tr><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">ডোরার প্রস্থ<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">সমান<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">অসমান (কেন্দ্রীয় ডোরা চওড়া)<\/td><\/tr><tr><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">তীব্রতা<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">সব উজ্জ্বল ডোরার তীব্রতা প্রায় সমান<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">ক্রমশ কমে<\/td><\/tr><\/tbody><\/table><\/div>", "intuition": "দুটি সুসঙ্গত উৎসের (একই কম্পাঙ্ক ও স্থির দশা পার্থক্য) আলো মিলিত হয়ে উজ্জ্বল (গঠ     // =========================================================================
    // 2. COURSE STRUCTURE BUILDER (Chapters -> Micro-Lessons + Boss Quiz)
    // =========================================================================
    function buildCourse() {
      const chapters = [];
      for (const meta of CHAPTER_META) {
        const chFormulas = FORMULAS.filter(f => f.ch === meta.num);
        const fullTitle = chFormulas[0] ? chFormulas[0].chapter : `অধ্যায় ${meta.num}: ${meta.short}`;
        const lessons = [];
        const chunkSize = 4;
        let part = 1;
        for (let i = 0; i < chFormulas.length; i += chunkSize) {
          let slice = chFormulas.slice(i, i + chunkSize);
          if (slice.length === 1 && lessons.length > 0) {
            lessons[lessons.length - 1].formulaIds.push(slice[0].id);
            lessons[lessons.length - 1].topics.push(slice[0].topic);
            continue;
          }
          lessons.push({
            id: `ch${meta.num}_l${part}`,
            ch: meta.num,
            type: 'lesson',
            number: `${meta.num}.${part}`,
            title: slice[0].topic + (slice.length > 1 ? ` ও আরও ${slice.length - 1}টি` : ''),
            formulaIds: slice.map(x => x.id),
            topics: slice.map(x => x.topic),
            xpReward: slice.length * 10 + 15
          });
          part++;
        }
        lessons.push({
          id: `ch${meta.num}_boss`,
          ch: meta.num,
          type: 'boss',
          number: `🏆`,
          title: `অধ্যায় ${toBnNum(meta.num)} বস কুইজ`,
          formulaIds: chFormulas.map(x => x.id),
          topics: ['সম্পূর্ণ অধ্যায় রিভিউ'],
          xpReward: 50
        });
        chapters.push({
          ...meta,
          fullTitle,
          formulaIds: chFormulas.map(x => x.id),
          lessons
        });
      }
      return chapters;
    }

    function toBnNum(n) {
      const d = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
      return String(n).replace(/\d/g, x => d[Number(x)]);
    }

    const COURSE = buildCourse();
    const ALL_LESSONS = COURSE.flatMap(c => c.lessons);

    // =========================================================================

    const STORAGE_KEY = 'physics2_sololearn_v1';
    const DEFAULT_STATE = {
      xp: 0,
      streak: 0,
      lastStudyDate: null,
      hearts: 5,
      unlimitedHearts: false,
      soundEnabled: true,
      darkMode: false,
      completedLessons: {},
      formulaStats: {},
      blitzHighScore: 0,
      matchBestTime: null,
      totalAnswered: 0,
      totalCorrect: 0,
      expandedChapters: { 1: true }
    };

    let state = loadState();
    let currentTab = 'learn';
    let vaultState = { search: '', chapter: 0, filter: 'all', hideFormulas: false, revealed: {}, expandedDetails: {} };
    let practiceMode = 'hub';
    let activeSandbox = 'temp';
    let blitzTimer = null;
    let matchTimer = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        return { ...JSON.parse(JSON.stringify(DEFAULT_STATE)), ...parsed };
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function getFormulaStat(id) {
      if (!state.formulaStats[id]) {
        state.formulaStats[id] = { seen: 0, correct: 0, wrong: 0, mastery: 0, nextReview: 0, bookmarked: false };
      }
      return state.formulaStats[id];
    }

    function recordAnswer(formulaId, isCorrect) {
      const st = getFormulaStat(formulaId);
      st.seen = (st.seen || 0) + 1;
      state.totalAnswered = (state.totalAnswered || 0) + 1;
      const now = Date.now();
      if (isCorrect) {
        st.correct = (st.correct || 0) + 1;
        state.totalCorrect = (state.totalCorrect || 0) + 1;
        st.mastery = Math.min(3, (st.mastery || 0) + 1);
        const intervals = [10 * 60e3, 6 * 3600e3, 24 * 3600e3, 72 * 3600e3];
        st.nextReview = now + intervals[st.mastery];
      } else {
        st.wrong = (st.wrong || 0) + 1;
        st.mastery = Math.max(0, (st.mastery || 0) - 1);
        st.nextReview = now + 2 * 60e3;
      }
      touchStreak();
      saveState();
    }

    function touchStreak() {
      const today = new Date().toISOString().slice(0, 10);
      if (state.lastStudyDate === today) return;
      if (state.lastStudyDate) {
        const prev = new Date(state.lastStudyDate);
        const curr = new Date(today);
        const diffDays = Math.round((curr - prev) / 86400000);
        state.streak = diffDays === 1 ? (state.streak || 0) + 1 : 1;
      } else {
        state.streak = 1;
      }
      state.lastStudyDate = today;
    }

    function addXp(amount) {
      state.xp = (state.xp || 0) + amount;
      saveState();
      updateHud();
      const xpEl = document.getElementById('hud-xp');
      if (xpEl) {

    // =========================================================================
    // 4. SOUND EFFECTS (Web Audio API)
    // =========================================================================
    let audioCtx = null;
    function playTone(type) {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const playNote = (freq, start, dur, wave = 'sine', gainVal = 0.12) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(gainVal, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + dur);
        };
        if (type === 'correct') {
          playNote(587.33, now, 0.12, 'triangle', 0.14);
          playNote(880, now + 0.09, 0.2, 'triangle', 0.14);
        } else if (type === 'wrong') {
          playNote(240, now, 0.16, 'sawtooth', 0.09);
          playNote(180, now + 0.12, 0.22, 'sawtooth', 0.08);
        } else if (type === 'complete') {
          playNote(523.25, now, 0.13, 'triangle', 0.14);
          playNote(659.25, now + 0.1, 0.13, 'triangle', 0.14);
          playNote(783.99, now + 0.2, 0.16, 'triangle', 0.14);
          playNote(1046.5, now + 0.32, 0.32, 'triangle', 0.16);
        } else if (type === 'tap') {
          playNote(440, now, 0.05, 'sine', 0.06);
        }
      } catch (e) {}
    }

    // =========================================================================
    // 5. KATEX RENDERING HELPER & UTILITIES
    // =========================================================================
    function renderMath(el) {
      if (!el) return;
      if (typeof renderMathInElement === 'function') {
        try {
          renderMathInElement(el, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '\\[', right: '\\]', display: true },
              { left: '\\(', right: '\\)', display: false },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false,
            strict: false,
            ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'svg'],
            macros: {
              '\\AA': '\\text{Å}'
            }
          });
          return;
        } catch (e) {}
      }
      if (typeof katex !== 'undefined' && typeof katex.renderToString === 'function') {
        try {
          const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
          const nodes = [];
          let n;
          while ((n = walker.nextNode())) {
            if (!n.parentElement) continue;
            const tag = n.parentElement.tagName;
            if (['SCRIPT','STYLE','TEXTAREA','PRE','CODE','SVG'].includes(tag) || n.parentElement.closest('.katex, svg')) continue;
            if (/\\\(|\$\$|\\\[/.test(n.nodeValue)) nodes.push(n);
          }
          nodes.forEach(node => {
            const span = document.createElement('span');
            span.innerHTML = node.nodeValue.replace(/\$\$([\s\S]*?)\$\$|\\\[([\s\S]*?)\\\]|\\\(([\s\S]*?)\\\)/g, (m, d1, d2, i1) => {
              const tex = d1 !== undefined ? d1 : (d2 !== undefined ? d2 : i1);
              const displayMode = i1 === undefined;
              try {
                return katex.renderToString(tex, { displayMode, throwOnError: false, strict: false, macros: { '\\AA': '\\text{Å}' } });
              } catch (e) { return m; }
            });
            node.parentNode.replaceChild(span, node);
          });
        } catch (e) {}
      }
    }

      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

      }

    function getRankInfo(xp) {
      const ranks = [
        { name: 'নবীন পদার্থবিদ', min: 0, max: 150, badge: '🌱' },
        { name: 'সূত্র অন্বেষী', min: 150, max: 400, badge: '🔭' },
        { name: 'ল্যাব এক্সপ্লোরার', min: 400, max: 800, badge: '⚗️' },
        { name: 'সূত্র বিশারদ', min: 800, max: 1400, badge: '⚡' },
        { name: 'কোয়ান্টাম মাস্টার', min: 1400, max: 2200, badge: '⚛️' },
        { name: 'পদার্থবিজ্ঞান কিংবদন্তি', min: 2200, max: 99999, badge: '👑' }
      ];
      for (let i = 0; i < ranks.length; i++) {
        if (xp < ranks[i].max || i === ranks.length - 1) {
          const level = i + 1;
          const pct = i === ranks.length - 1 ? 100 : Math.min(100, Math.round(((xp - ranks[i].min) / (ranks[i].max - ranks[i].min)) * 100));
          return { ...ranks[i], level, pct };
        }
      }
      return { ...ranks[0], level: 1, pct: 0 };
    }

    function getMasteredCount() {
      return FORMULAS.filter(f => (state.formulaStats[f.id]?.mastery || 0) >= 2).length;
    }

    function getDueFormulas() {
      const now = Date.now();
      return FORMULAS.filter(f => {
        const st = state.formulaStats[f.id];
        if (!st) return false;
        return (st.wrong > 0 && st.mastery < 2) || (st.nextReview > 0 && st.nextReview <= now && st.mastery < 3);
      });
    }

    function getNextRecommendedLesson() {
      for (const l of ALL_LESSONS) {
        if (!state.completedLessons[l.id]) return l;
      }
      return ALL_LESSONS[0];

    function pickDistractors(targetFormula, count = 3) {
      let pool = FORMULAS.filter(f => f.id !== targetFormula.id && f.ch === targetFormula.ch);
      if (pool.length < count) {
        const extra = FORMULAS.filter(f => f.id !== targetFormula.id && f.ch !== targetFormula.ch);
        pool = pool.concat(shuffle(extra));
      }
      return shuffle(pool).slice(0, count);
    }

    function buildHandcraftedQuizObj(hq) {
      const formula = FORMULAS[hq.formulaId] || FORMULAS[0];
      const indexedOpts = hq.options.map((txt, idx) => ({
        text: txt,
        correct: idx === hq.correctIndex
      }));
      const shuffledOpts = shuffle(indexedOpts);
      const tInfo = TYPE_LABELS[hq.type] || TYPE_LABELS.concept;
      const dInfo = DIFF_LABELS[hq.difficulty] || DIFF_LABELS.medium;
      return {
        kind: 'handcrafted',
        formulaId: formula.id,
        badge: tInfo.text,
        badgeCls: tInfo.cls,
        diffText: dInfo.text,
        diffCls: dInfo.cls,
        promptHtml: `<div class="text-xs font-bold uppercase tracking-wider text-[#2493DF] mb-1">${formula.topic}</div>
          <div class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-snug math-scroll">${hq.question}</div>
          ${hq.svg ? `<div class="mt-2">${hq.svg}</div>` : ''}`,
        options: shuffledOpts.map(o => ({
          html: `<div class="math-scroll py-0.5">${o.text}</div>`,
          correct: o.correct
        })),
        explanation: hq.explanation,
        formula
      };
    }

    function buildQuizQuestion(formula, preferredIdx = null, forceAuto = false) {
      const hqList = QUIZZES_BY_FORMULA[formula.id];
      if (!forceAuto && hqList && hqList.length > 0) {
        const chosen = preferredIdx !== null ? hqList[preferredIdx % hqList.length] : hqList[Math.floor(Math.random() * hqList.length)];
        return buildHandcraftedQuizObj(chosen);
      }

      const distractors = pickDistractors(formula, 3);
      const allOpts = shuffle([formula, ...distractors]);
      return {
        kind: 'formula_mcq',
        formulaId: formula.id,
        badge: 'সঠিক সূত্র বাছাই',
        badgeCls: 'bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300',

          html: `<div class="math-scroll py-0.5">${o.answer}</div>`,
          correct: o.id === formula.id
        })),
        explanation: formula.context,
        formula
      };
    }

    // =========================================================================
    // 9. SOLOLEARN INTERACTIVE LESSON RUNNER
    // =========================================================================
    let activeLesson = null;

    function buildLessonSteps(lesson) {
      const fList = lesson.formulaIds.map(id => FORMULAS[id]);
      const steps = [];
      const chGudPool = HANDCRAFTED_QUIZZES.filter(q => q.ch === lesson.ch && (q.type === 'graph' || q.type === 'unit_dim'));
      if (lesson.type === 'boss') {
        const normalPool = shuffle(fList.flatMap(f => (QUIZZES_BY_FORMULA[f.id] || []).filter(q => q.type !== 'graph' && q.type !== 'unit_dim')));
        const gudPick = shuffle(chGudPool).slice(0, 2);
        const count = Math.min(8, Math.max(5, normalPool.length + gudPick.length));
        const usedQs = shuffle([...gudPick, ...normalPool.slice(0, Math.max(0, count - gudPick.length))]);
        usedQs.forEach(hq => steps.push({ type: 'quiz', quiz: buildHandcraftedQuizObj(hq) }));
        return steps;
      }

      for (let i = 0; i < fList.length; i += 2) {
        const pair = fList.slice(i, i + 2);
        pair.forEach(f => steps.push({ type: 'learn', formula: f }));
        pair.forEach(f => {
          steps.push({ type: 'quiz', quiz: buildQuizQuestion(f, 0) });
        });
      }
      // Bonus Graph / Unit & Dimension DU Blitz question for this lesson/chapter
      const lessonGud = fList.flatMap(f => (QUIZZES_BY_FORMULA[f.id] || []).filter(q => q.type === 'graph' || q.type === 'unit_dim'));
      const bonusGudPool = lessonGud.length ? lessonGud : chGudPool;
      if (bonusGudPool.length) {
        const pickedGud = bonusGudPool[Math.floor(Math.random() * bonusGudPool.length)];
        steps.push({ type: 'quiz', quiz: buildHandcraftedQuizObj(pickedGud) });
      } else if (fList.length >= 2) {
        const bonusF = fList[Math.floor(Math.random() * fList.length)];
        steps.push({ type: 'quiz', quiz: buildQuizQuestion(bonusF, 1) });
      }
      return steps;
    }

    function startLesson(lessonId) {
      const lesson = ALL_LESSONS.find(l => l.id === lessonId);
      if (!lesson) return;
      if (!state.unlimitedHearts && state.hearts <= 0) {
        openModal(
          'হার্ট শেষ হয়ে গেছে ❤️',
          'আপনার ৫টি হার্ট শেষ হয়ে গেছে। ফ্রি প্র্যাকটিস মোডে হার্ট রিফিল করে এখনই শেখা চালিয়ে যেতে পারেন!',
          [
            { label: 'বাতিল' },
            {
              label: 'হার্ট রিফিল করুন (৫ ❤️)',
              cls: 'px-4 py-2 rounded-xl text-sm font-bold bg-[#2493DF] text-white hover:bg-[#1B76B8]',
              onClick: () => { state.hearts = 5; saveState(); updateHud(); startLesson(lessonId); }
            }
          ]
        );
        return;
      }

      playTone('tap');
      activeLesson = {
        lesson,
        steps: buildLessonSteps(lesson),
        idx: 0,
        selectedOptionIdx: null,
        checked: false,
        lastCorrect: false,
        quizTotal: 0,
        quizCorrect: 0,
        xpEarned: 0,
        finished: false
      };

          });

          const disabled = activeLesson.selectedOptionIdx === null;
          footerInner.innerHTML = `
            <div class="flex justify-end">

    function checkLessonAnswer() {
      if (!activeLesson || activeLesson.checked || activeLesson.selectedOptionIdx === null) return;
      const step = activeLesson.steps[activeLesson.idx];
      const opt = step.quiz.options[activeLesson.selectedOptionIdx];
      activeLesson.checked = true;
      activeLesson.lastCorrect = !!opt.correct;
      recordAnswer(step.quiz.formulaId, opt.correct);

      if (opt.correct) {
        playTone('correct');
        activeLesson.quizCorrect++;
        activeLesson.xpEarned += 10;
        addXp(10);
      } else {
        playTone('wrong');
        if (!state.unlimitedHearts) {
          state.hearts = Math.max(0, state.hearts - 1);
          saveState();
          updateHud();
        }
      }
      renderLessonStep();
    }

    function advanceLessonStep() {
      if (!activeLesson) return;
      if (!state.unlimitedHearts && state.hearts <= 0 && !activeLesson.finished) {
        openModal(
          'হার্ট শেষ! ❤️',
          'আপনার সব হার্ট শেষ হয়ে গেছে। চিন্তা নেই—এখনই ফ্রি রিফিল করে লেসনটি শেষ করুন!',
          [
            { label: 'লেসন থেকে বের হন', onClick: closeLessonOverlay },
            {
              label: 'ফ্রি রিফিল করে চালিয়ে যান',
              cls: 'px-4 py-2 rounded-xl text-sm font-bold bg-[#2493DF] text-white',
              onClick: () => { state.hearts = 5; saveState(); updateHud(); renderLessonStep(); }
            }
          ]
        );
        return;
      }

      if (activeLesson.idx + 1 >= activeLesson.steps.length) {
        finishLesson();
      } else {
        activeLesson.idx++;
        activeLesson.selectedOptionIdx = null;
        activeLesson.checked = false;
        activeLesson.lastCorrect = false;
        renderLessonStep();
        document.getElementById('lesson-body').scrollTop = 0;
      }
    }

    function finishLesson() {
      activeLesson.finished = true;
      const acc = activeLesson.quizTotal > 0 ? Math.round((activeLesson.quizCorrect / activeLesson.quizTotal) * 100) : 100;
      const stars = acc >= 90 ? 3 : (acc >= 70 ? 2 : 1);
      const bonusXp = activeLesson.lesson.xpReward;
      activeLesson.xpEarned += bonusXp;
      addXp(bonusXp);

      const prev = state.completedLessons[activeLesson.lesson.id];
      state.completedLessons[activeLesson.lesson.id] = {
        stars: prev ? Math.max(prev.stars, stars) : stars,
        bestAccuracy: prev ? Math.max(prev.bestAccuracy, acc) : acc,
        completedAt: Date.now()
      };
      if (activeLesson.lesson.type === 'boss' && activeLesson.lesson.ch < 11) {
        state.expandedChapters[activeLesson.lesson.ch + 1] = true;
      }
      saveState();
      playTone('complete');
      try {
        if (typeof confetti === 'function') {
          confetti({ particleCount: 70, spread: 65, origin: { y: 0.6 } });
        }
      } catch (e) {}
      renderLessonStep();
    }

      wrap.innerHTML = `

        </div>
      `;

      if (nextLes) {
        document.getElementById('les-done-next').addEventListener('click', () => startLesson(nextLes.id));
      }

      return items;

                  <span class="font-extrabold text-[#2493DF]">💡 সমাধান:</span> ${q.solution || 'সঠিক উত্তরটি উপরে চিহ্নিত করা হয়েছে।'}
                </div>
                <div class="flex justify-end">

      }));
      main.querySelectorAll('[data-dudrill]').forEach(b => b.addEventListener('click', () => {

    // --- 10-0B. GRAPH, UNIT & DIMENSION BLITZ ---
    let gudState = { filter: 'all', idx: 0, correct: 0, wrong: 0, streak: 0, answered: false, picked: null, pool: [] };

      if (filter === 'unit_dim') list = list.filter(q => q.type === 'unit_dim');
      return shuffle(list);
    }

    // --- 10A. 60s RAPID BLITZ ---
    function renderBlitzGame() {
      const main = document.getElementById('app-main');
      let timeLeft = 60;
      let score = 0;
      let combo = 0;
      let answered = 0;
      let right = 0;
      let currentQ = null;
      let locked = false;

      function nextQ() {
        locked = false;
        const hq = HANDCRAFTED_QUIZZES[Math.floor(Math.random() * HANDCRAFTED_QUIZZES.length)];
        currentQ = buildHandcraftedQuizObj(hq);
        draw();
      }

      function draw() {
        const mult = combo >= 5 ? 3 : (combo >= 3 ? 2 : 1);
        main.innerHTML = `
          <div class="max-w-2xl mx-auto">
            <div class="flex items-center justify-between gap-2 mb-4">
              <button id="blitz-back" class="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold">← ফিরে যান</button>
              <div class="flex items-center gap-2">
                <span class="px-3 py-1 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300 text-xs font-extrabold">স্কোর: ${toBnNum(score)} ${mult > 1 ? `(${mult}×)` : ''}</span>
                <span id="blitz-clock" class="px-3 py-1 rounded-full ${timeLeft <= 10 ? 'bg-rose-500 text-white animate-pulse' : 'bg-slate-900 dark:bg-white text-white dark:text-slate-900'} text-xs font-extrabold">⏱ ${toBnNum(timeLeft)}s</span>
              </div>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm mb-3">
              ${currentQ.promptHtml}
            </div>

            <div class="space-y-2.5">
              ${currentQ.options.map((opt, idx) => `
                <button data-bopt="${idx}" class="w-full text-left p-3.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-[#2493DF] transition flex items-center gap-3">
                  <span class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-xs font-extrabold shrink-0">${toBnNum(idx + 1)}</span>
                  <div class="flex-1 min-w-0 text-sm">${opt.html}</div>
                </button>
              `).join('')}
            </div>
          </div>
        `;
        renderMath(main);

        document.getElementById('blitz-back').addEventListener('click', () => {
          practiceMode = 'hub';
          renderPracticeView();
        });

        main.querySelectorAll('[data-bopt]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (locked) return;
            locked = true;
            const opt = currentQ.options[Number(btn.dataset.bopt)];
            answered++;
            recordAnswer(currentQ.formulaId, opt.correct);
            if (opt.correct) {
              playTone('correct');
              combo++;
              right++;
              const m = combo >= 5 ? 3 : (combo >= 3 ? 2 : 1);
              score += 10 * m;
              btn.classList.add('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-950/50');
            } else {
              playTone('wrong');
              combo = 0;
              btn.classList.add('border-rose-500', 'bg-rose-50', 'dark:bg-rose-950/50', 'animate-shake');
            }
            setTimeout(() => { if (timeLeft > 0) nextQ(); }, 320);
          });
        });
      }

      function endBlitz() {
        clearPracticeTimers();
        const isRecord = score > (state.blitzHighScore || 0);
        if (isRecord) state.blitzHighScore = score;
        const xpGain = Math.max(10, Math.round(score / 3));
        addXp(xpGain);
        playTone('complete');
        main.innerHTML = `
          <div class="max-w-md mx-auto bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 text-center shadow-sm animate-pop">
            <div class="text-5xl mb-2">${isRecord ? '🏆' : '⚡'}</div>
            <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white">সময় শেষ!</h2>
            ${isRecord ? '<div class="text-xs font-extrabold text-amber-500 mt-1">নতুন ব্যক্তিগত রেকর্ড!</div>' : ''}
            <div class="grid grid-cols-3 gap-2.5 my-5">
              <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800">
                <div class="text-xs text-slate-400">স্কোর</div>
                <div class="text-xl font-extrabold text-amber-500">${toBnNum(score)}</div>
              </div>
              <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800">
                <div class="text-xs text-slate-400">সঠিক</div>
                <div class="text-xl font-extrabold text-emerald-500">${toBnNum(right)}/${toBnNum(answered)}</div>
              </div>
              <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800">
                <div class="text-xs text-slate-400">XP</div>
                <div class="text-xl font-extrabold text-[#2493DF]">+${toBnNum(xpGain)}</div>
              </div>
            </div>
            <div class="flex gap-2.5">
              <button id="blitz-exit" class="flex-1 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm">অ্যারেনা</button>
              <button id="blitz-again" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-white font-bold text-sm">আবার খেলুন</button>
            </div>
          </div>
        `;
        document.getElementById('blitz-exit').addEventListener('click', () => { practiceMode = 'hub'; renderPracticeView(); });
        document.getElementById('blitz-again').addEventListener('click', () => renderBlitzGame());
      }

      nextQ();
      blitzTimer = setInterval(() => {
        timeLeft--;
        const cl = document.getElementById('blitz-clock');
        if (cl) cl.textContent = `⏱ ${toBnNum(Math.max(0, timeLeft))}s`;
        if (timeLeft <= 0) endBlitz();
      }, 1000);
    }

    // --- 10B. SMART SRS WEAK-SPOT DRILL ---
    function renderSrsDrill() {
      const due = getDueFormulas();
      const queue = due.length > 0 ? shuffle(due).slice(0, 8) : shuffle(FORMULAS).slice(0, 8);
      const isWeakMode = due.length > 0;
      let idx = 0, correctCount = 0, selected = null, checked = false;
      let q = buildQuizQuestion(queue[0]);

      function draw() {
        const main = document.getElementById('app-main');
        if (idx >= queue.length) {
          const xpGain = correctCount * 10 + 15;
          addXp(xpGain);
          playTone('complete');
          main.innerHTML = `
