    // --- 10A. 60s RAPID BLITZ ---
    function renderBlitzGame() {
      const main = document.getElementById('app-main');
      let timeLeft = 60;
      let score = 0;
      let combo = 0;
      let answered = 0;
      let right = 0;
      let currentQ = null;
      let locked = false;

      function nextQ() {
        locked = false;
        const hq = HANDCRAFTED_QUIZZES[Math.floor(Math.random() * HANDCRAFTED_QUIZZES.length)];
        currentQ = buildHandcraftedQuizObj(hq);
        draw();
      }

      function draw() {
        const mult = combo >= 5 ? 3 : (combo >= 3 ? 2 : 1);
        main.innerHTML = `
          <div class="max-w-2xl mx-auto">
            <div class="flex items-center justify-between gap-2 mb-4">
              <button id="blitz-back" class="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold">← ফিরে যান</button>
              <div class="flex items-center gap-2">
                <span class="px-3 py-1 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300 text-xs font-extrabold">স্কোর: ${toBnNum(score)} ${mult > 1 ? `(${mult}×)` : ''}</span>
                <span id="blitz-clock" class="px-3 py-1 rounded-full ${timeLeft <= 10 ? 'bg-rose-500 text-white animate-pulse' : 'bg-slate-900 dark:bg-white text-white dark:text-slate-900'} text-xs font-extrabold">⏱ ${toBnNum(timeLeft)}s</span>
              </div>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm mb-3">
              ${currentQ.promptHtml}
            </div>

            <div class="space-y-2.5">
              ${currentQ.options.map((opt, idx) => `
                <button data-bopt="${idx}" class="w-full text-left p-3.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-[#2493DF] transition flex items-center gap-3">
                  <span class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-xs font-extrabold shrink-0">${toBnNum(idx + 1)}</span>
                  <div class="flex-1 min-w-0 text-sm">${opt.html}</div>
                </button>
              `).join('')}
            </div>
          </div>
        `;
        renderMath(main);

        document.getElementById('blitz-back').addEventListener('click', () => {
          practiceMode = 'hub';
          renderPracticeView();
        });

        main.querySelectorAll('[data-bopt]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (locked) return;
            locked = true;
            const opt = currentQ.options[Number(btn.dataset.bopt)];
            answered++;
            recordAnswer(currentQ.formulaId, opt.correct);
            if (opt.correct) {
              playTone('correct');
              combo++;
              right++;
              const m = combo >= 5 ? 3 : (combo >= 3 ? 2 : 1);
              score += 10 * m;
              btn.classList.add('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-950/50');
            } else {
              playTone('wrong');
              combo = 0;
              btn.classList.add('border-rose-500', 'bg-rose-50', 'dark:bg-rose-950/50', 'animate-shake');
            }
            setTimeout(() => { if (timeLeft > 0) nextQ(); }, 320);
          });
        });
      }

      function endBlitz() {
        clearPracticeTimers();
        const isRecord = score > (state.blitzHighScore || 0);
        if (isRecord) state.blitzHighScore = score;
        const xpGain = Math.max(10, Math.round(score / 3));
        addXp(xpGain);
        playTone('complete');
        main.innerHTML = `
          <div class="max-w-md mx-auto bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 text-center shadow-sm animate-pop">
            <div class="text-5xl mb-2">${isRecord ? '🏆' : '⚡'}</div>
            <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white">সময় শেষ!</h2>
            ${isRecord ? '<div class="text-xs font-extrabold text-amber-500 mt-1">নতুন ব্যক্তিগত রেকর্ড!</div>' : ''}
            <div class="grid grid-cols-3 gap-2.5 my-5">
              <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800">
                <div class="text-xs text-slate-400">স্কোর</div>
                <div class="text-xl font-extrabold text-amber-500">${toBnNum(score)}</div>
              </div>
              <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800">
                <div class="text-xs text-slate-400">সঠিক</div>
                <div class="text-xl font-extrabold text-emerald-500">${toBnNum(right)}/${toBnNum(answered)}</div>
              </div>
              <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800">
                <div class="text-xs text-slate-400">XP</div>
                <div class="text-xl font-extrabold text-[#2493DF]">+${toBnNum(xpGain)}</div>
              </div>
            </div>
            <div class="flex gap-2.5">
              <button id="blitz-exit" class="flex-1 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm">অ্যারেনা</button>
              <button id="blitz-again" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-white font-bold text-sm">আবার খেলুন</button>
            </div>
          </div>
        `;
        document.getElementById('blitz-exit').addEventListener('click', () => { practiceMode = 'hub'; renderPracticeView(); });
        document.getElementById('blitz-again').addEventListener('click', () => renderBlitzGame());
      }

      nextQ();
      blitzTimer = setInterval(() => {
        timeLeft--;
        const cl = document.getElementById('blitz-clock');
        if (cl) cl.textContent = `⏱ ${toBnNum(Math.max(0, timeLeft))}s`;
        if (timeLeft <= 0) endBlitz();
      }, 1000);
    }

    // --- 10B. SMART SRS WEAK-SPOT DRILL ---
    function renderSrsDrill() {
      const due = getDueFormulas();
      const queue = due.length > 0 ? shuffle(due).slice(0, 8) : shuffle(FORMULAS).slice(0, 8);
      const isWeakMode = due.length > 0;
      let idx = 0, correctCount = 0, selected = null, checked = false;
      let q = buildQuizQuestion(queue[0]);

      function draw() {
        const main = document.getElementById('app-main');
        if (idx >= queue.length) {
          const xpGain = correctCount * 10 + 15;
          addXp(xpGain);
          playTone('complete');
          main.innerHTML = `
            <div class="max-w-md mx-auto bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 text-center shadow-sm animate-pop">
              <div class="text-5xl mb-2">🧠</div>
              <h2 class="text-2xl font-extrabold">রিভিউ সেশন সম্পন্ন!</h2>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">সঠিক উত্তর: ${toBnNum(correctCount)} / ${toBnNum(queue.length)} · +${toBnNum(xpGain)} XP</p>
              <div class="flex gap-2.5 mt-5">
                <button id="srs-home" class="flex-1 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm">অ্যারেনা</button>
                <button id="srs-more" class="flex-1 py-2.5 rounded-xl bg-rose-500 text-white font-bold text-sm">আরও রিভিউ</button>
              </div>
            </div>
          `;
          document.getElementById('srs-home').addEventListener('click', () => { practiceMode = 'hub'; renderPracticeView(); });
          document.getElementById('srs-more').addEventListener('click', () => renderSrsDrill());
          return;
        }

        main.innerHTML = `
          <div class="max-w-2xl mx-auto">
            <div class="flex items-center justify-between mb-4">
              <button id="srs-back" class="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold">← ফিরে যান</button>
              <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-300">
                ${isWeakMode ? 'দুর্বল সূত্র রিভিউ' : 'স্মার্ট মিক্সড ড্রিল'} · ${toBnNum(idx + 1)}/${toBnNum(queue.length)}
              </span>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm mb-3">
              ${q.promptHtml}
            </div>

            <div class="space-y-2.5 mb-4">
              ${q.options.map((opt, oIdx) => {
                let cls = 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-[#2493DF]';
                if (checked) {
                  if (opt.correct) cls = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50';
                  else if (selected === oIdx) cls = 'border-rose-500 bg-rose-50 dark:bg-rose-950/50';
                } else if (selected === oIdx) {
                  cls = 'border-[#2493DF] bg-sky-50 dark:bg-sky-950/40';
                }
                return `
                  <button data-sopt="${oIdx}" ${checked ? 'disabled' : ''} class="w-full text-left p-3.5 rounded-xl border-2 transition flex items-center gap-3 ${cls}">
                    <span class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-xs font-extrabold shrink-0">${toBnNum(oIdx + 1)}</span>
                    <div class="flex-1 min-w-0 text-sm">${opt.html}</div>
                  </button>
                `;
              }).join('')}
            </div>

            ${checked ? `
              <div class="p-4 rounded-xl mb-4 text-sm ${q.options[selected].correct ? 'bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-300' : 'bg-rose-50 dark:bg-rose-950/50 border border-rose-300'}">
                <div class="font-bold mb-1">${q.options[selected].correct ? '✅ দারুণ! পরবর্তী রিভিউ সময় বাড়ানো হয়েছে।' : '❌ আবার মনে রাখুন — সমাধান:'}</div>
                <div class="math-scroll">${q.explanation || q.formula.context}</div>
              </div>
              <button id="srs-next" class="w-full py-3 rounded-xl bg-[#2493DF] text-white font-extrabold text-sm">পরবর্তী →</button>
            ` : `
              <button id="srs-check" ${selected === null ? 'disabled' : ''} class="w-full py-3 rounded-xl font-extrabold text-sm ${selected === null ? 'bg-slate-200 dark:bg-slate-800 text-slate-400' : 'bg-rose-500 hover:bg-rose-600 text-white'}">উত্তর যাচাই করুন</button>
            `}
          </div>
        `;
        renderMath(main);

        document.getElementById('srs-back').addEventListener('click', () => { practiceMode = 'hub'; renderPracticeView(); });
        if (!checked) {
          main.querySelectorAll('[data-sopt]').forEach(btn => {
            btn.addEventListener('click', () => { selected = Number(btn.dataset.sopt); draw(); });
          });
          const chk = document.getElementById('srs-check');
          if (chk && selected !== null) {
            chk.addEventListener('click', () => {
              checked = true;
              const ok = q.options[selected].correct;
              recordAnswer(q.formulaId, ok);
              if (ok) { correctCount++; playTone('correct'); } else { playTone('wrong'); }
              draw();
            });
          }
        } else {
          document.getElementById('srs-next').addEventListener('click', () => {
            idx++;
            selected = null;
            checked = false;
            if (idx < queue.length) q = buildQuizQuestion(queue[idx]);
            draw();
          });
        }
      }
      draw();
    }

    // --- 10C. TAP-TO-MATCH PAIRS GAME ---
    function renderMatchGame(chapterFilter = 0) {
      clearPracticeTimers();
      const pool = chapterFilter > 0 ? FORMULAS.filter(f => f.ch === chapterFilter) : FORMULAS;
      const picked = shuffle(pool).slice(0, Math.min(5, pool.length));
      const leftItems = shuffle(picked.map(f => ({ id: f.id, label: f.topic, sub: `অধ্যায় ${toBnNum(f.ch)}` })));
      const rightItems = shuffle(picked.map(f => ({ id: f.id, html: f.answer })));

      let selLeft = null;
      let selRight = null;
      let matched = new Set();
      let mistakes = 0;
      let seconds = 0;
      let wrongFlash = null;

      function checkPair() {
        if (selLeft === null || selRight === null) return;
        if (selLeft === selRight) {
          playTone('correct');
          matched.add(selLeft);
          recordAnswer(selLeft, true);
          selLeft = null;
          selRight = null;
          if (matched.size === picked.length) {
            clearPracticeTimers();
            const isBest = !state.matchBestTime || seconds < state.matchBestTime;
            if (isBest) state.matchBestTime = seconds;
            addXp(25);
            playTone('complete');
            try { if (typeof confetti === 'function') confetti({ particleCount: 55, spread: 60, origin: { y: 0.65 } }); } catch (e) {}
          }
        } else {
          playTone('wrong');
          mistakes++;
          wrongFlash = { l: selLeft, r: selRight };
          selLeft = null;
          selRight = null;
          draw();
          setTimeout(() => { wrongFlash = null; draw(); }, 420);
          return;
        }
        draw();
      }

      function draw() {
        const main = document.getElementById('app-main');
        const allDone = matched.size === picked.length;
        main.innerHTML = `
          <div class="max-w-3xl mx-auto">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <button id="match-back" class="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold">← ফিরে যান</button>
              <div class="flex items-center gap-2">
                <select id="match-ch" class="px-2.5 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-semibold">
                  <option value="0" ${chapterFilter === 0 ? 'selected' : ''}>সব অধ্যায়</option>
                  ${COURSE.filter(c => c.formulaIds.length >= 2).map(c => `<option value="${c.num}" ${chapterFilter === c.num ? 'selected' : ''}>অধ্যায় ${toBnNum(c.num)}: ${c.short}</option>`).join('')}
                </select>
                <span id="match-clock" class="px-3 py-1.5 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-extrabold">⏱ ${toBnNum(seconds)}s</span>
              </div>
            </div>

            ${allDone ? `
              <div class="bg-emerald-50 dark:bg-emerald-950/50 border-2 border-emerald-400 rounded-2xl p-5 text-center mb-4 animate-pop">
                <div class="text-3xl mb-1">🎉</div>
                <div class="text-lg font-extrabold text-emerald-700 dark:text-emerald-300">সব জোড়া মিলে গেছে! (+25 XP)</div>
                <div class="text-xs text-slate-600 dark:text-slate-300 mt-1">সময়: ${toBnNum(seconds)} সেকেন্ড · ভুল: ${toBnNum(mistakes)}টি</div>
                <button id="match-new" class="mt-3 px-6 py-2 rounded-xl bg-emerald-600 text-white font-bold text-sm">নতুন রাউন্ড খেলুন →</button>
              </div>
            ` : `<p class="text-xs text-slate-500 dark:text-slate-400 mb-3 text-center">বাম দিকের টপিক এবং ডান দিকের সঠিক সূত্র ট্যাপ করে জোড়া মিলান</p>`}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div class="space-y-2.5">
                <div class="text-xs font-extrabold uppercase tracking-wider text-slate-400 px-1">টপিক</div>
                ${leftItems.map(item => {
                  const isDone = matched.has(item.id);
                  const isSel = selLeft === item.id;
                  const isWrong = wrongFlash && wrongFlash.l === item.id;
                  let cls = 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-[#2493DF]';
                  if (isDone) cls = 'border-emerald-400 bg-emerald-50/70 dark:bg-emerald-950/40 opacity-60';
                  else if (isWrong) cls = 'border-rose-500 bg-rose-50 dark:bg-rose-950/50 animate-shake';
                  else if (isSel) cls = 'border-[#2493DF] bg-sky-50 dark:bg-sky-950/50 ring-2 ring-[#2493DF]/30';
                  return `<button data-mleft="${item.id}" ${isDone ? 'disabled' : ''} class="w-full text-left p-3.5 rounded-xl border-2 transition ${cls}">
                    <div class="font-bold text-sm text-slate-900 dark:text-white">${item.label}</div>
                    <div class="text-[11px] text-slate-400 mt-0.5">${item.sub}</div>
                  </button>`;
                }).join('')}
              </div>

              <div class="space-y-2.5">
                <div class="text-xs font-extrabold uppercase tracking-wider text-slate-400 px-1">সূত্র</div>
                ${rightItems.map(item => {
                  const isDone = matched.has(item.id);
                  const isSel = selRight === item.id;
                  const isWrong = wrongFlash && wrongFlash.r === item.id;
                  let cls = 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-[#2493DF]';
                  if (isDone) cls = 'border-emerald-400 bg-emerald-50/70 dark:bg-emerald-950/40 opacity-60';
                  else if (isWrong) cls = 'border-rose-500 bg-rose-50 dark:bg-rose-950/50 animate-shake';
                  else if (isSel) cls = 'border-[#2493DF] bg-sky-50 dark:bg-sky-950/50 ring-2 ring-[#2493DF]/30';
                  return `<button data-mright="${item.id}" ${isDone ? 'disabled' : ''} class="w-full text-left p-3.5 rounded-xl border-2 transition math-scroll text-sm ${cls}">
                    ${item.html}
                  </button>`;
                }).join('')}
              </div>
            </div>
          </div>
        `;
        renderMath(main);

        document.getElementById('match-back').addEventListener('click', () => { practiceMode = 'hub'; renderPracticeView(); });
        document.getElementById('match-ch').addEventListener('change', (e) => renderMatchGame(Number(e.target.value)));
        const newBtn = document.getElementById('match-new');
        if (newBtn) newBtn.addEventListener('click', () => renderMatchGame(chapterFilter));

        main.querySelectorAll('[data-mleft]').forEach(btn => {
          btn.addEventListener('click', () => {
            playTone('tap');
            selLeft = Number(btn.dataset.mleft);
            if (selRight !== null) checkPair(); else draw();
          });
        });
        main.querySelectorAll('[data-mright]').forEach(btn => {
          btn.addEventListener('click', () => {
            playTone('tap');
            selRight = Number(btn.dataset.mright);
            if (selLeft !== null) checkPair(); else draw();
          });
        });
      }

      draw();
      matchTimer = setInterval(() => {
        seconds++;
        const cl = document.getElementById('match-clock');
        if (cl) cl.textContent = `⏱ ${toBnNum(seconds)}s`;
      }, 1000);
    }

    // --- 10D. INTERACTIVE PHYSICS FORMULA SANDBOX ---
    const SANDBOX_TOOLS = [
      { id: 'temp', label: 'তাপমাত্রা স্কেল', ch: 'অধ্যায় ১' },
      { id: 'carnot', label: 'কার্নো ইঞ্জিন', ch: 'অধ্যায় ১' },
      { id: 'coulomb', label: 'কুলম্বের সূত্র', ch: 'অধ্যায় ২' },
      { id: 'lens', label: 'লেন্স সমীকরণ', ch: 'অধ্যায় ৬' },
      { id: 'debroglie', label: 'ডি-ব্রগলি তরঙ্গ', ch: 'অধ্যায় ৮' },
      { id: 'halflife', label: 'তেজস্ক্রিয় অর্ধায়ু', ch: 'অধ্যায় ৯' }
    ];

    function renderSandboxView() {
      const main = document.getElementById('app-main');
      main.innerHTML = `
        <div class="max-w-3xl mx-auto">
          <div class="flex items-center justify-between mb-4">
            <button id="sb-back" class="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold">← প্র্যাকটিস অ্যারেনা</button>
            <span class="text-xs font-bold text-[#2493DF]">🧮 ইন্টারেক্টিভ সূত্র স্যান্ডবক্স</span>
          </div>

          <div class="flex gap-2 overflow-x-auto pb-2 mb-4">
            ${SANDBOX_TOOLS.map(t => `
              <button data-sb="${t.id}" class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap border transition ${activeSandbox === t.id ? 'bg-[#2493DF] text-white border-[#2493DF]' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-800'}">
                ${t.label} <span class="opacity-70">(${t.ch})</span>
              </button>
            `).join('')}
          </div>

          <div id="sb-panel" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm"></div>
        </div>
      `;

      document.getElementById('sb-back').addEventListener('click', () => { practiceMode = 'hub'; renderPracticeView(); });
      main.querySelectorAll('[data-sb]').forEach(btn => {
        btn.addEventListener('click', () => { activeSandbox = btn.dataset.sb; renderSandboxView(); });
      });

      mountSandboxTool(document.getElementById('sb-panel'), activeSandbox);
    }

    function mountSandboxTool(panel, toolId) {
      if (toolId === 'temp') {
        panel.innerHTML = `
          <div class="text-center p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40 mb-4 math-scroll">\\(\\frac{C}{5} = \\frac{F - 32}{9} = \\frac{K - 273.15}{5}\\)</div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="text-xs font-bold text-slate-500">সেলসিয়াস (°C)</label>
              <input id="sb-c" type="number" step="0.1" value="25" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" />
            </div>
            <div>
              <label class="text-xs font-bold text-slate-500">ফারেনহাইট (°F)</label>
              <input id="sb-f" type="number" step="0.1" value="77" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" />
            </div>
            <div>
              <label class="text-xs font-bold text-slate-500">কেলভিন (K)</label>
              <input id="sb-k" type="number" step="0.1" value="298.15" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" />
            </div>
          </div>
          <p class="text-xs text-slate-500 mt-3">যেকোনো একটি ঘরে মান লিখুন—বাকি দুটি স্কেল সাথে সাথে আপডেট হবে।</p>
        `;
        renderMath(panel);
        const cIn = document.getElementById('sb-c'), fIn = document.getElementById('sb-f'), kIn = document.getElementById('sb-k');
        cIn.addEventListener('input', () => {
          const c = parseFloat(cIn.value); if (isNaN(c)) return;
          fIn.value = (c * 9 / 5 + 32).toFixed(2);
          kIn.value = (c + 273.15).toFixed(2);
        });
        fIn.addEventListener('input', () => {
          const f = parseFloat(fIn.value); if (isNaN(f)) return;
          const c = (f - 32) * 5 / 9;
          cIn.value = c.toFixed(2);
          kIn.value = (c + 273.15).toFixed(2);
        });
        kIn.addEventListener('input', () => {
          const k = parseFloat(kIn.value); if (isNaN(k)) return;
          const c = k - 273.15;
          cIn.value = c.toFixed(2);
          fIn.value = (c * 9 / 5 + 32).toFixed(2);
        });
      } else if (toolId === 'carnot') {
        panel.innerHTML = `
          <div class="text-center p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40 mb-4 math-scroll">\\(\\eta = \\left(1 - \\frac{T_2}{T_1}\\right) \\times 100\\%, \\quad W = Q_1 \\cdot \\eta\\)</div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
            <div>
              <label class="text-xs font-bold text-slate-500">তাপ উৎসের তাপমাত্রা T₁ (K)</label>
              <input id="cn-t1" type="number" min="1" value="600" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" />
            </div>
            <div>
              <label class="text-xs font-bold text-slate-500">তাপ গ্রাহকের তাপমাত্রা T₂ (K)</label>
              <input id="cn-t2" type="number" min="1" value="300" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" />
            </div>
            <div>
              <label class="text-xs font-bold text-slate-500">গৃহীত তাপ Q₁ (J)</label>
              <input id="cn-q1" type="number" min="0" value="1000" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" />
            </div>
          </div>
          <div id="cn-out" class="grid grid-cols-3 gap-3 text-center"></div>
        `;
        renderMath(panel);
        const calc = () => {
          const t1 = parseFloat(document.getElementById('cn-t1').value) || 0;
          const t2 = parseFloat(document.getElementById('cn-t2').value) || 0;
          const q1 = parseFloat(document.getElementById('cn-q1').value) || 0;
          const out = document.getElementById('cn-out');
          if (t1 <= 0 || t2 <= 0 || t2 >= t1) {
            out.innerHTML = `<div class="col-span-3 p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 text-sm font-bold">শর্ত: T₁ > T₂ > 0 K হতে হবে।</div>`;
            return;
          }
          const eta = (1 - t2 / t1);
          const w = q1 * eta;
          const q2 = q1 - w;
          out.innerHTML = `
            <div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40"><div class="text-xs text-slate-500">দক্ষতা (η)</div><div class="text-lg font-extrabold text-emerald-600">${(eta * 100).toFixed(2)}%</div></div>
            <div class="p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40"><div class="text-xs text-slate-500">কৃতকাজ (W)</div><div class="text-lg font-extrabold text-[#2493DF]">${w.toFixed(1)} J</div></div>
            <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40"><div class="text-xs text-slate-500">বর্জিত তাপ (Q₂)</div><div class="text-lg font-extrabold text-amber-600">${q2.toFixed(1)} J</div></div>
          `;
        };
        ['cn-t1','cn-t2','cn-q1'].forEach(id => document.getElementById(id).addEventListener('input', calc));
        calc();
      } else if (toolId === 'coulomb') {
        panel.innerHTML = `
          <div class="text-center p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40 mb-4 math-scroll">\\(F = \\frac{1}{4\\pi\\epsilon_0 k} \\frac{q_1 q_2}{r^2} \\approx 9 \\times 10^9 \\frac{q_1 q_2}{k r^2}\\)</div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
            <div><label class="text-xs font-bold text-slate-500">q₁ (µC)</label><input id="cl-q1" type="number" step="0.5" value="4" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" /></div>
            <div><label class="text-xs font-bold text-slate-500">q₂ (µC)</label><input id="cl-q2" type="number" step="0.5" value="5" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" /></div>
            <div><label class="text-xs font-bold text-slate-500">দূরত্ব r (m)</label><input id="cl-r" type="number" step="0.1" min="0.01" value="0.3" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" /></div>
            <div><label class="text-xs font-bold text-slate-500">ধ্রুবক k</label><input id="cl-k" type="number" step="0.5" min="1" value="1" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" /></div>
          </div>
          <div id="cl-out" class="p-4 rounded-xl bg-sky-50 dark:bg-sky-950/40 text-center"></div>
        `;
        renderMath(panel);
        const calc = () => {
          const q1 = (parseFloat(document.getElementById('cl-q1').value) || 0) * 1e-6;
          const q2 = (parseFloat(document.getElementById('cl-q2').value) || 0) * 1e-6;
          const r = parseFloat(document.getElementById('cl-r').value) || 0;
          const k = parseFloat(document.getElementById('cl-k').value) || 0;
          const out = document.getElementById('cl-out');
          if (r <= 0 || k <= 0) {
            out.innerHTML = `<span class="text-rose-600 font-bold text-sm">দূরত্ব r এবং পরাবৈদ্যুতিক ধ্রুবক k ধনাত্মক হতে হবে।</span>`;
            return;
          }
          const F = (8.98755e9 * Math.abs(q1 * q2)) / (k * r * r);
          const nature = q1 * q2 === 0 ? 'শূন্য বল' : (q1 * q2 > 0 ? 'বিকর্ষণ বল' : 'আকর্ষণ বল');
          out.innerHTML = `<div class="text-xs text-slate-500">কুলম্ব বল (F)</div><div class="text-2xl font-extrabold text-[#2493DF] mt-1">${F >= 1e4 || (F > 0 && F < 0.01) ? F.toExponential(3) : F.toFixed(3)} N</div><div class="text-xs font-bold text-slate-600 dark:text-slate-300 mt-1">${nature}</div>`;
        };
        ['cl-q1','cl-q2','cl-r','cl-k'].forEach(id => document.getElementById(id).addEventListener('input', calc));
        calc();
      } else if (toolId === 'lens') {
        panel.innerHTML = `
          <div class="text-center p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40 mb-4 math-scroll">\\(\\frac{1}{u} + \\frac{1}{v} = \\frac{1}{f}, \\quad P = \\frac{1}{f\\text{ (m)}}, \\quad m = \\left|\\frac{v}{u}\\right|\\)</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div><label class="text-xs font-bold text-slate-500">ফোকাস দূরত্ব f (cm) (+ উত্তল, - অবতল)</label><input id="ln-f" type="number" step="1" value="15" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" /></div>
            <div><label class="text-xs font-bold text-slate-500">বস্তুর দূরত্ব u (cm)</label><input id="ln-u" type="number" step="1" min="0.1" value="30" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" /></div>
          </div>
          <div id="ln-out" class="grid grid-cols-3 gap-3 text-center"></div>
        `;
        renderMath(panel);
        const calc = () => {
          const f = parseFloat(document.getElementById('ln-f').value) || 0;
          const u = parseFloat(document.getElementById('ln-u').value) || 0;
          const out = document.getElementById('ln-out');
          if (f === 0 || u <= 0) {
            out.innerHTML = `<div class="col-span-3 p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 text-sm font-bold">f ≠ 0 এবং u > 0 হতে হবে।</div>`;
            return;
          }
          const invV = (1 / f) - (1 / u);
          const P = 100 / f;
          if (Math.abs(invV) < 1e-9) {
            out.innerHTML = `
              <div class="p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40"><div class="text-xs text-slate-500">প্রতিবিম্ব (v)</div><div class="text-lg font-extrabold text-[#2493DF]">∞ (অসীম)</div></div>
              <div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40"><div class="text-xs text-slate-500">ক্ষমতা (P)</div><div class="text-lg font-extrabold text-emerald-600">${P.toFixed(2)} D</div></div>
              <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40"><div class="text-xs text-slate-500">বিবর্ধন (m)</div><div class="text-lg font-extrabold text-amber-600">∞</div></div>
            `;
            return;
          }
          const v = 1 / invV;
          const m = Math.abs(v / u);
          out.innerHTML = `
            <div class="p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40"><div class="text-xs text-slate-500">প্রতিবিম্ব (v)</div><div class="text-lg font-extrabold text-[#2493DF]">${v.toFixed(2)} cm</div><div class="text-[11px] text-slate-500">${v > 0 ? 'বাস্তব ও উল্টো' : 'অবাস্তব ও সোজা'}</div></div>
            <div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40"><div class="text-xs text-slate-500">ক্ষমতা (P)</div><div class="text-lg font-extrabold text-emerald-600">${P > 0 ? '+' : ''}${P.toFixed(2)} D</div></div>
            <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40"><div class="text-xs text-slate-500">বিবর্ধন (m)</div><div class="text-lg font-extrabold text-amber-600">${m.toFixed(2)}×</div></div>
          `;
        };
        ['ln-f','ln-u'].forEach(id => document.getElementById(id).addEventListener('input', calc));
        calc();
      } else if (toolId === 'debroglie') {
        panel.innerHTML = `
          <div class="text-center p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40 mb-4 math-scroll">\\(\\lambda = \\frac{h}{mv} = \\frac{h}{\\sqrt{2meV}}, \\quad h = 6.626 \\times 10^{-34}\\text{ J}\\cdot\\text{s}\\)</div>
          <div class="mb-4">
            <label class="text-xs font-bold text-slate-500">ইলেকট্রন ত্বরণ বিভব V (Volt)</label>
            <input id="db-v" type="number" min="0.1" step="10" value="100" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" />
          </div>
          <div id="db-out" class="grid grid-cols-2 gap-3 text-center"></div>
        `;
        renderMath(panel);
        const calc = () => {
          const V = parseFloat(document.getElementById('db-v').value) || 0;
          const out = document.getElementById('db-out');
          if (V <= 0) {
            out.innerHTML = `<div class="col-span-2 p-3 rounded-xl bg-rose-50 text-rose-600 text-sm font-bold">বিভব V > 0 হতে হবে।</div>`;
            return;
          }
          const h = 6.62607e-34, m = 9.10938e-31, e = 1.60218e-19;
          const lam = h / Math.sqrt(2 * m * e * V);
          const ang = lam * 1e10;
          out.innerHTML = `
            <div class="p-3.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/40"><div class="text-xs text-slate-500">তরঙ্গদৈর্ঘ্য (m)</div><div class="text-lg font-extrabold text-indigo-600 dark:text-indigo-400">${lam.toExponential(3)} m</div></div>
            <div class="p-3.5 rounded-xl bg-sky-50 dark:bg-sky-950/40"><div class="text-xs text-slate-500">অ্যাংস্ট্রম (Å)</div><div class="text-lg font-extrabold text-[#2493DF]">${ang.toFixed(4)} Å</div></div>
          `;
        };
        document.getElementById('db-v').addEventListener('input', calc);
        calc();
      } else if (toolId === 'halflife') {
        panel.innerHTML = `
          <div class="text-center p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40 mb-4 math-scroll">\\(\\lambda = \\frac{0.693}{T_{1/2}}, \\quad \\tau = \\frac{1}{\\lambda}, \\quad N = N_0 e^{-\\lambda t}\\)</div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
            <div><label class="text-xs font-bold text-slate-500">অর্ধায়ু T½ (দিন)</label><input id="hl-th" type="number" min="0.1" step="1" value="8" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" /></div>
            <div><label class="text-xs font-bold text-slate-500">অতিবাহিত সময় t (দিন)</label><input id="hl-t" type="number" min="0" step="1" value="16" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" /></div>
            <div><label class="text-xs font-bold text-slate-500">আদি পরমাণু N₀</label><input id="hl-n0" type="number" min="1" step="100" value="1000" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" /></div>
          </div>
          <div id="hl-out" class="grid grid-cols-3 gap-3 text-center"></div>
        `;
        renderMath(panel);
        const calc = () => {
          const th = parseFloat(document.getElementById('hl-th').value) || 0;
          const t = parseFloat(document.getElementById('hl-t').value) || 0;
          const n0 = parseFloat(document.getElementById('hl-n0').value) || 0;
          const out = document.getElementById('hl-out');
          if (th <= 0 || t < 0 || n0 <= 0) {
            out.innerHTML = `<div class="col-span-3 p-3 rounded-xl bg-rose-50 text-rose-600 text-sm font-bold">সঠিক ধনাত্মক মান দিন।</div>`;
            return;
          }
          const lam = Math.LN2 / th;
          const tau = 1 / lam;
          const n = n0 * Math.exp(-lam * t);
          out.innerHTML = `
            <div class="p-3 rounded-xl bg-teal-50 dark:bg-teal-950/40"><div class="text-xs text-slate-500">ক্ষয় ধ্রুবক (λ)</div><div class="text-lg font-extrabold text-teal-600">${lam.toFixed(4)} /দিন</div></div>
            <div class="p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40"><div class="text-xs text-slate-500">গড় আয়ু (τ)</div><div class="text-lg font-extrabold text-[#2493DF]">${tau.toFixed(2)} দিন</div></div>
            <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40"><div class="text-xs text-slate-500">অবশিষ্ট (N)</div><div class="text-lg font-extrabold text-amber-600">${n.toFixed(1)} (${((n/n0)*100).toFixed(1)}%)</div></div>
          `;
        };
        ['hl-th','hl-t','hl-n0'].forEach(id => document.getElementById(id).addEventListener('input', calc));
        calc();
      }
    }

    // =========================================================================
    // 11. TAB 3: FORMULA VAULT (Searchable Reference + Self-Test Mode + Deep Notes)
    // =========================================================================
    let vaultDebounceTimer = null;

    function getFilteredVaultFormulas() {
      const q = vaultState.search.trim().toLowerCase();
      return FORMULAS.filter(f => {
        if (vaultState.chapter > 0 && f.ch !== vaultState.chapter) return false;
        const st = state.formulaStats[f.id] || {};
        if (vaultState.filter === 'bookmarked' && !st.bookmarked) return false;
        if (vaultState.filter === 'weak' && !(st.wrong > 0 && (st.mastery || 0) < 2)) return false;
        if (q) {
          const hay = (f.topic + ' ' + f.question + ' ' + f.answer + ' ' + f.context + ' ' + f.intuition + ' ' + f.trap + ' ' + f.chapter).toLowerCase();
          return hay.includes(q);
        }
        return true;
      });
    }

              <span class="text-sm font-extrabold text-slate-900 dark:text-white">${f.topic}</span>
              ${f.isNewPdfSection ? '<span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-violet-100 dark:bg-violet-950 text-violet-700 dark:text-violet-300">নতুন</span>' : ''}

              <button data-vcopy="${f.id}" title="Copy LaTeX" class="px-2 py-1 rounded-lg text-xs font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">📋</button>
              <button data-vbm="${f.id}" title="Bookmark" class="px-2 py-1 rounded-lg text-sm ${st.bookmarked ? 'text-amber-500' : 'text-slate-400 hover:text-amber-500'}">${st.bookmarked ? '★' : '☆'}</button>

            <div class="mt-3 space-y-2 pt-2.5 border-t border-slate-100 dark:border-slate-800 text-xs sm:text-sm">

    function renderVaultListOnly() {
      const listEl = document.getElementById('vault-list');
      const countEl = document.getElementById('vault-count-title');
      if (!listEl) return;
      const filtered = getFilteredVaultFormulas();
      const limit = vaultState.limit || 20;
      const visible = filtered.slice(0, limit);
      if (countEl) countEl.textContent = `সূত্র ভাণ্ডার (${toBnNum(filtered.length)}/${toBnNum(FORMULAS.length)})`;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-8 text-center text-slate-500">কোনো সূত্র পাওয়া যায়নি। ফিল্টার বা সার্চ পরিবর্তন করে দেখুন।</div>`;
        return;
      }

      listEl.innerHTML = visible.map(renderVaultCardHtml).join('') + (filtered.length > visible.length ? `
        <div class="text-center pt-2">
          <button id="vault-load-more" class="px-6 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-extrabold transition">
            আরও দেখুন (${toBnNum(filtered.length - visible.length)}টি বাকি) ↓
          </button>
        </div>
      ` : '');
      renderMath(listEl);

      const loadMore = document.getElementById('vault-load-more');
      if (loadMore) {
        loadMore.addEventListener('click', () => {
          vaultState.limit = (vaultState.limit || 20) + 25;
          renderVaultListOnly();
        });
      }

      listEl.querySelectorAll('[data-vreveal]').forEach(box => {
        box.addEventListener('click', () => {
          if (!vaultState.hideFormulas) return;
          const id = Number(box.dataset.vreveal);
          vaultState.revealed[id] = !vaultState.revealed[id];
          const card = listEl.querySelector(`[data-vcard="${id}"]`);
          if (card) {
            card.outerHTML = renderVaultCardHtml(FORMULAS[id]);
            const fresh = listEl.querySelector(`[data-vcard="${id}"]`);
            if (fresh) { renderMath(fresh); bindSingleVaultCard(fresh, id); }
          }
        });
      });

      listEl.querySelectorAll('[data-vcard]').forEach(card => {
        bindSingleVaultCard(card, Number(card.dataset.vcard));
      });
    }

    function bindSingleVaultCard(card, id) {
      const bmBtn = card.querySelector('[data-vbm]');
      if (bmBtn) bmBtn.addEventListener('click', () => {
        const st = getFormulaStat(id);
        st.bookmarked = !st.bookmarked;
        saveState();
        bmBtn.textContent = st.bookmarked ? '★' : '☆';
        bmBtn.className = `px-2 py-1 rounded-lg text-sm ${st.bookmarked ? 'text-amber-500' : 'text-slate-400 hover:text-amber-500'}`;
        showToast(st.bookmarked ? 'বুকমার্ক করা হয়েছে ★' : 'বুকমার্ক সরানো হয়েছে');
      });
      const cpBtn = card.querySelector('[data-vcopy]');
      if (cpBtn) cpBtn.addEventListener('click', () => {
        const f = FORMULAS[id];
        copyText(`${f.topic}: ${f.answer}`);
      });
      const exBtn = card.querySelector('[data-vextra]');
      if (exBtn) exBtn.addEventListener('click', () => {
        vaultState.expandedDetails[id] = !vaultState.expandedDetails[id];
        card.outerHTML = renderVaultCardHtml(FORMULAS[id]);
        const listEl = document.getElementById('vault-list');
        const fresh = listEl && listEl.querySelector(`[data-vcard="${id}"]`);
        if (fresh) { renderMath(fresh); bindSingleVaultCard(fresh, id); }
      });
    }

        clearTimeout(vaultDebounceTimer);
        vaultDebounceTimer = setTimeout(renderVaultListOnly, 160);
      });

      document.getElementById('vault-hide-toggle').addEventListener('click', () => {
        vaultState.hideFormulas = !vaultState.hideFormulas;
        vaultState.revealed = {};
        renderVaultView();
      });

      main.querySelectorAll('[data-vfilt]').forEach(btn => {
        btn.addEventListener('click', () => { vaultState.filter = btn.dataset.vfilt; renderVaultView(); });
      });
      main.querySelectorAll('[data-vch]').forEach(btn => {
        btn.addEventListener('click', () => { vaultState.chapter = Number(btn.dataset.vch); renderVaultView(); });
      });
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('LaTeX সূত্র কপি হয়েছে!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast('LaTeX সূত্র কপি হয়েছে!'); } catch (e) {}
      ta.remove();
    }

              <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 text-center">
                <div class="text-xs text-slate-400">ব্লিটজ সেরা</div>
                <div class="text-xl font-extrabold text-amber-500 mt-0.5">${toBnNum(state.blitzHighScore || 0)}</div>
              </div>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm">
            <h2 class="text-base font-extrabold mb-3">অ্যাচিভমেন্ট ব্যাজ</h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              ${badges.map(b => `
                <div class="p-3.5 rounded-xl border text-center transition ${b.unlocked ? 'border-amber-300 dark:border-amber-700 bg-amber-50/60 dark:bg-amber-950/25' : 'border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/40 opacity-50 grayscale'}">
                  <div class="text-2xl mb-1">${b.icon}</div>
                  <div class="text-xs font-extrabold text-slate-900 dark:text-white">${b.title}</div>
                  <div class="text-[11px] text-slate-500 mt-0.5">${b.desc}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm">
            <h2 class="text-base font-extrabold mb-3">অধ্যায়ভিত্তিক দক্ষতা</h2>
            <div class="space-y-3">
              ${COURSE.map(c => {
                const mCount = c.formulaIds.filter(id => (state.formulaStats[id]?.mastery || 0) >= 2).length;
                const pct = Math.round((mCount / c.formulaIds.length) * 100);
                return `
                  <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                      <span class="truncate pr-2">অধ্যায় ${toBnNum(c.num)}: ${c.short}</span>
                      <span class="text-slate-500 shrink-0">${toBnNum(mCount)}/${toBnNum(c.formulaIds.length)} (${toBnNum(pct)}%)</span>
                    </div>
                    <div class="h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                      <div class="h-full bg-gradient-to-r ${c.bg} rounded-full" style="width:${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;

      document.getElementById('prof-export').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'physicslab_progress.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('প্রগ্রেস ব্যাকআপ ডাউনলোড হয়েছে!');
      });

      document.getElementById('prof-import').addEventListener('click', () => {
        openModal(
          'প্রগ্রেস রিস্টোর করুন',
          `<p class="mb-2">আগে ব্যাকআপ করা JSON টেক্সট এখানে পেস্ট করুন:</p>
           <textarea id="import-json-ta" rows="5" class="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-mono" placeholder='{"xp": ...}'></textarea>`,
          [
            { label: 'বাতিল' },
            {
              label: 'রিস্টোর করুন',
              cls: 'px-4 py-2 rounded-xl text-sm font-bold bg-[#2493DF] text-white',
              onClick: () => {
                try {
                  const txt = document.getElementById('import-json-ta').value;
                  const parsed = JSON.parse(txt);
                  state = { ...JSON.parse(JSON.stringify(DEFAULT_STATE)), ...parsed };
                  saveState();
                  applyTheme();
                  updateHud();
                  renderProfileView();
                  showToast('প্রগ্রেস সফলভাবে রিস্টোর হয়েছে!');
                } catch (e) {
                  showToast('সঠিক JSON ফরম্যাট নয়!');
                }
              }
            }
          ]
        );
      });

      document.getElementById('prof-reset').addEventListener('click', () => {
        openModal(
          'সব অগ্রগতি মুছে ফেলবেন?',
          'এতে আপনার XP, স্ট্রিক, সম্পন্ন লেসন ও বুকমার্ক সব রিসেট হয়ে যাবে।',
          [
            { label: 'বাতিল' },
            {
              label: 'হ্যাঁ, রিসেট করুন',
              cls: 'px-4 py-2 rounded-xl text-sm font-bold bg-rose-600 text-white',
              onClick: () => {
                state = JSON.parse(JSON.stringify(DEFAULT_STATE));
                saveState();
                applyTheme();
                updateHud();
                renderProfileView();
                showToast('অগ্রগতি রিসেট করা হয়েছে।');
              }
            }
          ]
        );
      });
    }

    // =========================================================================
    // 13. ROUTER & GLOBAL EVENT LISTENERS
    // =========================================================================
    function renderCurrentTab() {
      updateHud();
      if (currentTab === 'learn') renderLearnView();
      else if (currentTab === 'practice') renderPracticeView();
      else if (currentTab === 'vault') renderVaultView();
      else if (currentTab === 'profile') renderProfileView();
    }

    function switchTab(tab) {
      if (tab !== 'practice') {
        clearPracticeTimers();
        practiceMode = 'hub';
      }
      currentTab = tab;
      renderCurrentTab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.querySelectorAll('[data-nav]').forEach(btn => {
      btn.addEventListener('click', () => {
        playTone('tap');
        switchTab(btn.dataset.nav);
      });
    });

    document.getElementById('brand-btn').addEventListener('click', () => switchTab('learn'));

    document.getElementById('theme-toggle').addEventListener('click', () => {
      state.darkMode = !state.darkMode;
      saveState();
      applyTheme();
    });

    document.getElementById('sound-toggle').addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      saveState();
      applyTheme();
      showToast(state.soundEnabled ? 'সাউন্ড চালু হয়েছে' : 'সাউন্ড মিউট করা হয়েছে');
    });

    document.getElementById('hearts-btn').addEventListener('click', () => {
      openModal(
        'হার্ট ও প্র্যাকটিস মোড ❤️',
        `<p class="mb-3">বর্তমান হার্ট: <strong>${state.unlimitedHearts ? '∞ (আনলিমিটেড)' : `${toBnNum(state.hearts)} / ৫`}</strong>।</p>
         <p>চাইলে আনলিমিটেড প্র্যাকটিস মোড চালু রাখতে পারেন অথবা হার্ট রিফিল করে নিতে পারেন।</p>`,
        [
          {
            label: state.unlimitedHearts ? 'স্বাভাবিক হার্ট মোড (৫ ❤️)' : 'আনলিমিটেড হার্ট চালু করুন (∞)',
            cls: 'px-4 py-2 rounded-xl text-sm font-bold bg-[#2493DF] text-white',
            onClick: () => {
              state.unlimitedHearts = !state.unlimitedHearts;
              if (!state.unlimitedHearts) state.hearts = 5;
              saveState();
              updateHud();
              showToast(state.unlimitedHearts ? 'আনলিমিটেড হার্ট চালু হয়েছে!' : 'স্বাভাবিক ৫ হার্ট মোড চালু হয়েছে!');
            }
          },
          {
            label: '৫ হার্ট রিফিল',
            onClick: () => { state.hearts = 5; saveState(); updateHud(); showToast('৫টি হার্ট রিফিল হয়েছে!'); }
          }
        ]
      );
    });

    document.getElementById('lesson-exit-btn').addEventListener('click', () => {
      if (activeLesson && !activeLesson.finished && activeLesson.idx > 0) {
        openModal(
          'লেসন থেকে বের হবেন?',
          'এখন বের হলে এই লেসনের চলতি ধাপটি সংরক্ষিত হবে না।',
          [
            { label: 'থাকুন' },
            { label: 'বের হন', cls: 'px-4 py-2 rounded-xl text-sm font-bold bg-rose-600 text-white', onClick: closeLessonOverlay }
          ]
        );
      } else {
        closeLessonOverlay();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const go = document.getElementById('guide-overlay');
        if (go && !go.classList.contains('hidden')) { closeChapterGuide(); return; }
        const mb = document.getElementById('modal-backdrop');
        if (mb && !mb.classList.contains('hidden')) { closeModal(); return; }
      }
      if (!activeLesson || activeLesson.finished) return;
      const step = activeLesson.steps[activeLesson.idx];
      if (!step) return;
      if (step.type === 'learn' && e.key === 'Enter') {
        e.preventDefault();
        advanceLessonStep();
      } else if (step.type === 'quiz') {
        if (!activeLesson.checked && ['1','2','3','4'].includes(e.key)) {
          const i = Number(e.key) - 1;
          if (i < step.quiz.options.length) {
            playTone('tap');
            activeLesson.selectedOptionIdx = i;
            renderLessonStep();
          }
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (!activeLesson.checked && activeLesson.selectedOptionIdx !== null) checkLessonAnswer();
          else if (activeLesson.checked) advanceLessonStep();
        }
      }
    });

    document.getElementById('guide-close-btn').addEventListener('click', closeChapterGuide);
    applyTheme();
    renderCurrentTab();
    window.addEventListener('load', () => {
      renderMath(document.body);
      setTimeout(() => renderMath(document.body), 400);
    });
  </script>
</body>
</html>
