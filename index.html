 দেয়, ফলে কেবল অক্ষীয় উপাংশই টিকে থাকে এবং দূরে গেলে ক্ষেত্র \\((a^2 + x^2)^{-3/2}\\) হারে দ্রুত কমে (অনেক দূরে এটি ক্ষুদ্র দণ্ডচুম্বকের মতো \\(\\propto \\frac{1}{x^3}\\) আচরণ করে)। সসীম তারের ক্ষেত্রে \\(\\sin\\phi_1 + \\sin\\phi_2\\) অংশটি বোঝায় বিন্দু \\(C\\) থেকে তারটির কতখানি বিস্তৃতি দেখা যাচ্ছে।", "trap": "সসীম তারের সূত্রে \\(\\phi_1\\) ও \\(\\phi_2\\) হলো তার থেকে বিন্দুতে টানা লম্বের সাথে দুই প্রান্তের সংযোগ রেখার কোণ, আর এক প্রান্তের ঠিক বিপরীতে অবস্থিত অর্ধ-অসীম তারের জন্য \\(\\phi_1 = 90^\\circ\\) ও \\(\\phi_2 = 0^\\circ\\) হয়!", "quickExample": "\\(a\\) ব্যাসার্ধের বৃত্তাকার কুণ্ডলীর অক্ষে \\(x = \\sqrt{3}a\\) দূরত্বে চৌম্বক ক্ষেত্র ও কেন্দ্রের চৌম্বক ক্ষেত্রের অনুপাত: \\(\\frac{B_x}{B_0} = \\frac{a^3}{(a^2 + 3a^2)^{3/2}} = \\frac{a^3}{(4a^2)^{3/2}} = \\frac{1}{8}\\)।"}, {"id": 55, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "চৌম্বক বল ও লরেঞ্জ বল", "question": "গতিশীল চার্জ ও সোজা তারের ওপর চৌম্বক বল, লরেঞ্জ বল এবং বৃত্তাকার পথে ঘূর্ণায়মান ইলেকট্রনের ব্যাসার্ধ \\(r\\) এর সূত্র কী?", "answer": "চার্জের ওপর: \\(\\vec{F} = q\\vec{v}\\times\\vec{B} \\Rightarrow F = qvB\\sin\\theta\\) • ব্যাসার্ধ: \\(r = \\frac{mv}{qB}\\)<br>সোজা তারের ওপর: \\(\\vec{F} = I\\vec{l}\\times\\vec{B} \\Rightarrow F = IlB\\sin\\theta\\)<br>লরেঞ্জ বল: \\(\\vec{F} = q\\vec{E} + q\\vec{v}\\times\\vec{B}\\)", "context": "<b>ধারণা:<\/b> চার্জ স্থির থাকলে (\\(v=0\\)) বা \\(\\vec{B}\\)-এর সমান্তরালে চললে (\\(\\theta=0^\\circ, 180^\\circ\\)) চৌম্বক বল শূন্য হয়।<br>চৌম্বক বল সর্বদা বেগের লম্ব হওয়ায় এটি কোনো কাজ করে না (গতিশক্তি বদলায় না, শুধু দিক বদলায়)।", "intuition": "চৌম্বক বল \\(\\vec{F} = q(\\vec{v} \\times \\vec{B})\\) ক্রস গুণনের কারণে সর্বদা বেগ \\(\\vec{v}\\)-এর সাথে লম্ব থাকে। বল ও সরণ সর্বদা \\(90^\\circ\\) কোণে থাকায় তাৎক্ষণিক ক্ষমতা \\(P = \\vec{F}\\cdot\\vec{v} = 0\\) এবং চৌম্বক বল দ্বারা কৃতকাজ সর্বদা শূন্য—তাই চৌম্বক ক্ষেত্র কখনোই চার্জের দ্রুতি বা গতিশক্তি বাড়াতে বা কমাতে পারে না! এটি কেবল গাড়ির স্টিয়ারিংয়ের মতো কেন্দ্রমুখী বল হিসেবে কাজ করে কণার দিক ঘুরিয়ে \\(r = \\frac{mv}{qB}\\) ব্যাসার্ধের বৃত্তে ঘোরায়; ভরবেগ \\(mv\\) যত বেশি, পথ বাঁকানো তত কঠিন হওয়ায় বৃত্তের ব্যাসার্ধ তত বড় হয়।", "trap": "চৌম্বক বল সর্বদা বেগের লম্ব হওয়ায় এর দ্বারা কৃতকাজ শূন্য (গতিশক্তি ও দ্রুতি অপরিবর্তিত থাকে)—তাই চৌম্বক ক্ষেত্রের প্রভাবে চার্জের গতিশক্তি কত বাড়বে জিজ্ঞেস করলে উত্তর হবে শূন্য!", "quickExample": "\\(2\\text{ m}\\) দীর্ঘ একটি তারে \\(5\\text{ A}\\) প্রবাহ চলছে এবং এটি \\(0.4\\text{ T}\\) চৌম্বক ক্ষেত্রের সাথে \\(30^\\circ\\) কোণে থাকলে ক্রিয়াশীল বল \\(F = IlB\\sin\\theta = 5 \\times 2 \\times 0.4 \\times \\sin 30^\\circ = 4 \\times 0.5 = 2\\text{ N}\\)।"}, {"id": 56, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "অ্যাম্পিয়ারের সূত্র ও সমান্তরাল তার", "question": "অ্যাম্পিয়ারের সূত্র এবং \\(a\\) দূরত্বে দুটি সমান্তরাল তড়িৎবাহী তারের একক দৈর্ঘ্যে বল কত? (আকর্ষণ/বিকর্ষণ শর্তসহ)", "answer": "অ্যাম্পিয়ারের সূত্র: \\(\\oint \\vec{B}\\cdot\\overrightarrow{dl} = \\mu_0 I\\)<br>একক দৈর্ঘ্যে বল: \\(\\frac{F}{l} = \\frac{\\mu_0 I_1 I_2}{2\\pi a}\\)<br>প্রবাহ একমুখী হলে আকর্ষণ এবং বিপরীতমুখী হলে বিকর্ষণ করে।", "context": "<b>মনে রাখো:<\/b> চার্জের ক্ষেত্রে সমধর্মী বিকর্ষণ করে, কিন্তু সমান্তরাল তারে <b>একই দিকে প্রবাহ আকর্ষণ<\/b> করে! এই সূত্র থেকেই \\(1\\text{ A}\\) এর আন্তর্জাতিক সংজ্ঞা দেওয়া হয়।", "intuition": "সমান্তরাল তারে একই দিকে প্রবাহ চললে কেন আকর্ষণ হয়? প্রথম তারটি ডানহাত বৃদ্ধাঙ্গুলি নিয়মে দ্বিতীয় তারের অবস্থানে লম্ব চৌম্বক ক্ষেত্র তৈরি করে, আর সেই ক্ষেত্রের প্রভাবে দ্বিতীয় তারের ওপর লরেঞ্জ বল \\(\\vec{F} = I_2(\\vec{l} \\times \\vec{B}_1)\\) ঠিক প্রথম তারের দিকেই কাজ করে! ভিন্নভাবে ভাবলে, একমুখী প্রবাহে তার দুটির মাঝখানে চৌম্বক ক্ষেত্র পরস্পরকে নাকচ করে দুর্বল হয় কিন্তু বাইরের দিকে শক্তিশালী হয়—ফলে বাইরের বেশি চৌম্বক চাপ তার দুটিকে ভেতরের দিকে ঠেলে আকর্ষণ করে (বিপরীতমুখী প্রবাহে মাঝখানে ক্ষেত্র বেড়ে গিয়ে বিকর্ষণ করে)। আর অ্যাম্পিয়ারের সূত্র \\(\\oint \\vec{B}\\cdot\\overrightarrow{dl} = \\mu_0 I\\) প্রতিসম জ্যামিতিতে বদ্ধ লুপের ভেতরের মোট প্রবাহ থেকেই সরাসরি \\(B\\) বের করার শর্টকাট।", "trap": "স্থির চার্জে সমধর্মী চার্জ পরস্পরকে বিকর্ষণ করলেও দুটি সমান্তরাল তারে একই দিকে প্রবাহ চললে তারা পরস্পরকে আকর্ষণ করে এবং বিপরীত দিকে প্রবাহ চললে বিকর্ষণ করে!", "quickExample": "\\(10\\text{ cm}\\) দূরত্বে দুটি সমান্তরাল তারে একই দিকে \\(5\\text{ A}\\) ও \\(10\\text{ A}\\) প্রবাহ চললে প্রতি মিটার দৈর্ঘ্যে আকর্ষণ বল \\(\\frac{F}{l} = \\frac{4\\pi \\times 10^{-7} \\times 5 \\times 10}{2\\pi \\times 0.1} = 2 \\times 10^{-7} \\times 500 = 10^{-4}\\text{ N m}^{-1}\\)।"}, {"id": 57, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "সমান্তরাল তারের লব্ধি B", "question": "\\(a\\) দূরত্বে দুটি সমান্তরাল তার (\\(I_1, I_2\\)) একই বা বিপরীত দিকে প্রবাহ বহন করলে ভেতরে ও বাইরে \\(p\\) বিন্দুতে লব্ধি \\(B\\) কত?", "answer": "• একমুখী প্রবাহ (ভেতরে): \\(B = \\frac{\\mu_0}{2\\pi}\\left(\\frac{I_1}{x} - \\frac{I_2}{a-x}\\right)\\)<br>• একমুখী প্রবাহ (বাইরে): \\(B = \\frac{\\mu_0}{2\\pi}\\left(\\frac{I_1}{a+x} + \\frac{I_2}{x}\\right)\\)<br>• বিপরীতমুখী (ভেতরে): \\(B = \\frac{\\mu_0}{2\\pi}\\left(\\frac{I_1}{x} + \\frac{I_2}{a-x}\\right)\\)<br>• বিপরীতমুখী (বাইরে): \\(B = \\frac{\\mu_0}{2\\pi}\\left(\\frac{I_1}{x} - \\frac{I_2}{a+x}\\right)\\)", "context": "<b>যুক্তি:<\/b> ডানহাত বৃদ্ধাঙ্গুলি নিয়ম (Right-hand thumb rule) দিয়ে দুটি তারের সৃষ্ট চৌম্বক ক্ষেত্রের দিক একই হলে যোগ এবং বিপরীত হলে বিয়োগ করতে হয়।", "intuition": "প্রতিটি তারকে নিজের চারপাশে ঘূর্ণায়মান চৌম্বক ঘূর্ণির উৎস হিসেবে কল্পনা করো (ডানহাত বৃদ্ধাঙ্গুলি নিয়ম)। দুটি তারে প্রবাহ একই দিকে হলে তাদের মাঝখানের অঞ্চলে একটির ক্ষেত্র কাগজের ভেতরে এবং অন্যটির ক্ষেত্র কাগজের বাইরে মুখ করে পরস্পরের সাথে লড়াই করে—তাই দুর্বল প্রবাহের তারের কাছাকাছি ভেতরেই নিরপেক্ষ বিন্দু (\\(B = 0\\)) পাওয়া যায়, আর বাইরে দুটি ক্ষেত্র একই দিকে যোগ হয়। প্রবাহ বিপরীতমুখী হলে ঠিক উল্টো ঘটনা ঘটে: মাঝখানে দুটি ক্ষেত্র একই দিকে যোগ হয়, ফলে \\(B = 0\\) কেবল তার দুটির বাইরে কম প্রবাহের তারের পাশেই সম্ভব।", "trap": "একমুখী প্রবাহে নিরপেক্ষ বিন্দু (\\(B = 0\\)) থাকে তার দুটির মাঝখানে কম প্রবাহের তারের কাছে, কিন্তু বিপরীতমুখী প্রবাহে নিরপেক্ষ বিন্দু সর্বদা তার দুটির বাইরে কম প্রবাহের তারের পাশে অবস্থান করে!", "quickExample": "\\(12\\text{ cm}\\) দূরত্বে দুটি সমান্তরাল তারে একই দিকে \\(2\\text{ A}\\) ও \\(4\\text{ A}\\) প্রবাহ চললে প্রথম তার থেকে \\(x\\) দূরত্বে ভেতরে \\(B = 0\\) হতে হলে \\(\\frac{2}{x} = \\frac{4}{12 - x} \\Rightarrow 24 - 2x = 4x \\Rightarrow x = 4\\text{ cm}\\)।"}, {"id": 58, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "হল ক্রিয়া ও ট্যানজেন্ট সূত্র", "question": "হল বিভব পার্থক্য (\\(V_H\\)), হল বৈদ্যুতিক প্রাবল্য (\\(E_H\\)) এবং ট্যানজেন্ট সূত্র কী?", "answer": "হল বিভব: \\(V_H = Bvd = \\frac{BI}{ntq}\\) • হল প্রাবল্য: \\(E_H = \\frac{V_H}{d} = Bv\\)<br>ট্যানজেন্ট সূত্র: \\(I \\propto \\tan\\theta \\Rightarrow \\frac{I_1}{I_2} = \\frac{\\tan\\theta_1}{\\tan\\theta_2}\\)", "context": "<b>প্রতীক:<\/b> \\(d\\) = পাতের প্রস্থ, \\(t\\) = পাতের পুরুত্ব, \\(n\\) = একক আয়তনে চার্জ বাহকের সংখ্যা, \\(q\\) = বাহকের চার্জ।<br><b>ব্যবহার:<\/b> হল ক্রিয়ার সাহায্যে চার্জ বাহকের প্রকৃতি (p-type নাকি n-type) এবং ঘনত্ব নির্ণয় করা হয়।", "intuition": "লম্ব চৌম্বক ক্ষেত্রের ভেতর দিয়ে চ্যাপ্টা পরিবাহী পাতে প্রবাহ চললে চৌম্বক বল \\(qvB\\) চার্জ বাহকগুলোকে একপাশের কিনারায় ঠেলে জমা করতে থাকে। এতে দুই প্রান্তের মাঝে একটি আড়াআড়ি তড়িৎ ক্ষেত্র \\(E_H\\) গড়ে ওঠে, যা বিপরীত দিকে \\(qE_H\\) বল দিয়ে চৌম্বক বলের সমান (\\(qE_H = qvB\\)) হলে সাম্যাবস্থা আসে—এটাই হল বিভব \\(V_H\\)! মজার বিষয় হলো, একই প্রবাহ \\(I\\)-এর জন্য ধনাত্মক হোল ও ঋণাত্মক ইলেকট্রন বিপরীত দিকে চলে বলে উভয়েই পাতের একই কিনারায় গিয়ে জমা হয়; ফলে হল বিভবের চিহ্ন দেখেই চার্জ বাহক p-type না n-type তা সরাসরি চেনা যায়। আর ট্যানজেন্ট গ্যালভানোমিটারে চুম্বক শলাকা ভূ-চৌম্বক ক্ষেত্র \\(H\\) ও কুণ্ডলীর লম্ব ক্ষেত্র \\(B\\)-এর লব্ধি বরাবর দাঁড়ায় বলে \\(\\tan\\theta = \\frac{B}{H} \\propto I\\) হয়।", "trap": "হল বিভবের সূত্র \\(V_H = \\frac{BI}{ntq}\\)-তে \\(t\\) হলো চৌম্বক ক্ষেত্রের সমান্তরাল পুরুত্ব (প্রস্থ \\(d\\) নয়)—অর্থাৎ স্থির প্রবাহের জন্য \\(V_H\\) পাতের প্রস্থ \\(d\\)-এর ওপর সরাসরি নির্ভর করে না!", "quickExample": "একটি পরিবাহীর প্রস্থ \\(d = 2\\text{ cm}\\), চার্জের তাড়নবেগ \\(v = 0.05\\text{ m s}^{-1}\\) এবং লম্ব চৌম্বক ক্ষেত্র \\(B = 0.8\\text{ T}\\) হলে হল বিভব \\(V_H = Bvd = 0.8 \\times 0.05 \\times 0.02 = 8 \\times 10^{-4}\\text{ V}\\)।"}, {"id": 59, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "লুপের টর্ক ও ভূ-চুম্বকত্ব", "question": "চৌম্বক ক্ষেত্রে লুপের ওপর ক্রিয়াশীল টর্ক \\(\\tau\\) এবং ভূ-চুম্বকত্বের উপাংশ (\\(H, V, B, \\delta\\)) সম্পর্কিত সূত্র কী?", "answer": "টর্ক: \\(\\vec{\\tau} = NI\\vec{A}\\times\\vec{B} = \\vec{m}\\times\\vec{B}\\), \\(\\tau = NIAB\\sin\\theta\\)<br>ভূ-চুম্বকত্ব: \\(H = B\\cos\\delta\\), \\(V = B\\sin\\delta\\), \\(B = \\sqrt{V^2 + H^2}\\) ও \\(\\tan\\delta = \\frac{V}{H}\\)", "context": "<b>প্রতীক:<\/b> \\(\\vec{m} = NI\\vec{A}\\) (চৌম্বক দ্বিমেরু ভ্রামক), \\(\\delta\\) = বিনতি কোণ (Dip angle), \\(H\\) = আনুভূমিক উপাংশ, \\(V\\) = উলম্ব উপাংশ।<br><b>তথ্য:<\/b> মেরুতে \\(\\delta = 90^\\circ\\) (\\(H=0\\)) এবং বিষুবরেখায় \\(\\delta = 0^\\circ\\) (\\(V=0\\))।", "intuition": "সুষম চৌম্বক ক্ষেত্রে রাখা তড়িৎবাহী লুপের বিপরীত দুই বাহুতে প্রবাহ উল্টো দিকে হওয়ায় বল দুটি সমান ও বিপরীত হয়—ফলে লুপটির ওপর মোট রৈখিক বল শূন্য, কিন্তু বল দুটি স্টিয়ারিং ঘোরানোর মতো দ্বন্দ্ব (টর্ক) তৈরি করে লুপের চৌম্বক ভ্রামক \\(\\vec{m}\\)-কে \\(\\vec{B}\\)-এর দিকে ঘুরিয়ে আনতে চায়। আর পৃথিবী নিজেই বিশাল দণ্ডচুম্বকের মতো কাজ করে: চৌম্বক মেরুতে বলরেখা খাড়াভাবে ঢোকে বা বের হয় বলে \\(\\delta = 90^\\circ\\) (\\(H = 0\\)), আর চৌম্বক বিষুবরেখায় বলরেখা আনুভূমিকভাবে চলে বলে \\(\\delta = 0^\\circ\\) (\\(V = 0\\))।", "trap": "টর্কের সূত্র \\(\\tau = NIAB\\sin\\theta\\)-তে \\(\\theta\\) হলো \\(\\vec{B}\\) ও তলের অভিলম্বের কোণ—তাই কুণ্ডলীর তল \\(\\vec{B}\\)-এর সমান্তরাল হলে টর্ক শূন্য নয়, বরং সর্বোচ্চ (\\(NIAB\\)) হয়!", "quickExample": "কোনো স্থানে \\(H = 30\\text{ }\\mu\\text{T}\\) এবং \\(V = 30\\sqrt{3}\\text{ }\\mu\\text{T}\\) হলে বিনতি কোণ \\(\\tan\\delta = \\frac{V}{H} = \\sqrt{3} \\Rightarrow \\delta = 60^\\circ\\) এবং মোট ক্ষেত্র \\(B = \\sqrt{30^2 + (30\\sqrt{3})^2} = 60\\text{ }\\mu\\text{T}\\)।"}, {"id": 60, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "প্রকৃত ও আপাত বিনতি", "question": "চুম্বক শলাকাকে উলম্ব অক্ষে বা চৌম্বক মধ্যতলে \\(\\alpha\\) কোণে ঘুরালে আপাত বিনতি \\(\\delta'\\) ও প্রকৃত বিনতি \\(\\delta\\) এর সম্পর্ক কী?", "answer": "উলম্ব অক্ষে \\(\\alpha\\) কোণে ঘুরালে: \\(\\tan\\delta' = \\frac{\\tan\\delta}{\\sin\\alpha}\\)<br>চৌম্বক মধ্যতলে \\(\\alpha\\) কোণে ঘুরালে: \\(\\tan\\delta' = \\frac{\\tan\\delta}{\\cos\\alpha}\\)", "context": "<b>প্রতীক:<\/b> \\(\\delta\\) = প্রকৃত বিনতি, \\(\\delta'\\) = আপাত বিনতি।<br><b>মনে রাখো:<\/b> যেকোনো দুটি পরস্পর লম্ব তলে আপাত বিনতি \\(\\delta_1, \\delta_2\\) হলে \\(\\cot^2\\delta = \\cot^2\\delta_1 + \\cot^2\\delta_2\\)।", "intuition": "একটি বিনতি শলাকাকে চৌম্বক মধ্যতল থেকে \\(\\alpha\\) কোণে ঘোরানো অন্য কোনো উলম্ব তলে আটকে রাখলে ভূ-চৌম্বক ক্ষেত্রের উলম্ব উপাংশ \\(V\\) পুরোপুরি কাজ করে, কিন্তু আনুভূমিক উপাংশ \\(H\\)-এর কেবল ওই তল বরাবর প্রক্ষেপণ \\(H\\cos\\alpha\\) কার্যকর থাকে। আনুভূমিক টান কমে যাওয়ায় অথচ উলম্ব টান একই থাকায় শলাকাটি সবসময় প্রকৃত বিনতির চেয়ে বেশি খাড়া হয়ে ঝুলে থাকে (\\(\\delta' \\gt \\delta\\)), এবং মধ্যতলের সাথে \\(90^\\circ\\) কোণে ঘোরালে আনুভূমিক উপাংশ শূন্য হয়ে শলাকাটি সম্পূর্ণ উল্লম্ব (\\(\\delta' = 90^\\circ\\)) হয়ে দাঁড়ায়!", "trap": "চৌম্বক মধ্যতল থেকে \\(\\alpha\\) কোণে ঘোরালে \\(\\tan\\delta' = \\frac{\\tan\\delta}{\\cos\\alpha}\\) হয় (\\(\\cos\\alpha\\) দিয়ে ভাগ, গুণ নয়)—তাই \\(\\alpha = 90^\\circ\\) হলে আপাত বিনতি সর্বদা \\(90^\\circ\\) হয়!", "quickExample": "কোনো স্থানে প্রকৃত বিনতি \\(\\delta = 45^\\circ\\) হলে চৌম্বক মধ্যতল থেকে \\(\\alpha = 60^\\circ\\) কোণে আনত তলে আপাত বিনতি \\(\\tan\\delta' = \\frac{\\tan 45^\\circ}{\\cos 60^\\circ} = \\frac{1}{0.5} = 2 \\Rightarrow \\delta' = \\tan^{-1}(2) \\approx 63.4^\\circ\\)।"}, {"id": 61, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "চুম্বকত্বের রাশিমালা", "question": "কম্পন ম্যাগনেটোমিটারের দোলনকাল \\(T\\), মেরুশক্তি \\(M\\), চৌম্বক দৈর্ঘ্য, চুম্বকায়ন মাত্রা \\(I\\), চৌম্বক গ্রাহীতা \\(\\chi\\) ও \\(\\mu_r\\) এর সূত্র কী?", "answer": "\\(T = 2\\pi\\sqrt{\\frac{I}{MH}}\\) • \\(M = m\\times 2l\\) • চৌম্বক দৈর্ঘ্য \\(2l = 0.85L\\)<br>\\(I = \\frac{M}{V} = \\frac{m}{A}\\) • \\(\\chi = \\frac{I}{H}\\) • \\(\\mu_r = \\frac{\\mu}{\\mu_0} = \\frac{B}{B_0} = \\frac{F_0}{F} = \\frac{H_0}{H}\\)", "context": "<b>প্রতীক:<\/b> দোলনকালে \\(I\\) = জড়তার ভ্রামক, \\(M\\) = চৌম্বক ভ্রামক, \\(H\\) = ভূ-চৌম্বক ক্ষেত্রের আনুভূমিক উপাংশ।<br><b>তথ্য:<\/b> ডায়াচৌম্বকের \\(\\chi \\lt  0\\), প্যারাচৌম্বকের \\(\\chi\\) ক্ষুদ্র ধনাত্মক, ফেরোচৌম্বকের \\(\\chi \\gg 1\\)।", "intuition": "কম্পন ম্যাগনেটোমিটারে ঝোলানো দণ্ডচুম্বক অনেকটা সরল দোলকের মতো আচরণ করে: জড়তার ভ্রামক \\(I\\) বেশি হলে দুলতে বেশি সময় লাগে (\\(T\\) বাড়ে), আর চৌম্বক ভ্রামক \\(M\\) বা ভূ-চৌম্বক ক্ষেত্র \\(H\\) শক্তিশালী হলে প্রত্যাবর্তী টর্ক বেড়ে দ্রুত দোলে (\\(T\\) কমে)। অন্যদিকে চৌম্বক গ্রাহীতা \\(\\chi = \\frac{I}{H}\\) বোঝায় বাহ্যিক চুম্বকায়ন ক্ষেত্র \\(H\\)-এর প্রভাবে কোনো পদার্থের পারমাণবিক দ্বিমেরুগুলো কত সহজে সাড়া দেয়—ডায়াচৌম্বক সামান্য বাধা দেয় (\\(\\chi \\lt 0\\)), প্যারাচৌম্বক দুর্বলভাবে সাড়া দেয় (\\(\\chi \\gt 0\\)), আর ফেরোচৌম্বক ক্ষেত্রকে বহুগুণ বাড়িয়ে তোলে (\\(\\chi \\gg 1\\))।", "trap": "দণ্ডচুম্বকের চৌম্বক দৈর্ঘ্য সর্বদা জ্যামিতিক দৈর্ঘ্যের প্রায় \\(0.85\\) গুণ (\\(2l = 0.85L\\)) হয়, এবং চুম্বকটিকে দৈর্ঘ্যের সমান্তরালে লম্বালম্বি দুই ভাগ করলে মেরুশক্তি অর্ধেক হয় কিন্তু আড়াআড়ি কাটলে মেরুশক্তি অপরিবর্তিত থাকে!", "quickExample": "একটি দণ্ডচুম্বকের জ্যামিতিক দৈর্ঘ্য \\(20\\text{ cm}\\) এবং মেরুশক্তি \\(5\\text{ A m}\\) হলে চৌম্বক দৈর্ঘ্য \\(2l = 0.85 \\times 0.20 = 0.17\\text{ m}\\) এবং চৌম্বক ভ্রামক \\(M = m \\times 2l = 5 \\times 0.17 = 0.85\\text{ A m}^2\\)।"}, {"id": 62, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "ফ্যারাডে ও লেনজের সূত্র", "question": "চৌম্বক ফ্লাক্স \\(\\phi\\), ফ্যারাডের আবেশ সূত্র, লেনজের সূত্র এবং গতিশীল \\(\\text{emf}\\) এর সূত্র কী?", "answer": "\\(\\phi = \\vec{A}\\cdot\\vec{B} = AB\\cos\\theta\\)<br>ফ্যারাডে/লেনজ সূত্র: \\(\\varepsilon = -N\\frac{d\\phi}{dt}\\)<br>গতিশীল \\(\\text{emf}\\): \\(\\varepsilon = Blv\\sin\\theta\\)", "context": "<b>ধারণা:<\/b> ঋণাত্মক চিহ্নটি লেনজের সূত্র নির্দেশ করে—আবিষ্ট প্রবাহ সর্বদা তার সৃষ্টির কারণকে (ফ্লাক্স পরিবর্তনকে) বাধা দেয়; এটি <b>শক্তির সংরক্ষণ<\/b> নীতির প্রকাশ।<br>গতিশীল \\(\\text{emf}\\): \\(l\\) দৈর্ঘ্যের পরিবাহী \\(v\\) বেগে \\(B\\) ক্ষেত্রে চললে এটি সৃষ্টি হয়।", "intuition": "কোনো কুণ্ডলীর ভেতর দিয়ে অতিক্রান্ত চৌম্বক বলরেখার সংখ্যা (ফ্লাক্স) কেবল স্থির থাকলে নয়, বরং সময়ের সাথে বদলালেই তড়িচ্চালক বল (\\(\\text{emf}\\)) জন্মায়—পরিবর্তন যত দ্রুত হয়, আবিষ্ট \\(\\text{emf}\\) তত বড় হয়। লেনজের সূত্রের ঋণাত্মক চিহ্নটি আসলে এক ধরনের <b>চৌম্বক জড়তা (magnetic inertia)<\/b> ও <b>শক্তির সংরক্ষণশীলতার<\/b> প্রকাশ: ফ্লাক্স বাড়তে চাইলে আবিষ্ট প্রবাহ বিপরীত চৌম্বক ক্ষেত্র তৈরি করে বাড়তে বাধা দেয়, আর কমতে চাইলে টেনে ধরে রাখতে চায়। এই বাধার বিরুদ্ধে বাহ্যিক যান্ত্রিক কাজ করলেই তবেই তড়িৎ শক্তি উৎপন্ন হয়—বাধা না থাকলে শূন্য থেকে অফুরন্ত শক্তি তৈরি হয়ে যেত।", "trap": "চৌম্বক ফ্লাক্স \\(\\phi = AB\\cos\\theta\\)-এ \\(\\theta\\) হলো তলের অভিলম্ব ও চৌম্বক ক্ষেত্রের মধ্যবর্তী কোণ—প্রশ্নে কুণ্ডলীর তলের সাথে কোণ \\(\\alpha\\) দেওয়া থাকলে \\(\\theta = 90^\\circ - \\alpha\\) বসাতে হবে। এছাড়া চৌম্বক ফ্লাক্স যত বড়ই হোক, তা সময়ের সাথে স্থির থাকলে \\(\\frac{d\\phi}{dt} = 0\\) হওয়ায় আবিষ্ট \\(\\text{emf}\\) শূন্য হয়।", "quickExample": "\\(50\\) পাকের একটি কুণ্ডলীতে \\(0.2\\text{ s}\\) সময়ে চৌম্বক ফ্লাক্স \\(0.08\\text{ Wb}\\) থেকে \\(0.02\\text{ Wb}\\)-এ নেমে এলে, আবিষ্ট \\(\\text{emf}\\): \\(\\varepsilon = -N\\frac{\\Delta\\phi}{\\Delta t} = -50 \\times \\frac{0.02 - 0.08}{0.2} = +15\\text{ V}\\)। একইভাবে \\(0.5\\text{ T}\\) ক্ষেত্রের লম্বে \\(2\\text{ m}\\) তার \\(4\\text{ m s}^{-1}\\) বেগে চললে গতিশীল \\(\\text{emf} = Blv = 0.5 \\times 2 \\times 4 = 4\\text{ V}\\)।"}, {"id": 63, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "স্বকীয় আবেশ", "question": "ঘূর্ণায়মান কুণ্ডলীতে আবিষ্ট তড়িচ্চালক বল \\(\\varepsilon\\), স্বকীয় আবেশের সূত্র এবং বৃত্তাকার কুণ্ডলী ও সলিনয়েডের স্বকীয় আবেশ গুণাঙ্ক \\(L\\) কত?", "answer": "\\(\\varepsilon = NAB\\omega\\sin\\omega t\\); স্বকীয় আবেশে \\(N\\phi = LI\\) ও \\(\\varepsilon = -L\\frac{dI}{dt}\\)<br>বৃত্তাকার কুণ্ডলী: \\(L = \\frac{\\pi\\mu_0 N^2 r}{2}\\) • সলিনয়েড: \\(L = \\frac{\\pi\\mu_0 N^2 r^2}{l}\\)", "context": "<b>প্রতীক:<\/b> \\(L\\) = স্বকীয় আবেশ গুণাঙ্ক (একক হেনরি, \\(\\text{H}\\)), \\(\\omega = 2\\pi f\\) (কৌণিক কম্পাঙ্ক)।<br><b>ধারণা:<\/b> \\(L\\) কুণ্ডলীর জ্যামিতি ও পাক সংখ্যার বর্গের (\\(N^2\\)) সমানুপাতিক; প্রবাহ \\(I\\)-এর ওপর নির্ভর করে না।", "intuition": "যান্ত্রিক গতিতে ভর \\(m\\) যেমন বেগের হঠাৎ পরিবর্তনে জড়তার মাধ্যমে বাধা দেয়, তড়িৎ বর্তনীতে স্বকীয় আবেশ গুণাঙ্ক \\(L\\) ঠিক তেমনই <b>চৌম্বক জড়তা<\/b> হিসেবে প্রবাহের হঠাৎ বৃদ্ধি বা হ্রাসে বাধা দেয়। কুণ্ডলীতে প্রবাহ বদলালে এর নিজের ভেতরের চৌম্বক ফ্লাক্স বদলায় এবং কুণ্ডলী নিজেই একটি বিপরীত \\(\\text{emf}\\) তৈরি করে (\\(\\varepsilon = -L\\frac{dI}{dt}\\))—তাই ভারী আবেশকের সুইচ হঠাৎ বন্ধ করলে \\(\\frac{dI}{dt}\\) বিশাল হয়ে বড় ভোল্টেজ স্পাইক বা স্পার্ক দেখা যায়। আবেশ গুণাঙ্ক \\(L\\) পুরোপুরি কুণ্ডলীর জ্যামিতি, ভেতরের কোর মাধ্যম ও পাকসংখ্যার বর্গের (\\(N^2\\)) বৈশিষ্ট্য।", "trap": "\\(L = \\frac{N\\phi}{I}\\) দেখে অনেকেই ভাবে প্রবাহ \\(I\\) দ্বিগুণ করলে \\(L\\) অর্ধেক হবে—আসলে \\(I\\) বাড়লে \\(\\phi\\)-ও সমানুপাতিকভাবে বাড়ে, ফলে \\(L\\) প্রবাহের ওপর নির্ভরশীল নয়। বরং জ্যামিতি স্থির রেখে পাকসংখ্যা \\(N\\) দ্বিগুণ করলে \\(L\\) চারগুণ হয় (\\(L \\propto N^2\\))।", "quickExample": "\\(0.4\\text{ H}\\) স্বকীয় আবেশ গুণাঙ্কের একটি কুণ্ডলীতে \\(0.05\\text{ s}\\) সময়ে প্রবাহ \\(6\\text{ A}\\) থেকে \\(2\\text{ A}\\)-এ কমে এলে, আবিষ্ট \\(\\text{emf}\\): \\(\\varepsilon = -L\\frac{\\Delta I}{\\Delta t} = -0.4 \\times \\frac{2 - 6}{0.05} = +32\\text{ V}\\)।"}, {"id": 64, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "সঞ্চিত শক্তি ও পারস্পরিক আবেশ", "question": "চৌম্বক আবেশকে সঞ্চিত শক্তি \\(W\\) এবং পারস্পরিক আবেশের সূত্রগুলো কী?", "answer": "সঞ্চিত শক্তি: \\(W = \\frac{1}{2}LI^2\\)<br>পারস্পরিক আবেশ: \\(N\\phi = MI\\) এবং গৌণ কুণ্ডলীতে \\(\\varepsilon = -M\\frac{dI}{dt}\\)", "context": "<b>প্রতীক:<\/b> \\(M\\) = পারস্পরিক আবেশ গুণাঙ্ক (একক হেনরি, \\(\\text{H}\\))।<br><b>তুলনা:<\/b> আবেশকের শক্তি \\(\\frac{1}{2}LI^2\\) অনেকটা গতিশক্তি \\(\\frac{1}{2}mv^2\\) বা ধারকের শক্তি \\(\\frac{1}{2}CV^2\\)-এর মতো।", "intuition": "কোনো আবেশকে প্রবাহ শূন্য থেকে \\(I\\)-এ তুলতে গেলে তার নিজের বিপরীত \\(\\text{emf}\\)-এর বিরুদ্ধে উৎসকে যে কাজ করতে হয়, তা অপচয় না হয়ে কুণ্ডলীর চৌম্বক ক্ষেত্রে \\(W = \\frac{1}{2}LI^2\\) শক্তি হিসেবে জমা থাকে—যা ঠিক গতিশক্তি \\(\\frac{1}{2}mv^2\\)-এর তড়িৎচৌম্বকীয় রূপ। আর পাশাপাশি রাখা দুটি কুণ্ডলীর একটিতে প্রবাহ বদলালে তার পরিবর্তনশীল চৌম্বক বলরেখা দ্বিতীয় কুণ্ডলীকে ছেদ করে সেখানে \\(\\varepsilon_s = -M\\frac{dI_p}{dt}\\) তড়িচ্চালক বল আবেশিত করে—এই চৌম্বক সংযোগই (magnetic coupling) পারস্পরিক আবেশ ও ট্রান্সফর্মারের ভিত্তি।", "trap": "পারস্পরিক আবেশের সূত্র \\(\\varepsilon_s = -M\\frac{dI_p}{dt}\\)-এ প্রবাহের পরিবর্তন ঘটে মুখ্য কুণ্ডলীতে (\\(I_p\\)), আর \\(\\text{emf}\\) আবিষ্ট হয় গৌণ কুণ্ডলীতে (\\(\\varepsilon_s\\))। মুখ্য কুণ্ডলীতে স্থির \\(\\text{DC}\\) প্রবাহ চললে \\(\\frac{dI_p}{dt} = 0\\) হয় এবং গৌণ কুণ্ডলীতে কোনো \\(\\text{emf}\\) তৈরি হয় না। এছাড়া \\(W \\propto I^2\\) হওয়ায় প্রবাহ দ্বিগুণ করলে সঞ্চিত শক্তি \\(4\\) গুণ হয়।", "quickExample": "\\(0.5\\text{ H}\\) আবেশকের মধ্য দিয়ে \\(4\\text{ A}\\) প্রবাহ চললে সঞ্চিত চৌম্বক শক্তি \\(W = \\frac{1}{2}LI^2 = \\frac{1}{2} \\times 0.5 \\times 4^2 = 4\\text{ J}\\)। আবার \\(M = 0.2\\text{ H}\\) হলে \\(0.01\\text{ s}\\)-এ মুখ্য প্রবাহ \\(5\\text{ A}\\) থেকে \\(0\\text{ A}\\)-এ নামলে গৌণ \\(\\text{emf} = -0.2 \\times \\frac{0 - 5}{0.01} = 100\\text{ V}\\)।"}, {"id": 65, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "পরিবর্তী প্রবাহ ও ক্ষমতা", "question": "পরিবর্তী তড়িচ্চালক শক্তি \\(\\varepsilon\\), প্রবাহমাত্রা \\(I\\) এবং কার্যকর ক্ষমতা \\(P\\) এর সমীকরণ কী?", "answer": "\\(\\varepsilon = \\varepsilon_0\\sin\\omega t = \\varepsilon_0\\sin 2\\pi ft = \\varepsilon_0\\sin\\left(\\frac{2\\pi}{T}\\right)t\\)<br>\\(I = I_0\\sin\\omega t = I_0\\sin 2\\pi ft = I_0\\sin\\left(\\frac{2\\pi}{T}\\right)t\\)<br>\\(P = \\frac{\\varepsilon^2}{R} = I_{\\text{rms}}^2 R\\)", "context": "<b>প্রতীক:<\/b> \\(\\varepsilon_0, I_0\\) = শীর্ষ মান (Peak value), \\(f\\) = কম্পাঙ্ক (বাংলাদেশে \\(50\\text{ Hz}\\)), \\(T = \\frac{1}{f}\\) = পর্যায়কাল।<br><b>তথ্য:<\/b> \\(50\\text{ Hz}\\) AC প্রতি সেকেন্ডে \\(100\\) বার দিক পরিবর্তন করে।", "intuition": "সুষম চৌম্বক ক্ষেত্রে একটি কুণ্ডলীকে সমকৌণিক বেগে ঘোরালে তার ফ্লাক্স সাইন তরঙ্গের মতো পর্যায়ক্রমে বাড়ে-কমে, ফলে উৎপন্ন \\(\\text{AC}\\) ভোল্টেজ ও প্রবাহ প্রতি অর্ধচক্রে দিক বদলায়। প্রবাহ সামনে-পেছনে দোল খেলেও রোধের ভেতর উৎপন্ন তাপশক্তি \\(I^2 R\\) সবসময় ধনাত্মক থাকে (বর্গের কারণে দিকের চিহ্ন মুছে যায়)—তাই পূর্ণ চক্রে গড় প্রবাহ শূন্য হলেও গড় কার্যকর ক্ষমতা শূন্য হয় না, বরং \\(P = I_{\\text{rms}}^2 R\\) হয়।", "trap": "\\(I = I_0\\sin(\\omega t)\\) সমীকরণ থেকে কম্পাঙ্ক \\(f\\) বের করার সময় \\(\\omega\\)-কেই সরাসরি \\(f\\) ধরে ফেলা সবচেয়ে সাধারণ ভুল—মনে রাখো \\(\\omega = 2\\pi f\\), তাই \\(f = \\frac{\\omega}{2\\pi}\\)। প্রতি পূর্ণ চক্রে \\(\\text{AC}\\) দুইবার দিক বদলায়, ফলে প্রতি সেকেন্ডে দিক পরিবর্তনের সংখ্যা \\(2f\\) (\\(50\\text{ Hz}\\)-এ \\(100\\) বার)।", "quickExample": "একটি পরিবর্তী প্রবাহের সমীকরণ \\(I = 10\\sin(100\\pi t)\\text{ A}\\) হলে, \\(\\omega = 2\\pi f = 100\\pi \\implies f = 50\\text{ Hz}\\), পর্যায়কাল \\(T = \\frac{1}{50} = 0.02\\text{ s}\\) এবং \\(I_{\\text{rms}} = \\frac{10}{\\sqrt{2}} \\approx 7.07\\text{ A}\\)।"}, {"id": 66, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "AC গড় ও RMS মান", "question": "পূর্ণ ও অর্ধচক্রের জন্য গড় তড়িচ্চালক বল/প্রবাহ এবং \\(\\text{rms}\\) মানসমূহ কী?", "answer": "• পূর্ণ চক্রের গড় তড়িচ্চালক বল \\(= 0\\text{ V}\\)<br>• অর্ধচক্রের গড়: \\(\\varepsilon_{\\text{av}} = \\frac{2}{\\pi}\\varepsilon_0 = 0.637\\varepsilon_0\\), \\(I_{\\text{av}} = \\frac{2}{\\pi}I_0 = 0.637I_0\\)<br>• \\(\\text{rms}\\) মান: \\(\\varepsilon_{\\text{rms}} = \\frac{\\varepsilon_0}{\\sqrt{2}} = 0.707\\varepsilon_0\\), \\(I_{\\text{rms}} = \\frac{I_0}{\\sqrt{2}} = 0.707I_0\\)", "context": "<b>মনে রাখো:<\/b> বাসার \\(220\\text{ V}\\) AC লাইনের \\(220\\text{ V}\\) হলো <b>\\(\\text{rms}\\) মান<\/b> (শীর্ষ মান \\(\\varepsilon_0 = 220\\sqrt{2} \\approx 311\\text{ V}\\))। অ্যামিটার/ভোল্টমিটার সর্বদা \\(\\text{rms}\\) মান পরিমাপ করে।", "intuition": "পূর্ণ চক্রে সাইন তরঙ্গের ধনাত্মক ও ঋণাত্মক অর্ধচক্র পরস্পরকে নাকচ করে দেওয়ায় সাধারণ গড় মান শূন্য হয়, অথচ সেই প্রবাহ বাতি জ্বালায় ও হিটার গরম করে! এই বাস্তব তাপীয় ক্ষমতা মাপতেই <b>\\(\\text{RMS}\\) (বর্গমূলীয় গড় বর্গ)<\/b> মানের জন্ম: \\(I_{\\text{rms}}\\) হলো ঠিক সেই স্থির \\(\\text{DC}\\) প্রবাহের মান, যা একই রোধে সমান সময়ে এই পরিবর্তী প্রবাহের সমপরিমাণ তাপশক্তি উৎপন্ন করে। তাই বাসার লাইনের \\(220\\text{ V}\\) বা যেকোনো \\(\\text{AC}\\) অ্যামিটার-ভোল্টমিটারের পাঠ সর্বদা এই সমতুল্য তাপীয় বা \\(\\text{RMS}\\) মান নির্দেশ করে।", "trap": "বাসাবাড়ির \\(220\\text{ V}\\) লাইন বা \\(\\text{AC}\\) মিটারের পাঠ হলো \\(\\text{RMS}\\) মান, শীর্ষ মান নয়—তাই শীর্ষ মান বের করতে \\(\\sqrt{2}\\) দিয়ে গুণ করতে হয় (\\(220\\sqrt{2} \\approx 311\\text{ V}\\)), ভাগ নয়। আর প্রশ্নে 'পূর্ণ চক্রের গড় মান' চাইলে উত্তর \\(0.637I_0\\) নয়, সর্বদা \\(0\\) হবে—\\(0.637I_0\\) কেবল অর্ধচক্রের গড়।", "quickExample": "বাংলাদেশের বাসাবাড়ির \\(\\text{AC}\\) লাইনে \\(\\varepsilon_{\\text{rms}} = 220\\text{ V}\\) হলে, শীর্ষ মান \\(\\varepsilon_0 = \\sqrt{2}\\,\\varepsilon_{\\text{rms}} = 1.414 \\times 220 \\approx 311.1\\text{ V}\\) এবং অর্ধচক্রের গড় মান \\(\\varepsilon_{\\text{av}} = 0.637 \\times 311.1 \\approx 198.2\\text{ V}\\)।"}, {"id": 67, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "আকার ও শীর্ষক গুণাঙ্ক", "question": "পরিবর্তী প্রবাহের আকার গুণাঙ্ক (Form Factor) এবং শীর্ষক গুণাঙ্ক (Peak Factor) এর সূত্র ও মান কত?", "answer": "Form Factor \\(= \\frac{I_{\\text{rms}}}{I_{\\text{av}}} = \\frac{\\pi}{2\\sqrt{2}} = 1.11\\)<br>Peak Factor \\(= \\frac{I_0}{I_{\\text{rms}}} = \\sqrt{2} = 1.41\\)", "context": "<b>ধারণা:<\/b> সাইন তরঙ্গের (Sinusoidal AC) জন্য এই দুটি ধ্রুবক মান (\\(1.11\\) এবং \\(1.414\\)) সর্বদা নির্দিষ্ট এবং এককবিহীন।", "intuition": "আকার গুণাঙ্ক (Form Factor \\(= \\frac{I_{\\text{rms}}}{I_{\\text{av}}} = 1.11\\)) তুলনা করে তরঙ্গটির তাপীয় কার্যকারিতা (\\(\\text{RMS}\\)) তার সাধারণ অর্ধচক্র গড়ের চেয়ে কত বেশি—এটি তরঙ্গের আকৃতি কতটা চ্যাপ্টা বা সূঁচালো তা নির্দেশ করে (বর্গ তরঙ্গের জন্য এটি \\(1\\))। আর শীর্ষক গুণাঙ্ক (Peak Factor বা Crest Factor \\(= \\frac{I_0}{I_{\\text{rms}}} = \\sqrt{2} \\approx 1.414\\)) জানায় তরঙ্গের সর্বোচ্চ চূড়া তার \\(\\text{RMS}\\) রেটিংয়ের চেয়ে কত গুণ উঁচু—বৈদ্যুতিক তারের ইনসুলেশন কতটুকু সর্বোচ্চ ভোল্টেজ সহ্য করবে তা নকশা করতে এটি অপরিহার্য।", "trap": "পরীক্ষায় শিক্ষার্থীরা প্রায়ই Form Factor (\\(1.11\\)) ও Peak Factor (\\(1.414\\))-এর অনুপাত ও মান উল্টে ফেলে। মনে রাখার সহজ কৌশল: 'Peak' কথাটি শীর্ষ মান \\(I_0\\)-এর সাথে যুক্ত, তাই \\(\\text{Peak Factor} = \\frac{I_0}{I_{\\text{rms}}} = \\sqrt{2} \\approx 1.414\\) এবং \\(\\text{Form Factor} = \\frac{I_{\\text{rms}}}{I_{\\text{av}}} = 1.11\\); উভয়ই এককবিহীন।", "quickExample": "কোনো সাইনুসয়ডাল \\(\\text{AC}\\)-এর অর্ধচক্রের গড় মান \\(I_{\\text{av}} = 10\\text{ A}\\) হলে, Form Factor থেকে \\(I_{\\text{rms}} = 1.11 \\times 10 = 11.1\\text{ A}\\) এবং Peak Factor থেকে শীর্ষ মান \\(I_0 = 1.414 \\times 11.1 \\approx 15.7\\text{ A}\\)।"}, {"id": 68, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "ট্রান্সফরমার", "question": "ট্রান্সফরমারের সমীকরণ, রূপান্তর গুণক (\\(K\\)), ক্ষমতা এবং স্টেপ আপ ও স্টেপ ডাউন ট্রান্সফরমারের শর্ত কী?", "answer": "সমীকরণ: \\(\\frac{E_p}{E_s} = \\frac{I_s}{I_p} = \\frac{n_p}{n_s} = \\sqrt{\\frac{R_p}{R_s}}\\); \\(K = \\frac{E_s}{E_p}\\); \\(P = E_pI_p = E_sI_s\\)<br>স্টেপ আপ: \\(E_p \\lt  E_s\\) ও \\(n_p \\lt  n_s\\) • স্টেপ ডাউন: \\(E_p \\gt  E_s\\) ও \\(n_p \\gt  n_s\\)", "context": "<b>প্রতীক:<\/b> \\(p\\) = মুখ্য কুণ্ডলী (Primary), \\(s\\) = গৌণ কুণ্ডলী (Secondary)।<br><b>ধারণা:<\/b> ট্রান্সফরমার পারস্পরিক আবেশের নীতিতে <b>শুধু AC-তে<\/b> কাজ করে (DC-তে নয়)। স্টেপ আপ ভোল্টেজ বাড়ায় ও কারেন্ট কমায়, কিন্তু ক্ষমতা ও কম্পাঙ্ক অপরিবর্তিত থাকে।", "intuition": "ট্রান্সফর্মার পারস্পরিক আবেশের মাধ্যমে \\(\\text{AC}\\) ভোল্টেজকে প্রয়োজনমতো বাড়ায় বা কমায়। এটি <b>\\(\\text{DC}\\)-তে কখনোই কাজ করে না<\/b>, কারণ \\(\\text{DC}\\) প্রবাহ স্থির থাকায় লৌহ কোরের চৌম্বক ফ্লাক্স সময়ের সাথে বদলায় না (\\(\\frac{d\\phi}{dt} = 0\\))—ফলে গৌণ কুণ্ডলীতে কোনো \\(\\text{emf}\\) আবিষ্ট হয় না; বরং বিপরীত \\(\\text{emf}\\) না থাকায় কম রোধের মুখ্য কুণ্ডলীতে অতিরিক্ত কারেন্ট বয়ে কুণ্ডলী পুড়ে যেতে পারে। আদর্শ ট্রান্সফর্মারে শক্তি সংরক্ষিত থাকে (\\(E_p I_p = E_s I_s\\)), তাই ভোল্টেজ যত গুণ বাড়ে প্রবাহ ঠিক তত গুণ কমে।", "trap": "ট্রান্সফর্মারে ভোল্টেজ ও পাকসংখ্যার অনুপাত সরাসরি সমানুপাতিক (\\(\\frac{E_p}{E_s} = \\frac{n_p}{n_s}\\)), কিন্তু প্রবাহের অনুপাত ঠিক উল্টো (\\(\\frac{I_s}{I_p}\\))। এছাড়া ট্রান্সফর্মার কখনো শক্তির উৎস নয় (ক্ষমতা বাড়াতে পারে না), \\(\\text{AC}\\)-এর কম্পাঙ্ক বদলায় না এবং \\(\\text{DC}\\)-তে আউটপুট ভোল্টেজ সর্বদা \\(0\\text{ V}\\) হয়।", "quickExample": "একটি আদর্শ স্টেপ-আপ ট্রান্সফর্মারের \\(n_p = 200\\), \\(n_s = 1000\\), \\(E_p = 220\\text{ V}\\) ও \\(I_p = 5\\text{ A}\\) হলে, \\(E_s = E_p \\frac{n_s}{n_p} = 220 \\times \\frac{1000}{200} = 1100\\text{ V}\\) এবং \\(I_s = I_p \\frac{n_p}{n_s} = 5 \\times \\frac{200}{1000} = 1\\text{ A}\\) (ক্ষমতা উভয় পাশে \\(1100\\text{ W}\\))।"}, {"id": 69, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "স্নেলের সূত্র ও প্রতিসরাঙ্ক", "question": "স্নেলের সূত্র এবং আপেক্ষিক প্রতিসরাঙ্ক \\({}_a\\mu_b\\) ও \\({}_b\\mu_c\\) এর সম্পর্কগুলো কী?", "answer": "\\(\\mu = \\frac{\\sin i}{\\sin r}\\) এবং \\(\\mu_1\\sin\\theta_1 = \\mu_2\\sin\\theta_2\\)<br>\\({}_a\\mu_b = \\frac{1}{{}_b\\mu_a} = \\frac{\\mu_b}{\\mu_a} = \\frac{c_a}{c_b} = \\frac{\\lambda_a}{\\lambda_b} = \\frac{1}{\\sin\\theta_c}\\)<br>\\({}_b\\mu_c = \\frac{{}_a\\mu_c}{{}_a\\mu_b}\\) এবং \\({}_a\\mu_b \\times {}_b\\mu_c \\times {}_c\\mu_a = 1\\)", "context": "<b>প্রতীক:<\/b> \\({}_a\\mu_b\\) = \\(a\\) মাধ্যমের সাপেক্ষে \\(b\\) মাধ্যমের প্রতিসরাঙ্ক।<br><b>মূল তথ্য:<\/b> প্রতিসরণের সময় আলোর বেগ (\\(c\\)) ও তরঙ্গদৈর্ঘ্য (\\(\\lambda\\)) পরিবর্তিত হয়, কিন্তু <b>কম্পাঙ্ক (\\(f\\)) অপরিবর্তিত<\/b> থাকে।", "intuition": "কল্পনা করো একটি গাড়ির সামনের দুই চাকা তির্যকভাবে পাকা রাস্তা (হালকা মাধ্যম) থেকে কাদামাটিতে (ঘন মাধ্যম) ঢুকছে। যে চাকাটি আগে কাদায় ঢোকে সেটি ধীর হয়ে যায়, আর অন্য চাকাটি তখনও দ্রুত চলতে থাকে—ফলে গাড়িটি অভিলম্বের দিকে ঘুরে যায়। আলোর তরঙ্গমুখও ঠিক একইভাবে ঘন মাধ্যমে ঢুকলে বেগ কমে যাওয়ায় অভিলম্বের দিকে বেঁকে যায়, আর এই বেগের অনুপাতই প্রতিসরাঙ্ক \\(\\mu = \\frac{c}{v}\\)।", "trap": "প্রতিসরণের সময় আলোর বেগ (\\(v\\)) ও তরঙ্গদৈর্ঘ্য (\\(\\lambda\\)) বদলালেও উৎসের ওপর নির্ভরশীল কম্পাঙ্ক (\\(f\\)) সর্বদা অপরিবর্তিত থাকে। আরেকটি সাধারণ ভুল হলো \\({}_a\\mu_b = \\frac{\\mu_a}{\\mu_b}\\) লেখা—সঠিকটি হলো \\({}_a\\mu_b = \\frac{\\mu_b}{\\mu_a} = \\frac{c_a}{c_b}\\) (যার প্রতিসরাঙ্ক বের করছ সে লবে থাকবে)।", "quickExample": "বায়ুর সাপেক্ষে কাচ ও পানির প্রতিসরাঙ্ক যথাক্রমে \\({}_a\\mu_g = 1.5\\) ও \\({}_a\\mu_w = 1.33\\) হলে, পানির সাপেক্ষে কাচের প্রতিসরাঙ্ক \\({}_w\\mu_g = \\frac{{}_a\\mu_g}{{}_a\\mu_w} = \\frac{1.5}{1.33} \\approx 1.13\\)।"}, {"id": 70, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "ক্রান্তি কোণ (SVSL)", "question": "দুটি মাধ্যমের মধ্যে ক্রান্তি কোণ \\(\\theta_c\\) নির্ণয়ের সূত্র কী?", "answer": "\\(\\theta_c = \\sin^{-1}\\left(\\frac{1}{{}_2\\mu_1}\\right) = \\sin^{-1}\\left(\\frac{\\mu_2}{\\mu_1}\\right) = \\sin^{-1}\\left(\\frac{\\text{হালকা মাধ্যমের প্রতিসরাঙ্ক}}{\\text{ঘন মাধ্যমের প্রতিসরাঙ্ক}}\\right)\\)", "context": "<b>শর্ত:<\/b> পূর্ণ অভ্যন্তরীণ প্রতিফলন ও ক্রান্তি কোণের জন্য আলোকে অবশ্যই <b>ঘন থেকে হালকা মাধ্যমে<\/b> যেতে হবে এবং আপতন কোণ \\(i \\gt  \\theta_c\\) হতে হবে।<br><b>উদাহরণ:<\/b> হীরক (\\(\\mu=2.4\\)) ও পানির (\\(\\mu=1.33\\)) ক্ষেত্রে \\(\\theta_c = \\sin^{-1}(1.33/2.4) \\approx 33.65^\\circ\\)।", "intuition": "ঘন মাধ্যম থেকে হালকা মাধ্যমে আলো বের হলে বেগ বেড়ে যাওয়ায় রশ্মি অভিলম্ব থেকে দূরে সরে যায়। আপতন কোণ বাড়াতে থাকলে একটি বিশেষ কোণে (\\(\\theta_c\\)) প্রতিসরিত রশ্মি \\(90^\\circ\\) কোণে বিভেদতল ঘেঁষে চলে। এর চেয়েও বড় কোণে (\\(i \\gt \\theta_c\\)) আলো পড়লে স্নেলের সূত্রে \\(\\sin r \\gt 1\\) আসে, যা অসম্ভব—ফলে আলো আর বাইরে যেতে না পেরে \\(100\\%\\) ঘন মাধ্যমেই প্রতিফলিত হয়ে ফিরে আসে।", "trap": "ক্রান্তি কোণ ও পূর্ণ অভ্যন্তরীণ প্রতিফলন কেবল ঘন থেকে হালকা মাধ্যমেই সম্ভব, হালকা থেকে ঘন মাধ্যমে কখনোই নয়। সূত্রে ভগ্নাংশটি সবসময় \\(\\frac{\\mu_{\\text{rarer}}}{\\mu_{\\text{denser}}} \\lt 1\\) বসাতে হবে—উল্টো বসালে \\(\\sin\\theta_c \\gt 1\\) হয়ে অবাস্তব মান আসে।", "quickExample": "কাচ (\\(\\mu_1 = 1.5\\)) থেকে বায়ুতে (\\(\\mu_2 = 1\\)) আলোর ক্রান্তি কোণ \\(\\theta_c = \\sin^{-1}\\left(\\frac{1}{1.5}\\right) = \\sin^{-1}(0.667) \\approx 41.8^\\circ\\)।"}, {"id": 71, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "আপাত গভীরতা ও পার্শ্ব সরণ", "question": "তরলের প্রতিসরাঙ্ক, আপাত গভীরতা, আপাত সরণ এবং কাচ ফলকের পার্শ্ব সরণ \\(x\\) নির্ণয়ের সূত্র কী?", "answer": "\\(\\mu = \\frac{\\text{প্রকৃত গভীরতা}}{\\text{আপাত গভীরতা}} = \\frac{\\tan\\theta_r}{\\tan\\theta_a}\\) • আপাত গভীরতা \\(= \\frac{\\text{প্রকৃত গভীরতা}}{\\mu}\\)<br>আপাত সরণ \\(= \\text{প্রকৃত গভীরতা} - \\text{আপাত গভীরতা}\\) • পার্শ্ব সরণ: \\(x = \\frac{d\\sin(i - r)}{\\cos r}\\)", "context": "<b>প্রতীক:<\/b> \\(d\\) = কাচ ফলকের পুরুত্ব, \\(i\\) = আপতন কোণ, \\(r\\) = প্রতিসরণ কোণ।<br><b>ধারণা:<\/b> লম্বভাবে (হালকা মাধ্যম থেকে ঘন মাধ্যমে) দেখলে তলদেশ ওপরে উঠে এসেছে বলে মনে হয়; আপাত সরণ \\(= d\\left(1 - \\frac{1}{\\mu}\\right)\\)।", "intuition": "পানির নিচে থাকা কোনো কয়েন থেকে অপসারী আলোকরশ্মি বায়ুতে বের হওয়ার সময় অভিলম্ব থেকে দূরে বেঁকে যায়। আমাদের মস্তিষ্ক আলোকে সরলরেখায় আসে ধরে নিয়ে ওই বেশি ছড়ানো রশ্মিগুলোকে পেছনে বাড়ালে সেগুলো প্রকৃত কয়েনের চেয়ে ওপরে ছেদ করে—তাই পুকুর বা কাচ ফলকের তলদেশ কম গভীর মনে হয়। সমান্তরাল কাচ ফলকে আলো দুবার সমান ও বিপরীত দিকে বাঁকে বলে নির্গত রশ্মি সমান্তরাল থেকে পাশে সরে যায়।", "trap": "প্রশ্নে 'আপাত গভীরতা' (\\(d' = \\frac{d}{\\mu}\\)) নাকি 'আপাত সরণ বা কতটুকু ওপরে উঠেছে' (\\(\\Delta d = d - \\frac{d}{\\mu}\\)) চাওয়া হয়েছে তা খেয়াল না করলে ঠিক বিপরীত উত্তর দাগানোর ঝুঁকি থাকে। আর লম্ব আপতনে (\\(i = 0^\\circ\\)) পার্শ্ব সরণ \\(x = 0\\) হয়।", "quickExample": "পানির (\\(\\mu = \\frac{4}{3}\\)) প্রকৃত গভীরতা \\(12\\text{ cm}\\) হলে আপাত গভীরতা \\(= \\frac{12}{4/3} = 9\\text{ cm}\\) এবং আপাত সরণ \\(= 12 - 9 = 3\\text{ cm}\\)।"}, {"id": 72, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "গোলীয় তলে প্রতিসরণ", "question": "গোলীয় তলে প্রতিসরণের সাধারণ, উত্তল ও অবতল প্রতিসারকের সূত্র এবং চিহ্নের প্রথা কী?", "answer": "সাধারণ: \\(\\frac{\\mu_1}{u} + \\frac{\\mu_2}{v} = \\frac{\\mu_2 - \\mu_1}{r}\\)<br>উত্তল (\\(r\\) ধনাত্মক): \\(\\frac{\\mu}{v} + \\frac{1}{u} = \\frac{\\mu - 1}{r}\\) • অবতল (\\(r\\) ঋণাত্মক): \\(\\frac{\\mu}{u} + \\frac{1}{v} = \\frac{1 - \\mu}{r}\\)", "context": "<b>প্রতীক:<\/b> \\(\\mu_1\\) = যে মাধ্যম থেকে আলো আসছে; \\(\\mu_2\\) = যে মাধ্যমে আলো যাচ্ছে; \\(r\\) = বক্রতার ব্যাসার্ধ।<br><b>চিহ্ন প্রথা (PDF অনুযায়ী):<\/b> আলো প্রথমে অবতল পৃষ্ঠে আঘাত করলে \\(r\\) (+ve) এবং উত্তল পৃষ্ঠে আঘাত করলে \\(r\\) (-ve)।", "intuition": "সমতল বিভেদতলে সব বিন্দুর অভিলম্ব পরস্পর সমান্তরাল, কিন্তু গোলীয় বক্রতলের প্রতিটি বিন্দুর অভিলম্ব বক্রতার কেন্দ্র \\(C\\) দিয়ে যায়। ফলে প্রধান অক্ষ থেকে ভিন্ন উচ্চতায় পড়া রশ্মিগুলো ভিন্ন আপতন কোণে বেঁকে এক বিন্দুতে মিলিত (অভিসারী) বা ছড়িয়ে পড়ে (অপসারী) প্রতিবিম্ব গড়ে। দুটি গোলীয় তল জুড়ে দিলেই লেন্স তৈরি হয়—তাই এই সূত্রটিই লেন্স প্রস্তুতকারক সূত্রের মূল ভিত্তি।", "trap": "সূত্রে \\(\\mu_1\\) হলো যে মাধ্যম থেকে আলো আসছে এবং \\(\\mu_2\\) হলো যে মাধ্যমে প্রবেশ করছে—এই ক্রম উল্টে দিলে বা উত্তল ও অবতল তলের জন্য \\(r\\)-এর চিহ্ন ভুল বসালে উত্তর পুরোপুরি বদলে যায়।", "quickExample": "বায়ু (\\(\\mu_1 = 1\\)) থেকে কাচের (\\(\\mu_2 = 1.5\\)) উত্তল গোলীয় তলে (\\(r = +10\\text{ cm}\\)) অসীম (\\(u = \\infty\\)) থেকে আলো পড়লে \\(\\frac{1}{\\infty} + \\frac{1.5}{v} = \\frac{1.5 - 1}{10} \\Rightarrow \\frac{1.5}{v} = 0.05 \\Rightarrow v = 30\\text{ cm}\\)।"}, {"id": 73, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "লেন্স প্রস্তুতকারক সূত্র ও SVSL", "question": "লেন্স প্রস্তুতকারকের সূত্র কী এবং কাচের লেন্সকে (\\(\\mu = \\frac{3}{2}\\)) পানিতে (\\(\\mu = \\frac{4}{3}\\)) ডুবালে ফোকাস দূরত্ব কত হয়?", "answer": "\\(\\frac{1}{u} + \\frac{1}{v} = (\\mu - 1)\\left(\\frac{1}{r_1} - \\frac{1}{r_2}\\right) = \\left(\\frac{\\mu_{\\text{lens}}}{\\mu_{\\text{surroundings}}} - 1\\right)\\left(\\frac{1}{r_1} - \\frac{1}{r_2}\\right)\\)<br>SVSL: পানিতে ফোকাস দূরত্ব \\(= 4\\times\\) বাতাসে ফোকাস দূরত্ব (\\(f_w = 4f_a\\))", "context": "<b>প্রয়োগ:<\/b> লেন্সের চেয়ে বেশি প্রতিসরাঙ্কের মাধ্যমে ডুবালে লেন্সের প্রকৃতি বদলে যায় (উত্তল অবতলের মতো আচরণ করে)।<br><b>উদাহরণ:<\/b> বাতাসে \\(f_a = 25\\text{ cm}\\) হলে পানিতে \\(f_w = 4\\times 25 = 100\\text{ cm}\\)।", "intuition": "লেন্স আলোকে কতটা বাঁকাবে তা নির্ভর করে লেন্স ও চারপাশের মাধ্যমের প্রতিসরাঙ্কের পার্থক্য \\(\\left(\\frac{\\mu_{\\text{lens}}}{\\mu_{\\text{surroundings}}} - 1\\right)\\)-এর ওপর। বায়ুর (\\(\\mu = 1\\)) বদলে কাচের লেন্সকে (\\(\\mu = 1.5\\)) পানিতে (\\(\\mu = 1.33\\)) ডোবালে ভেতর ও বাইরের বেগের পার্থক্য অনেক কমে যায়, ফলে আলো কম বাঁকে এবং রশ্মিগুলো অনেক দূরে গিয়ে ফোকাসে মিলিত হয় (\\(f_w = 4f_a\\))। আর চারপাশের প্রতিসরাঙ্ক লেন্সের চেয়ে বেশি হলে পার্থক্যটি ঋণাত্মক হয়ে লেন্সের প্রকৃতিই উল্টে যায়।", "trap": "কাচের লেন্সকে (\\(\\mu = 1.5\\)) পানিতে (\\(\\mu = \\frac{4}{3}\\)) ডোবালে ফোকাস দূরত্ব \\(4\\) গুণ হয়, কিন্তু \\(\\mu_{\\text{surroundings}} = \\mu_{\\text{lens}}\\) হলে লেন্সটি অদৃশ্য হয়ে সমতল কাচের মতো আচরণ করে (\\(f = \\infty\\)), আর \\(\\mu_{\\text{surroundings}} \\gt \\mu_{\\text{lens}}\\) হলে উত্তল লেন্স অবতলের মতো আচরণ করে।", "quickExample": "বায়ুতে একটি কাচের (\\(\\mu = 1.5\\)) উত্তল লেন্সের ফোকাস দূরত্ব \\(f_a = 15\\text{ cm}\\) হলে, পানিতে (\\(\\mu = \\frac{4}{3}\\)) ডুবালে এর ফোকাস দূরত্ব \\(f_w = 4f_a = 4 \\times 15 = 60\\text{ cm}\\)।"}, {"id": 74, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "প্রিজমে প্রতিসরণ", "question": "প্রিজমের প্রতিসরাঙ্ক \\(\\mu\\), প্রিজম কোণ \\(A\\), বিচ্যুতি \\(\\delta\\), ন্যূনতম বিচ্যুতির শর্ত এবং সরু প্রিজমের বিচ্যুতি \\(\\delta_m\\) কী?", "answer": "\\(\\mu = \\frac{\\sin i}{\\sin r} = \\frac{\\sin\\left(\\frac{A+\\delta_m}{2}\\right)}{\\sin\\left(\\frac{A}{2}\\right)}\\) • \\(A = r_1 + r_2\\) • \\(\\delta = i_1 + i_2 - A\\)<br>ন্যূনতম বিচ্যুতি: \\(i_1 = i_2\\) ও \\(r_1 = r_2 = \\frac{A}{2}\\) • সরু প্রিজম (\\(A \\lt  6^\\circ\\)): \\(\\delta_m = (\\mu - 1)A\\)", "context": "<b>প্রতীক:<\/b> \\(i_1, i_2\\) = আপতন ও নির্গমন কোণ; \\(r_1, r_2\\) = ভেতরের দুটি প্রতিসরণ কোণ; \\(\\delta_m\\) = ন্যূনতম বিচ্যুতি কোণ।<br><b>তথ্য:<\/b> বেগুনি আলোর \\(\\mu\\) বেশি বলে বিচ্যুতি সর্বাধিক, লাল আলোর বিচ্যুতি সর্বনিম্ন।", "intuition": "প্রিজমের দুটি হেলানো তলে আলো পরপর দুবার ভূমির দিকে বেঁকে যাওয়ায় মোট বিচ্যুতি ঘটে। কাচের ভেতর ছোট তরঙ্গদৈর্ঘ্যের বেগুনি আলো লাল আলোর তুলনায় বেশি বাধাপ্রাপ্ত হয়ে ধীরগতিতে চলে (\\(\\mu_v \\gt \\mu_r\\))—তাই প্রিজমে বেগুনি আলো সবচেয়ে বেশি এবং লাল আলো সবচেয়ে কম বাঁকে। প্রতিসাম্য অবস্থায় (\\(i_1 = i_2\\)) রশ্মিটি প্রিজমের ভূমির সমান্তরাল হয়ে যায় এবং তখনই বিচ্যুতি সর্বনিম্ন (\\(\\delta_m\\)) হয়।", "trap": "সরু প্রিজমের শর্টকাট সূত্র \\(\\delta_m = (\\mu - 1)A\\) কেবল ক্ষুদ্র প্রিজম কোণের (\\(A \\lt 6^\\circ\\)) জন্য প্রযোজ্য—\\(60^\\circ\\) সমবাহু প্রিজমে এটি বসালে বড় ভুল হয়; তখন পূর্ণ সাইন সূত্র \\(\\mu = \\frac{\\sin\\left(\\frac{A+\\delta_m}{2}\\right)}{\\sin\\left(\\frac{A}{2}\\right)}\\) ব্যবহার করতে হবে।", "quickExample": "একটি \\(60^\\circ\\) প্রিজম কোণের প্রিজমের ন্যূনতম বিচ্যুতি \\(\\delta_m = 30^\\circ\\) হলে প্রতিসরাঙ্ক \\(\\mu = \\frac{\\sin\\left(\\frac{60^\\circ + 30^\\circ}{2}\\right)}{\\sin\\left(\\frac{60^\\circ}{2}\\right)} = \\frac{\\sin 45^\\circ}{\\sin 30^\\circ} = \\sqrt{2} \\approx 1.414\\)।"}, {"id": 75, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "লেন্সের সমীকরণ ও চিহ্ন", "question": "লেন্সের ফোকাস দূরত্ব \\(f\\), সাধারণ সমীকরণ, ক্ষমতা \\(P\\), বিবর্ধন \\(m\\) এবং \\(v, m\\) এর চিহ্ন সংক্রান্ত নিয়ম কী?", "answer": "\\(f = \\frac{r}{2} = \\frac{1}{P}\\) • \\(\\frac{1}{v} + \\frac{1}{u} = \\frac{1}{f} = \\frac{2}{r} = P\\) • \\(m = \\frac{l'}{l} = -\\frac{v}{u}\\)<br>• \\(v = +\\text{ve}\\) বাস্তব, \\(v = -\\text{ve}\\) অবাস্তব • \\(m = +\\text{ve}\\) সোজা, \\(m = -\\text{ve}\\) উল্টো<br>• \\(|m|\\gt 1\\) বিবর্ধিত, \\(|m|\\lt 1\\) খর্বিত, \\(|m|=1\\) সমান।", "context": "<b>একক ও চিহ্ন:<\/b> \\(P\\)-এর একক ডায়প্টার (\\(\\text{D} = \\text{m}^{-1}\\)), তাই \\(f\\) অবশ্যই <b>মিটারে<\/b> বসাতে হবে।<br>উত্তল লেন্সের \\(f, P\\) ধনাত্মক (\\(+\\)) এবং অবতল লেন্সের \\(f, P\\) ঋণাত্মক (\\(-\\))।", "intuition": "লেন্সের সমীকরণ \\(\\frac{1}{u} + \\frac{1}{v} = \\frac{1}{f}\\) আসলে আলোকরশ্মির অভিসারিতা বা বক্রতার হিসাব: বস্তু থেকে আসা রশ্মির অপসারিতা (\\(\\frac{1}{u}\\))-কে লেন্স নিজের ক্ষমতা (\\(P = \\frac{1}{f}\\)) দিয়ে বাঁকিয়ে প্রতিবিম্বে নিয়ে যায়। ফোকাস দূরত্ব যত কম, লেন্স আলোকে তত তীব্রভাবে বাঁকাতে পারে—তাই ক্ষমতা \\(P = \\frac{1}{f}\\) ফোকাস দূরত্বের ব্যস্তানুপাতিক।", "trap": "ডায়প্টারে (\\(\\text{D} = \\text{m}^{-1}\\)) ক্ষমতা বের করতে \\(f\\) অবশ্যই মিটারে বসাতে হবে (সেন্টিমিটারে থাকলে \\(P = \\frac{100}{f}\\))। অবতল লেন্সের \\(f\\) ও \\(P\\) ঋণাত্মক ধরতে ভুল করলে এবং লেন্সের অর্ধেক ঢাকলে বিম্ব অর্ধেক হয়ে যাবে ভাবলে (আসলে বিম্ব সম্পূর্ণ থাকে, শুধু উজ্জ্বলতা কমে) নম্বর কাটা যায়।", "quickExample": "একটি অবতল লেন্সের ফোকাস দূরত্ব \\(f = -20\\text{ cm} = -0.2\\text{ m}\\) হলে এর ক্ষমতা \\(P = \\frac{1}{-0.2} = -5\\text{ D}\\)।"}, {"id": 76, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "প্রতিবিম্বের অবস্থান টেকনিক", "question": "উত্তল লেন্সে বস্তুর অবস্থান কোড (১–৬) ব্যবহার করে প্রতিবিম্বের অবস্থান নির্ণয়ের টেকনিকটি কী?", "answer": "১=অসীম, ২=অসীম ও \\(2F\\)-এর মাঝে, ৩=\\(2F\\), ৪=\\(2F\\) ও \\(F\\)-এর মাঝে, ৫=\\(F\\), ৬=\\(F\\) ও আলোক কেন্দ্রের মাঝে।<br>সূত্র: প্রতিবিম্বের অবস্থান \\(= 6 -\\) বস্তুর অবস্থান", "context": "<b>উদাহরণ:<\/b> বস্তু প্রধান ফোকাসে (কোড ৫) থাকলে প্রতিবিম্ব \\(= 6 - 5 = 1\\) অর্থাৎ অসীমে তৈরি হয়।<br>বস্তু \\(2F\\)-এ (কোড ৩) থাকলে প্রতিবিম্ব \\(= 6 - 3 = 3\\) (\\(2F\\)-এ সমান আকারের)।", "intuition": "আলোর প্রত্যাবর্তনশীলতা নীতির কারণে বস্তু ও বাস্তব প্রতিবিম্বের অবস্থান পরস্পর বিনিময়যোগ্য (conjugate)। তাই বস্তুকে অসীম থেকে ফোকাসের দিকে যত কাছে আনা হয়, বাস্তব প্রতিবিম্ব ততই ফোকাস থেকে অসীমের দিকে সরে গিয়ে বড় হতে থাকে—এই নিখুঁত প্রতিসাম্যের ফলেই ১ থেকে ৫ নম্বর অবস্থানে বস্তু ও বিম্বের কোডের যোগফল সর্বদা \\(6\\) হয়।", "trap": "'প্রতিবিম্বের অবস্থান \\(= 6 -\\) বস্তুর অবস্থান' শর্টকাটটি কেবল ১ থেকে ৫ নম্বর অবস্থানের (বাস্তব ও উল্টো বিম্ব) জন্য প্রযোজ্য। বস্তু কোড ৬-এ (\\(F\\) ও আলোক কেন্দ্রের মাঝে) চলে এলে বিম্ব আর বাস্তব থাকে না—লেন্সের একই পাশে অবাস্তব, সোজা ও বিবর্ধিত হয়।", "quickExample": "উত্তল লেন্সে বস্তু অসীম ও \\(2F\\)-এর মাঝে (কোড ২) থাকলে প্রতিবিম্বের অবস্থান \\(= 6 - 2 = 4\\), অর্থাৎ \\(2F\\) ও \\(F\\)-এর মাঝে (বাস্তব, উল্টো ও খর্বিত)।"}, {"id": 77, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "তুল্য লেন্স", "question": "সংস্পর্শে থাকা একাধিক লেন্সের তুল্য ফোকাস দূরত্ব \\(F\\) ও তুল্য ক্ষমতা \\(P\\) কত?", "answer": "\\(\\frac{1}{F} = \\frac{1}{f_1} + \\frac{1}{f_2} + \\dots + \\frac{1}{f_n}\\) এবং \\(P = P_1 + P_2 + \\dots + P_n\\)", "context": "<b>সতর্কতা:<\/b> উত্তল লেন্সের \\(f, P\\) ধনাত্মক এবং অবতল লেন্সের ঋণাত্মক চিহ্নসহ বসাতে হবে। \\(P = 0\\) হলে সমবায়টি সমতল কাচ ফলকের মতো আচরণ করে।", "intuition": "দুটি পাতলা লেন্স পরস্পরের গায়ে লাগিয়ে রাখলে প্রথম লেন্স রশ্মিকে যতটা বাঁকায়, দ্বিতীয় লেন্স ঠিক সেই বিন্দু থেকেই আরও বাঁকায় বা সোজা করে। তাই তাদের সম্মিলিত আলো বাঁকানোর শক্তি তথা ক্ষমতাগুলো সরাসরি বীজগাণিতিকভাবে যোগ হয় (\\(P = P_1 + P_2\\))। সমান ও বিপরীত ক্ষমতার উত্তল ও অবতল লেন্স একের বাঁকানো অন্যজন পুরোপুরি বাতিল করে দেয়, ফলে সমবায়টি সাধারণ সমতল কাচের মতো আচরণ করে।", "trap": "উত্তল (\\(+\\)) ও অবতল (\\(-\\)) লেন্সের চিহ্ন না বসিয়ে মান যোগ করলে ভুল হয়। মনে রেখো, \\(P = 0\\) মানে তুল্য ফোকাস দূরত্ব \\(F = 0\\) নয়, বরং \\(F = \\frac{1}{0} = \\infty\\)।", "quickExample": "\\(+5\\text{ D}\\) ও \\(-3\\text{ D}\\) ক্ষমতার দুটি লেন্স সংস্পর্শে রাখলে তুল্য ক্ষমতা \\(P = 5 + (-3) = +2\\text{ D}\\) এবং তুল্য ফোকাস দূরত্ব \\(F = \\frac{1}{2} = +0.5\\text{ m} = 50\\text{ cm}\\)।"}, {"id": 78, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "সরল অণুবীক্ষণ যন্ত্র", "question": "সরল অণুবীক্ষণ যন্ত্রের বিবর্ধন \\(m\\) নির্ণয়ের সূত্রগুলো কী?", "answer": "i. \\(m = 1 + \\frac{v}{f}\\) • ii. \\(m = 1 + \\frac{D}{f}\\) • iii. \\(m = 1 + \\frac{D - a}{f}\\) [\\(a\\) = লেন্স ও চোখের দূরত্ব; \\(D\\) = স্পষ্ট দর্শনের ন্যূনতম দূরত্ব]", "context": "<b>মান:<\/b> সুস্থ চোখের জন্য \\(D = 25\\text{ cm} = 0.25\\text{ m}\\)।<br><b>ধারণা:<\/b> এটি একটি স্বল্প ফোকাস দূরত্বের উত্তল লেন্স। বিম্ব অসীমে গঠিত হলে বিবর্ধন \\(m = \\frac{D}{f}\\) হয়।", "intuition": "খালি চোখে কোনো বস্তু \\(D = 25\\text{ cm}\\)-এর চেয়ে কাছে আনলে চোখ আর ফোকাস করতে পারে না, ফলে দর্শন কোণ সীমিত থাকে। স্বল্প ফোকাস দূরত্বের উত্তল লেন্সের ফোকাসের ভেতর বস্তু রাখলে লেন্সটি বস্তুটির একটি সোজা ও বড় অবাস্তব প্রতিবিম্ব \\(25\\text{ cm}\\) বা অসীমে তৈরি করে—ফলে আমরা বস্তুকে চোখের অনেক কাছে এনে বড় কোণে স্পষ্ট দেখতে পাই।", "trap": "স্পষ্ট দর্শনের ন্যূনতম দূরত্বে (\\(D = 25\\text{ cm}\\)) বিবর্ধন \\(m = 1 + \\frac{D}{f}\\), কিন্তু বিম্ব অসীমে (স্বাভাবিক দর্শনে) গঠিত হলে \\(1\\) বাদ গিয়ে \\(m = \\frac{D}{f}\\) হয়—প্রশ্নের শর্ত না দেখে সূত্র বসালে \\(1\\)-এর পার্থক্যে উত্তর ভুল হয়।", "quickExample": "\\(f = 5\\text{ cm}\\) ফোকাস দূরত্বের একটি সরল অণুবীক্ষণ যন্ত্রে স্পষ্ট দর্শনের ন্যূনতম দূরত্বে (\\(D = 25\\text{ cm}\\)) বিবর্ধন \\(m = 1 + \\frac{25}{5} = 1 + 5 = 6\\)।"}, {"id": 79, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "যৌগিক অণুবীক্ষণ ও কৌণিক বিবর্ধন", "question": "যৌগিক অণুবীক্ষণ যন্ত্রের বিবর্ধন \\(m\\) এবং কৌণিক বিবর্ধনের সূত্র কী?", "answer": "\\(m = \\left|\\frac{v_0}{u_0}\\right|\\times\\left|\\frac{v_e}{u_e}\\right| = \\frac{v_0}{u_0}\\left(1 + \\frac{D}{f_e}\\right)\\)<br>কৌণিক বিবর্ধন: \\(m = \\frac{\\text{চোখে বিম্ব কর্তৃক সৃষ্ট কোণ}}{\\text{চোখে বস্তু কর্তৃক সৃষ্ট কোণ}} = \\frac{\\beta}{\\alpha}\\)", "context": "<b>প্রতীক:<\/b> \\(u_0, v_0\\) = অভিলক্ষ্যের (Objective) বস্তু ও বিম্ব দূরত্ব; \\(f_e\\) = অভিনেত্রের (Eyepiece) ফোকাস দূরত্ব।<br><b>তথ্য:<\/b> যৌগিক অণুবীক্ষণে অভিলক্ষ্যের চেয়ে অভিনেত্রের ফোকাস দূরত্ব ও উন্মেষ বড় হয় (\\(f_e \\gt  f_0\\))।", "intuition": "একটি লেন্স দিয়ে খুব বেশি বিবর্ধন করতে গেলে বিকৃতি বেড়ে যায়। তাই যৌগিক অণুবীক্ষণে দুই ধাপে কাজ করা হয়: ক্ষুদ্র ফোকাস দূরত্বের অভিলক্ষ্য (\\(f_0\\)) খুব কাছের ক্ষুদ্র বস্তুর একটি বাস্তব ও বিবর্ধিত বিম্ব নলের ভেতরে তৈরি করে, আর অভিনেত্র (\\(f_e\\)) সেই বিম্বটিকে সরল অণুবীক্ষণের মতো দ্বিতীয়বার বড় করে দেখায়—ফলে মোট বিবর্ধন দুটির গুণফল (\\(m = m_0 \\times m_e\\)) হয়।", "trap": "যৌগিক অণুবীক্ষণে দুটি লেন্সেরই ফোকাস দূরত্ব ছোট হলেও অভিনেত্রের ফোকাস দূরত্ব ও উন্মেষ অভিলক্ষ্যের চেয়ে বড় (\\(f_e \\gt f_0\\)) হয়—দূরবীক্ষণ যন্ত্রের (\\(f_0 \\gg f_e\\)) সাথে এটি প্রায়ই গুলিয়ে ফেলা হয়।", "quickExample": "একটি যৌগিক অণুবীক্ষণ যন্ত্রের অভিলক্ষ্যের বিবর্ধন \\(m_0 = 10\\) এবং অভিনেত্রের ফোকাস দূরত্ব \\(f_e = 5\\text{ cm}\\) হলে স্পষ্ট দর্শনের ন্যূনতম দূরত্বে (\\(D = 25\\text{ cm}\\)) মোট বিবর্ধন \\(m = 10 \\times \\left(1 + \\frac{25}{5}\\right) = 60\\)।"}, {"id": 80, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "নভো দূরবীক্ষণ যন্ত্র", "question": "অসীম দূরত্বে (স্বাভাবিক ফোকাসিং) ও স্পষ্ট দর্শনের ন্যূনতম দূরত্বে নভো দূরবীক্ষণের বিবর্ধন \\(m\\) ও দৈর্ঘ্য \\(L\\) কত?", "answer": "i. অসীম দূরত্বে: \\(m = \\frac{f_0}{f_e}\\), \\(L = f_0 + f_e\\)<br>ii. স্পষ্ট দর্শনের ন্যূনতম দূরত্বে: \\(m = \\frac{f_0}{f_e}\\left(1 + \\frac{f_e}{D}\\right)\\), \\(L = f_0 + u_e = f_0 + \\frac{Df_e}{D + f_e}\\)", "context": "<b>প্রতীক:<\/b> \\(f_0\\) = অভিলক্ষ্যের ফোকাস দূরত্ব, \\(f_e\\) = অভিনেত্রের ফোকাস দূরত্ব, \\(L\\) = নলের দৈর্ঘ্য।<br><b>তুলনা:<\/b> দূরবীক্ষণে \\(f_0 \\gg f_e\\) (অণুবীক্ষণের বিপরীত)।", "intuition": "অসীম দূরের নক্ষত্র থেকে খুব ক্ষীণ সমান্তরাল আলো আসে এবং চোখে খুব ছোট কোণ তৈরি করে। তাই দূরবীক্ষণের অভিলক্ষ্যের ফোকাস দূরত্ব (\\(f_0\\)) ও উন্মেষ খুব বড় রাখা হয় যেন বেশি আলো সংগ্রহ করে বড় বাস্তব বিম্ব তৈরি করা যায়; এরপর ক্ষুদ্র ফোকাস দূরত্বের অভিনেত্র (\\(f_e\\)) দিয়ে সেই বিম্বকে খুব কাছ থেকে দেখলে দর্শন কোণ \\(\\frac{f_0}{f_e}\\) গুণ বেড়ে যায়।", "trap": "নভো দূরবীক্ষণের স্পষ্ট দর্শনের সূত্রে বন্ধনীর ভেতর \\(\\left(1 + \\frac{f_e}{D}\\right)\\) থাকে, যেখানে \\(f_e\\) ওপরে এবং \\(D\\) নিচে—অণুবীক্ষণের \\(\\left(1 + \\frac{D}{f_e}\\right)\\)-এর সাথে গুলিয়ে ফেললে উত্তর অনেক বড় বা ভুল চলে আসে।", "quickExample": "একটি নভো দূরবীক্ষণ যন্ত্রের \\(f_0 = 80\\text{ cm}\\) এবং \\(f_e = 4\\text{ cm}\\) হলে অসীম ফোকাসিংয়ে বিবর্ধন \\(m = \\frac{80}{4} = 20\\) এবং নলের দৈর্ঘ্য \\(L = 80 + 4 = 84\\text{ cm}\\)।"}, {"id": 81, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "বিচ্ছুরণ ও বিচ্ছুরণ ক্ষমতা", "question": "বিচ্ছুরণের পরিমাপ \\(\\theta\\) এবং বিচ্ছুরণ ক্ষমতা \\(\\omega\\) নির্ণয়ের সূত্র কী?", "answer": "বিচ্ছুরণ: \\(\\theta = \\delta_v - \\delta_r\\)<br>বিচ্ছুরণ ক্ষমতা: \\(\\omega = \\frac{\\theta}{\\delta} = \\frac{\\delta_v - \\delta_r}{\\delta} = \\frac{\\mu_v - \\mu_r}{\\mu - 1}\\)", "context": "<b>প্রতীক:<\/b> \\(v\\) = বেগুনি (Violet), \\(r\\) = লাল (Red), \\(\\delta\\) ও \\(\\mu\\) = মধ্যবর্তী হলুদ আলোর বিচ্যুতি ও প্রতিসরাঙ্ক।<br><b>ধারণা:<\/b> \\(\\omega\\) এককবিহীন এবং এটি শুধু প্রিজমের উপাদানের ওপর নির্ভর করে (প্রিজম কোণ \\(A\\)-এর ওপর নয়)।", "intuition": "সাদা আলো প্রিজমে ঢুকলে বেগুনি বর্ণের তরঙ্গদৈর্ঘ্য সবচেয়ে ছোট হওয়ায় কাচে এর বেগ সবচেয়ে কম ও প্রতিসরাঙ্ক (\\(\\mu_v\\)) সবচেয়ে বেশি হয়—ফলে বেগুনি সবচেয়ে বেশি এবং লাল সবচেয়ে কম বেঁকে বর্ণালি ছড়ায়। এই কৌণিক ছড়ানো (\\(\\theta = \\delta_v - \\delta_r\\))-কে মধ্যবর্তী হলুদ আলোর গড় বিচ্যুতি (\\(\\delta\\)) দিয়ে ভাগ করলে প্রিজম কোণ \\(A\\) কেটে যায়, আর পাওয়া যায় কেবল কাচের উপাদানের নিজস্ব রং ছড়ানোর ক্ষমতা \\(\\omega\\)।", "trap": "বিচ্ছুরণ ক্ষমতা \\(\\omega\\) এককবিহীন ও মাত্রাহীন এবং এটি কেবল প্রিজমের উপাদানের ওপর নির্ভর করে—প্রিজম কোণ \\(A\\) বাড়ালে কৌণিক বিচ্ছুরণ \\(\\theta\\) বাড়লেও বিচ্ছুরণ ক্ষমতা \\(\\omega\\) অপরিবর্তিত থাকে।", "quickExample": "একটি প্রিজমের উপাদানের জন্য \\(\\mu_v = 1.523\\), \\(\\mu_r = 1.513\\) এবং \\(\\mu = 1.518\\) হলে বিচ্ছুরণ ক্ষমতা \\(\\omega = \\frac{1.523 - 1.513}{1.518 - 1} = \\frac{0.010}{0.518} \\approx 0.0193\\)।"}, {"id": 82, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "তড়িৎচুম্বকীয় তরঙ্গ", "question": "তড়িৎ ও চৌম্বক ক্ষেত্রের তরঙ্গ সমীকরণ এবং শূন্য ও অন্য মাধ্যমে তড়িৎচুম্বকীয় তরঙ্গের বেগ কত?", "answer": "\\(E = E_0\\sin(ct - x)\\), \\(B = B_0\\sin(ct - x)\\)<br>শূন্য মাধ্যমে: \\(c = \\frac{1}{\\sqrt{\\mu_0\\epsilon_0}} = \\frac{E_0}{B_0}\\) • অন্য মাধ্যমে: \\(v = \\frac{1}{\\sqrt{\\mu\\epsilon}} = \\frac{E}{B}\\)", "context": "<b>মান:<\/b> শূন্য মাধ্যমে \\(c = 3\\times 10^8\\text{ m s}^{-1}\\)।<br><b>ধারণা:<\/b> তড়িৎচুম্বকীয় তরঙ্গ অনুপ্রস্থ (আড়) তরঙ্গ; এতে \\(\\vec{E}\\), \\(\\vec{B}\\) এবং তরঙ্গ সঞ্চালনের দিক পরস্পর লম্ব।", "intuition": "তড়িৎচুম্বকীয় তরঙ্গ হলো তড়িৎ ক্ষেত্র \\(\\vec{E}\\) ও চৌম্বক ক্ষেত্র \\(\\vec{B}\\)-এর এক স্বয়ংসম্পূর্ণ যুগল নৃত্য: সময়ের সাথে পরিবর্তনশীল তড়িৎ ক্ষেত্র নতুন চৌম্বক ক্ষেত্র তৈরি করে, আর সেই পরিবর্তনশীল চৌম্বক ক্ষেত্র আবার তড়িৎ ক্ষেত্র তৈরি করে—তাই এর ছড়িয়ে পড়ার জন্য কোনো জড় মাধ্যমের প্রয়োজন হয় না। মাধ্যমের চৌম্বক প্রবেশ্যতা \\(\\mu\\) ও তড়িৎ ভেদ্যতা \\(\\epsilon\\) যেন মাধ্যমের 'চৌম্বকীয় ও বৈদ্যুতিক বাধা'—এগুলো যত বেশি হয়, ক্ষেত্র দুটি তত ধীরে সাড়া দেয় বলে তরঙ্গের বেগ \\(v = \\frac{1}{\\sqrt{\\mu\\epsilon}}\\) কমে যায়। আর যেকোনো মুহূর্তে \\(\\frac{E_0}{B_0} = c\\) হওয়ার অর্থ হলো উভয় ক্ষেত্র সমদশায় কাঁপে এবং তাদের মানের অনুপাত সর্বদা ওই মাধ্যমে আলোর বেগের সমান থাকে।", "trap": "ভর্তি পরীক্ষায় দুটি ভুল সবচেয়ে বেশি হয়: (১) \\(c = \\frac{E_0}{B_0}\\) উল্টে \\(\\frac{B_0}{E_0}\\) বসিয়ে দেওয়া, এবং (২) \\(\\frac{1}{\\sqrt{\\mu_0\\epsilon_0}}\\) আর \\(\\mu_0\\epsilon_0 = \\frac{1}{c^2}\\)-এর একক গুলিয়ে ফেলা (বর্গমূল থাকলে \\(\\text{m s}^{-1}\\), না থাকলে \\(\\text{m}^{-2}\\text{s}^2\\))। এছাড়া অন্য মাধ্যমে বেগ বের করতে \\(v = \\frac{c}{\\sqrt{\\mu_r\\epsilon_r}}\\) সূত্রের বর্গমূল দিতে ভুলবেন না।", "quickExample": "<b>প্রশ্ন:<\/b> শূন্য মাধ্যমে কোনো তড়িৎচুম্বকীয় তরঙ্গের তড়িৎ ক্ষেত্রের সর্বোচ্চ মান \\(E_0 = 60\\text{ V m}^{-1}\\) হলে চৌম্বক ক্ষেত্রের বিস্তার \\(B_0\\) কত?<br>• \\(c = \\frac{E_0}{B_0} \\Rightarrow B_0 = \\frac{E_0}{c} = \\frac{60}{3\\times 10^8} = 2\\times 10^{-7}\\text{ T}\\)<br><b>উত্তর:<\/b> \\(2\\times 10^{-7}\\text{ T}\\)"}, {"id": 83, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "কৃষ্ণবস্তু ও পয়েন্টিং ভেক্টর", "question": "কৃষ্ণবস্তুর বিকিরণ ও পয়েন্টিং ভেক্টর \\(\\vec{S}\\) এর সূত্র কী?", "answer": "কৃষ্ণবস্তুর বিকিরণ: \\(E \\propto T^4 \\Rightarrow \\frac{E_1}{E_2} = \\frac{T_1^4}{T_2^4}\\)<br>পয়েন্টিং ভেক্টর: \\(\\vec{S} = \\frac{1}{\\mu_0}\\vec{E}\\times\\vec{B} = \\vec{E}\\times\\vec{H}\\)", "context": "<b>ধারণা:<\/b> \\(E = \\sigma T^4\\) হলো স্টিফান-বোল্টজম্যান সূত্র (\\(T\\) কেলভিনে)।<br><b>পয়েন্টিং ভেক্টর:<\/b> প্রতি সেকেন্ডে একক ক্ষেত্রফল দিয়ে প্রবাহিত তড়িৎচুম্বকীয় শক্তির হার ও দিক নির্দেশ করে (একক \\(\\text{W m}^{-2}\\))।", "intuition": "কৃষ্ণবস্তুর পরম তাপমাত্রা \\(T\\) সামান্য বাড়ালেই তার বিকিরণ ক্ষমতা \\(E = \\sigma T^4\\) অনুযায়ী নাটকীয়ভাবে বেড়ে যায়—কারণ তাপমাত্রা বাড়লে পরমাণুগুলো শুধু বেশি জোরে কাঁপে না, বরং অনেক বেশি শক্তির উচ্চ-কম্পাঙ্কের ফোটনও নিঃসরণ করে; তাই \\(T\\) দ্বিগুণ করলে বিকিরণ হয় \\(2^4 = 16\\) গুণ! অন্যদিকে পয়েন্টিং ভেক্টর \\(\\vec{S} = \\frac{1}{\\mu_0}(\\vec{E}\\times\\vec{B})\\) হলো তড়িৎচুম্বকীয় শক্তির 'স্রোত'—ডানহাতি স্ক্রু নিয়মে \\(\\vec{E}\\) থেকে \\(\\vec{B}\\)-এর দিকে ঘোরালে এটি ঠিক কোন দিকে শক্তি প্রবাহিত হচ্ছে তা দেখায়, আর এর মান বলে দেয় প্রতি সেকেন্ডে \\(1\\text{ m}^2\\) ক্ষেত্রফল দিয়ে কত জুল শক্তি যাচ্ছে।", "trap": "স্টিফান-বোল্টজম্যান সূত্রে সেলসিয়াস তাপমাত্রা (\\(^\\circ\\text{C}\\)) সরাসরি বসিয়ে অনুপাত বের করাই সবচেয়ে বড় ফাঁদ—যেমন \\(27^\\circ\\text{C}\\) থেকে \\(327^\\circ\\text{C}\\) হলে তাপমাত্রা \\(12\\) গুণ নয়, কেলভিনে \\(300\\text{ K}\\) থেকে \\(600\\text{ K}\\) অর্থাৎ \\(2\\) গুণ হয়! আর পয়েন্টিং ভেক্টরের দিক নির্ণয়ে \\(\\vec{E}\\times\\vec{B}\\) (উল্টো করে \\(\\vec{B}\\times\\vec{E}\\) নয়) অনুসরণ করতে হবে।", "quickExample": "<b>প্রশ্ন:<\/b> কোনো কৃষ্ণবস্তুর তাপমাত্রা \\(27^\\circ\\text{C}\\) থেকে বাড়িয়ে \\(327^\\circ\\text{C}\\) করলে বিকিরণ হার কত গুণ হবে?<br>• \\(T_1 = 27 + 273 = 300\\text{ K}\\), \\(T_2 = 327 + 273 = 600\\text{ K}\\)<br>• \\(\\frac{E_2}{E_1} = \\left(\\frac{T_2}{T_1}\\right)^4 = \\left(\\frac{600}{300}\\right)^4 = 2^4 = 16\\) গুণ<br><b>উত্তর:<\/b> \\(16\\) গুণ"}, {"id": 84, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "দশা ও পথ পার্থক্য (ব্যতিচার)", "question": "দশা পার্থক্য \\(\\delta\\) ও পথ পার্থক্য \\(\\Delta x\\) এর সম্পর্ক এবং গঠনমূলক ও ধ্বংসাত্মক ব্যতিচারের শর্ত কী?", "answer": "\\(\\delta = \\frac{2\\pi}{\\lambda}\\times\\Delta x\\)<br>গঠনমূলক: \\(x_2 - x_1 = 2n\\frac{\\lambda}{2}\\) [\\(n=0,1,2,\\dots\\)]<br>ধ্বংসাত্মক: \\(x_2 - x_1 = (2n+1)\\frac{\\lambda}{2}\\) [\\(n=0,1,2,\\dots\\)] বা \\((2n-1)\\frac{\\lambda}{2}\\) [\\(n=1,2,\\dots\\)]", "context": "<b>শর্ত:<\/b> স্থায়ী ব্যতিচারের জন্য উৎস দুটি সুসংগত (coherent—সমান কম্পাঙ্ক ও ধ্রুব দশা পার্থক্য) হতে হবে।<br><b>দশা পার্থক্য:<\/b> গঠনমূলকে \\(\\delta = 2n\\pi\\) (উজ্জ্বল) এবং ধ্বংসাত্মকে \\(\\delta = (2n+1)\\pi\\) (অন্ধকার)।", "intuition": "একটি তরঙ্গ পূর্ণ এক তরঙ্গদৈর্ঘ্য \\(\\lambda\\) পথ এগিয়ে গেলে তার দশা এক পূর্ণ চক্র অর্থাৎ \\(2\\pi\\text{ rad}\\) ঘোরে—এই সহজ ঐকিক নিয়ম থেকেই \\(\\delta = \\frac{2\\pi}{\\lambda}\\Delta x\\) আসে। দুটি সাধারণ বৈদ্যুতিক বাল্বের আলো কখনোই স্থায়ী ব্যতিচার তৈরি করতে পারে না, কারণ তাদের অসংখ্য পরমাণু এলোমেলোভাবে ফোটন ছাড়ে এবং দুই উৎসের দশা পার্থক্য প্রতি সেকেন্ডে প্রায় \\(10^8\\) বার পাল্টে যায়; আমাদের চোখ এত দ্রুত পরিবর্তন আলাদা করতে না পেরে উজ্জ্বল ও অন্ধকারের গড় অর্থাৎ সমান আলো দেখে। স্থায়ী ব্যতিচারের জন্য তাই একই উৎস থেকে বিভক্ত দুটি সুসংগত (coherent) তরঙ্গ লাগে, যাতে দশা পার্থক্য স্থির থাকে।", "trap": "দশা পার্থক্য বের করতে গিয়ে অনেকেই \\(\\frac{2\\pi}{\\lambda}\\) উল্টে \\(\\frac{\\lambda}{2\\pi}\\) গুণ করে ফেলেন। মনে রাখার সহজ কৌশল: দশা পার্থক্যে \\(\\pi\\) উপরে থাকে (\\(\\delta = \\frac{2\\pi}{\\lambda}\\Delta x\\)), আর পথ পার্থক্যে \\(\\lambda\\) উপরে থাকে (\\(\\Delta x = \\frac{\\lambda}{2\\pi}\\delta\\))। এছাড়া ধ্বংসাত্মক ব্যতিচারে \\(\\frac{\\lambda}{2}\\)-এর বিজোড় গুণিতক হয়, জোড় নয়।", "quickExample": "<b>প্রশ্ন:<\/b> দুটি সুসংগত তরঙ্গের পথ পার্থক্য \\(\\Delta x = \\frac{\\lambda}{4}\\) হলে দশা পার্থক্য \\(\\delta\\) কত?<br>• \\(\\delta = \\frac{2\\pi}{\\lambda}\\times\\Delta x = \\frac{2\\pi}{\\lambda}\\times\\frac{\\lambda}{4} = \\frac{\\pi}{2}\\text{ rad}\\)<br><b>উত্তর:<\/b> \\(\\frac{\\pi}{2}\\text{ rad}\\) (বা \\(90^\\circ\\))"}, {"id": 85, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "লব্ধি বিস্তার ও তীব্রতা", "question": "তরঙ্গের উপরিপাতনে লব্ধি বিস্তার \\(A, A_{\\max}, A_{\\min}\\) এবং লব্ধি তীব্রতা \\(I, I_{\\max}, I_{\\min}\\) এর সূত্র কী?", "answer": "\\(A = \\sqrt{A_1^2 + A_2^2 + 2A_1A_2\\cos\\delta}\\); \\(A_{\\max} = A_1 + A_2\\); \\(A_{\\min} = A_1 \\sim A_2\\)<br>\\(I = I_1 + I_2 + 2\\sqrt{I_1I_2}\\cos\\delta\\); \\(I_{\\max} = (\\sqrt{I_1} + \\sqrt{I_2})^2\\); \\(I_{\\min} = (\\sqrt{I_1} - \\sqrt{I_2})^2\\)", "context": "<b>সম্পর্ক:<\/b> তীব্রতা বিস্তারের বর্গের সমানুপাতিক (\\(I \\propto A^2\\))।<br><b>সমান উৎস হলে (\\(I_1=I_2=I_0\\)):<\/b> \\(I_{\\max} = 4I_0\\) এবং \\(I_{\\min} = 0\\)।", "intuition": "দুটি তরঙ্গের উপরিপাতনে লব্ধি বিস্তার ঠিক দুটি ভেক্টরের সামান্তরিক সূত্রের মতো আচরণ করে, যেখানে দুই ভেক্টরের মধ্যবর্তী কোণের ভূমিকা নেয় দশা পার্থক্য \\(\\delta\\)। যেহেতু আলোর তীব্রতা বিস্তারের বর্গের সমানুপাতিক (\\(I \\propto A^2\\)), তাই সমান তীব্রতা \\(I_0\\)-এর দুটি তরঙ্গ সমদশায় মিললে বিস্তার \\(2A_0\\) হয় এবং তীব্রতা \\(2I_0\\) না হয়ে \\((2A_0)^2 \\Rightarrow 4I_0\\) হয়। এতে শক্তির সংরক্ষণশীলতা ভাঙে না—ধ্বংসাত্মক ব্যতিচারের অন্ধকার ডোরা থেকে যে শক্তি কমে \\(0\\) হয়, সেই শক্তিই পুনর্বণ্টিত হয়ে উজ্জ্বল ডোরায় জমা হয়; ফলে পুরো পর্দায় গড় তীব্রতা ঠিক \\(\\frac{4I_0 + 0}{2} = 2I_0\\) বজায় থাকে।", "trap": "তীব্রতার অনুপাত \\(I_1 : I_2\\) দেওয়া থাকলে সরাসরি \\(\\frac{I_1+I_2}{I_1-I_2}\\) বসালে মারাত্মক ভুল হয়! আগে বর্গমূল নিয়ে বিস্তারের অনুপাত \\(\\sqrt{I_1} : \\sqrt{I_2}\\) বের করতে হবে, তারপর \\(\\frac{I_{\\max}}{I_{\\min}} = \\left(\\frac{\\sqrt{I_1}+\\sqrt{I_2}}{\\sqrt{I_1}-\\sqrt{I_2}}\\right)^2\\) বসাতে হবে। আর বিপরীত প্রশ্নে \\(I_{\\max} : I_{\\min}\\) থেকে \\(A_1 : A_2\\) বের করতে যোগ-বিয়োগের (componendo-dividendo) আগে বর্গমূল নিতে ভুলবেন না।", "quickExample": "<b>প্রশ্ন:<\/b> দুটি সুসংগত উৎসের তীব্রতার অনুপাত \\(I_1 : I_2 = 9 : 1\\) হলে \\(I_{\\max} : I_{\\min}\\) কত?<br>• \\(\\frac{I_{\\max}}{I_{\\min}} = \\left(\\frac{\\sqrt{9}+\\sqrt{1}}{\\sqrt{9}-\\sqrt{1}}\\right)^2 = \\left(\\frac{3+1}{3-1}\\right)^2 = \\left(\\frac{4}{2}\\right)^2 = 4 : 1\\)<br><b>উত্তর:<\/b> \\(4 : 1\\)"}, {"id": 86, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "ইয়ং-এর দ্বি-চিড় পরীক্ষা", "question": "দ্বি-চিড় পরীক্ষায় পথ পার্থক্য, \\(n\\)-তম উজ্জ্বল ও অন্ধকার ডোরার দূরত্ব, ডোরা ব্যবধান \\(\\Delta x\\) ও প্রস্থ \\(x\\) (এবং \\(\\mu\\) তরলে ডোবালে) কত?", "answer": "পথ পার্থক্য \\(= a\\sin\\theta\\) • \\(n\\)-তম উজ্জ্বল: \\(x_n = \\frac{n\\lambda D}{a}\\) • \\(n\\)-তম অন্ধকার: \\(x_n = (2n-1)\\frac{\\lambda D}{2a}\\)<br>\\(\\Delta x = \\frac{\\lambda D}{a}\\), \\(x = \\frac{\\lambda D}{2a}\\) • \\(\\mu\\) তরলে: \\(\\Delta x' = \\frac{\\Delta x}{\\mu} = \\frac{\\lambda D}{\\mu a}\\), \\(x' = \\frac{x}{\\mu} = \\frac{\\lambda D}{2\\mu a}\\)", "context": "<b>প্রতীক:<\/b> \\(a\\) = চিড়দ্বয়ের মধ্যবর্তী দূরত্ব, \\(D\\) = চিড় থেকে পর্দার দূরত্ব, \\(\\lambda\\) = আলোর তরঙ্গদৈর্ঘ্য।<br><b>পার্থক্য:<\/b> ডোরা ব্যবধান (\\(\\Delta x\\)) = দুটি পরপর উজ্জ্বল/অন্ধকার ডোরার মধ্যবর্তী দূরত্ব; ডোরার প্রস্থ (\\(x\\)) = একটি ডোরার বেধ (\\(\\frac{\\Delta x}{2}\\))।", "intuition": "ইয়ং-এর দ্বি-চিড় পরীক্ষায় দুটি চিড় থেকে পর্দার কোনো বিন্দুতে পৌঁছাতে আলোর পথ পার্থক্য হয় \\(a\\sin\\theta\\)। লাল আলোর তরঙ্গদৈর্ঘ্য নীল আলোর চেয়ে বড় (\\(\\lambda_R \\gt \\lambda_B\\)) হওয়ায় একটি পূর্ণ \\(\\lambda\\) পথ পার্থক্য পূরণ করতে লাল আলোকে পর্দায় বেশি দূরে সরে যেতে হয়—এজন্যই লাল আলোর ডোরা নীল আলোর ডোরার চেয়ে বেশি চওড়া হয়। আর পুরো যন্ত্রকে \\(\\mu\\) প্রতিসরাঙ্কের পানিতে বা তরলে ডোবালে আলোর কম্পাঙ্ক \\(f\\) স্থির থাকলেও বেগ \\(\\mu\\) গুণ কমে যায়; ফলে তরঙ্গদৈর্ঘ্য সংকুচিত হয়ে \\(\\lambda' = \\frac{\\lambda}{\\mu}\\) হয় এবং ডোরাগুলোও \\(\\mu\\) গুণ কাছাকাছি চেপে এসে সরু হয়ে যায়।", "trap": "বাংলাদেশের HSC পাঠ্যবইয়ের পরিভাষায় সতর্ক থাকুন: 'ডোরা ব্যবধান' (\\(\\Delta x = \\frac{\\lambda D}{a}\\)) হলো পরপর দুটি উজ্জ্বল (বা অন্ধকার) ডোরার কেন্দ্রের দূরত্ব, আর 'একটি ডোরার প্রস্থ' (\\(x = \\frac{\\lambda D}{2a}\\)) হলো এর ঠিক অর্ধেক। তবে অনেক বিশ্ববিদ্যালয় ভর্তি পরীক্ষায় ইংরেজি fringe width \\(\\beta = \\frac{\\lambda D}{d}\\) বোঝাতেও 'ডোরার প্রস্থ' লেখা হয়—তাই প্রশ্নের অপশন ও প্রসঙ্গ দেখে \\(\\frac{\\lambda D}{a}\\) নাকি \\(\\frac{\\lambda D}{2a}\\) চাওয়া হয়েছে তা যাচাই করে নিন।", "quickExample": "<b>প্রশ্ন:<\/b> বায়ুতে ইয়ং-এর দ্বি-চিড় পরীক্ষায় ডোরা ব্যবধান \\(\\Delta x = 0.6\\text{ mm}\\) হলে পুরো যন্ত্রটি \\(\\mu = 1.5\\) প্রতিসরাঙ্কের তরলে ডোবালে নতুন ডোরা ব্যবধান কত হবে?<br>• \\(\\Delta x' = \\frac{\\Delta x}{\\mu} = \\frac{0.6}{1.5} = 0.4\\text{ mm}\\)<br><b>উত্তর:<\/b> \\(0.4\\text{ mm}\\) (ডোরাগুলো কাছাকাছি চেপে আসবে)"}, {"id": 87, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "একক চিড় ও গ্রেটিং", "question": "একক চিড়ে চরম ও অবমের শর্ত, গ্রেটিং ধ্রুবক \\(d\\), একক দৈর্ঘ্যে রেখার সংখ্যা \\(N\\) এবং গ্রেটিং সমীকরণ কী?", "answer": "একক চিড়ে চরম: \\(a\\sin\\theta = (2n+1)\\frac{\\lambda}{2}\\); অবম: \\(a\\sin\\theta = n\\lambda\\)<br>গ্রেটিং: \\(N = \\frac{1}{d} = \\frac{1}{a+b}\\), \\(d = \\frac{1}{N} = (a+b)\\) এবং \\(d\\sin\\theta = n\\lambda\\)", "context": "<b>সতর্কতা:<\/b> একক চিড়ের অপবর্তনে চরম ও অবমের শর্ত ব্যতিচারের ঠিক <b>উল্টো<\/b>! এখানে \\(a\\) হলো চিড়ের প্রস্থ, \\(b\\) হলো অস্বচ্ছ অংশের প্রস্থ, \\(n\\) = অপবর্তন ক্রম (Order)।", "intuition": "কোনো বাধা বা ছিদ্রের ধার ঘেঁষে তরঙ্গ বেঁকে যাওয়াকে অপবর্তন বলে, আর এটি স্পষ্টভাবে ঘটে কেবল তখনই যখন ছিদ্রের প্রস্থ \\(a\\) তরঙ্গদৈর্ঘ্য \\(\\lambda\\)-এর সমতুল্য (\\(a \\sim \\lambda\\)) হয়। শব্দের তরঙ্গদৈর্ঘ্য কয়েক সেন্টিমিটার থেকে কয়েক মিটার—যা আমাদের ঘরের দরজা, জানালা ও দেয়ালের আকারের কাছাকাছি; তাই শব্দ সহজেই দেয়ালের কোণা ঘুরে অন্য ঘরে শোনা যায়। কিন্তু দৃশ্যমান আলোর তরঙ্গদৈর্ঘ্য অতিক্ষুদ্র (\\(\\sim 400\\text{–}700\\text{ nm}\\)), যা দরজা-জানালার তুলনায় লক্ষ গুণ ছোট—তাই আলো সাধারণ বাধার পাশে স্পষ্টভাবে না বেঁকে তীক্ষ্ণ ছায়া তৈরি করে। আর অপবর্তন গ্রেটিংয়ে হাজার হাজার সূক্ষ্ম চিড় একসাথে কাজ করায় \\(d\\sin\\theta = n\\lambda\\) শর্তে অত্যন্ত উজ্জ্বল ও সরু বর্ণালি রেখা পাওয়া যায়।", "trap": "একক চিড়ের অপবর্তনে অবম (অন্ধকার) ডোরার শর্ত \\(a\\sin\\theta = n\\lambda\\), যা দ্বি-চিড় ব্যতিচারের উজ্জ্বল ডোরার শর্তের ঠিক উল্টো—পরীক্ষার হলে এই দুটি প্রায়ই গুলিয়ে যায়! দ্বিতীয় ফাঁদ হলো গ্রেটিংয়ে \\(N\\)-এর একক: প্রতি সেন্টিমিটারে রেখার সংখ্যা দেওয়া থাকলে \\(d = \\frac{10^{-2}\\text{ m}}{N}\\) লিখতে হবে, নতুবা \\(d\\) এর মান \\(100\\) গুণ ভুল হয়ে যাবে।", "quickExample": "<b>প্রশ্ন:<\/b> একটি অপবর্তন গ্রেটিংয়ের প্রতি সেন্টিমিটারে \\(5000\\) টি রেখা থাকলে গ্রেটিং ধ্রুবক \\(d\\) কত?<br>• প্রতি মিটারে রেখার সংখ্যা \\(N = 5000 \\times 100 = 5\\times 10^5\\text{ m}^{-1}\\)<br>• \\(d = \\frac{1}{N} = \\frac{1}{5\\times 10^5} = 2\\times 10^{-6}\\text{ m}\\)<br><b>উত্তর:<\/b> \\(2\\times 10^{-6}\\text{ m}\\)"}, {"id": 88, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "সমবর্তন (ম্যালাস ও ব্রুস্টার)", "question": "ম্যালাসের সূত্র, ব্রুস্টারের সূত্র এবং প্রতিসরণ ও সমবর্তন কোণের সম্পর্ক কী?", "answer": "ম্যালাসের সূত্র: \\(I = I_0\\cos^2\\theta\\) • ব্রুস্টারের সূত্র: \\(\\mu = \\tan\\theta_p\\) • সম্পর্ক: \\(r + \\theta_p = 90^\\circ\\)", "context": "<b>প্রতীক:<\/b> \\(\\theta\\) = সমবর্তক ও বিশ্লেষকের অক্ষের কোণ; \\(\\theta_p\\) = সমবর্তন/ব্রুস্টার কোণ।<br><b>ধারণা:<\/b> কেবল অনুপ্রস্থ (আড়) তরঙ্গের সমবর্তন ঘটে (শব্দ তরঙ্গের ঘটে না)। ব্রুস্টার কোণে প্রতিফলিত ও প্রতিসরিত রশ্মি পরস্পর লম্ব থাকে।", "intuition": "সমবর্তনকে একটি খাড়া বেড়ার ফাঁক দিয়ে দড়ি নাড়ানোর সাথে তুলনা করুন: দড়িটি উপর-নিচ কাঁপলে (অনুপ্রস্থ তরঙ্গ) ফাঁক দিয়ে তরঙ্গ পার হতে পারবে, কিন্তু ডানে-বামে কাঁপলে আটকে যাবে। ঠিক এভাবেই পোলারয়েড আলোর তড়িৎ ক্ষেত্রের কম্পনকে একটি নির্দিষ্ট তলে আটকে দেয়—যা অকাট্যভাবে প্রমাণ করে আলো একটি অনুপ্রস্থ (আড়) তরঙ্গ; অনুদৈর্ঘ্য তরঙ্গ হলে (যেমন বায়ুতে শব্দ) কম্পন গতির দিকেই থাকত, তাই ফিল্টার ঘুরিয়ে তাকে কখনোই আটকানো যেত না। আর ব্রুস্টার কোণে (\\(\\theta_p\\)) আপতিত হলে প্রতিফলিত ও প্রতিসরিত রশ্মি পরস্পর \\(90^\\circ\\) কোণে থাকে বলে প্রতিফলিত আলোর সমান্তরাল উপাংশ শূন্য হয়ে যায় এবং প্রতিফলিত রশ্মি সম্পূর্ণ সমবর্তিত হয়।", "trap": "ম্যালাসের সূত্রের সবচেয়ে পরিচিত ফাঁদ: অসমবর্তিত (unpolarized) আলো \\(I_0\\) প্রথম পোলারয়েড ভেদ করলে এর তীব্রতা প্রথমেই অর্ধেক হয়ে \\(\\frac{I_0}{2}\\) হয়, তারপর দ্বিতীয় পোলারয়েডের জন্য \\(\\cos^2\\theta\\) গুণ করতে হয় (\\(I = \\frac{I_0}{2}\\cos^2\\theta\\))। সরাসরি \\(I_0\\cos^2\\theta\\) বসালে উত্তর দ্বিগুণ হয়ে ভুল হবে!", "quickExample": "<b>প্রশ্ন:<\/b> কাচের প্রতিসরাঙ্ক \\(\\mu = \\sqrt{3}\\) হলে ব্রুস্টার কোণ \\(\\theta_p\\) এবং প্রতিসরণ কোণ \\(r\\) কত?<br>• \\(\\tan\\theta_p = \\mu = \\sqrt{3} \\Rightarrow \\theta_p = 60^\\circ\\)<br>• \\(r = 90^\\circ - \\theta_p = 90^\\circ - 60^\\circ = 30^\\circ\\)<br><b>উত্তর:<\/b> \\(\\theta_p = 60^\\circ\\) এবং \\(r = 30^\\circ\\)"}, {"id": 89, "ch": 8, "chapter": "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "topic": "ফোটন ও ইলেকট্রনের বেগ", "question": "ফোটনের শক্তি \\(E\\), ভরবেগ \\(p\\) এবং \\(V\\) বিভব পার্থক্যে ত্বরিত ইলেকট্রনের বেগ \\(v\\) এর সূত্র কী?", "answer": "শক্তি: \\(E = h\\nu = h\\frac{c}{\\lambda}\\) • ভরবেগ: \\(p = \\frac{h}{\\lambda} = \\frac{h\\nu}{c} = \\frac{E}{c}\\) • বেগ: \\(v = \\sqrt{\\frac{2eV}{m}}\\)", "context": "<b>ধ্রুবক:<\/b> প্ল্যাঙ্কের ধ্রুবক \\(h = 6.626\\times 10^{-34}\\text{ J s}\\), \\(1\\text{ eV} = 1.6\\times 10^{-19}\\text{ J}\\)।<br><b>তথ্য:<\/b> ফোটনের স্থির ভর শূন্য (\\(m_0 = 0\\)) এবং এটি চার্জ নিরপেক্ষ। \\(v\\) সূত্রটি \\(\\frac{1}{2}mv^2 = eV\\) থেকে আসে।", "intuition": "আলো নিরবচ্ছিন্ন ঢেউ নয়, বরং ক্ষুদ্র ক্ষুদ্র শক্তির প্যাকেট বা ফোটনের স্রোত। ফোটনের স্থির ভর শূন্য (\\(m_0 = 0\\)) হলেও এটি সর্বদা আলোর বেগে (\\(c\\)) চলে বলে এর সুনির্দিষ্ট শক্তি \\(E = h\\nu\\) এবং ভরবেগ \\(p = E/c = h/\\lambda\\) থাকে—যার কারণে আলো কোনো পৃষ্ঠে পড়লে বিকিরণ চাপ প্রয়োগ করে। অন্যদিকে একটি ইলেকট্রনকে \\(V\\) বিভব পার্থক্যের মধ্য দিয়ে ত্বরিত করলে তড়িৎক্ষেত্রের কৃতকাজ \\(eV\\) সরাসরি গতিশক্তি \\(\\frac{1}{2}mv^2\\)-এ রূপান্তরিত হয়।", "trap": "ভর্তি পরীক্ষায় ফোটনের শক্তি \\(\\text{eV}\\) এককে রেখেই সরাসরি SI এককের \\(h\\) বা \\(c\\) দিয়ে ভরবেগ ও কম্পাঙ্ক বের করে ফেলা সবচেয়ে বড় ভুল—SI হিসাবের আগে অবশ্যই \\(1\\text{ eV} = 1.6\\times 10^{-19}\\text{ J}\\) দিয়ে জুলে রূপান্তর করুন। এছাড়া \\(v = \\sqrt{\\frac{2eV}{m}}\\) কেবল অ-আপেক্ষিক বেগের (\\(v \\ll c\\)) জন্য প্রযোজ্য।", "quickExample": "\\(\\lambda = 600\\text{ nm} = 6\\times 10^{-7}\\text{ m}\\) তরঙ্গদৈর্ঘ্যের একটি ফোটনের শক্তি \\(E = \\frac{hc}{\\lambda} = \\frac{6.626\\times 10^{-34}\\times 3\\times 10^8}{6\\times 10^{-7}} = 3.313\\times 10^{-19}\\text{ J} \\approx 2.07\\text{ eV}\\) এবং ভরবেগ \\(p = \\frac{E}{c} \\approx 1.10\\times 10^{-27}\\text{ kg m s}^{-1}\\)।"}, {"id": 90, "ch": 8, "chapter": "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "topic": "ফটো-তড়িৎ ক্রিয়া ও এক্স-রে", "question": "ফটো ইলেকট্রনের সর্বোচ্চ গতিশক্তি, সূচন কম্পাঙ্ক \\(\\nu_0\\), সূচন তরঙ্গদৈর্ঘ্য \\(\\lambda_0\\), নিবৃত্তি বিভব \\(V_s\\), কার্যাপেক্ষক \\(W_0\\) ও এক্স-রে শক্তির সূত্র কী?", "answer": "\\(\\frac{1}{2}mv_{\\max}^2 = h\\nu - W_0 = h\\nu - h\\nu_0 = \\frac{hc}{\\lambda} - \\frac{hc}{\\lambda_0} = eV_s\\)<br>\\(\\nu_0 = \\frac{W_0}{h}\\), \\(\\lambda_0 = \\frac{c}{\\nu_0} = \\frac{hc}{W_0}\\), \\(W_0 = h\\nu_{\\min} = h\\frac{c}{\\lambda_{\\max}}\\)<br>এক্স-রে: \\(E = h\\nu = h\\frac{c}{\\lambda} = W_0 + \\frac{1}{2}mv_{\\max}^2\\)", "context": "<b>শর্ত:<\/b> ইলেকট্রন নির্গমনের জন্য আপতিত কম্পাঙ্ক \\(\\nu \\gt  \\nu_0\\) (অর্থাৎ \\(\\lambda \\lt  \\lambda_0\\)) হতে হবে।<br><b>ধারণা:<\/b> গতিশক্তি ও \\(V_s\\) আলোর কম্পাঙ্কের ওপর নির্ভর করে, কিন্তু ফটো-তড়িৎ প্রবাহ আলোর তীব্রতার সমানুপাতিক।", "intuition": "ফটো-তড়িৎ ক্রিয়াকে একটি এক-বনাম-এক (one-to-one) লেনদেনের মতো ভাবুন: একটি ফোটন তার পুরো শক্তি \\(h\\nu\\) ঠিক একটি ইলেকট্রনকেই দেয়। ধাতুর বন্ধন ছিঁড়ে বের হতে ন্যূনতম \\(W_0\\) শক্তি (টিকিট মূল্য) লাগে; বাকি শক্তি \\(K_{\\max} = h\\nu - W_0\\) হয় ইলেকট্রনের গতিশক্তি। তাই আলোর তীব্রতা বাড়ালে প্রতি সেকেন্ডে ফোটন সংখ্যা বাড়ে বলে বেশি ইলেকট্রন বের হয় (ফটোকারেন্ট বাড়ে), কিন্তু প্রতিটি ফোটনের শক্তি না বাড়ায় \\(K_{\\max}\\) ও নিবৃত্তি বিভব \\(V_s\\) অপরিবর্তিত থাকে—\\(K_{\\max}\\) বাড়াতে হলে অবশ্যই কম্পাঙ্ক \\(\\nu\\) বাড়াতে হবে। এক্স-রে উৎপাদন হলো এর ঠিক উল্টো প্রক্রিয়া, যেখানে দ্রুতগতির ইলেকট্রনের গতিশক্তি থেমে গিয়ে উচ্চশক্তির ফোটনে পরিণত হয়।", "trap": "অনেকেই ভাবেন উজ্জ্বল (বেশি তীব্রতার) আলো ফেললেই ইলেকট্রন বেশি বেগে বের হবে—এটি সম্পূর্ণ ভুল। কম্পাঙ্ক সূচন মানের কম (\\(\\nu \\lt \\nu_0\\)) হলে তীব্রতা লাখ গুণ বাড়ালেও একটি ইলেকট্রনও বের হবে না; তীব্রতা কেবল প্রবাহ \\(I\\) বাড়ায়, আর \\(K_{\\max}\\) ও \\(V_s\\) নিয়ন্ত্রণ করে কেবল কম্পাঙ্ক \\(\\nu\\)।", "quickExample": "কোনো ধাতুর কার্যাপেক্ষক \\(W_0 = 2.2\\text{ eV}\\) এবং আপতিত ফোটনের শক্তি \\(E = 3.7\\text{ eV}\\) হলে সর্বোচ্চ গতিশক্তি \\(K_{\\max} = E - W_0 = 3.7 - 2.2 = 1.5\\text{ eV}\\) এবং নিবৃত্তি বিভব \\(V_s = \\frac{K_{\\max}}{e} = 1.5\\text{ V}\\)।"}, {"id": 91, "ch": 8, "chapter": "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "topic": "ডি-ব্রগলি তরঙ্গদৈর্ঘ্য", "question": "ডি-ব্রগলি তরঙ্গদৈর্ঘ্য \\(\\lambda\\) নির্ণয়ের সূত্রসমূহ কী?", "answer": "\\(\\lambda = \\frac{h}{mv} = \\frac{h}{p} = \\frac{h}{\\sqrt{2mE_k}} = \\frac{h}{\\sqrt{2meV_s}}\\)", "context": "<b>ধারণা:<\/b> এটি পদার্থের কণা-তরঙ্গ দ্বৈত প্রকৃতি প্রকাশ করে।<br><b>শর্টকাট:<\/b> \\(V\\) ভোল্টে ত্বরিত ইলেকট্রনের জন্য \\(\\lambda \\approx \\frac{12.27}{\\sqrt{V}}\\text{ \\AA}\\)।", "intuition": "আলোর মতো প্রতিটি গতিশীল বস্তুকণার সাথেই একটি পদার্থ-তরঙ্গ যুক্ত থাকে, যার তরঙ্গদৈর্ঘ্য \\(\\lambda = h/p = h/(mv)\\)। ক্রিকেট বল বা গাড়ির মতো দৈনন্দিন স্থূল (macroscopic) বস্তুর ভর \\(m\\) বিশাল হওয়ায় এবং প্ল্যাঙ্কের ধ্রুবক \\(h \\approx 6.63\\times 10^{-34}\\text{ J s}\\) অতি ক্ষুদ্র হওয়ায় এদের ডি-ব্রগলি তরঙ্গদৈর্ঘ্য \\(\\sim 10^{-34}\\text{ m}\\) হয়, যা পরমাণুর চেয়েও অকল্পনীয়ভাবে ছোট—তাই আমরা বড় বস্তুর তরঙ্গ ধর্ম কখনো অনুভব করি না। কিন্তু ইলেকট্রনের ভর অত্যন্ত কম (\\(9.11\\times 10^{-31}\\text{ kg}\\)) হওয়ায় এর তরঙ্গদৈর্ঘ্য পরমাণুর ব্যবধানের (\\(\\sim 1\\text{ Å}\\)) সমতুল্য হয় এবং অপবর্তন সহজেই ধরা পড়ে।", "trap": "\\(\\lambda \\approx \\frac{12.27}{\\sqrt{V}}\\text{ Å}\\) শর্টকাট সূত্রটি কেবল ইলেকট্রনের ভর ও চার্জ বসিয়ে তৈরি—প্রোটন বা \\(\\alpha\\)-কণার ক্ষেত্রে এটি সরাসরি বসালে উত্তর ভুল হবে। এছাড়া সমান গতিশক্তি \\(E_k\\) থাকলে \\(\\lambda \\propto 1/\\sqrt{m}\\), অর্থাৎ হালকা কণার তরঙ্গদৈর্ঘ্য বেশি হয়।", "quickExample": "\\(V = 100\\text{ V}\\) বিভব পার্থক্যে ত্বরিত একটি ইলেকট্রনের ডি-ব্রগলি তরঙ্গদৈর্ঘ্য \\(\\lambda \\approx \\frac{12.27}{\\sqrt{100}}\\text{ Å} = 1.227\\text{ Å} = 0.1227\\text{ nm}\\)।"}, {"id": 92, "ch": 8, "chapter": "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "topic": "আপেক্ষিকতা (দৈর্ঘ্য, কাল, ভর)", "question": "আপেক্ষিকতা তত্ত্ব অনুসারে গতিশীল দৈর্ঘ্য \\(L\\), সময় \\(t\\), ভর \\(m\\), ক্ষেত্রফল \\(A\\) এবং ঘনত্ব \\(\\rho\\) এর সূত্র কী?", "answer": "\\(L = L_0\\sqrt{1 - \\frac{v^2}{c^2}}\\) • \\(t = \\frac{t_0}{\\sqrt{1 - \\frac{v^2}{c^2}}}\\) • \\(m = \\frac{m_0}{\\sqrt{1 - \\frac{v^2}{c^2}}}\\)<br>\\(A = A_0\\sqrt{1 - \\frac{v^2}{c^2}}\\) • \\(\\rho = \\frac{\\rho_0}{1 - \\frac{v^2}{c^2}}\\)", "context": "<b>প্রতীক:<\/b> \\(L_0, t_0, m_0, A_0, \\rho_0\\) = স্থির অবস্থার (Proper) মান।<br><b>ধারণা:<\/b> গতির দিকে দৈর্ঘ্য সংকুচিত হয় (\\(L \\lt  L_0\\)), সময় দীর্ঘায়িত হয় (\\(t \\gt  t_0\\)) এবং ভর ও ঘনত্ব বৃদ্ধি পায় (\\(m \\gt  m_0, \\rho \\gt  \\rho_0\\))।", "intuition": "যেহেতু সব পর্যবেক্ষকের কাছেই আলোর বেগ \\(c\\) ধ্রুবক, তাই অতি উচ্চ বেগে চললে স্থান ও কাল নিজেদের মানিয়ে নেয়। \"চলমান ঘড়ি ধীরে চলে\" (moving clocks run slow)—অর্থাৎ রকেটের ভেতরের ঘড়িতে \\(t_0\\) সময় কাটলে পৃথিবীর স্থির পর্যবেক্ষকের ঘড়িতে তার চেয়ে বেশি সময় \\(t = \\gamma t_0\\) কাটে (কাল দীর্ঘায়ন)। একইভাবে দৈর্ঘ্য সংকোচন ঘটে শুধুমাত্র গতির দিক বরাবর (\\(L = L_0/\\gamma\\)); গতির লম্ব বা আড়াআড়ি দিকের প্রস্থ ও উচ্চতা বিন্দুমাত্র বদলায় না। ফলে একটি আয়তাকার পাতের কেবল একটি বাহু সংকুচিত হওয়ায় ক্ষেত্রফল \\(A = A_0/\\gamma\\) এবং আয়তন \\(V = V_0/\\gamma\\) হয়, আর ভর \\(\\gamma\\) গুণ বাড়ায় ঘনত্ব \\(\\gamma^2\\) গুণ বেড়ে \\(\\rho = \\frac{\\rho_0}{1 - v^2/c^2}\\) হয়।", "trap": "দৈর্ঘ্য সংকোচন ও কাল দীর্ঘায়নে \\(\\sqrt{1 - v^2/c^2}\\) গুণ না ভাগ হবে তা অনেকেই গুলিয়ে ফেলেন—সহজ নিয়ম: গতিশীল দৈর্ঘ্য সবসময় কমে (\\(L \\lt L_0\\)), আর গতিশীল সময় ও ভর সবসময় বাড়ে (\\(t \\gt t_0,\\; m \\gt m_0\\))। আরেকটি বড় ফাঁদ: ঘনত্বের সূত্রে বর্গমূল থাকে না, কারণ ভর বৃদ্ধি (\\(\\gamma\\)) ও আয়তন সংকোচন (\\(1/\\gamma\\)) মিলে \\(\\gamma^2\\) তৈরি করে।", "quickExample": "\\(L_0 = 10\\text{ m}\\) স্থির দৈর্ঘ্যের একটি দণ্ড \\(v = 0.6c\\) বেগে দৈর্ঘ্য বরাবর চললে \\(\\sqrt{1 - v^2/c^2} = \\sqrt{1 - 0.36} = 0.8\\), ফলে আপেক্ষিক দৈর্ঘ্য \\(L = 10\\times 0.8 = 8\\text{ m}\\), কিন্তু দণ্ডের ব্যাস অপরিবর্তিত থাকে।"}, {"id": 93, "ch": 8, "chapter": "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "topic": "আপেক্ষিক ভরবেগ ও শক্তি", "question": "আপেক্ষিক ভরবেগ \\(p\\), বস্তুর মোট শক্তি \\(E\\) এবং আপেক্ষিক গতিশক্তি \\(E_k\\) এর সূত্র কী?", "answer": "\\(p = mv = \\frac{m_0v}{\\sqrt{1 - \\frac{v^2}{c^2}}} = \\frac{p_0}{\\sqrt{1 - \\frac{v^2}{c^2}}}\\)<br>\\(E = mc^2 = \\sqrt{p^2c^2 + m_0^2c^4} = \\frac{E_0}{\\sqrt{1 - \\frac{v^2}{c^2}}}\\) • \\(E_k = (m - m_0)c^2\\)", "context": "<b>প্রতীক:<\/b> \\(E_0 = m_0c^2\\) (স্থির ভর শক্তি)।<br><b>সতর্কতা:<\/b> \\(v\\) আলোর বেগের কাছাকাছি হলে \\(E_k = \\frac{1}{2}mv^2\\) ব্যবহার করা যাবে না; তখন \\(E_k = (m - m_0)c^2 = E - E_0\\) ব্যবহার করতে হবে।", "intuition": "আইনস্টাইনের \\(E_0 = m_0c^2\\) দেখায় যে ভর হলো ঘনীভূত শক্তি—স্থির অবস্থাতেও প্রতিটি বস্তুর ভেতর বিপুল স্থির ভর শক্তি লুকিয়ে থাকে। বস্তুকে ত্বরিত করতে থাকলে প্রযুক্ত শক্তির একটি অংশ এর বেগ বাড়ায় এবং উচ্চ বেগে আপেক্ষিক ভর \\(m = \\gamma m_0\\) দ্রুত বাড়তে থাকে। বেগ যত \\(c\\)-এর কাছাকাছি যায়, \\(\\gamma \\to \\infty\\) হওয়ায় আরও ত্বরণ দিতে অসীম শক্তির প্রয়োজন হয়—এ কারণেই অশূন্য স্থির ভরের কোনো বস্তু কখনোই আলোর বেগ \\(c\\) অর্জন করতে পারে না।", "trap": "বেগ আলোর বেগের উল্লেখযোগ্য ভগ্নাংশ (যেমন \\(0.5c\\) বা \\(0.8c\\)) হলে চিরায়ত সূত্র \\(E_k = \\frac{1}{2}mv^2\\) ব্যবহার করা মারাত্মক ভুল—তখন অবশ্যই আপেক্ষিক গতিশক্তি \\(E_k = (m - m_0)c^2 = (\\gamma - 1)m_0c^2 = E - E_0\\) ব্যবহার করতে হবে।", "quickExample": "ইলেকট্রনের স্থির ভর শক্তি \\(E_0 = m_0c^2 \\approx 0.511\\text{ MeV}\\)। এটি \\(v = 0.6c\\) বেগে চললে \\(\\gamma = \\frac{1}{\\sqrt{1 - 0.36}} = 1.25\\), ফলে মোট শক্তি \\(E = 1.25 E_0 \\approx 0.639\\text{ MeV}\\) এবং গতিশক্তি \\(E_k = E - E_0 = 0.25 E_0 \\approx 0.128\\text{ MeV}\\)।"}, {"id": 94, "ch": 8, "chapter": "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "topic": "কম্পটন ও অনিশ্চয়তা নীতি", "question": "কম্পটন ক্রিয়ার তরঙ্গদৈর্ঘ্য পরিবর্তন \\(\\Delta\\lambda\\) এবং হাইজেনবার্গের অনিশ্চয়তা নীতির সমীকরণ কী?", "answer": "কম্পটন ক্রিয়া: \\(\\Delta\\lambda = \\lambda' - \\lambda = \\frac{h}{m_0c}(1 - \\cos\\phi)\\)<br>অনিশ্চয়তা নীতি: \\(\\Delta x\\times\\Delta p \\ge \\frac{h}{4\\pi}\\) এবং \\(\\Delta E\\times\\Delta t \\ge \\frac{h}{4\\pi}\\) [\\(h = 6.626\\times 10^{-34}\\text{ J s}\\)]", "context": "<b>কম্পটন তরঙ্গদৈর্ঘ্য:<\/b> ইলেকট্রনের জন্য \\(\\frac{h}{m_0c} = 0.02426\\text{ \\AA}\\)। বিক্ষেপণ কোণ \\(\\phi = 180^\\circ\\) হলে \\(\\Delta\\lambda\\) সর্বোচ্চ হয়।<br><b>অনিশ্চয়তা নীতি:<\/b> একই সাথে অবস্থান (\\(\\Delta x\\)) ও ভরবেগ (\\(\\Delta p\\)) শতভাগ নির্ভুলভাবে মাপা অসম্ভব।", "intuition": "কম্পটন ক্রিয়াকে বিলিয়ার্ড বলের সংঘর্ষের মতো ভাবুন: একটি উচ্চশক্তির এক্স-রে ফোটন স্থির মুক্ত ইলেকট্রনকে ধাক্কা দিলে ইলেকট্রনটি ছিটকে যায় এবং ফোটনটি কিছু শক্তি ও ভরবেগ হারিয়ে বেঁকে যায়। শক্তি কমে যাওয়ায় বিক্ষিপ্ত ফোটনের তরঙ্গদৈর্ঘ্য বেড়ে যায় (\\(\\lambda' \\gt \\lambda\\))—তরঙ্গ তত্ত্ব দিয়ে এই তরঙ্গদৈর্ঘ্য পরিবর্তন ব্যাখ্যা করা অসম্ভব, তাই কম্পটন সরণ সরাসরি প্রমাণ করে যে ফোটনের কণার মতো ভরবেগ \\(p = h/\\lambda\\) আছে। অন্যদিকে হাইজেনবার্গের অনিশ্চয়তা নীতি বলে, এটি যন্ত্রের ত্রুটি নয় বরং প্রকৃতির মৌলিক নিয়ম: একটি কণার অবস্থান যত সূক্ষ্মভাবে সীমাবদ্ধ করবেন (\\(\\Delta x\\) ছোট), তার ভরবেগের অনিশ্চয়তা (\\(\\Delta p\\)) ততই বেড়ে যাবে।", "trap": "অনেকেই ভাবেন \\(\\phi = 90^\\circ\\) কোণে কম্পটন সরণ \\(\\Delta\\lambda\\) সর্বোচ্চ হয়—আসলে \\(\\phi = 180^\\circ\\) (মুখোমুখি সংঘর্ষে বিপরীতে ফিরে আসা) হলে \\(1 - \\cos 180^\\circ = 2\\) হওয়ায় \\(\\Delta\\lambda_{\\max} = \\frac{2h}{m_0c} = 0.04852\\text{ Å}\\) হয়। এছাড়া \\(\\Delta\\lambda\\) আপতিত আলোর তরঙ্গদৈর্ঘ্যের ওপর নির্ভর করে না, কেবল বিক্ষেপণ কোণ \\(\\phi\\)-এর ওপর নির্ভর করে।", "quickExample": "একটি এক্স-রে ফোটন মুক্ত ইলেকট্রনের সাথে সংঘর্ষে \\(\\phi = 90^\\circ\\) কোণে বিক্ষিপ্ত হলে তরঙ্গদৈর্ঘ্য পরিবর্তন \\(\\Delta\\lambda = \\frac{h}{m_0c}(1 - \\cos 90^\\circ) = 0.02426\\times (1 - 0) = 0.02426\\text{ Å}\\)।"}, {"id": 95, "ch": 9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "বোর মডেল: ব্যাসার্ধ, বেগ, পর্যায়কাল", "question": "ইলেকট্রনের কৌণিক ভরবেগ \\(L\\), \\(n\\)-তম কক্ষপথের ব্যাসার্ধ \\(r_n\\), বেগ \\(v_n\\), পর্যায়কাল \\(T_n\\) ও আবর্তন সংখ্যা কত?", "answer": "\\(L = mv_nr_n = \\frac{nh}{2\\pi}\\); \\(r_n = \\frac{n^2h^2\\epsilon_0}{\\pi m Z e^2} \\propto \\frac{n^2}{Z}\\); \\(v_n = \\frac{Ze^2}{2\\epsilon_0 nh} \\propto \\frac{Z}{n}\\)<br>\\(T_n = \\frac{2\\pi r_n}{v_n} = \\frac{4\\epsilon_0^2 n^3 h^3}{m Z^2 e^4} \\propto \\frac{n^3}{Z^2}\\); আবর্তন সংখ্যা \\(= \\frac{1}{T_n}\\)", "context": "<b>প্রতীক:<\/b> \\(n = 1, 2, 3, \\dots\\) (কক্ষপথ সংখ্যা), \\(Z\\) = পারমাণবিক সংখ্যা।<br><b>মূল অনুপাত:<\/b> বাইরের কক্ষপথে গেলে ব্যাসার্ধ বাড়ে (\\(n^2\\)), বেগ কমে (\\(\\frac{1}{n}\\)), পর্যায়কাল বাড়ে (\\(n^3\\))।", "intuition": "নিউক্লিয়াসের কুলম্ব আকর্ষণ বল ইলেকট্রনকে ঘোরার প্রয়োজনীয় কেন্দ্রমুখী বল জোগায়, আর ডি ব্রগলি স্থির তরঙ্গের শর্ত (\\(2\\pi r_n = n\\lambda\\)) থেকে কৌণিক ভরবেগ \\(L = \\frac{nh}{2\\pi}\\) কোয়ান্টায়িত হওয়ায় শুধু নির্দিষ্ট কক্ষপথই অনুমোদিত হয়। বাইরের কক্ষপথে (\\(n\\) বাড়লে) কুলম্ব আকর্ষণ \\(1/r^2\\) হারে কমে যাওয়ায় ইলেকট্রনের বেগ কমে (\\(v_n \\propto 1/n\\)), অথচ পথের পরিধি \\(r_n \\propto n^2\\) হারে বড় হওয়ায় একবার ঘুরতে পর্যায়কাল \\(T_n = \\frac{2\\pi r_n}{v_n} \\propto n^3\\) হারে দ্রুত বেড়ে যায়।", "trap": "অনেকেই ভাবেন ব্যাসার্ধ বাড়লে বেগও বাড়ে, কিন্তু আসলে \\(r_n \\propto \\frac{n^2}{Z}\\), \\(v_n \\propto \\frac{Z}{n}\\) এবং \\(T_n \\propto \\frac{n^3}{Z^2}\\)। বিশেষ করে \\(Z\\) বাড়লে শক্তিশালী আকর্ষণে কক্ষপথ সংকুচিত হয় (\\(r_n \\propto \\frac{1}{Z}\\)) কিন্তু বেগ বাড়ে (\\(v_n \\propto Z\\)), আর আবর্তন সংখ্যা \\(f_n = \\frac{1}{T_n} \\propto \\frac{Z^2}{n^3}\\)।", "quickExample": "হাইড্রোজেন পরমাণুর (\\(Z=1\\)) প্রথম কক্ষপথের ব্যাসার্ধ \\(r_1 = 0.53\\text{ Å}\\) হলে তৃতীয় কক্ষপথের (\\(n=3\\)) ব্যাসার্ধ \\(r_3 = 3^2 \\times 0.53 = 4.77\\text{ Å}\\)। আবার \\(\\text{He}^+\\) (\\(Z=2\\)) আয়নের প্রথম কক্ষপথের ব্যাসার্ধ \\(r_1' = \\frac{0.53}{2} = 0.265\\text{ Å}\\) এবং বেগ হাইড্রোজেনের দ্বিগুণ।"}, {"id": 96, "ch": 9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "বোর মডেল: শক্তি", "question": "\\(n\\)-তম কক্ষপথে আবর্তনশীল ইলেকট্রনের গতিশক্তি \\(E_{k_n}\\), বিভবশক্তি \\(E_{p_n}\\) এবং মোট শক্তি \\(E_n\\) এর সূত্র কী?", "answer": "\\(E_{k_n} = \\frac{m Z^2 e^4}{8n^2h^2\\epsilon_0^2}\\) • \\(E_{p_n} = -\\frac{m Z^2 e^4}{4n^2h^2\\epsilon_0^2}\\) • \\(E_n = -\\frac{m Z^2 e^4}{8n^2h^2\\epsilon_0^2} \\propto -\\frac{Z^2}{n^2}\\)", "context": "<b>সুপার শর্টকাট সম্পর্ক:<\/b> \\(E_k = -E_{\\text{total}}\\) এবং \\(E_p = 2E_{\\text{total}}\\) (অর্থাৎ \\(E_p = -2E_k\\))।<br><b>ধারণা:<\/b> মোট শক্তি ঋণাত্মক মানে ইলেকট্রন নিউক্লিয়াসের সাথে আবদ্ধ। \\(n\\) বাড়লে মোট শক্তি বাড়ে (কম ঋণাত্মক হয়)।", "intuition": "অসীমে (\\(r \\to \\infty\\)) মুক্ত ইলেকট্রনের বিভবশক্তি শূন্য ধরা হয়; নিউক্লিয়াসের কুলম্ব আকর্ষণে ইলেকট্রন কাছাকাছি এসে শক্তি বিকিরণ করে গভীর বিভব কূপে আবদ্ধ হয় বলেই এর বিভবশক্তি ঋণাত্মক। কুলম্ব বলের অধীনে বৃত্তাকার গতির জন্য ঋণাত্মক বিভবশক্তির মান ধনাত্মক গতিশক্তির ঠিক দ্বিগুণ (\\(E_p = -2E_k\\)), তাই মোট শক্তি \\(E_n = E_k + E_p = -E_k \\lt 0\\) হয়—অর্থাৎ ইলেকট্রনটি আবদ্ধ এবং একে মুক্ত করতে বাইরে থেকে \\(|E_n|\\) পরিমাণ শক্তি জোগাতে হবে।", "trap": "পরীক্ষায় \\(E_k\\), \\(E_p\\) ও \\(E\\)-এর চিহ্ন এবং \\(n\\) বাড়লে পরিবর্তনের দিক নিয়ে সবচেয়ে বেশি ভুল হয়—মনে রাখবে \\(E_k = -E \\gt 0\\) এবং \\(E_p = 2E = -2E_k \\lt 0\\)। \\(n\\) বাড়লে গতিশক্তি \\(E_k\\) কমে, কিন্তু বিভবশক্তি ও মোট শক্তি কম ঋণাত্মক হয় বলে উভয়ই বৃদ্ধি পায়।", "quickExample": "কোনো বোর কক্ষপথে ইলেকট্রনের মোট শক্তি \\(E = -3.4\\text{ eV}\\) হলে গতিশক্তি \\(E_k = -E = +3.4\\text{ eV}\\) এবং বিভবশক্তি \\(E_p = 2E = 2 \\times (-3.4) = -6.8\\text{ eV}\\)। যাচাই: \\(E_k + E_p = 3.4 - 6.8 = -3.4\\text{ eV}\\)।"}, {"id": 97, "ch": 9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "হাইড্রোজেন পরমাণু", "question": "হাইড্রোজেন পরমাণুর \\(n\\)-তম কক্ষপথের ব্যাসার্ধ, বেগ, শক্তি, পর্যায়কাল ও প্রতি সেকেন্ডে আবর্তন সংখ্যার সংক্ষিপ্ত সূত্র কী?", "answer": "\\(r_n = n^2 r_1\\) (\\(r_1 = 0.51\\text{ \\AA}\\)), \\(v_n = \\frac{v_1}{n}\\) (\\(v_1 = 2.18\\times 10^6\\text{ m s}^{-1}\\)), \\(E_n = \\frac{E_1}{n^2}\\) (\\(E_1 = -13.6\\text{ eV}\\)), \\(T_n = n^3 T_1\\) (\\(T_1 = 1.51\\times 10^{-16}\\text{ s}\\)), আবর্তন সংখ্যা \\(= \\frac{6.56\\times 10^{15}}{n^3}\\)", "context": "<b>দ্রুত হিসাব (H-পরমাণু, \\(Z=1\\)):<\/b> \\(E_1 = -13.6\\text{ eV}\\), \\(E_2 = -3.4\\text{ eV}\\), \\(E_3 = -1.51\\text{ eV}\\)। আয়নীকরণ শক্তি \\(= +13.6\\text{ eV}\\)।", "intuition": "হাইড্রোজেন পরমাণু (\\(Z=1\\)) হলো বোর মডেলের আদর্শ মাপকাঠি—এর ভূমি স্তরের চারটি ধ্রুব মান (\\(
