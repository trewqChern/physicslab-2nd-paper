r_1 = 0.529\\text{ Å}\\), \\(v_1 = 2.18 \\times 10^6\\text{ m s}^{-1}\\), \\(E_1 = -13.6\\text{ eV}\\), \\(T_1 = 1.51 \\times 10^{-16}\\text{ s}\\)) জানা থাকলে শুধু \\(n\\)-এর ঘাত দিয়ে গুণ বা ভাগ করে যেকোনো কক্ষপথের মান মুহূর্তেই বের করা যায়। \\(E_1 = -13.6\\text{ eV}\\) ঋণাত্মক হওয়ায় ভূমি স্তর থেকে ইলেকট্রনকে সম্পূর্ণ মুক্ত (\\(E_\\infty = 0\\)) করতে ঠিক \\(+13.6\\text{ eV}\\) আয়নীকরণ শক্তি দিতে হয়।", "trap": "প্রথম উত্তেজিত অবস্থা (1st excited state) মানে \\(n = 1\\) নয় বরং \\(n = 2\\) (\\(E_2 = -3.4\\text{ eV}\\)), এবং দ্বিতীয় উত্তেজিত অবস্থা মানে \\(n = 3\\) (\\(E_3 = -1.51\\text{ eV}\\))। এছাড়া ভূমি স্তরের শক্তি \\(-13.6\\text{ eV}\\) হলেও আয়নীকরণ শক্তি সর্বদা ধনাত্মক \\(+13.6\\text{ eV}\\)।", "quickExample": "হাইড্রোজেনের দ্বিতীয় কক্ষপথে (\\(n=2\\)) বেগ \\(v_2 = \\frac{v_1}{2} = 1.09 \\times 10^6\\text{ m s}^{-1}\\), শক্তি \\(E_2 = \\frac{-13.6}{2^2} = -3.4\\text{ eV}\\) এবং এখান থেকে আয়নীকরণের জন্য ন্যূনতম শক্তি \\(= 0 - (-3.4) = +3.4\\text{ eV}\\)।"}, {"id": 98, "ch": 9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "কক্ষ স্থানান্তর ও রীডবার্গ", "question": "ইলেকট্রনের কক্ষ স্থানান্তরের নিঃসৃত শক্তি ও একক দৈর্ঘ্যে তরঙ্গ সংখ্যা (\\(\\bar{\\nu}\\)) নির্ণয়ের সূত্র কী?", "answer": "\\(E_2 - E_1 = h\\nu = \\frac{hc}{\\lambda}\\) • \\(\\bar{\\nu} = \\frac{1}{\\lambda} = R_H\\left(\\frac{1}{n_1^2} - \\frac{1}{n_2^2}\\right)Z^2\\) [\\(R_H = 109678\\text{ cm}^{-1}\\)]", "context": "<b>প্রতীক:<\/b> \\(n_1\\) = নিম্ন কক্ষপথ, \\(n_2\\) = উচ্চ কক্ষপথ, \\(R_H = 1.097\\times 10^7\\text{ m}^{-1}\\)।<br><b>বর্ণালি সারি:<\/b> \\(n_1=1\\) লাইম্যান (UV), \\(n_1=2\\) বামার (দৃশ্যমান), \\(n_1=3\\) প্যাশ্চেন (IR)।", "intuition": "ইলেকট্রন উচ্চ স্তর \\(n_2\\) থেকে নিম্ন স্তর \\(n_1\\)-এ নামলে শক্তির পার্থক্য \\(\\Delta E = E_{n_2} - E_{n_1}\\) একটি ফোটন হিসেবে নির্গত হয়। যেহেতু \\(E_n \\propto -\\frac{1}{n^2}\\), তাই ভূমি স্তরের কাছে শক্তিস্তরগুলোর ব্যবধান বিশাল হলেও \\(n\\) বাড়ার সাথে সাথে স্তরগুলো দ্রুত গায়ে গায়ে লেগে শূন্যের কাছে জমা হয়। এজন্য \\(n = 2 \\to 1\\) ধাপে \\(10.2\\text{ eV}\\) শক্তি নির্গত হয়, যা \\(n = 80 \\to 2\\) (এমনকি \\(n = \\infty \\to 2\\), মাত্র \\(3.4\\text{ eV}\\))-এর চেয়ে তিন গুণেরও বেশি!", "trap": "রীডবার্গ সূত্র সরাসরি \\(\\lambda\\) নয় বরং তরঙ্গ সংখ্যা \\(\\bar{\\nu} = \\frac{1}{\\lambda}\\) দেয়—শেষ ধাপে উল্টাতে ভুলে যাওয়া এবং হাইড্রোজেন-সদৃশ আয়নে (যেমন \\(\\text{He}^+, \\text{Li}^{2+}\\)) \\(Z^2\\) গুণ করতে ভুলে যাওয়া সবচেয়ে বড় ফাঁদ। মনে রাখবে \\(n_1 \\lt n_2\\) বসালেই ফলাফল ধনাত্মক হবে।", "quickExample": "হাইড্রোজেনের বামার সারির প্রথম রেখার (\\(n_2 = 3 \\to n_1 = 2\\)) তরঙ্গ সংখ্যা \\(\\frac{1}{\\lambda} = R_H\\left(\\frac{1}{2^2} - \\frac{1}{3^2}\\right) = \\frac{5}{36} R_H\\)। এখানে \\(R_H = 1.097 \\times 10^7\\text{ m}^{-1}\\) বসালে \\(\\lambda = \\frac{36}{5 \\times 1.097 \\times 10^7} \\approx 656\\text{ nm}\\) (লাল আলো)।"}, {"id": 99, "ch": 9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "তেজস্ক্রিয় ক্ষয় ও অর্ধায়ু", "question": "অর্ধায়ু \\(T_{1/2}\\), গড় আয়ু \\(\\tau\\), তেজস্ক্রিয় ক্ষয় সূত্র, ভাঙনের হার \\(\\frac{dN}{dt}\\), অবশিষ্ট পরমাণু \\(N\\) ও তেজস্ক্রিয়তা \\(A\\) এর সূত্র কী?", "answer": "\\(T_{1/2} = \\frac{\\ln 2}{\\lambda} = \\frac{0.693}{\\lambda}\\) • \\(\\tau = \\frac{1}{\\lambda} = 1.44\\times T_{1/2}\\)<br>\\(N = N_0e^{-\\lambda t}\\); \\(\\frac{N}{N_0} = \\frac{1}{2^n}\\) [\\(n = \\frac{t}{T_{1/2}}\\)]; \\(\\frac{dN}{dt} = N\\lambda = nN_A\\lambda\\)<br>\\(A = A_0e^{-\\lambda t} = \\frac{A_0}{2^n}\\); প্রতি সেকেন্ডে ফিশন \\(N = \\frac{P}{E}\\)", "context": "<b>প্রতীক:<\/b> \\(\\lambda\\) = ক্ষয় ধ্রুবক, \\(N_0\\) = আদি পরমাণু সংখ্যা, \\(N\\) = \\(t\\) সময় পর অবশিষ্ট (অক্ষত) পরমাণু, \\(N_A = 6.023\\times 10^{23}\\)।<br><b>সতর্কতা:<\/b> \\(N\\) হলো <b>অবশিষ্ট<\/b> অংশ; ক্ষয়প্রাপ্ত অংশ \\(= N_0 - N\\)। \\(A\\)-এর SI একক বেকেরেল (\\(\\text{Bq} = 1\\text{ decay/s}\\))।", "intuition": "তেজস্ক্রিয় ক্ষয় সম্পূর্ণ নিউক্লিয়াসের অভ্যন্তরীণ (\\(\\sim \\text{MeV}\\) পাল্লার) স্বতঃস্ফূর্ত কোয়ান্টাম ঘটনা। তাপমাত্রা, চাপ, তড়িৎ-চুম্বক ক্ষেত্র বা রাসায়নিক বিক্রিয়া কেবল বাইরের ইলেকট্রন স্তরে (\\(\\sim \\text{eV}\\) পাল্লায়) প্রভাব ফেলে—এগুলোর শক্তি নিউক্লিয়াসের ভেতরের শক্তির তুলনায় লক্ষ গুণ কম বলে অর্ধায়ু \\(T_{1/2}\\) ও ক্ষয় ধ্রুবক \\(\\lambda\\) কখনো তাপমাত্রা বা চাপে বদলায় না। ভাঙনের হার তৎক্ষণাৎ অবশিষ্ট অক্ষত পরমাণুর সমানুপাতিক হওয়ায় প্রতি অর্ধায়ুতে পরমাণু অর্ধেক হয়, কিন্তু তাত্ত্বিকভাবে কখনো শূন্য হয় না।", "trap": "\\(N = \\frac{N_0}{2^n}\\) সূত্রে \\(N\\) হলো অবশিষ্ট (অক্ষত) পরমাণু, ক্ষয়প্রাপ্ত অংশ (\\(N_0 - N\\)) নয়—প্রশ্নে 'কত অংশ ক্ষয় হবে' চাইলে \\(1 - \\frac{1}{2^n}\\) বের করতে হবে। আর গড় আয়ু \\(\\tau = 1.443\\,T_{1/2}\\) হওয়ায় \\(\\tau \\gt T_{1/2}\\) সর্বদা সত্য।", "quickExample": "কোনো তেজস্ক্রিয় মৌলের অর্ধায়ু \\(T_{1/2} = 10\\text{ min}\\) হলে \\(30\\text{ min}\\) পর \\(n = \\frac{30}{10} = 3\\)। অবশিষ্ট অংশ \\(\\frac{N}{N_0} = \\frac{1}{2^3} = \\frac{1}{8} = 12.5\\%\\), তাই ক্ষয়প্রাপ্ত অংশ \\(= 100\\% - 12.5\\% = 87.5\\%\\)।"}, {"id": 100, "ch": 9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "নিউক্লিয়াস ও বন্ধন শক্তি", "question": "নিউক্লিয়াসের ব্যাসার্ধ \\(R\\), ভর ত্রুটি \\(\\Delta m\\), বন্ধন শক্তি \\(E\\) এবং প্রতি নিউক্লিয়নে বন্ধন শক্তির সূত্র কী?", "answer": "\\(R = R_0 A^{1/3}\\) [\\(R_0 = 1.2\\times 10^{-15}\\text{ m}\\)]<br>\\(\\Delta m = m_{\\text{nucleus}} - [Zm_p + (A-Z)m_n]\\)<br>বন্ধন শক্তি: \\(E = \\Delta m c^2\\) • প্রতি নিউক্লিয়নে: \\(\\frac{E}{A} = \\frac{\\Delta m c^2}{A}\\)", "context": "<b>প্রতীক:<\/b> \\(A\\) = ভর সংখ্যা, \\(Z\\) = প্রোটন সংখ্যা, \\((A-Z)\\) = নিউট্রন সংখ্যা।<br><b>শর্টকাট:<\/b> \\(1\\text{ amu} \\approx 931.5\\text{ MeV}\\)। প্রতি নিউক্লিয়নে বন্ধন শক্তি যত বেশি, নিউক্লিয়াস তত বেশি স্থায়ী (লোহা \\(\\text{Fe-56}\\) সবচেয়ে স্থায়ী)।", "intuition": "নিউক্লীয় বলের স্বল্প পাল্লা ও সম্পৃক্তি ধর্মের কারণে প্রতিটি নিউক্লিয়ন নির্দিষ্ট আয়তন দখল করে, ফলে ব্যাসার্ধ \\(R = R_0 A^{1/3}\\) এবং আয়তন \\(V \\propto R^3 \\propto A\\) হয়। ভর \\(M \\propto A\\) হওয়ায় ঘনত্ব \\(\\rho = \\frac{M}{V} \\propto \\frac{A}{A} = \\text{const}\\) (\\(\\approx 2.3 \\times 10^{17}\\text{ kg m}^{-3}\\)), যা ভর সংখ্যা \\(A\\)-নিরপেক্ষ। আবার নিউক্লিয়াস গঠনের ভর ত্রুটি \\(\\Delta m\\) থেকে উদ্ভূত প্রতি নিউক্লিয়নে বন্ধন শক্তি \\(E_b/A\\) লোহার (\\({}^{56}_{26}\\text{Fe}\\)) ক্ষেত্রে সর্বোচ্চ (\\(\\approx 8.8\\text{ MeV}\\)) হয়—যার ফলেই হালকা নিউক্লিয়াসের ফিউশন এবং ভারী নিউক্লিয়াসের ফিশন উভয় প্রক্রিয়ায় শক্তি নির্গত হয়।", "trap": "স্থায়িত্ব মোট বন্ধন শক্তি \\(E_b\\) দিয়ে নয় বরং প্রতি নিউক্লিয়নে বন্ধন শক্তি \\(E_b/A\\) দিয়ে মাপা হয় (যেমন \\({}^{238}_{92}\\text{U}\\)-এর মোট \\(E_b\\) বেশি হলেও \\({}^{56}_{26}\\text{Fe}\\) বেশি স্থায়ী)। আর \\(\\Delta m\\) একক \\(\\text{u}\\)-তে থাকলে \\(931.5\\text{ MeV}\\) দিয়ে গুণ করতে হবে।", "quickExample": "\\({}^{27}_{13}\\text{Al}\\) ও \\({}^{125}_{52}\\text{Te}\\) নিউক্লিয়াসের ব্যাসার্ধের অনুপাত \\(\\frac{R_1}{R_2} = \\left(\\frac{27}{125}\\right)^{1/3} = \\frac{3}{5}\\)। আর ভর ত্রুটি \\(\\Delta m = 0.03\\text{ u}\\) হলে বন্ধন শক্তি \\(E_b = 0.03 \\times 931.5 = 27.945\\text{ MeV}\\)।"}, {"id": 101, "ch": 10, "chapter": "অধ্যায় ১০: সেমিকন্ডাক্টর ও ইলেকট্রনিক্স", "topic": "ডায়োড ও ট্রানজিস্টর", "question": "ডায়োডের গতীয় রোধ \\(R\\), নিঃসারক প্রবাহ \\(I_E\\), প্রবাহ লাভ \\(\\beta\\) এবং প্রবাহ বিবর্ধক গুণক \\(\\alpha\\) এর সূত্র কী?", "answer": "\\(R = \\frac{\\Delta V}{\\Delta I}\\) • \\(I_E = I_B + I_C\\) (\\(\\Delta I_E = \\Delta I_B + \\Delta I_C\\))<br>\\(\\beta = \\frac{I_C}{I_B} = \\frac{\\alpha}{1 - \\alpha}\\) • \\(\\alpha = \\frac{I_C}{I_E} = \\frac{I_C}{I_B + I_C} = \\frac{\\beta}{1 + \\beta}\\)", "context": "<b>প্রতীক:<\/b> \\(I_E\\) = নিঃসারক (Emitter), \\(I_B\\) = পীঠ (Base, সবচেয়ে কম), \\(I_C\\) = সংগ্রাহক (Collector) প্রবাহ।<br><b>মানের সীমা:<\/b> সর্বদা \\(\\alpha \\lt  1\\) (প্রায় \\(0.95\\text{–}0.99\\)) এবং \\(\\beta \\gg 1\\) (সাধারণত \\(20\\text{–}500\\))।", "intuition": "ডায়োডের \\(I\\text{-}V\\) লেখচিত্র সরলরৈখিক নয় বরং সূচকীয় (exponential), তাই এর রোধ ধ্রুব থাকে না—কোনো বিন্দুতে বিভবের অতি ক্ষুদ্র পরিবর্তনের সাপেক্ষে প্রবাহের পরিবর্তনের অনুপাত \\(r_d = \\frac{\\Delta V}{\\Delta I}\\) ওই বিন্দুতে লেখচিত্রের ঢালের ব্যস্তানুপাত হিসেবে গতীয় রোধ নির্দেশ করে। আর ট্রানজিস্টরে পীঠ (Base) অঞ্চলকে অত্যন্ত পাতলা ও লঘু ডোপিংযুক্ত রাখা হয় যাতে নিঃসারক (Emitter) থেকে আসা অধিকাংশ বাহক পীঠে পুনর্মিলিত (recombine) না হয়ে সরাসরি সংগ্রাহকে (Collector) চলে যায়। ফলে মোট প্রবাহের মাত্র \\(1\\%\\text{–}5\\%\\) পীঠে (\\(I_B\\)) এবং \\(95\\%\\text{–}99\\%\\) সংগ্রাহকে (\\(I_C\\)) পৌঁছায়—তাই পীঠ প্রবাহের ক্ষুদ্র পরিবর্তনেই সংগ্রাহক প্রবাহে বিশাল বিবর্ধন ঘটে।", "trap": "ভর্তি পরীক্ষায় \\(I_B\\) প্রায়ই \\(\\mu\\text{A}\\)-এ এবং \\(I_C\\) বা \\(I_E\\) দেওয়া থাকে \\(\\text{mA}\\)-এ—একক না মিলিয়ে সরাসরি যোগ-বিয়োগ বা ভাগ করলে উত্তর \\(1000\\) গুণ ভুল হয়! এছাড়া অনেকেই \\(\\alpha \\lt 1\\) ও \\(\\beta \\gg 1\\)-এর সম্পর্ক উল্টে ফেলেন এবং গতীয় রোধ \\(r_d = \\frac{\\Delta V}{\\Delta I}\\)-এর বদলে সরাসরি \\(\\frac{V}{I}\\) বসিয়ে ভুল করেন।", "quickExample": "একটি ট্রানজিস্টরে \\(I_B = 50\\ \\mu\\text{A} = 0.05\\ \\text{mA}\\) এবং \\(I_C = 2.45\\ \\text{mA}\\) হলে নিঃসারক প্রবাহ \\(I_E = 0.05 + 2.45 = 2.50\\ \\text{mA}\\)। এখানে প্রবাহ লাভ \\(\\beta = \\frac{2.45}{0.05} = 49\\) এবং প্রবাহ বিবর্ধন গুণক \\(\\alpha = \\frac{49}{1+49} = 0.98\\)।"}, {"id": 102, "ch": 10, "chapter": "অধ্যায় ১০: সেমিকন্ডাক্টর ও ইলেকট্রনিক্স", "topic": "বুলিয়ান ও ডি-মর্গ্যান", "question": "মৌলিক বুলিয়ান উপপাদ্যসমূহ এবং ডি-মর্গ্যানের উপপাদ্য দুটি কী?", "answer": "বুলিয়ান: \\(A+0=A\\), \\(A+\\bar{A}=1\\), \\(A+A=A\\), \\(A+1=1\\), \\(A\\cdot 1=A\\), \\(A\\cdot\\bar{A}=0\\), \\(A\\cdot A=A\\), \\(A\\cdot 0=0\\)<br>ডি-মর্গ্যান: \\(\\overline{(A+B)} = \\bar{A}\\cdot\\bar{B}\\) এবং \\(\\overline{(A\\cdot B)} = \\bar{A} + \\bar{B}\\)", "context": "<b>প্রয়োগ:<\/b> ডিজিটাল লজিক সার্কিট ও বুলিয়ান ফাংশন সরলীকরণে ব্যবহৃত হয়।<br><b>মনে রাখার উপায়:<\/b> ডি-মর্গ্যানে 'বার ভাঙলে চিহ্ন বদলায়' (Break the bar, change the sign: \\(+\\) হয় \\(\\cdot\\), আর \\(\\cdot\\) হয় \\(+\\))।", "intuition": "বুলিয়ান বীজগণিত আসলে সুইচিং সার্কিটের যুক্তি: \\(1\\) মানে সুইচ বন্ধ (চালু) এবং \\(0\\) মানে খোলা (বন্ধ)। দুটি সুইচ সমান্তরালে থাকলে যেকোনো একটি চালু হলেই বাতি জ্বলে—এটিই OR (\\(+\\)), তাই \\(A + 1 = 1\\); আর শ্রেণিতে থাকলে দুটোই চালু হতে হয়—এটিই AND (\\(\\cdot\\)), তাই \\(A \\cdot 0 = 0\\)। ডি-মর্গ্যানের উপপাদ্যও দৈনন্দিন যুক্তিরই প্রতিফলন: 'A অথবা B কেউই সত্য নয়' (\\(\\overline{A+B}\\)) বলা আর 'A মিথ্যা এবং B মিথ্যা' (\\(\\bar{A}\\cdot\\bar{B}\\)) বলা একই কথা; তেমনি 'A ও B দুটো একসাথে সত্য নয়' (\\(\\overline{A\\cdot B}\\)) মানে 'অন্তত A অথবা B মিথ্যা' (\\(\\bar{A}+\\bar{B}\\))।", "trap": "ডি-মর্গ্যানের উপপাদ্যে পূর্ণ বার (\\(\\overline{A+B}\\)) ভাঙার সময় অনেকেই কেবল চলকগুলোর ওপর আলাদা বার বসিয়ে মাঝের \\(+\\) বা \\(\\cdot\\) চিহ্ন পরিবর্তন করতে ভুলে যান, ফলে \\(\\overline{A+B} = \\bar{A}+\\bar{B}\\) লিখে মারাত্মক ভুল করেন। এছাড়া সাধারণ বীজগণিতের মতো \\(A + A = 2A\\) বা \\(A \\cdot A = A^2\\) লেখাও বড় ফাঁদ—বুলিয়ানে উভয়েরই মান \\(A\\)।", "quickExample": "\\(Y = \\overline{A \\cdot \\bar{B}} + A\\) সরলীকরণ করলে ডি-মর্গ্যানের সূত্রে \\(\\overline{A \\cdot \\bar{B}} = \\bar{A} + \\overline{\\bar{B}} = \\bar{A} + B\\)। ফলে \\(Y = \\bar{A} + B + A = (A + \\bar{A}) + B = 1 + B = 1\\)।"}, {"id": 103, "ch": 11, "chapter": "অধ্যায় ১১: জ্যোতির্বিজ্ঞান", "topic": "হাবল, সংকট ঘনত্ব ও শোয়ার্জশিল্ড", "question": "হাবল বিধি, মহাবিশ্বের সংকট ঘনত্ব \\(\\rho_c\\), ঘনত্ব \\(\\rho\\) এবং শোয়ার্জশিল্ড ব্যাসার্ধ \\(R_s\\) এর সূত্র কী?", "answer": "হাবল বিধি: \\(v = Hd\\) [\\(H = 55\\text{ (km/s)/Mpc}\\)]<br>সংকট ঘনত্ব: \\(\\rho_c = \\frac{3H^2}{8\\pi G}\\) • ঘনত্ব: \\(\\rho = \\frac{M}{V} = \\frac{M}{\\frac{4}{3}\\pi R^3}\\) • \\(R_s = \\frac{2GM}{c^2}\\)", "context": "<b>প্রতীক:<\/b> \\(v\\) = গ্যালাক্সির অপসারণ বেগ, \\(d\\) = দূরত্ব, \\(H\\) = হাবল ধ্রুবক, \\(G = 6.673\\times 10^{-11}\\text{ N m}^2\\text{kg}^{-2}\\)।<br><b>ধারণা:<\/b> \\(R_s\\) হলো কৃষ্ণগহ্বরের (Black hole) ঘটনা দিগন্তের ব্যাসার্ধ; মহাবিশ্বের ঘনত্ব \\(\\rho \\gt  \\rho_c\\) হলে তা সংকুচিত হবে।", "intuition": "হাবল বিধি (\\(v = Hd\\)) আসলে মহাকাশের নিজেরই প্রসারণের ফল—কিশমিশ দেওয়া পাউরুটির খামির ফুলে উঠলে প্রতিটি কিশমিশ অন্যটির থেকে দূরে সরে যায় এবং যে কিশমিশ যত দূরে, তার সরে যাওয়ার বেগ তত বেশি। এই প্রসারণকে মহাকর্ষীয় আকর্ষণ থামাতে পারবে কি না তা নির্ধারণ করে সংকট ঘনত্ব \\(\\rho_c\\): মহাবিশ্বের গড় ঘনত্ব \\(\\rho \\gt \\rho_c\\) হলে মহাকর্ষ জিতে গিয়ে একসময় সংকোচন ঘটবে। আর কোনো ভর \\(M\\)-কে যদি তার শোয়ার্জশিল্ড ব্যাসার্ধ \\(R_s = \\frac{2GM}{c^2}\\)-এর ভেতরে সংকুচিত করা যায়, তবে পৃষ্ঠে মুক্তিবেগ আলোর বেগ \\(c\\)-এর সমান হয়ে যায়—তাই এর ভেতর থেকে আলোও আর বেরোতে পারে না এবং তা কৃষ্ণগহ্বর হয়।", "trap": "শোয়ার্জশিল্ড ব্যাসার্ধের সূত্রে \\(R_s = \\frac{2GM}{c^2}\\) অনেকেই \\(2\\) বা \\(c\\)-এর বর্গ বাদ দিয়ে ভুল করেন! এছাড়া হাবল ধ্রুবক \\(H\\)-এর এসআই একক \\(\\text{s}^{-1}\\) হওয়ায় মহাবিশ্বের বয়স \\(T = \\frac{1}{H}\\) হিসাবের আগে \\(\\text{km}\\) ও \\(\\text{Mpc}\\) রূপান্তর না করলে উত্তর সম্পূর্ণ ভুল আসে। আর মনে রেখো, কৃষ্ণগহ্বরের ভর দ্বিগুণ হলে \\(R_s\\) দ্বিগুণ হয় কিন্তু গড় ঘনত্ব \\(\\rho \\propto \\frac{1}{M^2}\\) হওয়ায় \\(\\frac{1}{4}\\) গুণ হয়ে যায়।", "quickExample": "একটি গ্যালাক্সির দূরত্ব \\(d = 40\\ \\text{Mpc}\\) এবং হাবল ধ্রুবক \\(H = 55\\ \\text{km s}^{-1}\\text{Mpc}^{-1}\\) হলে এর অপসারণ বেগ \\(v = Hd = 55 \\times 40 = 2200\\ \\text{km s}^{-1}\\)। আবার সূর্যের ভর \\(M = 2 \\times 10^{30}\\ \\text{kg}\\) হলে এর শোয়ার্জশিল্ড ব্যাসার্ধ \\(R_s = \\frac{2 \\times 6.67 \\times 10^{-11} \\times 2 \\times 10^{30}}{(3 \\times 10^8)^2} \\approx 2.96\\ \\text{km}\\)।"}, {"id": 104, "ch": 11, "chapter": "অধ্যায় ১১: জ্যোতির্বিজ্ঞান", "topic": "ডপলার, মুক্তিবেগ ও উপগ্রহ", "question": "জ্যোতির্বিজ্ঞানে ডপলারের সমীকরণ, মুক্তিবেগ \\(v_e\\), কৃত্রিম উপগ্রহের বেগ \\(v\\), আবর্তনকাল \\(T\\) ও কেপলারের ৩য় সূত্র কী?", "answer": "ডপলার: \\(\\frac{v}{c} = \\frac{\\Delta l}{l}\\) • মুক্তিবেগ: \\(v_e = \\sqrt{\\frac{2GM}{R}}\\)<br>উপগ্রহের বেগ: \\(v = \\sqrt{\\frac{GM}{r}} = \\sqrt{\\frac{GM}{R+h}} = \\sqrt{g_h(R+h)}\\)<br>আবর্তনকাল: \\ \\))। ব্যাটারি খুলে নেওয়া মানে ট্যাংকের মুখ সিল করে দেওয়া—চার্জ \\(Q\\) পালাতে পারে না (\\(U = \\frac{Q^2}{2C} \\propto \\frac{1}{C}\\))। ডাই-ইলেকট্রিক ঢোকালে এর অণুগুলো বিপরীত ক্ষেত্র তৈরি করে মূল ক্ষেত্রকে আংশিক আড়াল (screening) করে, আর ধাতব পাত ঢোকালে তার ভেতরে \\(E = 0\\) হওয়ায় কার্যকর ফাঁকা দূরত্ব কমে \\(d - t\\) হয়।", "trap": "ধারকের প্রশ্নে প্রথমেই দেখো ব্যাটারি লাগানো না খোলা। এছাড়া সব রৈখিক মাত্রা \\(n\\) গুণ করলে \\(C = \\frac{\\varepsilon_0 a^2}{d} \\to \\frac{\\varepsilon_0 (na)^2}{nd} = nC\\) (\\(n\\) গুণ হয়, \\(n^2\\) গুণ নয়)।", "quickExample": "\\(C = 4\\ \\mu\\text{F}\\), \\(V = 10\\text{ V}\\) ধারকের ব্যাটারি খুলে পাত-দূরত্ব দ্বিগুণ করলে আদি শক্তি \\(U = \\frac{1}{2}CV^2 = 200\\ \\mu\\text{J}\\); \\(Q\\) ধ্রুব ও \\(C' = \\frac{C}{2}\\) হওয়ায় \\(U' = 2U = 400\\ \\mu\\text{J}\\)।", "svg": "<svg viewBox=\"0 0 320 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;height:auto;display:block;margin:8px auto;\"><rect x=\"10\" y=\"8\" width=\"300\" height=\"139\" rx=\"10\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.2\"/><rect x=\"48\" y=\"26\" width=\"12\" height=\"86\" rx=\"2\" fill=\"#ef4444\"/><text x=\"54\" y=\"20\" font-size=\"11\" font-weight=\"700\" fill=\"#dc2626\" text-anchor=\"middle\">+Q<\/text><rect x=\"260\" y=\"26\" width=\"12\" height=\"86\" rx=\"2\" fill=\"#2563eb\"/><text x=\"266\" y=\"20\" font-size=\"11\" font-weight=\"700\" fill=\"#1d4ed8\" text-anchor=\"middle\">−Q<\/text><rect x=\"110\" y=\"32\" width=\"100\" height=\"74\" rx=\"4\" fill=\"#94a3b8\" fill-opacity=\"0.35\" stroke=\"#475569\" stroke-width=\"1.5\" stroke-dasharray=\"4,2\"/><text x=\"160\" y=\"65\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1e293b\" text-anchor=\"middle\">Metal / Dielectric<\/text><text x=\"160\" y=\"80\" font-size=\"10\" fill=\"#334155\" text-anchor=\"middle\">t = d/2 (E = 0 / E/K)<\/text><line x1=\"62\" y1=\"46\" x2=\"106\" y2=\"46\" stroke=\"#0f766e\" stroke-width=\"1.4\" marker-end=\"url(#arrC)\"/><line or=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#b91c1c\">Opposite Direction (Repel)<\/text><line x1=\"252\" y1=\"162\" x2=\"252\" y2=\"42\" stroke=\"#1d4ed8\" stroke-width=\"3\" marker-end=\"url(#arrI4)\"/><line x1=\"318\" y1=\"42\" x2=\"318\" y2=\"162\" stroke=\"#1d4ed8\" stroke-width=\"3\" marker-end=\"url(#arrI4)\"/><text x=\"236\" y=\"64\" font-size=\"12\" font-weight=\"bold\" fill=\"#1e3a8a\">I&#8321;<\/text><text x=\"326\" y=\"148\" font-size=\"12\" font-weight=\"bold\" fill=\"#1e3a8a\">I&#8322;<\/text><line x1=\"248\" y1=\"106\" x2=\"218\" y2=\"106\" stroke=\"#dc2626\" stroke-width=\"2.2\" marker-end=\"url(#arrRep4)\"/><line x1=\"322\" y1=\"106\" x2=\"352\" y2=\"106\" stroke=\"#dc2626\" stroke-width=\"2.2\" marker-end=\"url(#arrRep4)\"/><text x=\"228\" y=\"96\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" fill=\"#b91c1c\">F<\/text><text x=\"342\" y=\"96\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" fill=\"#b91c1c\">F<\/text><line x1=\"252\" y1=\"176\" x2=\"318\" y2=\"176\" stroke=\"#475569\" stroke-width=\"1.2\"/><text x=\"285\" y=\"191\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\" fill=\"#334155\">d<\/text><\/svg>", "isNewPdfSection": true}, {"id": 122, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "AC বর্তনীতে ধারক ও আবেশকের দশা পার্থক্য, ইম্পিড্যান্স ও রেজোন্যান্স", "question": "AC বর্তনীতে ধারক ও আবেশকের দশা পার্থক্য, ইম্পিড্যান্স ও রেজোন্যান্স", "answer": "তাৎক্ষণিক প্রবাহ: \\(I = I_0\\sin\\omega t\\), \\(\\omega = 2\\pi f\\)<br>RMS মান: \\(I_{\\text{rms}} = \\frac{I_0}{\\sqrt{2}} = 0.707\\,I_0\\); \\(E_{\\text{rms}} = \\frac{E_0}{\\sqrt{2}}\\)<br>আবেশীয় ও ধারকীয় প্রতিঘাত: \\(X_L = \\omega L = 2\\pi fL\\), \\(X_C = \\frac{1}{\\omega C} = \\frac{1}{2\\pi fC}\\)<br>সিরিজ LCR ইম্পিড্যান্স: \\(Z = \\sqrt{R^2 + (X_L - X_C)^2}\\)<br>রেজোন্যান্স কম্পাঙ্ক: \\(f_0 = \\frac{1}{2\\pi\\sqrt{LC}}\\) (শর্ত: \\(X_L = X_C\\), \\(Z = R\\))<br>গড় ক্ষমতা: \\(P = V_{\\text{rms}} I_{\\text{rms}} \\cos\\phi\\)", "context": "• ধারক AC-তে প্রবাহ \\(90^\\circ\\) আগায়, আবেশক \\(90^\\circ\\) পিছায়।<br>• DC-তে ধারক পূর্ণ চার্জ হলে প্রবাহ বন্ধ করে দেয় (\\(X_C \\to \\infty\\)), আর আবেশক সাধারণ পরিবাহী তারের মতো আচরণ করে (\\(X_L = 0\\))।<br>• রেজোন্যান্সে \\(X_L = X_C\\) হওয়ায় ইম্পিড্যান্স সর্বনিম্ন (\\(Z = R\\)) এবং বর্তনীর প্রবাহ সর্বোচ্চ হয়।<br>• অ্যামিটার ও ভোল্টমিটার AC-তে সর্বদা RMS মান দেখায়; ঘরের \\(220\\text{ V}\\) মানে RMS মান, যার শীর্ষমান \\(\\approx 311\\text{ V}\\)।", "intuition": "\\(\\text{DC}\\)-তে কম্পাঙ্ক \\(f = 0\\): তাই ধারকের প্রতিঘাত \\(X_C = \\frac{1}{2\\pi fC} \\to \\infty\\) হয়—একবার পূর্ণ চার্জ হয়ে গেলে দুটি পাতের মাঝের অন্তরক স্তর ভেদ করে স্থির প্রবাহ আর যেতে পারে না, ফলে <b>ধারক \\(\\text{DC}\\) আটকে দেয়<\/b> কিন্তু দ্রুত দিক বদলানো \\(\\text{AC}\\) সহজেই চার্জ-ডিসচার্জের মাধ্যমে পাস করে। উল্টোদিকে আবেশকের \\(X_L = 2\\pi fL = 0\\)—স্থির প্রবাহে ফ্লাক্স না বদলানোয় কোনো বিপরীত \\(\\text{emf}\\) তৈরি হয় না, তাই <b>আবেশক \\(\\text{DC}\\) সহজেই পাস করে<\/b> কিন্তু উচ্চ কম্পাঙ্কের \\(\\text{AC}\\)-কে বাধা দেয়। সিরিজ \\(LCR\\) বর্তনীতে ধারক প্রবাহকে ভোল্টেজের \\(90^\\circ\\) এগিয়ে রাখে ও আবেশক \\(90^\\circ\\) পিছিয়ে রাখে; রেজোন্যান্স কম্পাঙ্ক \\(f_0\\)-তে \\(X_L = X_C\\) হয়ে পরস্পরকে নাকচ করে দেওয়ায় ইম্পিড্যান্স সর্বনিম্ন (\\(Z = R\\)) ও প্রবাহ সর্বোচ্চ হয়।", "trap": "সিরিজ \\(LCR\\) বর্তনীতে মোট বাধা বের করতে \\(R + X_L + X_C\\) বীজগাণিতিকভাবে যোগ করা যাবে না—দশা পার্থক্যের কারণে ভেক্টরীয় সূত্র \\(Z = \\sqrt{R^2 + (X_L - X_C)^2}\\) ব্যবহার করতে হবে। এছাড়া \\(f_0 = \\frac{1}{2\\pi\\sqrt{LC}}\\) (হার্টজে) আর \\(\\omega_0 = \\frac{1}{\\sqrt{LC}}\\) (\\(\\text{rad s}^{-1}\\)-এ)—পরীক্ষায় \\(2\\pi\\) বাদ দিয়ে ফেললে উত্তর ভুল হবে।", "quickExample": "<b>প্রশ্ন:<\/b> \\(R = 30\\,\\Omega\\), \\(X_L = 80\\,\\Omega\\), \\(X_C = 40\\,\\Omega\\) সিরিজে যুক্ত। ইম্পিড্যান্স \\(Z\\) ও ক্ষমতা গুণক \\(\\cos\\phi\\) কত?<br>• \\(X_L - X_C = 80 - 40 = 40\\,\\Omega\\)<br>• \\(Z = \\sqrt{30^2 + 40^2} = \\sqrt{900 + 1600} = 50\\,\\Omega\\)<br>• \\(\\cos\\phi = \\frac{R}{Z} = \\frac{30}{50} = 0.6\\)<br><b>উত্তর:<\/b> \\(Z = 50\\,\\Omega\\), \\(\\cos\\phi = 0.6\\)", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 230\" width=\"100%\" role=\"img\" aria-label=\"Impedance Triangle and AC Sine Wave Peak vs RMS\"><rect x=\"0\" y=\"0\" width=\"640\" height=\"230\" rx=\"12\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.2\"/><text x=\"155\" y=\"24\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#1e293b\">Impedance Triangle (LCR)<\/text><line x1=\"45\" y1=\"185\" x2=\"255\" y2=\"185\" stroke=\"#2563eb\" stroke-width=\"3\"/><line x1=\"255\" y1=\"185\" x2=\"255\" y2=\"60\" stroke=\"#dc2626\" stroke-width=\"3\"/><line x1=\"45\" y1=\"185\" x2=\"255\" y2=\"60\" stroke=\"#7c3aed\" stroke-width=\"3\"/><rect x=\"243\" y=\"173\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"#475569\" stroke-width=\"1.2\"/><path d=\"M 82 185 A 37 37 0 0 0 76 166\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"1.8\"/><text x=\"92\" y=\"176\" font-family=\"serif\" font-size=\"14\" font-style=\"italic\" fill=\"#0f766e\">φ<\/text><text x=\"150\" y=\"205\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#2563eb\">R<\/text><text x=\"264\" y=\"126\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"#dc2626\">X_L - X_C<\/text><text x=\"128\" y=\"110\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#7c3aed\" transform=\"rotate(-31 128 110)\">Z = √(R² + (X_L - X_C)²)<\/text><line x1=\"325\" y1=\"18\" x2=\"325\" y2=\"212\" stroke=\"#e2e8f0\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/><text x=\"482\" y=\"24\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#1e293b\">AC Sine Wave: Peak vs RMS<\/text><line x1=\"350\" y1=\"130\" x2=\"615\" y2=\"130\" stroke=\"#64748b\" stroke-width=\"1.4\"/><line x1=\"365\" y1=\"45\" x2 য়।", "intuition": "পাওয়ার স্টেশন থেকে দূরদূরান্তে বিদ্যুৎ পাঠাতে হলে পরিবাহী তারে \\(P_{\\text{loss}} = I^2 R\\) তাপজনিত অপচয় কমানো জরুরি। আদর্শ ট্রান্সফর্মারে শক্তি সংরক্ষিত থাকে (\\(V_p I_p = V_s I_s\\)), তাই স্টেপ-আপ ট্রান্সফর্মার (\\(N_s \\gt N_p\\)) দিয়ে ভোল্টেজ অনেক গুণ বাড়ালে প্রবাহ \\(I\\) ঠিক তত গুণ কমে যায় এবং লাইনের তাপক্ষয় \\(I^2\\) অনুপাতে বহুগুণ কমে আসে; পরে গ্রাহকের বাড়ির কাছে স্টেপ-ডাউন ট্রান্সফর্মার (\\(N_s \\lt N_p\\)) ভোল্টেজকে নিরাপদ \\(220\\text{ V}\\)-এ নামিয়ে আনে। ফ্লাক্সের পরিবর্তন ছাড়া পারস্পরিক আবেশ সম্ভব নয় বলে কোনো ট্রান্সফর্মারই \\(\\text{DC}\\)-তে কাজ করে না।", "trap": "অনেকেই ভুল করে ভাবে স্টেপ-আপ ট্রান্সফর্মার ভোল্টেজের সাথে সাথে ক্ষমতা বা কম্পাঙ্কও বাড়ায়—বাস্তবে আদর্শ ট্রান্সফর্মারে ক্ষমতা (\\(P\\)) ও কম্পাঙ্ক (\\(f\\)) উভয়ই অপরিবর্তিত থাকে, কেবল ভোল্টেজ বাড়লে প্রবাহ কমে। আবার বাস্তব ট্রান্সফর্মারে দক্ষতা \\(\\eta = \\frac{V_s I_s}{V_p I_p} \\times 100\\% \\lt 100\\%\\) হলে \\(I_s\\) বের করতে \\(\\eta\\) হিসাব করতে হবে।", "quickExample": "<b>প্রশ্ন:<\/b> একটি আদর্শ স্টেপ-আপ ট্রান্সফর্মারে \\(N_p = 100\\), \\(N_s = 500\\), \\(V_p = 220\\text{ V}\\) এবং মুখ্য প্রবাহ \\(I_p = 5\\text{ A}\\) হলে গৌণ ভোল্টেজ \\(V_s\\) ও গৌণ প্রবাহ \\(I_s\\) কত?<br>• \\(V_s = V_p \\times \\frac{N_s}{N_p} = 220 \\times \\frac{500}{100} = 1100\\text{ V}\\)<br>• \\(V_p I_p = V_s I_s \\implies I_s = \\frac{220 \\times 5}{1100} = 1\\text{ A}\\)<br><b>উত্তর:<\/b> \\(V_s = 1100\\text{ V}\\), \\(I_s = 1\\text{ A}\\)", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 220\" width=\"100%\" role=\"img\" aria-label=\"Step-Up Transformer Schematic Diagram\"><rect x=\"0\" y=\"0\" width=\"560\" height=\"220\" rx=\"12\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.2\"/><text x=\"280\" y=\"24\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#1e293b\">Transformer (Laminated Iron Core)<\/text><rect x=\"175\" y=\"48\" width=\"210\" height=\"140\" rx=\"6\" fill=\"#cbd5e1\" stroke=\"#475569\" stroke-width ণ বেড়ে যায়—ফলে এডি কারেন্ট ও তাপজনিত শক্তির ক্ষয় নাটকীয়ভাবে কমে আসে।", "trap": "ট্রান্সফর্মারের কোর ক্ষয়ে দুটি আলাদা সমাধান গুলিয়ে ফেলা যাবে না: <b>এডি কারেন্ট ক্ষয়<\/b> কমাতে <b>ল্যামিনেটেড (পাতলা পাতযুক্ত) কোর<\/b> ব্যবহৃত হয়, আর <b>হিস্টেরেসিস ক্ষয়<\/b> কমাতে <b>নরম লোহার (soft iron) কোর<\/b> ব্যবহৃত হয়। এছাড়া এডি কারেন্ট সবসময় ক্ষতিকর নয়—ইনডাকশন চুল্লি, ইনডাকশন কুকার ও ট্রেনের তড়িৎচৌম্বকীয় ব্রেকে এর উপকারী প্রয়োগ রয়েছে।", "quickExample": "<b>প্রশ্ন:<\/b> \\(100\\) পাকের একটি কুণ্ডলীর চৌম্বক ফ্লাক্স \\(0.1\\text{ s}\\)-এ \\(0.05\\text{ Wb}\\) থেকে \\(0.01\\text{ Wb}\\)-এ নেমে এলে আবিষ্ট \\(\\text{emf}\\) কত?<br>• \\(\\Delta\\Phi = 0.01 - 0.05 = -0.04\\text{ Wb}\\)<br>• \\(|E| = N\\frac{|\\Delta\\Phi|}{\\Delta t} = 100 \\times \\frac{0.04}{0.1} = 40\\text{ V}\\)<br><b>উত্তর:<\/b> \\(40\\text{ V}\\)", "svg": "", "isNewPdfSection": true}, {"id": 125, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "চোখের ত্রুটি ও প্রতিকার (মায়োপিয়া, হাইপারমেট্রোপিয়া, অ্যাস্টিগম্যাটিজম, চালশে)", "question": "চোখের ত্রুটি ও প্রতিকার (মায়োপিয়া, হাইপারমেট্রোপিয়া, অ্যাস্টিগম্যাটিজম, চালশে)", "answer": "স্বাভাবিক চোখের নিকট বিন্দু \\(25\\text{ cm}\\) এবং দূর বিন্দু অসীম। প্রতিবিম্ব রেটিনার সামনে বা পেছনে গঠিত হলে অথবা কর্নিয়ার অসম বক্রতা ও বয়সজনিত আবাসন ক্ষমতা হ্রাস পেলে চোখে ত্রুটি দেখা দেয়।", "context": "• মায়োপিয়াতে দূরের বস্তু ঝাপসা দেখায়; চশমার ক্ষমতা \\(P = -\\frac{1}{d_{\\text{far}}}\\) (যেখানে \\(d_{\\text{far}}\\) মিটারে দূর বিন্দুর দূরত্ব, অবতল লেন্স)।<br>• হাইপারমেট্রোপিয়াতে কাছের বস্তু ঝাপসা দেখায়; অভিসারী উত্তল লেন্স ব্যবহার করে নিকট বিন্দুকে \\(25\\text{ cm}\\)-এ আনা হয়।<br>• উদাহরণ: দূর বিন্দু \\(50\\text{ cm} = 0.5\\text{ m}\\) হলে ক্ষীণ দৃষ্টির চশমার ক্ষমতা \\(P = -\\frac{1}{0.5} = -2\\text{ D}\\)।<br><div class=\"overflow-x-auto mt-2\"><table class=\"w-full text-xs border-collapse bg-white dark:bg-slate-900 rounded-lg overflow-hidden\"><thead><tr class=\"bg-slate-100 dark:bg-slate-800\"><th class=\"px-2.5 py-1.5 text-left font-bold border- stroke=\"#059669\" stroke-width=\"1.8\" marker-end=\"url(#arrGreen)\"/>\n  <!-- Slightly converged rays to eye lens -->\n  <line x1=\"472\" y1=\"222\" x2=\"526\" y2=\"224\" stroke=\"#059669\" stroke-width=\"1.8\"/>\n  <line x1=\"472\" y1=\"262\" x2=\"526\" y2=\"260\" stroke=\"#059669\" stroke-width=\"1.8\"/>\n  <!-- Focusing cleanly on retina -->\n  <line x1=\"526\" y1=\"224\" x2=\"644\" y2=\"242\" stroke=\"#059669\" stroke-width=\"1.8\"/>\n  <line x1=\"526\" y1=\"260\" x2=\"644\" y2=\"242\" stroke=\"#059669\" stroke-width=\"1.8\"/>\n  <circle cx=\"644\" cy=\"242\" r=\"3.5\" fill=\"#059669\"/>\n  <text x=\"672\" y=\"246\" text-anchor=\"middle\" font-size=\"10\" fill=\"#047857\" font-weight=\"600\">রেটিনা<\/text>\n<\/svg>", "isNewPdfSection": true}, {"id": 126, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "আপাত গভীরতা ও পূর্ণ অভ্যন্তরীণ প্রতিফলন", "question": "আপাত গভীরতা ও পূর্ণ অভ্যন্তরীণ প্রতিফলন", "answer": "আলো এক মাধ্যম থেকে অন্য মাধ্যমে গেলে দিক পরিবর্তন করে (প্রতিসরণ)। ঘন মাধ্যমের ভেতরের কোনো বস্তুকে হালকা মাধ্যম থেকে খাড়া নিচে দেখলে প্রকৃত গভীরতার চেয়ে ওপরে দেখা যায়। আবার আলো ঘন থেকে হালকা মাধ্যমে যাওয়ার সময় আপতন কোণ সংকট কোণের বেশি হলে পূর্ণ অভ্যন্তরীণ প্রতিফলন ঘটে।", "context": "• প্রতিসরাঙ্ক ও স্নেলের সূত্র: \\(\\mu = \\frac{c}{v} = \\frac{\\sin i}{\\sin r}\\) এবং \\(\\mu =\\) প্রকৃত গভীরতা / আপাত গভীরতা।<br>• সংকট কোণ: \\(\\sin C = \\frac{1}{\\mu}\\) (ঘন থেকে হালকা মাধ্যমে যাওয়ার ক্ষেত্রে)।<br>• পূর্ণ অভ্যন্তরীণ প্রতিফলনের দুটি শর্ত: (১) আলোকে ঘন মাধ্যম থেকে হালকা মাধ্যমে যেতে হবে, (২) আপতন কোণ \\(i \\gt  C\\) হতে হবে। উদাহরণ: অপটিক্যাল ফাইবার ও মরীচিকা।<br>• সতর্কতা: \\(\\mu \\gt  1\\) হওয়ায় প্রকৃত গভীরতা সবসময় আপাত গভীরতার চেয়ে বেশি হয়।", "intuition": "পানি বা কাচের নিচে থাকা বস্তু থেকে বের হওয়া আলো বায়ুতে এসে অভিলম্ব থেকে দূরে সরে যায়, তাই চোখ পেছন দিকে সোজা রেখা টানলে বস্তুটিকে আসল গভীরতার চেয়ে ওপরে দেখে (আপাত গভীরতা কমে)। আবার এই দূরে সরে যাওয়া বাড়তে বাড়তে আপতন কোণ যখন সংকট কোণ (\\(\\theta_c\\)) ছাড়িয়ে যায়, তখন আলো আর বাইরে বেরোতেই পারে না—ভেতরেই সম্পূর্ণ প্রতিফলিত হয়, যে নীতিতে অপটিক্যাল ফাইবারে আলোক সংকেত বহুদূর যায়।", "trap": "অনেকেই ভুল করে ঘন থেকে হালকা মাধ্যমে যাওয়ার শর্তটি বাদ দিয়ে শুধু \\(i \\gt \\theta_c\\) মনে রাখেন, অথবা \\(\\mu \\gt 1\\) সত্ত্বেও আপাত গভীরতাকে প্রকৃত গভীরতার চেয়ে বড় বের করে ফেলেন। মনে রেখো, হালকা মাধ্যম থেকে ঘন মাধ্যমের বস্তু দেখলে আপাত গভীরতা সবসময় প্রকৃত গভীরতার চেয়ে কম হয়।", "quickExample": "\\(\\mu = 1.5\\) প্রতিসরাঙ্কের কাচ ফলকের নিচের দাগ ওপর থেকে \\(6\\text{ cm}\\) নিচে দেখা গেলে কাচের প্রকৃত পুরুত্ব \\(= \\mu \\times 6 = 1.5 \\times 6 = 9\\text{ cm}\\) এবং সংকট কোণ \\(\\theta_c = \\sin^{-1}\\left(\\frac{1}{1.5}\\right) \\approx 41.8^\\circ\\)।", "svg": "<svg viewBox=\"0 0 720 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"আপাত গভীরতা এবং পূর্ণ অভ্যন্তরীণ প্রতিফলনের রশ্মি চিত্র\" style=\"width:100%;max-width:720px;height:auto;font-family:sans-serif;\">\n  <defs>\n    <marker id=\"rayArr1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M 0 1 L 10 5 L 0 9 z\" fill=\"#2563eb\"/>\n    <\/marker>\n    <marker id=\"rayArr2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M 0 1 L 10 5 L 0 9 z\" fill=\"#d97706\"/>\n    <\/marker>\n    <marker id=\"rayArr3\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M 0 1 L 10 5 L 0 9 z\" fill=\"#dc2626\"/>\n    <\/marker>\n  <\/defs>\n\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"300\" rx=\"12\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/>\n\n  <!-- Left Panel: Apparent Depth -->\n  <rect x=\"14\" y=\"14\" width=\"338\" height=\"272\" rx=\"8\" fill=\"#ffffff\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n  <text x=\"183\" y=\"36\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1e3a8a\">আপাত গভীরত \\)।", "intuition": "বাস্তব-ধনাত্মক চিহ্ন প্রথায় আলো প্রকৃতপক্ষে যে দূরত্ব অতিক্রম করে (বাস্তব বস্তু ও বাস্তব বিম্ব) তা ধনাত্মক এবং পেছনে বর্ধিত কাল্পনিক দূরত্ব (অবাস্তব বিম্ব) ঋণাত্মক ধরা হয়—ফলে একটি সূত্র দিয়েই উত্তল ও অবতল উভয় লেন্স সমাধান করা যায়। সমতল আয়না আলোকে সমকোণে উল্টে দেওয়ায় আয়নার যত সামনে বস্তু থাকে, ঠিক তত পেছনেই সমান আকারের অসদ বিম্ব তৈরি হয়; ফলে বস্তু ও বিম্বের দূরত্ব \\(2d\\) এবং পূর্ণ প্রতিবিম্ব দেখতে আয়নার উচ্চতা কেবল \\(\\frac{H}{2}\\) হলেই চলে।", "trap": "সমতল আয়নায় বস্তু আয়না থেকে \\(d\\) দূরে থাকলে আয়না থেকে বিম্বের দূরত্ব \\(d\\), কিন্তু বস্তু থেকে বিম্বের দূরত্ব \\(2d\\)—প্রশ্নে কার সাপেক্ষে দূরত্ব চাওয়া হয়েছে তা খেয়াল না করলে অর্ধেক বা দ্বিগুণ ভুল হয়।", "quickExample": "\\(+20\\text{ cm}\\) ফোকাস দূরত্বের উত্তল লেন্সের সামনে \\(30\\text{ cm}\\) দূরে বস্তু রাখলে \\(\\frac{1}{v} = \\frac{1}{20} - \\frac{1}{30} = \\frac{1}{60} \\Rightarrow v = +60\\text{ cm}\\) (বাস্তব ও উল্টো) এবং \\(|m| = \\frac{60}{30} = 2\\)।", "svg": "", "isNewPdfSection": true}, {"id": 128, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "ব্যতিচার বনাম অপবর্তন তুলনা ও ইয়ং-এর দ্বি-চিড় পরীক্ষা", "question": "ব্যতিচার বনাম অপবর্তন তুলনা ও ইয়ং-এর দ্বি-চিড় পরীক্ষা", "answer": "পথ পার্থক্য \\(\\Delta = \\left(\\frac{\\lambda}{2\\pi}\\right)\\delta\\)<br>গঠনমূলক: \\(\\Delta = n\\lambda\\) (দশা পার্থক্য \\(2n\\pi\\)); ধ্বংসাত্মক: \\(\\Delta = (2n+1)\\frac{\\lambda}{2}\\)<br>ডোরার প্রস্থ: \\(\\beta = \\frac{\\lambda D}{d}\\); প্রতি একক দৈর্ঘ্যে ডোরার সংখ্যা \\(= \\frac{1}{\\beta} = \\frac{d}{\\lambda D}\\)", "context": "• সুসঙ্গত উৎস: একই কম্পাঙ্ক ও স্থির দশা পার্থক্যের উৎস। অসংসক্ত দুটি বাল্বের আলোতে দশা পার্থক্য দ্রুত পরিবর্তিত হওয়ায় ব্যতিচার দেখা যায় না।<br>• \\(D/d\\) অনুপাত স্থির রাখলে ডোরা-প্রস্থ \\(\\beta\\) ও প্রতি একক দৈর্ঘ্যে ডোরার সংখ্যা \\(1/\\beta\\) স্থির থাকে (\\(d \\to 2d\\) করলে \\(D \\to 2D\\))।<br>• কম্পাঙ্ক \\(f\\) দ্বিগুণ করলে \\(\\lambda = c/f\\) অর্ধেক হয়, ফলে ডোরার প্রস্থ \\(\\beta\\) অর্ধেক হয়; লাল থেকে নীল আলোয় গেল া দ্রুত কমতে থাকে। যেহেতু \\(\\beta \\propto \\lambda\\), লাল আলোর \\(\\lambda\\) বেশি হওয়ায় লাল ডোরা নীল ডোরার চেয়ে চওড়া হয়; আর দুটি সাধারণ বাল্ব অসংসক্ত (দশা পার্থক্য অনিয়মিত) হওয়ায় তাদের আলোতে কোনো স্থায়ী ব্যতিচার ডোরা দেখা যায় না।", "trap": "প্রতি একক দৈর্ঘ্যে ডোরার সংখ্যা \\(\\frac{1}{\\beta} = \\frac{d}{\\lambda D}\\)-কে অনেকেই ভুলে \\(\\beta = \\frac{\\lambda D}{d}\\) ধরে ফেলেন! এছাড়া \\(d\\) ও \\(D\\) উভয়কেই দ্বিগুণ করলে \\(\\frac{D}{d}\\) অনুপাত অপরিবর্তিত থাকে বলে \\(\\beta\\) বদলায় না—এই অনুপাতটি না দেখে তাড়াহুড়ো করলে ভুল হয়। আর একক রূপান্তরে \\(1\\text{ nm} = 10^{-9}\\text{ m}\\) এবং \\(1\\text{ mm} = 10^{-3}\\text{ m}\\) ঠিকমতো বসানো জরুরি।", "quickExample": "<b>প্রশ্ন:<\/b> ইয়ং-এর পরীক্ষায় \\(\\lambda = 600\\text{ nm}\\), \\(d = 1\\text{ mm}\\), \\(D = 1\\text{ m}\\) হলে ডোরার প্রস্থ \\(\\beta\\) এবং প্রতি মিটারে ডোরার সংখ্যা \\(\\frac{1}{\\beta}\\) কত?<br>• \\(\\beta = \\frac{\\lambda D}{d} = \\frac{600\\times 10^{-9}\\times 1}{1\\times 10^{-3}} = 6\\times 10^{-4}\\text{ m} = 0.6\\text{ mm}\\)<br>• প্রতি মিটারে ডোরার সংখ্যা \\(= \\frac{1}{\\beta} = \\frac{1}{6\\times 10^{-4}} \\approx 1667\\text{ m}^{-1}\\)<br><b>উত্তর:<\/b> \\(\\beta = 0.6\\text{ mm}\\), \\(\\frac{1}{\\beta} \\approx 1667\\text{ m}^{-1}\\)", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 250\" width=\"100%\" style=\"max-width:560px;background:#0f172a;border-radius:10px;\"><defs><marker id=\"arrY\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 7 3.5, 0 7\" fill=\"#38bdf8\"/><\/marker><marker id=\"arrY2\" markerWidth=\"7\" markerHeight=\"7\" refX=\"2\" refY=\"3.5\" orient=\"auto\"><polygon points=\"7 0, 0 3.5, 7 7\" fill=\"#38bdf8\"/><\/marker><\/defs><text x=\"280\" y=\"22\" fill=\"#f8fafc\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">Young's Double-Slit Setup (d, D, β)<\/text><circle cx=\"52\" cy=\"125\" r=\"6\" fill=\"#facc15\"/><text x=\"52\" y=\"148\" fill=\"#facc15\" font =\"#38bdf8\" font-size=\"13\" font-weight=\"bold\">β = λD/d<\/text><line x1=\"158\" y1=\"226\" x2=\"445\" y2=\"226\" stroke=\"#38bdf8\" stroke-width=\"1.6\" marker-start=\"url(#arrY2)\" marker-end=\"url(#arrY)\"/><text x=\"301\" y=\"243\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">D (Slit to Screen)<\/text><\/svg>", "isNewPdfSection": true}, {"id": 129, "ch": 7, "chapter": "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "topic": "সমবর্তন — পোলারাইজার তালিকা, ম্যালাসের সূত্র ও ব্রুস্টারের সূত্র", "question": "সমবর্তন — পোলারাইজার তালিকা, ম্যালাসের সূত্র ও ব্রুস্টারের সূত্র", "answer": "ম্যালাসের সূত্র: \\(I = I_0\\cos^2\\theta\\)<br>ব্রুস্টারের সূত্র: \\(\\tan\\theta_p = \\mu\\)<br>সমবর্তন ও প্রতিসরণ কোণের সম্পর্ক: \\(\\theta_p + r = 90^\\circ\\)", "context": "• পোলারাইজার তালিকা: টুরমালিন (Tourmaline), নিকল প্রিজম (Nicol Prism), পোলারয়েড (Polaroid), ক্যালসাইট (Calcite)।<br>• পোলারাইজার নয়: ফ্রেসনেল বাইপ্রিজম (Fresnel Biprism) — এটি ব্যতিচার (interference) সৃষ্টির যন্ত্র।<br>• ম্যালাসের সূত্র: \\(I = I_0\\cos^2\\theta\\), যেখানে \\(\\theta\\) হলো পোলারাইজার ও অ্যানালাইজারের অক্ষের মধ্যবর্তী কোণ।<br>• ব্রুস্টারের সূত্র: \\(\\tan\\theta_p = \\mu\\); ব্রুস্টার কোণে প্রতিফলিত আলো সম্পূর্ণ সমবর্তিত হয় এবং প্রতিফলিত ও প্রতিসরিত রশ্মি পরস্পর লম্ব (\\(\\theta_p + r = 90^\\circ\\)) থাকে।", "intuition": "আলো যে একটি অনুপ্রস্থ (আড়) তরঙ্গ—সমবর্তনই তার সবচেয়ে সরাসরি প্রমাণ। সাধারণ আলোতে তড়িৎ ক্ষেত্র গতির লম্বতলে সব দিকে সমানভাবে কাঁপে; টুরমালিন, নিকল প্রিজম, ক্যালসাইট বা পোলারয়েডের মতো পোলারাইজারগুলো সেই কম্পনকে কেবল এক তলে ছেঁকে বের করে। শব্দ তরঙ্গ অনুদৈর্ঘ্য হওয়ায় এর কম্পন গতির অভিমুখেই হয়, তাই কোনো পোলারাইজারই শব্দকে সমবর্তিত করতে পারে না। মনে রাখবেন, ফ্রেসনেল বাইপ্রিজম দেখতে প্রিজমের মতো হলেও এটি পোলারাইজার নয়—এটি একটি উৎস থেকে দুটি কাল্পনিক সুসংগত উৎস তৈরি করে ব্যতিচার ঘটানোর যন্ত্র।", "trap": "ঢাকা বিশ্ববিদ্যালয়ের ভর্তি পরীক্ষায় 'নিচের কোনটি পোলারাইজার নয়?' প্রশ্নে অপশনে 'নিকল প্রিজম' আর 'ফ্রেসনেল বাইপ্রিজম' একসাথে দিয়ে বিভ্রান্তি তৈরি করা হয়—নিকল প্রিজম পোলারাইজার, কিন্তু ফ্রেসনেল বাইপ্রিজম ব্যতিচারের যন্ত্র! এছাড়া \\(\\theta_p\\) দেওয়া থাকলে প্রতিসরণ কোণ \\(r = 90^\\circ - \\theta_p\\) বের করতে গিয়ে অনেকেই \\(\\theta_p\\)-এর মানই দাগিয়ে ফেলেন।", "quickExample": "<b>প্রশ্ন:<\/b> কোনো মাধ্যমের প্রতিসরাঙ্ক \\(\\mu = 1.732\\) হলে ব্রুস্টার কোণ \\(\\theta_p\\) কত এবং \\(I_0\\) তীব্রতার সমবর্তিত আলো \\(60^\\circ\\) কোণে রাখা অ্যানালাইজার ভেদ করলে নির্গত তীব্রতা কত হবে?<br>• \\(\\tan\\theta_p = 1.732 \\approx \\sqrt{3} \\Rightarrow \\theta_p = 60^\\circ\\)<br>• ম্যালাসের সূত্র: \\(I = I_0\\cos^2 60^\\circ = I_0\\left(\\frac{1}{2}\\right)^2 = \\frac{I_0}{4}\\)<br><b>উত্তর:<\/b> \\(\\theta_p = 60^\\circ\\), \\(I = \\frac{I_0}{4}\\)", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 255\" width=\"100%\" style=\"max-width:560px;background:#0f172a;border-radius:10px;\"><defs><marker id=\"arrB\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 7 3.5, 0 7\" fill=\"#facc15\"/><\/marker><marker id=\"arrR\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 7 3.5, 0 7\" fill=\"#38bdf8\"/><\/marker><marker id=\"arrT\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 7 3.5, 0 7\" fill=\"#4ade80\"/><\/marker><\/defs><text x=\"280\" y=\"22\" fill=\"#f8fafc\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">Brewster's Angle Polarization (tan θ_p = μ)<\/text><rect x=\"30\" y=\"130\" width=\"500\" height=\"105\" fill=\"#1e293b\" opacity=\"0.85\"/><line x1=\"30\" y1=\"130\" x2=\"530\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"2\"/><text x=\"515\" y=\"122\" fill=\"#cbd5e1\" font-size=\"11\" text-anchor=\"end\">Air (n = 1)<\/text><text x=\"515\" y=\"148\" fill=\"#cbd5e1\" font-size=\"11\" text-anchor=\"end\">Medium (μ)<\/text><line x1=\"280\" y1=\"38\" x2=\"280\" y2=\"230\" stroke=\"#64748b\" stroke-width=\"1.3\" stroke-dasharray=\"5,4\"/><t  9, "chapter": "অধ্যায় ৯: পরমাণুর মডেল এবং নিউক্লিয়ার পদার্থবিজ্ঞান", "topic": "নিউক্লীয় বিক্রিয়া, ফিশন ও ফিউশন", "question": "নিউক্লীয় বিক্রিয়া, ফিশন ও ফিউশন", "answer": "সংরক্ষণ নীতি: \\(\\sum A_{\\text{initial}} = \\sum A_{\\text{final}}\\) এবং \\(\\sum Z_{\\text{initial}} = \\sum Z_{\\text{final}}\\)<br>\\(\\text{U-235}\\) ফিশন: \\({}^{235}_{92}\\text{U} + {}^{1}_{0}\\text{n} \\rightarrow {}^{141}_{56}\\text{Ba} + {}^{92}_{36}\\text{Kr} + 3\\,^{1}_{0}\\text{n} + \\text{Energy}\\; (\\approx 200\\text{ MeV}\\text{/atom})\\)", "context": "<div class=\"overflow-x-auto mt-2\"><table class=\"w-full text-xs border-collapse bg-white dark:bg-slate-900 rounded-lg overflow-hidden\"><thead><tr class=\"bg-slate-100 dark:bg-slate-800\"><th class=\"px-2.5 py-1.5 text-left font-bold border-b border-slate-200 dark:border-slate-700\">বৈশিষ্ট্য<\/th><th class=\"px-2.5 py-1.5 text-left font-bold border-b border-slate-200 dark:border-slate-700\">নিউক্লীয় ফিশন<\/th><th class=\"px-2.5 py-1.5 text-left font-bold border-b border-slate-200 dark:border-slate-700\">নিউক্লীয় ফিউশন<\/th><\/tr><\/thead><tbody><tr><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">প্রক্রিয়া<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">ভারী নিউক্লিয়াস (\\(\\text{U-235}\\)) নিউট্রন শোষণ করে ভেঙে দুটি মাঝারি নিউক্লিয়াসে পরিণত হয়<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">দুটি হালকা নিউক্লিয়াস (\\(\\text{H}\\)) যুক্ত হয়ে ভারী নিউক্লিয়াস গঠন করে<\/td><\/tr><tr><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">শক্তি উৎপাদন<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">প্রতি \\(\\text{U-235}\\) পরমাণু থেকে প্রায় \\(200\\text{ MeV}\\)<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">প্রতি নিউক্লিয়নে ফিশনের চেয়ে বেশি শক্তি পাওয়া যায়<\/td><\/tr><tr><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">তাপমাত্রা শর্ত<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">সাধারণ তাপমাত্রাতেই ধীর নিউট্রন দিয়ে শুরু করা যায়<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">খুব উচ্চ তাপমাত্রা (কোটি ডিগ্রি) প্রয়োজন<\/td><\/tr><tr><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">উদাহরণ / প্রয়োগ<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">পারমাণবিক চুল্লি, পারমাণবিক বোমা<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">সূর্য ও নক্ষত্রের শক্তির উৎস, হাইড্রোজেন বোমা<\/td><\/tr><\/tbody><\/table><\/div>", "intuition": "বন্ধন শক্তি বক্ররেখার শীর্ষে থাকা \\({}^{56}_{26}\\text{Fe}\\) হলো নিউক্লীয় স্থায়িত্বের চূড়া। তাই \\({}^{235}_{92}\\text{U}\\)-এর মতো ভারী নিউক্লিয়াস ভেঙে মাঝারি নিউক্লিয়াসে (ফিশন) কিংবা \\({}^{2}_{1}\\text{H}\\)-এর মতো হালকা নিউক্লিয়াস জুড়ে ভারী নিউক্লিয়াসে (ফিউশন) পরিণত হলে উভয় ক্ষেত্রেই উৎপাদের প্রতি নিউক্লিয়নে বন্ধন শক্তি বাড়ে এবং হারানো ভর বিপুল শক্তিতে রূপান্তরিত হয়। চুল্লিতে মডারেটর (ভারী পানি/গ্রাফাইট) দ্রুত নিউট্রনকে ধীর করে ফিশন উপযোগী করে, আর নিয়ন্ত্রণ দণ্ড (ক্যাডমিয়াম/বোরন) অতিরিক্ত নিউট্রন শুষে শৃঙ্খল বিক্রিয়াকে নিরাপদ রাখে।", "trap": "অনেকে মডারেটর ও নিয়ন্ত্রণ দণ্ডের কাজ গুলিয়ে ফেলেন—মডারেটর নিউট্রন শোষণ করে না বরং গতি কমায়, আর নিয়ন্ত্রণ দণ্ড নিউট্রন শোষণ করে। আরেকটি ফাঁদ: প্রতিটি ফিশনে (\\(\\approx 200\\text{ MeV}\\)) মোট শক্তি বেশি হলেও প্রতি একক ভরে বা প্রতি নিউক্লিয়নে ফিউশনে ফিশনের চেয়ে অনেক বেশি শক্তি উৎপন্ন হয়।", "quickExample": "<b>প্রশ্ন:<\/b> \\({}^{235}_{92}\\text{U} + {}^{1}_{0}\\text{n} \\rightarrow {}^{A}_{56}\\text{Ba} + {}^{92}_{36}\\text{Kr} + 3\\,{}^{1}_{0}\\text{n}\\) বিক্রিয়ায় \\(A\\) কত?<br>• ভর সংখ্যা সংরক্ষণ: \\(235 + 1 = A + 92 + 3 \\Rightarrow A = 236 - 95 = 141\\) (\\({}^{141}_{56}\\text{Ba}\\))।<br><br><b>প্রশ্ন:<\/b> \\({}^{27}_{13}\\text{Al} + {}^{4}_{2}\\text{He} \\rightarrow {}^{30}_{14}\\text{Si} + X\\) বিক্রিয়ায় \\(X\\) কী?<br>• \\(A_x = 27 + 4 - 30 = 1\\) এবং \\(Z_x = 13 + 2 - 14 = 1\\), তাই \\(X\\) হলো প্রোটন (\\({}^{1}_{1}\\text{H}\\))।", "svg": "", "isNewPdfSection": true}, {"id": 139, "ch": 10, "chapter": "অধ্যায় ১০: সেমিকন্ডাক্টর ও ইলেকট্রনিক্স", "topic": "সেমিকন্ডাক্টর, ডোপিং (n-টাইপ ও p-টাইপ) ও p-n জাংশন", "question": "\\(n\\)-টাইপ ও \\(p\\)-টাইপ সেমিকন্ডাক্টর কীভাবে তৈরি হয় এবং \\(p\\text{-}n\\) জাংশনে সম্মুখ ঝোঁক ও বিপরীত ঝোঁকে কী ঘটে?", "answer": "• \\(n\\)-টাইপ: পঞ্চযোজী অপদ্রব্য (\\(\\text{P}, \\text{As}, \\text{Sb}\\)) ডোপিং \\(\\Rightarrow\\) সংখ্যাগুরু বাহক ইলেকট্রন, সংখ্যালঘু হোল<br>• \\(p\\)-টাইপ: ত্রিযোজী অপদ্রব্য (\\(\\text{B}, \\text{Al}, \\text{Ga}\\)) ডোপিং \\(\\Rightarrow\\) সংখ্যাগুরু বাহক হোল, সংখ্যালঘু ইলেকট্রন<br>• সম্মুখ ঝোঁক (\\(p\\)-এ \\(+\\), \\(n\\)-এ \\(-\\)): ডিপ্লেশন স্তর সরু, প্রবাহ বেশি<br>• বিপরীত ঝোঁক (\\(p\\)-এ \\(-\\), \\(n\\)-এ \\(+\\)): ডিপ্লেশন স্তর চওড়া, প্রবাহ প্রায় শূন্য", "context": "<b>মূল ধারণা:<\/b> পরিবাহী ও অন্তরকের মাঝামাঝি পরিবাহিতার পদার্থ (\\(\\text{Si}, \\text{Ge}\\)) হলো সেমিকন্ডাক্টর; তাপমাত্রা বাড়লে এর রোধ কমে। শক্তি ব্যান্ড ফাঁক: পরিবাহীতে ব্যান্ড মিলিত, অন্তরকে বড় (\\(\\gt  3\\text{ eV}\\)), সেমিকন্ডাক্টরে ছোট (\\(\\text{Si} \\approx 1.1\\text{ eV}\\) )। \\(p\\text{-}n\\) জাংশনের ডিপ্লেশন স্তরে কোনো মুক্ত বাহক থাকে না।", "intuition": "\\(n\\)-টাইপ সেমিকন্ডাক্টরে সংখ্যাগুরু বাহক ইলেকট্রন এবং \\(p\\)-টাইপে হোল থাকলেও উভয়ই সামগ্রিকভাবে তড়িৎ-নিরপেক্ষ—কারণ ডোপিংয়ের সময় যে পঞ্চযোজী বা ত্রিযোজী অপদ্রব্য পরমাণু যোগ করা হয়, প্রতিটি পরমাণুই নিজে চার্জ-নিরপেক্ষ; মুক্ত ইলেকট্রন (বা হোল) তৈরি হলে তার বিপরীত চার্জের ধনাত্মক দাতা আয়ন (বা ঋণাত্মক গ্রহীতা আয়ন) কেলাসে স্থির থেকে মোট চার্জ শূন্য রাখে। আর \\(p\\text{-}n\\) জাংশনে সম্মুখ ঝোঁক (\\(p\\)-এ \\(+\\), \\(n\\)-এ \\(-\\)) প্রয়োগ করলে বহিঃস্থ তড়িৎক্ষেত্র অন্তর্নির্মিত বিভব প্রাচীরের বিপরীতে কাজ করে এবং হোল ও ইলেকট্রনকে জাংশনের দিকে ঠেলে দেয়, ফলে আয়ন-শূন্য ডিপ্লেশন স্তর সরু হয়ে যায় ও সহজে তড়িৎ প্রবাহিত হয়।", "trap": "\\(p\\)-টাইপ মানে ধনাত্মক চার্জযুক্ত আর \\(n\\)- t{DC}\\)-এর কাছাকাছি আনতে ফিল্টার হিসেবে ধারক (\\(C\\)) ব্যবহার করা হয়।", "intuition": "অর্ধতরঙ্গ রেক্টিফায়ার \\(\\text{AC}\\)-এর ঋণাত্মক অর্ধচক্র সম্পূর্ণ কেটে বাদ দেয়, তাই স্পন্দনের পুনরাবৃত্তি কাল আগের মতোই থাকে (\\(f_{\\text{out}} = f_{\\text{in}}\\))। কিন্তু পূর্ণতরঙ্গ ও ব্রিজ রেক্টিফায়ার ঋণাত্মক অর্ধচক্রকেও উল্টে ধনাত্মক বানিয়ে দেয়—ফলে প্রতি পূর্ণ চক্রে \\(2\\) টি স্পন্দন তৈরি হয়, পর্যায়কাল অর্ধেক হয় এবং আউটপুট কম্পাঙ্ক দ্বিগুণ (\\(f_{\\text{out}} = 2f_{\\text{in}}\\)) হয়। লোডের সমান্তরালে ফিল্টার ধারক (\\(C\\)) যোগ করলে তা শীর্ষ বিভবে চার্জ সঞ্চয় করে এবং খাঁজের সময় ধীরে ডিসচার্জ করে স্পন্দনশীল \\(\\text{DC}\\)-কে মসৃণ করে।", "trap": "\\(50\\text{ Hz}\\) ইনপুটে অর্ধতরঙ্গের আউটপুট \\(50\\text{ Hz}\\), কিন্তু পূর্ণতরঙ্গ ও ব্রিজ রেক্টিফায়ারে আউটপুট \\(2 \\times 50 = 100\\text{ Hz}\\)—ভুল করে \\(50\\text{ Hz}\\) বা \\(25\\text{ Hz}\\) দিও না! এছাড়া জেনার ডায়োড বিপরীত ঝোঁকে (ভোল্টেজ রেগুলেটর) এবং \\(\\text{LED}\\) সম্মুখ ঝোঁকে কাজ করে—এই ঝোঁক দুটি উল্টে ফেললে ভুল হবে।", "quickExample": "<b>উদাহরণ (DU 21-22):<\/b> একটি ব্রিজ রেক্টিফায়ারে (\\(4\\) টি ডায়োড) ইনপুট \\(\\text{AC}\\) সংকেতের কম্পাঙ্ক \\(50\\text{ Hz}\\) হলে আউটপুট স্পন্দনশীল \\(\\text{DC}\\)-এর মৌলিক কম্পাঙ্ক \\(f_{\\text{out}} = 2 \\times 50 = 100\\text{ Hz}\\)।", "svg": "<svg viewBox=\"0 0 320 156\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;height:auto;display:block;margin:8px auto;\"><rect x=\"6\" y=\"6\" width=\"308\" height=\"144\" rx=\"10\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.2\"/><text x=\"16\" y=\"25\" font-size=\"9.5\" font-weight=\"700\" fill=\"#334155\">AC Input (f)<\/text><line x1=\"115\" y1=\"28\" x2=\"298\" y2=\"28\" stroke=\"#94a3b8\" stroke-width=\"1\"/><path d=\"M 118 28 Q 138 6 158 28 T 198 28 T 238 28 T 278 28\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"16\" y=\"75\" font-size=\"9.5\" font-weight=\"700\" fill=\"#b45309\">Half-Wave (f)<\/text><line x1=\"115\" y1=\"78\" x2=\"298\" y2=\"78\" stroke=\"#94a  সার্কিট বানানো সম্ভব। যেমন: \\(\\text{NAND}\\) গেটের দুই ইনপুট একসাথে জুড়ে দিলে \\(\\text{NOT}\\) হয়; \\(\\text{NAND}\\)-এর আউটপুটে ওই \\(\\text{NOT}\\) বসালে \\(\\text{AND}\\) হয়; আর ডি-মর্গ্যানের সূত্র \\(\\overline{\\bar{A}\\cdot\\bar{B}} = A + B\\) অনুযায়ী দুই ইনপুটে \\(\\text{NOT}\\) বসিয়ে \\(\\text{NAND}\\) করলে \\(\\text{OR}\\) পাওয়া যায়! একই যুক্তিতে \\(\\text{NOR}\\) দিয়েও সব গেট তৈরি করা যায়। আর \\(\\text{XOR}\\) হলো 'পার্থক্য শনাক্তকারী' গেট—ইনপুট দুটি ভিন্ন হলেই কেবল আউটপুট \\(1\\)।", "trap": "\\(A + A \\cdot B\\) দেখে জটিল মনে হলেও \\(A(1 + B) = A \\cdot 1 = A\\) হয়। আবার অনেকেই \\(\\bar{A} + \\bar{B}\\)-কে \\(\\text{NOR}\\) গেট ভেবে ভুল করেন—ডি-মর্গ্যান সূত্রে \\(\\bar{A} + \\bar{B} = \\overline{A \\cdot B}\\), যা আসলে \\(\\text{NAND}\\) গেট! তেমনি \\(\\text{XOR}\\) গেটে \\(A=1, B=1\\) হলে আউটপুট \\(1\\) নয়, \\(0\\) হয়।", "quickExample": "<b>উদাহরণ:<\/b> \\(A + A \\cdot B = A(1 + B) = A \\cdot 1 = A\\) (DU 23-24)। আবার \\(\\text{XOR}\\) গেটে ইনপুট \\(01\\) বা \\(10\\) হলে আউটপুট \\(1\\), কিন্তু \\(00\\) বা \\(11\\) হলে আউটপুট \\(0\\) (DU 24-25)।", "svg": "<svg viewBox=\"0 0 330 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:330px;height:auto;display:block;margin:8px auto;\"><rect x=\"5\" y=\"5\" width=\"320\" height=\"150\" rx=\"10\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.2\"/><g stroke=\"#1e293b\" stroke-width=\"1.6\" fill=\"#ffffff\"><line x1=\"18\" y1=\"30\" x2=\"32\" y2=\"30\"/><line x1=\"18\" y1=\"46\" x2=\"32\" y2=\"46\"/><path d=\"M 32 22 L 54 22 A 16 16 0 0 1 54 54 L 32 54 Z\"/><line x1=\"70\" y1=\"38\" x2=\"86\" y2=\"38\"/><text x=\"52\" y=\"69\" font-size=\"9.5\" font-weight=\"700\" fill=\"#0f172a\" stroke=\"none\" text-anchor=\"middle\">AND<\/text><line x1=\"126\" y1=\"30\" x2=\"142\" y2=\"30\"/><line x1=\"126\" y1=\"46\" x2=\"142\" y2=\"46\"/><path d=\"M 138 22 Q 148 38 138 54 L 156 54 Q 174 54 182 38 Q 174 22 156 22 Z\"/><line x1=\"182\" y1=\"38\" x2=\"198\" y2=\"38\"/><text x=\"162\" y=\  (\\(C\\)); প্রকার \\(\\text{npn}\\) ও \\(\\text{pnp}\\)<br>• প্রবাহ সম্পর্ক: \\(I_E = I_B + I_C\\) এবং প্রবাহ লাভ \\(\\beta = \\frac{I_C}{I_B}\\)<br>• বাইনারি \\(\\to\\) দশমিক: প্রতিটি বিটকে \\(2^n\\) (ডান থেকে বামে \\(2^0, 2^1, 2^2, \\dots\\) এবং দশমিকের পর \\(2^{-1}, 2^{-2}, \\dots\\)) দিয়ে গুণ করে যোগ করো", "context": "<b>সংকেত ও হিসাব কৌশল:<\/b> ডিজিটাল সংকেত শুধু \\(0\\) ও \\(1\\), অ্যানালগ সংকেত ক্রমাগত পরিবর্তনশীল। ভর্তি পরীক্ষায় বাইনারি যোগ, বিয়োগ বা গুণ দ্রুত ও নির্ভুলভাবে করতে প্রথমে দশমিকে রূপান্তর করে হিসাব শেষ করে আবার বাইনারিতে ফেরত নেওয়া সবচেয়ে নিরাপদ।", "intuition": "ট্রানজিস্টরের বেস (পীঠ) অঞ্চলটি অতি পাতলা ও লঘু ডোপিংযুক্ত রাখার মূল কারণ হলো—যদি বেস মোটা বা ভারী ডোপিংযুক্ত হতো, তবে এমিটার থেকে আসা অধিকাংশ বাহক বেসেই বিপরীত বাহকের সাথে পুনর্মিলিত হয়ে যেত এবং কালেক্টরে পৌঁছাতে পারত না। পাতলা ও লঘু ডোপিংযুক্ত বেসের কারণেই \\(95\\%\\text{–}99\\%\\) বাহক সরাসরি কালেক্টরে চলে যায়, ফলে ক্ষুদ্র বেস প্রবাহ (\\(I_B\\)) দিয়ে বিশাল কালেক্টর প্রবাহ (\\(I_C\\)) নিয়ন্ত্রণ করে অ্যামপ্লিফায়ার হিসেবে কাজ করা সম্ভব হয়। আর বাইনারি পদ্ধতিতে প্রতিটি ঘর \\(2\\)-এর ঘাত (\\(1, 2, 4, 8, 16, 32, 64, 128\\)) হিসেবে 'চালু (\\(1\\)) বা বন্ধ (\\(0\\))' সুইচের মতো মান যোগ করে।", "trap": "বাইনারি ভগ্নাংশে দশমিকের পরের ঘরগুলোর মান \\(0.5, 0.25, 0.125\\) (\\(2^{-1}, 2^{-2}, 2^{-3}\\))—ভুল করে \\(2^1, 2^2\\) বসানো যাবে না। এছাড়া সরাসরি বাইনারি বিয়োগ বা গুণে ধার (borrow/carry) করতে গিয়ে ভুল হয়, তাই দশমিকে রূপান্তর করে হিসাব যাচাই করা সবচেয়ে নিরাপদ।", "quickExample": "<b>উদাহরণ:<\/b> \\(I_E = 5\\text{ mA}\\), \\(I_B = 0.1\\text{ mA} \\Rightarrow I_C = 4.9\\text{ mA}\\), \\(\\beta = \\frac{4.9}{0.1} = 49\\)। বাইনারি: \\((10110101)_2 = 128+32+16+4+1 = 181\\); \\((1101)_2 + (1011)_2 = 13 + 11 = 24 = (11000)_2\\)।", "svg": "", "isNewPdfSection": true}, {"id": 143, "ch": 11, "chapter": "অধ্যায় ১১: জ্যোতির্বিজ্ঞান", "topic": "জ্যোতির্বিজ্ঞানের একক (AU, আলোকবর্ষ, পারসেক) ও নক্ষত্রের লম্বন (প্যারালাক্স)", "question": "জ্যোতির্বিজ্ঞানের একক (AU, আলোকবর্ষ, পারসেক) ও নক্ষত্রের লম্বন (প্যারালাক্স)", "answer": "মহাকাশের দূরত্ব এত বিশাল যে মিটার বা কিলোমিটার অচল। তাই বিশেষ একক হিসেবে জ্যোতির্বিজ্ঞানিক একক (\\(\\text{AU}\\)), আলোকবর্ষ (\\(\\text{ly}\\)) এবং পারসেক (\\(\\text{pc}\\)) ব্যবহার করা হয়।", "context": "• নক্ষত্রের লম্বন (প্যারালাক্স): \\(d\\text{ (pc)} = \\frac{1}{p}\\) (যেখানে \\(p\\) আর্ক সেকেন্ডে)।<br>• আলো আসার সময়: \\(t =\\) দূরত্ব \\(/ c\\) (সূর্য থেকে পৃথিবীতে আলো আসতে সময় লাগে \\(\\approx 8.3\\) মিনিট)।<br>• লম্বন কোণ যত ছোট হয়, নক্ষত্র তত বেশি দূরে অবস্থিত।<br><div class=\"overflow-x-auto mt-2\"><table class=\"w-full text-xs border-collapse bg-white dark:bg-slate-900 rounded-lg overflow-hidden\"><thead><tr class=\"bg-slate-100 dark:bg-slate-800\"><th class=\"px-2.5 py-1.5 text-left font-bold border-b border-slate-200 dark:border-slate-700\">একক<\/th><th class=\"px-2.5 py-1.5 text-left font-bold border-b border-slate-200 dark:border-slate-700\">সংজ্ঞা<\/th><th class=\"px-2.5 py-1.5 text-left font-bold border-b border-slate-200 dark:border-slate-700\">মান<\/th><\/tr><\/thead><tbody><tr><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">জ্যোতির্বিজ্ঞানিক একক (\\(\\text{AU}\\))<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">পৃথিবী-সূর্যের গড় দূরত্ব<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">\\(1.496 \\times 10^{11}\\text{ m}\\)<\/td><\/tr><tr><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">আলোকবর্ষ (\\(\\text{ly}\\))<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">এক বছরে আলোর অতিক্রান্ত দূরত্ব<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">\\(\\approx 9.46 \\times 10^{15}\\text{ m}\\)<\/td><\/tr><tr><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">পারসেক (\\(\\text{pc}\\))<\/td><td class=\"px-2.5 py-1.5 border-b border-slate-100 dark:border-slate-800\">যে দূরত্বে \\(1\\text{ AU}\\) বিস্তারের লম্বন কোণ \\(1\\ ষত্র মেইন সিকোয়েন্সে আসে।<br>• রেড জায়ান্ট: মূল জ্বালানি (\\(\\text{H}\\)) ফুরালে নক্ষত্র রেড জায়ান্টে পরিণত হয়।<br>• সূর্যের মতো ছোট ভরের নক্ষত্র: বাইরের স্তর ঝরে গ্রহীয় নীহারিকা এবং কেন্দ্র হোয়াইট ডোয়ার্ফে পরিণত হয়।<br>• বড় ভরের নক্ষত্র: সুপারনোভা বিস্ফোরণের পর নিউট্রন স্টার বা ব্ল্যাক হোলে পরিণত হয়।<br>• চন্দ্রশেখর সীমা \\(\\approx 1.4\\,M_\\odot\\): এর নিচে ভরের মৃত নক্ষত্র হোয়াইট ডোয়ার্ফ হিসেবে স্থিতিশীল থাকে।<br>• ব্ল্যাক হোলের শোয়ার্জশিল্ড ব্যাসার্ধ: \\(R_s = \\frac{2GM}{c^2}\\)। ঘটনা দিগন্তে মুক্তিবেগ \\(= c\\); এর ভেতর থেকে আলোও বের হতে পারে না।", "intuition": "নক্ষত্রের সারাজীবন চলে মহাকর্ষের ভেতরমুখী টান আর নিউক্লীয় ফিউশনের বাইরের দিকের চাপের ভারসাম্য লড়াই। জ্বালানি ফুরালে মহাকর্ষ নক্ষত্রের কেন্দ্রকে সংকুচিত করে। সূর্যের মতো মাঝারি ভরের নক্ষত্রের অবশিষ্ট কেন্দ্রের ভর চন্দ্রশেখর সীমা (\\(1.4\\,M_\\odot\\))-এর নিচে থাকায় কোয়ান্টাম ইলেকট্রন অপজাত চাপ (electron degeneracy pressure) মহাকর্ষকে থামিয়ে দিতে পারে—ফলে সূর্য কৃষ্ণগহ্বর না হয়ে শান্ত হোয়াইট ডোয়ার্ফে পরিণত হয়। কেবল অতি ভারী নক্ষত্রের কেন্দ্র এই সীমা অতিক্রম করলেই সুপারনোভার পর নিউট্রন স্টার বা কৃষ্ণগহ্বর তৈরি হয়।", "trap": "অনেকেই মনে করেন যেকোনো নক্ষত্র মারা গেলেই ব্ল্যাক হোল হয়—আসলে আমাদের সূর্য কখনোই ব্ল্যাক হোল বা নিউট্রন স্টার হবে না, কারণ এর ভর চন্দ্রশেখর সীমা \\(1.4\\,M_\\odot\\)-এর কম; এটি হোয়াইট ডোয়ার্ফ হবে! আর ব্ল্যাক হোলের ভেতর থেকে আলো না আসায় একে সরাসরি দেখা যায় না, বরং অ্যাক্রিশন ডিস্কের এক্স-রে ও মহাকর্ষীয় প্রভাব থেকে পরোক্ষভাবে শনাক্ত করা হয়।", "quickExample": "<b>উদাহরণ:<\/b> সূর্যের ভর \\(M = 1.989 \\times 10^{30}\\text{ kg}\\) হলে সূর্যকে ব্ল্যাক হোল বানাতে হলে একে \\(R_s = \\frac{2GM}{c^2} = \\frac{2 \\times 6.67 \\times 10^{-11} \\times 1.989 \\times 10^{30}}{(3 \\times 10^8)^2} \\approx 2.95\\text{ km}\\) ব্যাসার্ধে সংকুচিত করতে হতো (যদিও বাস্তবে সূর্য হোয়াইট ডোয়ার্ফ হবে)।", "svg": "<svg viewBox=\"0 0 720 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"নক্ষত্রের জীবনচক্র ও চন্দ্রশেখর সীমার প্রবাহচিত্র\" style=\"width:100%;max-wi  যায়"], "correctIndex": 2, "explanation": "ব্যতিচার শক্তির সংরক্ষণশীলতা সম্পূর্ণ মেনে চলে। সমান তীব্রতা \\(I_0\\)-এর দুটি তরঙ্গের ক্ষেত্রে অন্ধকার ডোরায় তীব্রতা \\(0\\) এবং উজ্জ্বল ডোরায় \\(4I_0\\) হয়—অর্থাৎ অন্ধকার বিন্দুর শক্তি ধ্বংস না হয়ে উজ্জ্বল বিন্দুতে পুনর্বণ্টিত হয় এবং পুরো সজ্জার গড় তীব্রতা \\(\\frac{4I_0 + 0}{2} = 2I_0\\) অপরিবর্তিত থাকে।"}, {"formulaId": 128, "ch": 7, "type": "concept", "difficulty": "medium", "question": "দ্বি-চিড় ব্যতিচার এবং একক চিড়ের অপবর্তন সজ্জার মধ্যে ডোরার প্রস্থ ও তীব্রতার মূল পার্থক্য কোনটি?", "options": ["ব্যতিচারে সব ডোরার প্রস্থ সমান ও উজ্জ্বল ডোরার তীব্রতা প্রায় সমান; অপবর্তনে কেন্দ্রীয় চরম সবচেয়ে চওড়া ও গৌণ চরমের তীব্রতা দ্রুত কমে", "ব্যতিচারে কেন্দ্রীয় ডোরা সবচেয়ে চওড়া; অপবর্তনে সব ডোরার প্রস্থ সমান", "উভয় ক্ষেত্রেই সব উজ্জ্বল ডোরার প্রস্থ এবং তীব্রতা সমান থাকে", "ব্যতিচারে ডোরার তীব্রতা ক্রমশ কমে; অপবর্তনে সব ডোরার তীব্রতা সমান থাকে"], "correctIndex": 0, "explanation": "দ্বি-চিড় ব্যতিচারে দুটি সুসংগত উৎসের উপরিপাতনে প্রতিটি ডোরার প্রস্থ \\(\\beta = \\frac{\\lambda D}{d}\\) সমান এবং সব উজ্জ্বল ডোরার তীব্রতা প্রায় অভিন্ন। কিন্তু একক চিড়ের অপবর্তনে কেন্দ্রীয় উজ্জ্বল ডোরা অন্য ডোরাগুলোর দ্বিগুণ চওড়া এবং এর দুপাশে গৌণ চরমগুলোর তীব্রতা দ্রুত হ্রাস পায়।"}, {"formulaId": 129, "ch": 7, "type": "concept", "difficulty": "easy", "question": "নিচের কোন যন্ত্রটি পোলারাইজার (সমবর্তক) নয়, বরং ব্যতিচার সৃষ্টির কাজে ব্যবহৃত হয়?", "options": ["টুরমালিন কেলাস (Tourmaline)", "নিকল প্রিজম (Nicol Prism)", "ফ্রেসনেল বাইপ্রিজম (Fresnel Biprism)", "ক্যালসাইট কেলাস (Calcite)"], "correctIndex": 2, "explanation": "টুরমালিন, নিকল প্রিজম, ক্যালসাইট ও পোলারয়েড হলো সমবর্তক (polarizer)। অন্যদিকে ফ্রেসনেল বাইপ্রিজম একটি আলোক উৎস থেকে দুটি কাল্পনিক সুসংগত উৎস তৈরি করে ব্যতিচার (interference) ঘটানোর যন্ত্র, এটি পোলারাইজার নয়।"}, {"formulaId": 88, "ch": 7, "type": "concept", "difficulty": "medium", "question": "অসমবর্তিত আলো কোনো স্বচ্ছ মাধ্যমের পৃষ্ঠে ঠিক ব্রুস্টার কোণে (\\(\\theta_p\\)) আপতিত হলে প্রতিফলিত ও প্রতিসরিত রশ্মির ক্ষে     // =========================================================================
    // 2. COURSE STRUCTURE BUILDER (Chapters -> Micro-Lessons + Boss Quiz)
    // =========================================================================
    function buildCourse() {
      const chapters = [];
      for (const meta of CHAPTER_META) {
        const chFormulas = FORMULAS.filter(f => f.ch === meta.num);
        const fullTitle = chFormulas[0] ? chFormulas[0].chapter : `অধ্যায় ${meta.num}: ${meta.short}`;
        const lessons = [];
        const chunkSize = 4;
        let part = 1;
        for (let i = 0; i < chFormulas.length; i += chunkSize) {
          let slice = chFormulas.slice(i, i + chunkSize);
          if (slice.length === 1 && lessons.length > 0) {
            lessons[lessons.length - 1].formulaIds.push(slice[0].id);
            lessons[lessons.length - 1].topics.push(slice[0].topic);
            continue;
          }
          lessons.push({
            id: `ch${meta.num}_l${part}`,
            ch: meta.num,
            type: 'lesson',
            number: `${meta.num}.${part}`,
            title: slice[0].topic + (slice.length > 1 ? ` ও আরও ${slice.length - 1}টি` : ''),
            formulaIds: slice.map(x => x.id),
            topics: slice.map(x => x.topic),
            xpReward: slice.length * 10 + 15
          });
          part++;
        }
        lessons.push({
          id: `ch${meta.num}_boss`,
          ch: meta.num,
          type: 'boss',
          number: `🏆`,
          title: `অধ্যায় ${toBnNum(meta.num)} বস কুইজ`,
          formulaIds: chFormulas.map(x => x.id),
          topics: ['সম্পূর্ণ অধ্যায় রিভিউ'],
          xpReward: 50
        });
        chapters.push({
          ...meta,
          fullTitle,
          formulaIds: chFormulas.map(x => x.id),
          lessons
        });
      }
      return chapters;
    }

    function toBnNum(n) {
      const d = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
      return String(n).replace(/\d/g, x => d[Number(x)]);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        return { ...JSON.parse(JSON.stringify(DEFAULT_STATE)), ...parsed };
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function getFormulaStat(id) {
      if (!state.formulaStats[id]) {
        state.formulaStats[id] = { seen: 0, correct: 0, wrong: 0, mastery: 0, nextReview: 0, bookmarked: false };
      }
      return state.formulaStats[id];
    }

    function recordAnswer(formulaId, isCorrect) {
      const st = getFormulaStat(formulaId);
      st.seen = (st.seen || 0) + 1;
      state.totalAnswered = (state.totalAnswered || 0) + 1;
      const now = Date.now();
      if (isCorrect) {
        st.correct = (st.correct || 0) + 1;
        state.totalCorrect = (state.totalCorrect || 0) + 1;
        st.mastery = Math.min(3, (st.mastery || 0) + 1);
        const intervals = [10 * 60e3, 6 * 3600e3, 24 * 3600e3, 72 * 3600e3];
        st.nextReview = now + intervals[st.mastery];
      } else {
        st.wrong = (st.wrong || 0) + 1;
        st.mastery = Math.max(0, (st.mastery || 0) - 1);
        st.nextReview = now + 2 * 60e3;
      }
      touchStreak();
      saveState();
    }

    function touchStreak() {
      const today = new Date().toISOString().slice(0, 10);
      if (state.lastStudyDate === today) return;
      if (state.lastStudyDate) {
        const prev = new Date(state.lastStudyDate);
        const curr = new Date(today);
        const diffDays = Math.round((curr - prev) / 86400000);
        state.streak = diffDays === 1 ? (state.streak || 0) + 1 : 1;
      } else {
        state.streak = 1;
      }
      state.lastStudyDate = today;
    }

    function addXp(amount) {
      state.xp = (state.xp || 0) + amount;
      saveState();
      updateHud();
      const xpEl = document.getElementById('hud-xp');
      if (xpEl) {
        const badge = document.createElement('span');
        badge.className = 'xp-float absolute -top-2 right-0 text-xs font-extrabold text-emerald-500';
        badge.textContent = `+${amount} XP`;
        xpEl.appendChild(badge);
        setTimeout(() => badge.remove(), 900);
      }
    }

    // =========================================================================
    // 4. SOUND EFFECTS (Web Audio API)
    // =========================================================================
    let audioCtx = null;
    function playTone(type) {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const playNote = (freq, start, dur, wave = 'sine', gainVal = 0.12) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(gainVal, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + dur);
        };
        if (type === 'correct') {
          playNote(587.33, now, 0.12, 'triangle', 0.14);
          playNote(880, now + 0.09, 0.2, 'triangle', 0.14);
        } else if (type === 'wrong') {
          playNote(240, now, 0.16, 'sawtooth', 0.09);
          playNote(180, now + 0.12, 0.22, 'sawtooth', 0.08);
        } else if (type === 'complete') {
          playNote(523.25, now, 0.13, 'triangle', 0.14);
          playNote(659.25, now + 0.1, 0.13, 'triangle', 0.14);
          playNote(783.99, now + 0.2, 0.16, 'triangle', 0.14);
          playNote(1046.5, now + 0.32, 0.32, 'triangle', 0.16);
        } else if (type === 'tap') {
          playNote(440, now, 0.05, 'sine', 0.06);
        }
      } catch (e) {}
    }

    function renderMath(el) {
      if (!el) return;
      if (typeof renderMathInElement === 'function') {

          renderMathInElement(el, {
            delimiters: [

          while ((n = walker.nextNode())) {
            if (!n.parentElement) continue;
            const tag = n.parentElement.tagName;
            if (['SCRIPT','STYLE','TEXTAREA','PRE','CODE','SVG'].includes(tag) || n.parentElement.closest('.katex, svg')) continue;
            if (/\\\(|\$\$|\\\[/.test(n.nodeValue)) nodes.push(n);
          }
          nodes.forEach(node => {
            const span = document.createElement('span');
            span.innerHTML = node.nodeValue.replace(/\$\$([\s\S]*?)\$\$|\\\[([\s\S]*?)\\\]|\\\(([\s\S]*?)\\\)/g, (m, d1, d2, i1) => {
              const tex = d1 !== undefined ? d1 : (d2 !== undefined ? d2 : i1);
              const displayMode = i1 === undefined;
              try {
                return katex.renderToString(tex, { displayMode, throwOnError: false, strict: false, macros: { '\\AA': '\\text{Å}' } });
              } catch (e) { return m; }
            });
            node.parentNode.replaceChild(span, node);
          });
        } catch (e) {}
      }
    }

    function getRankInfo(xp) {
      const ranks = [
        { name: 'নবীন পদার্থবিদ', min: 0, max: 150, badge: '🌱' },
        { name: 'সূত্র অন্বেষী', min: 150, max: 400, badge: '🔭' },
        { name: 'ল্যাব এক্সপ্লোরার', min: 400, max: 800, badge: '⚗️' },
        { name: 'সূত্র বিশারদ', min: 800, max: 1400, badge: '⚡' },
        { name: 'কোয়ান্টাম মাস্টার', min: 1400, max: 2200, badge: '⚛️' },
        { name: 'পদার্থবিজ্ঞান কিংবদন্তি', min: 2200, max: 99999, badge: '👑' }
      ];
      for (let i = 0; i < ranks.length; i++) {
        if (xp < ranks[i].max || i === ranks.length - 1) {
          const level = i + 1;
          const pct = i === ranks.length - 1 ? 100 : Math.min(100, Math.round(((xp - ranks[i].min) / (ranks[i].max - ranks[i].min)) * 100));
          return { ...ranks[i], level, pct };
        }
      }
      return { ...ranks[0], level: 1, pct: 0 };
    }

    function getMasteredCount() {
      return FORMULAS.filter(f => (state.formulaStats[f.id]?.mastery || 0) >= 2).length;
    }

    function getDueFormulas() {
      const now = Date.now();
      return FORMULAS.filter(f => {
        const st = state.formulaStats[f.id];
        if (!st) return false;
        return (st.wrong > 0 && st.mastery < 2) || (st.nextReview > 0 && st.nextReview <= now && st.mastery < 3);
      });
    }

      for (const l of ALL_LESSONS) {

      }

    function pickDistractors(targetFormula, count = 3) {
      let pool = FORMULAS.filter(f => f.id !== targetFormula.id && f.ch === targetFormula.ch);
      if (pool.length < count) {
        const extra = FORMULAS.filter(f => f.id !== targetFormula.id && f.ch !== targetFormula.ch);
        pool = pool.concat(shuffle(extra));
      }
      return shuffle(pool).slice(0, count);
    }

    function buildHandcraftedQuizObj(hq) {
      const formula = FORMULAS[hq.formulaId] || FORMULAS[0];
      const indexedOpts = hq.options.map((txt, idx) => ({
        text: txt,
        correct: idx === hq.correctIndex
      }));
      const shuffledOpts = shuffle(indexedOpts);
      const tInfo = hq.mandatory
        ? { text: '📏 বাধ্যতামূলক একক', cls: 'bg-fuchsia-100 dark:bg-fuchsia-950 text-fuchsia-800 dark:text-fuchsia-300 ring-1 ring-fuchsia-400/50' }
        : (TYPE_LABELS[hq.type] || TYPE_LABELS.concept);
      const dInfo = DIFF_LABELS[hq.difficulty] || DIFF_LABELS.medium;
      return {
        kind: 'handcrafted',
        formulaId: formula.id,
        badge: tInfo.text,
        badgeCls: tInfo.cls,
        diffText: dInfo.text,
        diffCls: dInfo.cls,
        promptHtml: `<div class="text-xs font-bold uppercase tracking-wider text-[#2493DF] mb-1">${formula.topic}</div>
          <div class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-snug math-scroll">${hq.question}</div>
          ${hq.svg ? `<div class="mt-2">${hq.svg}</div>` : ''}`,
        options: shuffledOpts.map(o => ({
          html: `<div class="math-scroll py-0.5">${o.text}</div>`,
          correct: o.correct
        })),
        explanation: hq.explanation,
        formula
      };
    }

    function buildQuizQuestion(formula, preferredIdx = null, forceAuto = false) {
      const hqList = QUIZZES_BY_FORMULA[formula.id];
      if (!forceAuto && hqList && hqList.length > 0) {
        const chosen = preferredIdx !== null ? hqList[preferredIdx % hqList.length] : hqList[Math.floor(Math.random() * hqList.length)];
        return buildHandcraftedQuizObj(chosen);
      }

      const distractors = pickDistractors(formula, 3);
      const allOpts = shuffle([formula, ...distractors]);
      return {
        kind: 'formula_mcq',
        formulaId: formula.id,
        badge: 'সঠিক সূত্র বাছাই',
        badgeCls: 'bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300',
        diffText: 'মাঝারি',
        diffCls: 'bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300',
        promptHtml: `<div class="text-xs font-bold uppercase tracking-wider text-[#2493DF] mb-1">${formula.topic}</div>
          <div class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-snug">${formula.question}</div>`,
        options: allOpts.map(o => ({
          html: `<div class="math-scroll py-0.5">${o.answer}</div>`,
          correct: o.id === formula.id
        })),
        explanation: formula.context,
        formula
      };
    }

    // =========================================================================
    // 9. SOLOLEARN INTERACTIVE LESSON RUNNER
    // =========================================================================
    let activeLesson = null;

    function buildLessonSteps(lesson) {
      const fList = lesson.formulaIds.map(id => FORMULAS[id]);
      const steps = [];
      const chMandatoryUnits = HANDCRAFTED_QUIZZES.filter(q => q.ch === lesson.ch && q.mandatory);
      const chGraphs = HANDCRAFTED_QUIZZES.filter(q => q.ch === lesson.ch && q.type === 'graph');
      const chConcepts = HANDCRAFTED_QUIZZES.filter(q => q.ch === lesson.ch && q.type === 'concept');
      if (lesson.type === 'boss') {
        const normalPool = shuffle(fList.flatMap(f => (QUIZZES_BY_FORMULA[f.id] || []).filter(q => !q.mandatory && q.type !== 'graph')));
        const unitPick = shuffle(chMandatoryUnits).slice(0, 2);
        const graphPick = shuffle(chGraphs).slice(0, 1);
        const guaranteed = [...unitPick, ...graphPick];
        const count = Math.min(9, Math.max(6, normalPool.length + guaranteed.length));
        const usedQs = shuffle([...guaranteed, ...normalPool.slice(0, Math.max(0, count - guaranteed.length))]);
        usedQs.forEach(hq => steps.push({ type: 'quiz', quiz: buildHandcraftedQuizObj(hq) }));
        return steps;
      }

      const usedSet = new Set();
      for (let i = 0; i < fList.length; i += 2) {
        const pair = fList.slice(i, i + 2);
        pair.forEach(f => steps.push({ type: 'learn', formula: f }));
        pair.forEach(f => {
          const hqList = (QUIZZES_BY_FORMULA[f.id] || []).filter(q => !q.mandatory);
          if (hqList.length) {
            const pick = hqList[Math.floor(Math.random() * hqList.length)];
            usedSet.add(pick);
            steps.push({ type: 'quiz', quiz: buildHandcraftedQuizObj(pick) });
          } else {
            steps.push({ type: 'quiz', quiz: buildQuizQuestion(f, 0) });
          }
        });
      }
      // Mandatory Unit & Dimension question for important formulas in this lesson/chapter
      const lessonMandUnits = fList.flatMap(f => (QUIZZES_BY_FORMULA[f.id] || []).filter(q => q.mandatory));
      const unitPool = lessonMandUnits.length ? lessonMandUnits : chMandatoryUnits;
      if (unitPool.length) {
        const pickedUnit = unitPool[Math.floor(Math.random() * unitPool.length)];
        steps.push({ type: 'quiz', quiz: buildHandcraftedQuizObj(pickedUnit) });
      }
      // Bonus Graph or Conceptual DU question
      const lessonGraphOrConcept = fList.flatMap(f => (QUIZZES_BY_FORMULA[f.id] || []).filter(q => (q.type === 'graph' || q.type === 'concept') && !usedSet.has(q)));
      const bonusPool = lessonGraphOrConcept.length ? lessonGraphOrConcept : [...chGraphs, ...chConcepts].filter(q => !usedSet.has(q));
      if (bonusPool.length) {
        const pickedBonus = bonusPool[Math.floor(Math.random() * bonusPool.length)];
        steps.push({ type: 'quiz', quiz: buildHandcraftedQuizObj(pickedBonus) });
      }
      return steps;
    }

    function startLesson(lessonId) {
      const lesson = ALL_LESSONS.find(l => l.id === lessonId);
      if (!lesson) return;
      if (!state.unlimitedHearts && state.hearts <= 0) {
        openModal(
          'হার্ট শেষ হয়ে গেছে ❤️',
          'আপনার ৫টি হার্ট শেষ হয়ে গেছে। ফ্রি প্র্যাকটিস মোডে হার্ট রিফিল করে এখনই শেখা চালিয়ে যেতে পারেন!',
          [
            { label: 'বাতিল' },
            {
              label: 'হার্ট রিফিল করুন (৫ ❤️)',
              cls: 'px-4 py-2 rounded-xl text-sm font-bold bg-[#2493DF] text-white hover:bg-[#1B76B8]',
              onClick: () => { state.hearts = 5; saveState(); updateHud(); startLesson(lessonId); }
            }
          ]
        );
        return;
      }

      playTone('tap');
      activeLesson = {
        lesson,
        steps: buildLessonSteps(lesson),
        idx: 0,
        selectedOptionIdx: null,
        checked: false,
        lastCorrect: false,
        quizTotal: 0,
        quizCorrect: 0,
        xpEarned: 0,
        finished: false
      };
      activeLesson.quizTotal = activeLesson.steps.filter(s => s.type === 'quiz').length;

      const ov = document.getElementById('lesson-overlay');
      ov.classList.remove('hidden');
      ov.classList.add('flex');
      renderLessonStep();
    }

    function closeLessonOverlay() {
      const ov = document.getElementById('lesson-overlay');
      ov.classList.add('hidden');
      ov.classList.remove('flex');
      activeLesson = null;
      updateHud();
      renderCurrentTab();
    }

    function renderLessonStep() {
      if (!activeLesson) return;
      const { lesson, steps, idx } = activeLesson;

      document.getElementById('lesson-title-label').textContent = lesson.type === 'boss' ? lesson.title : `লেসন ${lesson.number} · ${lesson.title}`;
      document.getElementById('lesson-step-label').textContent = activeLesson.finished ? 'সম্পন্ন!' : `${toBnNum(idx + 1)} / ${toBnNum(steps.length)}`;
      document.getElementById('lesson-hearts-count').textContent = state.unlimitedHearts ? '∞' : state.hearts;

      const barsEl = document.getElementById('lesson-progress-bars');
      barsEl.innerHTML = steps.map((_, i) => {
        const cls = i < idx || activeLesson.finished
          ? 'bg-emerald-500'
          : (i === idx ? 'bg-[#2493DF]' : 'bg-slate-200 dark:bg-slate-700');
        return `<div class="flex-1 rounded-full transition-colors ${cls}"></div>`;
      }).join('');

      const wrap = document.getElementById('lesson-card-wrap');
      const footer = document.getElementById('lesson-footer');
      const footerInner = document.getElementById('lesson-footer-inner');
      footer.className = 'bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-3 sm:px-6 py-3.5 transition-colors';

    function checkLessonAnswer() {
      if (!activeLesson || activeLesson.checked || activeLesson.selectedOptionIdx === null) return;
      const step = activeLesson.steps[activeLesson.idx];
      const opt = step.quiz.options[activeLesson.selectedOptionIdx];
      activeLesson.checked = true;
      activeLesson.lastCorrect = !!opt.correct;
      recordAnswer(step.quiz.formulaId, opt.correct);

      if (opt.correct) {
        playTone('correct');
        activeLesson.quizCorrect++;
        activeLesson.xpEarned += 10;
        addXp(10);
      } else {
        playTone('wrong');
        if (!state.unlimitedHearts) {
          state.hearts = Math.max(0, state.hearts - 1);
          saveState();
          updateHud();
        }
      }
      renderLessonStep();
    }

    function advanceLessonStep() {
      if (!activeLesson) return;
      if (!state.unlimitedHearts && state.hearts <= 0 && !activeLesson.finished) {
        openModal(
          'হার্ট শেষ! ❤️',
          'আপনার সব হার্ট শেষ হয়ে গেছে। চিন্তা নেই—এখনই ফ্রি রিফিল করে লেসনটি শেষ করুন!',
          [
            { label: 'লেসন থেকে বের হন', onClick: closeLessonOverlay },
            {
              label: 'ফ্রি রিফিল করে চালিয়ে যান',
              cls: 'px-4 py-2 rounded-xl text-sm font-bold bg-[#2493DF] text-white',
              onClick: () => { state.hearts = 5; saveState(); updateHud(); renderLessonStep(); }
            }
          ]
        );
        return;
      }

      if (activeLesson.idx + 1 >= activeLesson.steps.length) {
        finishLesson();
      } else {
        activeLesson.idx++;
        activeLesson.selectedOptionIdx = null;
        activeLesson.checked = false;
        const lb = document.getElementById('lesson-body');
        if (lb) lb.scrollTop = 0;
        activeLesson.lastCorrect = false;
        renderLessonStep();
        document.getElementById('lesson-body').scrollTop = 0;
      }
    }

    function finishLesson() {
      activeLesson.finished = true;
      const acc = activeLesson.quizTotal > 0 ? Math.round((activeLesson.quizCorrect / activeLesson.quizTotal) * 100) : 100;
      const stars = acc >= 90 ? 3 : (acc >= 70 ? 2 : 1);
      const bonusXp = activeLesson.lesson.xpReward;
      activeLesson.xpEarned += bonusXp;
      addXp(bonusXp);

      const prev = state.completedLessons[activeLesson.lesson.id];
      state.completedLessons[activeLesson.lesson.id] = {
        stars: prev ? Math.max(prev.stars, stars) : stars,
        bestAccuracy: prev ? Math.max(prev.bestAccuracy, acc) : acc,
        completedAt: Date.now()
      };
      if (activeLesson.lesson.type === 'boss' && activeLesson.lesson.ch < 11) {
        state.expandedChapters[activeLesson.lesson.ch + 1] = true;
      }
      saveState();
      playTone('complete');
      try {
        if (typeof confetti === 'function') {
          confetti({ particleCount: 70, spread: 65, origin: { y: 0.6 } });
        }
      } catch (e) {}
      renderLessonStep();
    }

        </div>
      `;
      document.getElementById('les-done-home').addEventListener('click', closeLessonOverlay);
      if (nextLes) {
        document.getElementById('les-done-next').addEventListener('click', () => startLesson(nextLes.id));
      }

      return items;

                  <span class="font-extrabold text-[#2493DF]">💡 সমাধান:</span> ${q.solution || 'সঠিক উত্তরটি উপরে চিহ্নিত করা হয়েছে।'}
                </div>
                <div class="flex justify-end">

      }));
      main.querySelectorAll('[data-dudrill]').forEach(b => b.addEventListener('click', () => {

    // --- 10-0B. GRAPH, UNIT & DIMENSION BLITZ ---
    let gudState = { filter: 'all', idx: 0, correct: 0, wrong: 0, streak: 0, answered: false, picked: null, pool: [] };

      if (filter === 'unit_dim') list = list.filter(q => q.type === 'unit_dim');
      return shuffle(list);
    }
