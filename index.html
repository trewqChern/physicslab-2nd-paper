 সমান্তরাল সমবায়ের সূত্র কী এবং \\(n\\) সংখ্যক \\(R\\) রোধের সমবায় ও তার টেনে \\(n\\) গুণ লম্বা করলে রোধ কত হয়?", "answer": "শ্রেণী: \\(R_s = R_1 + \\dots + R_n\\) (সমান হলে \\(R_s = nR\\))<br>সমান্তরাল: \\(\\frac{1}{R_p} = \\frac{1}{R_1} + \\dots + \\frac{1}{R_n}\\) (সমান হলে \\(R_p = \\frac{R}{n}\\))<br>তার টেনে \\(n\\) গুণ লম্বা করলে রোধ \\(= n^2R\\)", "context": "<b>কারণ:<\/b> তার টেনে দৈর্ঘ্য \\(n\\) গুণ করলে আয়তন ধ্রুব থাকায় প্রস্থচ্ছেদ \\(A\\) কমে \\(\\frac{A}{n}\\) হয়; ফলে \\(R' = \\rho\\frac{nL}{A/n} = n^2 R\\)।<br>সমান \\(n\\) রোধের ক্ষেত্রে \\(\\frac{R_s}{R_p} = n^2\\)।", "intuition": "শ্রেণী সমবায়ে রোধগুলো পরপর থাকায় মোট বাধা বেড়ে যায়, আর সমান্তরাল সমবায়ে প্রবাহের একাধিক পথ তৈরি হওয়ায় মোট বাধা কমে যায়। একটি তারকে টেনে লম্বা করলে আয়তন স্থির রাখতে প্রস্থচ্ছেদও কমে যায়, ফলে রোধ বর্গাকারে বাড়ে।", "trap": "তার টেনে \\(n\\) গুণ লম্বা করলে রোধ \\(n\\) গুণ নয় বরং \\(n^2\\) গুণ হয় (\\(R' = n^2R\\)), এবং ব্যাসার্ধ অর্ধেক করলে রোধ \\(2^4 = 16\\) গুণ হয়—আয়তন ধ্রুব থাকার শর্তটি অনেকেই ভুলে যায়।", "quickExample": "\\(5\\ \\Omega\\) রোধের একটি তারকে সম-আয়তনে টেনে দৈর্ঘ্য \\(3\\) গুণ করলে নতুন রোধ \\(R' = n^2R = 3^2 \\times 5 = 45\\ \\Omega\\)।"}, {"id": 44, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "তড়িৎকোষ ও হারানো বিভব", "question": "অভ্যন্তরীণ রোধ \\(r\\) বিশিষ্ট কোষের বর্তনী প্রবাহমাত্রা \\(I\\), তড়িচ্চালক শক্তি \\(E\\) এবং হারানো বিভব \\(V'\\) এর সূত্র কী?", "answer": "\\(I = \\frac{E}{R+r}\\) • \\(E = V + Ir = IR + Ir = I(R+r)\\)<br>হারানো বিভব: \\(V' = E - V = Ir\\)", "context": "<b>প্রতীক:<\/b> \\(E\\) = কোষের তড়িচ্চালক শক্তি (EMF), \\(V = IR\\) = প্রান্তীয় বিভব পার্থক্য, \\(r\\) = কোষের অভ্যন্তরীণ রোধ।<br><b>ধারণা:<\/b> বর্তনী খোলা থাকলে (\\(I=0\\)) \\(V = E\\)। প্রবাহ চললে অভ্যন্তরীণ রোধে \\(Ir\\) বিভব নষ্ট হয়।", "intuition": "তড়িৎকোষের ভেতরের তড়িৎ-বিশ্লেষ্যের নিজস্ব বাধাকে অভ্যন্তরীণ রোধ \\(r\\) বলে, যার মধ্য দিয়ে প্রবাহ চললে বিভবের একটি অংশ \\(Ir\\) কোষের ভেতরেই নষ্ট হয়। ফলে বহিঃবর্তনীতে প্রাপ্ত প্রান্তীয় বিভব \\(V\\) কোষের তড়িচ্চালক শক্তি \\(E\\) অপেক্ষা কম হয়।", "trap": "স্বাভাবিক ব্যবহারে (ডিসচার্জিং) \\(V = E - Ir \\lt  E\\) হলেও কোষ চার্জ করার সময় প্রবাহ বিপরীত দিকে ঢোকে বলে \\(V = E + Ir \\gt  E\\) হয়।", "quickExample": "\\(E = 12\\text{ V}\\) ও \\(r = 1\\ \\Omega\\) বিশিষ্ট কোষে \\(R = 5\\ \\Omega\\) যুক্ত করলে \\(I = \\frac{12}{5 + 1} = 2\\text{ A}\\), হারানো বিভব \\(V' = Ir = 2\\text{ V}\\) এবং প্রান্তীয় বিভব \\(V = 12 - 2 = 10\\text{ V}\\)।"}, {"id": 45, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "বিভব ও প্রবাহ বিভাজন", "question": "রোধের শ্রেণী সমবায়ে ভোল্টেজ বিভাজন (\\(V_1, V_2\\)) এবং সমান্তরাল সমবায়ে কারেন্ট বিভাজন (\\(I_1, I_2\\)) এর সূত্র কী?", "answer": "শ্রেণী (কারেন্ট সমান): \\(V_1 = \\frac{R_1}{R_1+R_2}V\\), \\(V_2 = \\frac{R_2}{R_1+R_2}V\\)<br>সমান্তরাল (ভোল্টেজ সমান): \\(I_1 = \\frac{R_2}{R_1+R_2}I\\), \\(I_2 = \\frac{R_1}{R_1+R_2}I\\)", "context": "<b>সতর্কতা:<\/b> শ্রেণীতে নিজের রোধ ওপরে থাকে (\\(V \\propto R\\)), কিন্তু সমান্তরালে <b>বিপরীত শাখার রোধ<\/b> ওপরে থাকে (\\(I \\propto \\frac{1}{R}\\))।", "intuition": "শ্রেণী সমবায়ে সব রোধে প্রবাহ সমান থাকায় বিভব সরাসরি রোধের অনুপাতে ভাগ হয়, অর্থাৎ বড় রোধে বেশি বিভব পতন ঘটে। সমান্তরাল সমবায়ে বিভব সমান থাকায় প্রবাহ রোধের ব্যস্তানুপাতে ভাগ হয়, অর্থাৎ কম রোধের পথে বেশি প্রবাহ যায়।", "trap": "কারেন্ট ডিভাইডার সূত্রে \\(I_1 = \\frac{R_2}{R_1+R_2}I\\) লবে বিপরীত শাখার রোধ \\(R_2\\) বসে—ভোল্টেজ ডিভাইডারের সাথে গুলিয়ে নিজের রোধ \\(R_1\\) বসালেই উত্তর উল্টে যায়।", "quickExample": "\\(6\\ \\Omega\\) ও \\(3\\ \\Omega\\) রোধ সমান্তরালে যুক্ত হয়ে মোট \\(9\\text{ A}\\) প্রবাহ নিলে \\(6\\ \\Omega\\) রোধের প্রবাহ \\(I_1 = \\frac{3}{6 + 3} \\times 9 = 3\\text{ A}\\) এবং \\(3\\ \\Omega\\) রোধের প্রবাহ \\(I_2 = 6\\text{ A}\\)।"}, {"id": 46, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "ওহম ও কার্শপের সূত্র", "question": "ওহমের সূত্র এবং কার্শপের প্রথম (KCL) ও দ্বিতীয় (KVL) সূত্র কী?", "answer": "ওহমের সূত্র: \\(V = IR\\)<br>KCL: \\(\\sum I = 0\\) (মোট আগত প্রবাহ = মোট নির্গত প্রবাহ)<br>KVL: \\(\\sum V = \\sum IR\\)", "context": "<b>সংরক্ষণশীলতা:<\/b> KCL <b>চার্জের সংরক্ষণ<\/b> নীতির ওপর এবং KVL <b>শক্তির সংরক্ষণ<\/b> নীতির ওপর প্রতিষ্ঠিত। জটিল বর্তনী সমাধানে ব্যবহৃত হয়।", "intuition": "ওহমের সূত্র অনুযায়ী স্থির তাপমাত্রায় বিভব পার্থক্য বাড়ালে প্রবাহ সমানুপাতিক হারে বাড়ে। কার্শপের প্রথম সূত্র (KCL) জংশনে চার্জের সংরক্ষণ এবং দ্বিতীয় সূত্র (KVL) বদ্ধ লুপে শক্তির সংরক্ষণ নিশ্চিত করে।", "trap": "\\(I\\) বনাম \\(V\\) লেখচিত্রের ঢাল হলো \\(\\frac{1}{R}\\) (পরিবাহিতা), রোধ \\(R\\) নয়; কেবল \\(V\\) বনাম \\(I\\) লেখচিত্রের ঢাল রোধ \\(R\\) নির্দেশ করে।", "quickExample": "কোনো সংযোগ বিন্দুতে \\(4\\text{ A}\\) ও \\(3\\text{ A}\\) প্রবাহ প্রবেশ করে একটি শাখা দিয়ে \\(2\\text{ A}\\) বের হলে KCL অনুযায়ী অপর শাখা দিয়ে নির্গত প্রবাহ \\(I = (4 + 3) - 2 = 5\\text{ A}\\)।"}, {"id": 47, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "কোষের সমবায়", "question": "কোষের শ্রেণী, সমান্তরাল ও মিশ্র (\\(m\\) সারি, প্রতি সারিতে \\(n\\) কোষ) সমবায়ে প্রবাহমাত্রা এবং সর্বোচ্চ প্রবাহের শর্ত কী?", "answer": "শ্রেণী: \\(I = \\frac{nE}{R + nr}\\) • সমান্তরাল: \\(I = \\frac{nE}{nR + r}\\)<br>মিশ্র: \\(I = \\frac{mnE}{mR + nr}\\) • সর্বোচ্চ প্রবাহের শর্ত: \\(mR = nr\\)", "context": "<b>কখন কোনটি ভালো?<\/b> বহিঃরোধ \\(R \\gg r\\) হলে শ্রেণী সমবায়; \\(r \\gg R\\) হলে সমান্তরাল সমবায়। মিশ্র সমবায়ে মোট অভ্যন্তরীণ রোধ \\(\\frac{nr}{m} = R\\) হলে প্রবাহ সর্বোচ্চ হয়।", "intuition": "একাধিক কোষকে শ্রেণীতে সাজালে মোট তড়িচ্চালক শক্তি বাড়ে কিন্তু অভ্যন্তরীণ রোধও বাড়ে, আর সমান্তরালে সাজালে অভ্যন্তরীণ রোধ কমে। মিশ্র সমবায়ে মোট অভ্যন্তরীণ রোধ বহিঃরোধের সমান (\\(\\frac{nr}{m} = R\\)) হলে বহিঃবর্তনীতে সর্বোচ্চ প্রবাহ পাওয়া যায়।", "trap": "বহিঃরোধ \\(R \\gg r\\) হলে শ্রেণী সমবায় এবং \\(r \\gg R\\) হলে সমান্তরাল সমবায় সুবিধাজনক—এই দুটি শর্ত উল্টে ফেললে ভুল উত্তর আসে।", "quickExample": "\\(r = 1\\ \\Omega\\) বিশিষ্ট \\(12\\)টি কোষকে \\(R = 3\\ \\Omega\\) বহিঃরোধে সর্বোচ্চ প্রবাহের জন্য সাজালে \\(mn = 12\\) ও \\(3m = n\\); ফলে \\(3m^2 = 12 \\Rightarrow m = 2\\) সারি এবং প্রতি সারিতে \\(n = 6\\)টি কোষ হবে।"}, {"id": 48, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "হুইটস্টোন ব্রিজ", "question": "হুইটস্টোন ব্রিজের মূলনীতি এবং ব্রিজটি সাম্যাবস্থায় থাকার শর্ত কী?", "answer": "\\(\\frac{P}{Q} = \\frac{R}{S}\\) এবং সাম্যাবস্থায় গ্যালভানোমিটার প্রবাহ \\(I_G = 0\\text{ A}\\)", "context": "<b>ধারণা:<\/b> \\(P, Q, R, S\\) চারটি বাহুর রোধ। সাম্যাবস্থায় মাঝের শাখা (গ্যালভানোমিটার) দিয়ে কোনো প্রবাহ যায় না, তাই তুল্য রোধ নির্ণয়ে মাঝের রোধটি বাদ দেওয়া যায়।", "intuition": "হুইটস্টোন ব্রিজের চার বাহুর রোধের অনুপাত সমান হলে মাঝের দুটি বিন্দুর বিভব সমান হয়ে যায়। বিভব পার্থক্য শূন্য হওয়ায় মাঝের গ্যালভানোমিটার শাখায় কোনো প্রবাহ চলে না এবং অজানা রোধ নিখুঁতভাবে বের করা যায়।", "trap": "চতুর্থ বাহুতে প্রয়োজনীয় রোধ বর্তমান রোধের চেয়ে বেশি হলে শ্রেণীতে, আর কম হলে সমান্তরালে অতিরিক্ত রোধ যুক্ত করতে হয়—এই শ্রেণী-সমান্তরাল নির্বাচনটিই ভর্তি পরীক্ষায় সবচেয়ে বেশি ভুল হয়।", "quickExample": "\\(P = 4\\ \\Omega\\), \\(Q = 8\\ \\Omega\\), \\(R = 6\\ \\Omega\\) ও \\(S = 15\\ \\Omega\\) হলে সাম্যাবস্থার জন্য দরকার \\(S' = \\frac{8 \\times 6}{4} = 12\\ \\Omega\\)। তাই \\(15\\ \\Omega\\)-এর সাথে সমান্তরালে \\(x\\) যোগ করলে \\(\\frac{1}{12} = \\frac{1}{15} + \\frac{1}{x} \\Rightarrow x = 60\\ \\Omega\\)।"}, {"id": 49, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "শান্ট ও পাল্লা বৃদ্ধি", "question": "শান্টের প্রবাহ \\(I_S\\), গ্যালভানোমিটার প্রবাহ \\(I_G\\) এবং অ্যামিটার ও ভোল্টমিটারের পাল্লা \\(n\\) গুণ বৃদ্ধির সূত্র কী?", "answer": "\\(I_S = \\left(\\frac{G}{G+S}\\right)I\\) • \\(I_G = \\left(\\frac{S}{G+S}\\right)I\\)<br>অ্যামিটারের পাল্লা \\(n\\) গুণ করতে শান্ট: \\(S = \\frac{G}{n-1}\\)<br>ভোল্টমিটারের পাল্লা \\(n\\) গুণ করতে রোধ: \\(R = G(n-1)\\)", "context": "<b>ধারণা:<\/b> শান্ট (\\(S\\)) হলো খুব কম মানের রোধ যা গ্যালভানোমিটারের (\\(G\\)) সাথে <b>সমান্তরালে<\/b> যুক্ত হয় (অ্যামিটার বানাতে)। ভোল্টমিটারের পাল্লা বাড়াতে উচ্চ মানের রোধ \\(R\\) <b>শ্রেণীতে<\/b> যুক্ত হয়।", "intuition": "গ্যালভানোমিটারকে অতিরিক্ত প্রবাহ থেকে বাঁচাতে ও অ্যামিটারের পাল্লা বাড়াতে সমান্তরালে খুব কম মানের শান্ট যুক্ত করে বাড়তি প্রবাহ পাশ কাটিয়ে দেওয়া হয়। অন্যদিকে ভোল্টমিটারের পাল্লা বাড়াতে শ্রেণীতে উচ্চ রোধ যুক্ত করে অতিরিক্ত বিভব শোষণ করা হয়।", "trap": "পাল্লা \\(n\\) গুণ করার সূত্রে হরে বা গুণক হিসেবে \\((n - 1)\\) থাকে, \\(n\\) নয়—তাই অ্যামিটারের শান্ট \\(S = \\frac{G}{n-1}\\) এবং ভোল্টমিটারের শ্রেণী রোধ \\(R = G(n-1)\\) হয়।", "quickExample": "\\(G = 99\\ \\Omega\\) রোধের গ্যালভানোমিটারের পাল্লা \\(10\\) গুণ করে অ্যামিটার বানাতে শান্ট \\(S = \\frac{99}{10 - 1} = 11\\ \\Omega\\) (সমান্তরালে) এবং ভোল্টমিটার বানাতে \\(R = 99(10 - 1) = 891\\ \\Omega\\) (শ্রেণীতে)।"}, {"id": 50, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "মিটার ব্রিজ", "question": "মিটার ব্রিজের সাহায্যে অজানা রোধ নির্ণয়ের সূত্র কী?", "answer": "\\(\\frac{R}{S} = \\frac{l}{100 - l}\\)", "context": "<b>প্রতীক:<\/b> \\(l\\) = বাম প্রান্ত থেকে নিঃস্পন্দ বিন্দুর দূরত্ব (\\(\\text{cm}\\)-এ), \\((100 - l)\\) = ডান প্রান্তের দৈর্ঘ্য।<br><b>নীতি:<\/b> এটি হুইটস্টোন ব্রিজের নীতিতে কাজ করে (\\(1\\text{ m} = 100\\text{ cm}\\) তারের কারণে)।", "intuition": "মিটার ব্রিজ হলো \\(100\\text{ cm}\\) সুষম তারের ওপর নির্মিত হুইটস্টোন ব্রিজের ব্যবহারিক রূপ। তারের প্রস্থচ্ছেদ সুষম হওয়ায় দুই অংশের রোধের অনুপাত সরাসরি তাদের দৈর্ঘ্যের অনুপাত \\(\\frac{l}{100 - l}\\)-এর সমান হয়।", "trap": "নিঃস্পন্দ দৈর্ঘ্য \\(l\\) কোন প্রান্ত (বাম নাকি ডান) থেকে মাপা হয়েছে তা না দেখলে এবং বাম ও ডান ফাঁকের রোধের অবস্থান বদলালে \\(l\\) ও \\((100 - l)\\) উল্টে যাওয়ার বিষয়টি ভুলে গেলে অঙ্ক ভুল হয়।", "quickExample": "বাম ফাঁকে অজানা রোধ \\(R\\) ও ডান ফাঁকে \\(S = 12\\ \\Omega\\) বসালে বাম প্রান্ত থেকে \\(l = 40\\text{ cm}\\) দূরে নিঃস্পন্দ বিন্দু পেলে \\(R = 12 \\times \\frac{40}{100 - 40} = 8\\ \\Omega\\)।"}, {"id": 51, "ch": 3, "chapter": "অধ্যায় ৩: চল তড়িৎ", "topic": "পোটেনশিওমিটার", "question": "পোটেনশিওমিটারের সাহায্যে কোষের তড়িচ্চালক শক্তি \\(E\\) ও অভ্যন্তরীণ রোধ \\(r\\) নির্ণয়ের সূত্র কী?", "answer": "i. \\(E = \\frac{lIR}{L}\\)<br>ii. \\(r = \\left(\\frac{l_1}{l_2} - 1\\right)R\\) [\\(l_1\\) = \\(R\\) না থাকা অবস্থায়, \\(l_2\\) = \\(R\\) থাকা অবস্থায় নিঃস্পন্দ বিন্দুর দূরত্ব]", "context": "<b>প্রতীক:<\/b> \\(L\\) = পোটেনশিওমিটার তারের মোট দৈর্ঘ্য, \\(R\\) = তারের রোধ (১ম সূত্রে) বা সমান্তরাল রোধ (২য় সূত্রে)।<br><b>সুবিধা:<\/b> এটি নিঃস্পন্দ অবস্থায় কোষ থেকে কোনো প্রবাহ টানে না বলে ভোল্টমিটারের চেয়ে বেশি নির্ভুল।", "intuition": "পোটেনশিওমিটারের সুষম তারের দৈর্ঘ্য বরাবর বিভব সুষমভাবে কমে, তাই তারের যে অংশের বিভব পতন কোষের তড়িচ্চালক শক্তির সমান হয় সেখানে গ্যালভানোমিটারে প্রবাহ শূন্য হয়। নিঃস্পন্দ অবস্থায় কোষ থেকে কোনো প্রবাহ না টানায় এর প্রকৃত EMF মাপা যায়।", "trap": "অভ্যন্তরীণ রোধের সূত্র \\(r = \\left(\\frac{l_1}{l_2} - 1\\right)R\\)-এ \\(l_1\\) হলো \\(R\\) না থাকা অবস্থায় (বড় দৈর্ঘ্য) এবং \\(l_2\\) হলো \\(R\\) যুক্ত অবস্থায় (ছোট দৈর্ঘ্য)—দুটিকে উল্টে দিলে \\(r\\)-এর মান ঋণাত্মক চলে আসে।", "quickExample": "কোনো কোষের খোলা অবস্থায় নিঃস্পন্দ দৈর্ঘ্য \\(l_1 = 60\\text{ cm}\\) এবং \\(R = 10\\ \\Omega\\) সমান্তরালে যুক্ত অবস্থায় \\(l_2 = 50\\text{ cm}\\) হলে অভ্যন্তরীণ রোধ \\(r = \\left(\\frac{60}{50} - 1\\right) \\times 10 = 2\\ \\Omega\\)।"}, {"id": 52, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "চৌম্বক ফ্লাক্স ও বায়োট-স্যাভার্ট", "question": "চৌম্বক ফ্লাক্স \\(\\phi\\) এবং বায়োট-স্যাভার্ট সূত্রের গাণিতিক রূপ কী?", "answer": "চৌম্বক ফ্লাক্স: \\(\\phi = \\vec{A}\\cdot\\vec{B} = AB\\cos\\theta\\)<br>বায়োট-স্যাভার্ট সূত্র: \\(\\overrightarrow{dB} = \\frac{\\mu_0 I}{4\\pi}\\frac{\\overrightarrow{dl}\\times\\vec{r}}{r^3}\\)", "context": "<b>প্রতীক:<\/b> \\(\\mu_0 = 4\\pi\\times 10^{-7}\\text{ T m A}^{-1}\\); \\(\\phi\\)-এর একক ওয়েবার (\\(\\text{Wb}\\)) ও \\(B\\)-এর একক টেসলা (\\(\\text{T} = \\text{Wb m}^{-2}\\))।<br><b>দিক:<\/b> \\(\\theta\\) হলো \\(\\vec{B}\\) এবং তলের অভিলম্বের কোণ। \\(dB\\)-এর মান \\(\\frac{\\mu_0 I dl\\sin\\theta}{4\\pi r^2}\\)।", "intuition": "কোনো তলের ভেতর দিয়ে লম্বভাবে অতিক্রান্ত মোট চৌম্বক বলরেখার সংখ্যাই হলো চৌম্বক ফ্লাক্স; আর বায়োট-স্যাভার্ট সূত্র দেখায় কীভাবে ক্ষুদ্র তড়িৎবাহী অংশ \\(I\\,dl\\) তার চারপাশে দূরত্বের বর্গের ব্যস্তানুপাতে চৌম্বক ক্ষেত্র তৈরি করে।", "trap": "ফ্লাক্সের সূত্রে \\(\\theta\\) হলো \\(\\vec{B}\\) এবং তলের অভিলম্বের মধ্যবর্তী কোণ, তলের নিজের সাথে কোণ নয়—তাই তলের সাথে \\(30^\\circ\\) কোণ দেওয়া থাকলে \\(\\theta = 90^\\circ - 30^\\circ = 60^\\circ\\) বসাতে হবে!", "quickExample": "\\(0.05\\text{ m}^2\\) ক্ষেত্রফলের একটি তলের সাথে \\(0.4\\text{ T}\\) চৌম্বক ক্ষেত্র \\(30^\\circ\\) কোণে আনত থাকলে অভিলম্বের সাথে কোণ \\(\\theta = 90^\\circ - 30^\\circ = 60^\\circ\\)। সুতরাং, \\(\\phi = AB\\cos\\theta = 0.05 \\times 0.4 \\times \\cos 60^\\circ = 0.02 \\times 0.5 = 0.01\\text{ Wb}\\)।"}, {"id": 53, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "তার, কুণ্ডলী ও টরয়েডের B", "question": "সোজা তার থেকে \\(a\\) দূরত্বে, বৃত্তাকার কুণ্ডলীর কেন্দ্রে এবং টরয়েডের কেন্দ্রে চৌম্বক ক্ষেত্র \\(B\\) কত?", "answer": "সোজা তার: \\(B = \\frac{\\mu_0 I}{2\\pi a}\\)<br>বৃত্তাকার কুণ্ডলীর কেন্দ্রে: \\(B = \\frac{\\mu_0 NI}{2r} = \\mu_0 n I\\) [\\(n\\) = একক দৈর্ঘ্যে পাক সংখ্যা]<br>টরয়েডের কেন্দ্রে: \\(B = \\frac{\\mu_0 NI}{2\\pi r} = \\mu_0 n I\\)", "context": "<b>প্রতীক:<\/b> \\(N\\) = মোট পাক সংখ্যা, \\(r\\) = ব্যাসার্ধ, \\(a\\) = তার থেকে লম্ব দূরত্ব।<br><b>সতর্কতা:<\/b> সোজা তারে \\(2\\pi a\\), কিন্তু বৃত্তাকার কুণ্ডলীর কেন্দ্রে \\(2r\\) (\\(\\pi\\) নেই)। টরয়েড ও দীর্ঘ সলিনয়েডের ভেতরে \\(B = \\mu_0 n I\\)।", "intuition": "সোজা তারের চারপাশে চৌম্বক ক্ষেত্র সমকেন্দ্রিক বৃত্তে ছড়িয়ে পড়ে বলে দূরত্ব বাড়লে \\(\\frac{1}{a}\\) হারে কমে; কিন্তু তারকে বৃত্তাকার কুণ্ডলী বা টরয়েডে পেঁচালে প্রতিটি পাকের ক্ষেত্র কেন্দ্রে একমুখী হয়ে যোগ হয়ে শক্তিশালী হয়।", "trap": "বৃত্তাকার কুণ্ডলীর কেন্দ্রে হরে \\(2r\\) থাকে (\\(\\pi\\) নেই), কিন্তু সোজা তার ও টরয়েডের সূত্রে হরে \\(2\\pi\\) থাকে—এই \\(\\pi\\) বসানো বা বাদ দেওয়ার ভুলেই ভর্তি পরীক্ষায় সবচেয়ে বেশি নম্বর কাটা যায়!", "quickExample": "\\(100\\) পাকের ও \\(10\\text{ cm}\\) ব্যাসার্ধের একটি বৃত্তাকার কুণ্ডলীতে \\(2\\text{ A}\\) প্রবাহ চললে কেন্দ্রে \\(B = \\frac{\\mu_0 NI}{2r} = \\frac{4\\pi \\times 10^{-7} \\times 100 \\times 2}{2 \\times 0.1} = 4\\pi \\times 10^{-4}\\text{ T} \\approx 1.26 \\times 10^{-3}\\text{ T}\\)।"}, {"id": 54, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "গতিশীল চার্জ ও অক্ষীয় B", "question": "গতিশীল চার্জের জন্য \\(B\\), বৃত্তাকার কুণ্ডলীর অক্ষে \\(x\\) দূরত্বে \\(B\\) এবং সসীম দৈর্ঘ্যের \\(AB\\) তারের জন্য \\(C\\) বিন্দুতে \\(B\\) কত?", "answer": "গতিশীল চার্জ: \\(B = \\frac{\\mu_0}{4\\pi}\\frac{ev\\sin\\theta}{r^2}\\)<br>কুণ্ডলীর অক্ষে: \\(B = \\frac{\\mu_0 NI a^2}{2(a^2+x^2)^{3/2}}\\)<br>সসীম তার: \\(B = \\frac{\\mu_0 I}{4\\pi a}(\\sin\\phi_1 + \\sin\\phi_2)\\)", "context": "<b>বিশেষ ক্ষেত্র:<\/b> কুণ্ডলীর কেন্দ্রে \\(x = 0\\) বসালে \\(B = \\frac{\\mu_0 NI}{2a}\\) পাওয়া যায়। অসীম তারের ক্ষেত্রে \\(\\phi_1 = \\phi_2 = 90^\\circ\\) বসালে \\(B = \\frac{\\mu_0 I}{2\\pi a}\\) হয়।", "intuition": "একটি গতিশীল চার্জ নিজেই ক্ষুদ্র তড়িৎ প্রবাহের মতো আচরণ করে চৌম্বক ক্ষেত্র সৃষ্টি করে; আর বৃত্তাকার কুণ্ডলীর অক্ষ বরাবর কেন্দ্র থেকে দূরে সরে গেলে কেবল অক্ষীয় উপাংশ টিকে থাকায় ক্ষেত্র দ্রুত কমতে থাকে।", "trap": "সসীম তারের সূত্রে \\(\\phi_1\\) ও \\(\\phi_2\\) হলো তার থেকে বিন্দুতে টানা লম্বের সাথে দুই প্রান্তের সংযোগ রেখার কোণ, আর এক প্রান্তের ঠিক বিপরীতে অবস্থিত অর্ধ-অসীম তারের জন্য \\(\\phi_1 = 90^\\circ\\) ও \\(\\phi_2 = 0^\\circ\\) হয়!", "quickExample": "\\(a\\) ব্যাসার্ধের বৃত্তাকার কুণ্ডলীর অক্ষে \\(x = \\sqrt{3}a\\) দূরত্বে চৌম্বক ক্ষেত্র ও কেন্দ্রের চৌম্বক ক্ষেত্রের অনুপাত: \\(\\frac{B_x}{B_0} = \\frac{a^3}{(a^2 + 3a^2)^{3/2}} = \\frac{a^3}{(4a^2)^{3/2}} = \\frac{1}{8}\\)।"}, {"id": 55, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "চৌম্বক বল ও লরেঞ্জ বল", "question": "গতিশীল চার্জ ও সোজা তারের ওপর চৌম্বক বল, লরেঞ্জ বল এবং বৃত্তাকার পথে ঘূর্ণায়মান ইলেকট্রনের ব্যাসার্ধ \\(r\\) এর সূত্র কী?", "answer": "চার্জের ওপর: \\(\\vec{F} = q\\vec{v}\\times\\vec{B} \\Rightarrow F = qvB\\sin\\theta\\) • ব্যাসার্ধ: \\(r = \\frac{mv}{qB}\\)<br>সোজা তারের ওপর: \\(\\vec{F} = I\\vec{l}\\times\\vec{B} \\Rightarrow F = IlB\\sin\\theta\\)<br>লরেঞ্জ বল: \\(\\vec{F} = q\\vec{E} + q\\vec{v}\\times\\vec{B}\\)", "context": "<b>ধারণা:<\/b> চার্জ স্থির থাকলে (\\(v=0\\)) বা \\(\\vec{B}\\)-এর সমান্তরালে চললে (\\(\\theta=0^\\circ, 180^\\circ\\)) চৌম্বক বল শূন্য হয়।<br>চৌম্বক বল সর্বদা বেগের লম্ব হওয়ায় এটি কোনো কাজ করে না (গতিশক্তি বদলায় না, শুধু দিক বদলায়)।", "intuition": "চৌম্বক ক্ষেত্র কেবল চলমান চার্জের ওপর গতির সাথে লম্ব দিকে বল প্রয়োগ করে, ফলে চার্জের দ্রুতি না বদলে শুধু দিক ঘুরে যায় এবং সুষম ক্ষেত্রে এটি বৃত্তাকার পথে ঘুরতে থাকে।", "trap": "চৌম্বক বল সর্বদা বেগের লম্ব হওয়ায় এর দ্বারা কৃতকাজ শূন্য (গতিশক্তি ও দ্রুতি অপরিবর্তিত থাকে)—তাই চৌম্বক ক্ষেত্রের প্রভাবে চার্জের গতিশক্তি কত বাড়বে জিজ্ঞেস করলে উত্তর হবে শূন্য!", "quickExample": "\\(2\\text{ m}\\) দীর্ঘ একটি তারে \\(5\\text{ A}\\) প্রবাহ চলছে এবং এটি \\(0.4\\text{ T}\\) চৌম্বক ক্ষেত্রের সাথে \\(30^\\circ\\) কোণে থাকলে ক্রিয়াশীল বল \\(F = IlB\\sin\\theta = 5 \\times 2 \\times 0.4 \\times \\sin 30^\\circ = 4 \\times 0.5 = 2\\text{ N}\\)।"}, {"id": 56, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "অ্যাম্পিয়ারের সূত্র ও সমান্তরাল তার", "question": "অ্যাম্পিয়ারের সূত্র এবং \\(a\\) দূরত্বে দুটি সমান্তরাল তড়িৎবাহী তারের একক দৈর্ঘ্যে বল কত? (আকর্ষণ/বিকর্ষণ শর্তসহ)", "answer": "অ্যাম্পিয়ারের সূত্র: \\(\\oint \\vec{B}\\cdot\\overrightarrow{dl} = \\mu_0 I\\)<br>একক দৈর্ঘ্যে বল: \\(\\frac{F}{l} = \\frac{\\mu_0 I_1 I_2}{2\\pi a}\\)<br>প্রবাহ একমুখী হলে আকর্ষণ এবং বিপরীতমুখী হলে বিকর্ষণ করে।", "context": "<b>মনে রাখো:<\/b> চার্জের ক্ষেত্রে সমধর্মী বিকর্ষণ করে, কিন্তু সমান্তরাল তারে <b>একই দিকে প্রবাহ আকর্ষণ<\/b> করে! এই সূত্র থেকেই \\(1\\text{ A}\\) এর আন্তর্জাতিক সংজ্ঞা দেওয়া হয়।", "intuition": "দুটি সমান্তরাল তারের একটির সৃষ্ট চৌম্বক ক্ষেত্র অন্য তারের তড়িৎ প্রবাহের ওপর বল প্রয়োগ করে; আর অ্যাম্পিয়ারের সূত্র প্রতিসম বদ্ধ পথ বরাবর মোট আবদ্ধ প্রবাহ থেকেই সরাসরি চৌম্বক ক্ষেত্র বের করতে সাহায্য করে।", "trap": "স্থির চার্জে সমধর্মী চার্জ পরস্পরকে বিকর্ষণ করলেও দুটি সমান্তরাল তারে একই দিকে প্রবাহ চললে তারা পরস্পরকে আকর্ষণ করে এবং বিপরীত দিকে প্রবাহ চললে বিকর্ষণ করে!", "quickExample": "\\(10\\text{ cm}\\) দূরত্বে দুটি সমান্তরাল তারে একই দিকে \\(5\\text{ A}\\) ও \\(10\\text{ A}\\) প্রবাহ চললে প্রতি মিটার দৈর্ঘ্যে আকর্ষণ বল \\(\\frac{F}{l} = \\frac{4\\pi \\times 10^{-7} \\times 5 \\times 10}{2\\pi \\times 0.1} = 2 \\times 10^{-7} \\times 500 = 10^{-4}\\text{ N m}^{-1}\\)।"}, {"id": 57, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "সমান্তরাল তারের লব্ধি B", "question": "\\(a\\) দূরত্বে দুটি সমান্তরাল তার (\\(I_1, I_2\\)) একই বা বিপরীত দিকে প্রবাহ বহন করলে ভেতরে ও বাইরে \\(p\\) বিন্দুতে লব্ধি \\(B\\) কত?", "answer": "• একমুখী প্রবাহ (ভেতরে): \\(B = \\frac{\\mu_0}{2\\pi}\\left(\\frac{I_1}{x} - \\frac{I_2}{a-x}\\right)\\)<br>• একমুখী প্রবাহ (বাইরে): \\(B = \\frac{\\mu_0}{2\\pi}\\left(\\frac{I_1}{a+x} + \\frac{I_2}{x}\\right)\\)<br>• বিপরীতমুখী (ভেতরে): \\(B = \\frac{\\mu_0}{2\\pi}\\left(\\frac{I_1}{x} + \\frac{I_2}{a-x}\\right)\\)<br>• বিপরীতমুখী (বাইরে): \\(B = \\frac{\\mu_0}{2\\pi}\\left(\\frac{I_1}{x} - \\frac{I_2}{a+x}\\right)\\)", "context": "<b>যুক্তি:<\/b> ডানহাত বৃদ্ধাঙ্গুলি নিয়ম (Right-hand thumb rule) দিয়ে দুটি তারের সৃষ্ট চৌম্বক ক্ষেত্রের দিক একই হলে যোগ এবং বিপরীত হলে বিয়োগ করতে হয়।", "intuition": "দুটি সমান্তরাল তারের জন্য যেকোনো বিন্দুতে লব্ধি চৌম্বক ক্ষেত্র নির্ণয়ে ডানহাত বৃদ্ধাঙ্গুলি নিয়ম দিয়ে প্রতিটি তারের ক্ষেত্রের দিক বের করতে হয়—দিক একই হলে যোগ আর বিপরীত হলে বিয়োগ হয়।", "trap": "একমুখী প্রবাহে নিরপেক্ষ বিন্দু (\\(B = 0\\)) থাকে তার দুটির মাঝখানে কম প্রবাহের তারের কাছে, কিন্তু বিপরীতমুখী প্রবাহে নিরপেক্ষ বিন্দু সর্বদা তার দুটির বাইরে কম প্রবাহের তারের পাশে অবস্থান করে!", "quickExample": "\\(12\\text{ cm}\\) দূরত্বে দুটি সমান্তরাল তারে একই দিকে \\(2\\text{ A}\\) ও \\(4\\text{ A}\\) প্রবাহ চললে প্রথম তার থেকে \\(x\\) দূরত্বে ভেতরে \\(B = 0\\) হতে হলে \\(\\frac{2}{x} = \\frac{4}{12 - x} \\Rightarrow 24 - 2x = 4x \\Rightarrow x = 4\\text{ cm}\\)।"}, {"id": 58, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "হল ক্রিয়া ও ট্যানজেন্ট সূত্র", "question": "হল বিভব পার্থক্য (\\(V_H\\)), হল বৈদ্যুতিক প্রাবল্য (\\(E_H\\)) এবং ট্যানজেন্ট সূত্র কী?", "answer": "হল বিভব: \\(V_H = Bvd = \\frac{BI}{ntq}\\) • হল প্রাবল্য: \\(E_H = \\frac{V_H}{d} = Bv\\)<br>ট্যানজেন্ট সূত্র: \\(I \\propto \\tan\\theta \\Rightarrow \\frac{I_1}{I_2} = \\frac{\\tan\\theta_1}{\\tan\\theta_2}\\)", "context": "<b>প্রতীক:<\/b> \\(d\\) = পাতের প্রস্থ, \\(t\\) = পাতের পুরুত্ব, \\(n\\) = একক আয়তনে চার্জ বাহকের সংখ্যা, \\(q\\) = বাহকের চার্জ।<br><b>ব্যবহার:<\/b> হল ক্রিয়ার সাহায্যে চার্জ বাহকের প্রকৃতি (p-type নাকি n-type) এবং ঘনত্ব নির্ণয় করা হয়।", "intuition": "চৌম্বক ক্ষেত্রের লম্ব দিকে তড়িৎবাহী পরিবাহী রাখলে চার্জ বাহকগুলো চৌম্বক বলের টানে এক প্রান্তে জমে আড়াআড়ি বিভব পার্থক্য (হল বিভব) তৈরি করে, যা বৈদ্যুতিক বলের সাথে সাম্যাবস্থায় পৌঁছায়।", "trap": "হল বিভবের সূত্র \\(V_H = \\frac{BI}{ntq}\\)-তে \\(t\\) হলো চৌম্বক ক্ষেত্রের সমান্তরাল পুরুত্ব (প্রস্থ \\(d\\) নয়)—অর্থাৎ স্থির প্রবাহের জন্য \\(V_H\\) পাতের প্রস্থ \\(d\\)-এর ওপর সরাসরি নির্ভর করে না!", "quickExample": "একটি পরিবাহীর প্রস্থ \\(d = 2\\text{ cm}\\), চার্জের তাড়নবেগ \\(v = 0.05\\text{ m s}^{-1}\\) এবং লম্ব চৌম্বক ক্ষেত্র \\(B = 0.8\\text{ T}\\) হলে হল বিভব \\(V_H = Bvd = 0.8 \\times 0.05 \\times 0.02 = 8 \\times 10^{-4}\\text{ V}\\)।"}, {"id": 59, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "লুপের টর্ক ও ভূ-চুম্বকত্ব", "question": "চৌম্বক ক্ষেত্রে লুপের ওপর ক্রিয়াশীল টর্ক \\(\\tau\\) এবং ভূ-চুম্বকত্বের উপাংশ (\\(H, V, B, \\delta\\)) সম্পর্কিত সূত্র কী?", "answer": "টর্ক: \\(\\vec{\\tau} = NI\\vec{A}\\times\\vec{B} = \\vec{m}\\times\\vec{B}\\), \\(\\tau = NIAB\\sin\\theta\\)<br>ভূ-চুম্বকত্ব: \\(H = B\\cos\\delta\\), \\(V = B\\sin\\delta\\), \\(B = \\sqrt{V^2 + H^2}\\) ও \\(\\tan\\delta = \\frac{V}{H}\\)", "context": "<b>প্রতীক:<\/b> \\(\\vec{m} = NI\\vec{A}\\) (চৌম্বক দ্বিমেরু ভ্রামক), \\(\\delta\\) = বিনতি কোণ (Dip angle), \\(H\\) = আনুভূমিক উপাংশ, \\(V\\) = উলম্ব উপাংশ।<br><b>তথ্য:<\/b> মেরুতে \\(\\delta = 90^\\circ\\) (\\(H=0\\)) এবং বিষুবরেখায় \\(\\delta = 0^\\circ\\) (\\(V=0\\))।", "intuition": "চৌম্বক ক্ষেত্রে রাখা তড়িৎবাহী লুপের বিপরীত বাহুতে সমান ও বিপরীত বল কাজ করে ঘূর্ণন টর্ক সৃষ্টি করে; আর ভূ-চৌম্বক ক্ষেত্র \\(B\\) আনুভূমিকের সাথে বিনতি কোণ \\(\\delta\\) তৈরি করে \\(H\\) ও \\(V\\) উপাংশে বিভক্ত থাকে।", "trap": "টর্কের সূত্র \\(\\tau = NIAB\\sin\\theta\\)-তে \\(\\theta\\) হলো \\(\\vec{B}\\) ও তলের অভিলম্বের কোণ—তাই কুণ্ডলীর তল \\(\\vec{B}\\)-এর সমান্তরাল হলে টর্ক শূন্য নয়, বরং সর্বোচ্চ (\\(NIAB\\)) হয়!", "quickExample": "কোনো স্থানে \\(H = 30\\text{ }\\mu\\text{T}\\) এবং \\(V = 30\\sqrt{3}\\text{ }\\mu\\text{T}\\) হলে বিনতি কোণ \\(\\tan\\delta = \\frac{V}{H} = \\sqrt{3} \\Rightarrow \\delta = 60^\\circ\\) এবং মোট ক্ষেত্র \\(B = \\sqrt{30^2 + (30\\sqrt{3})^2} = 60\\text{ }\\mu\\text{T}\\)।"}, {"id": 60, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "প্রকৃত ও আপাত বিনতি", "question": "চুম্বক শলাকাকে উলম্ব অক্ষে বা চৌম্বক মধ্যতলে \\(\\alpha\\) কোণে ঘুরালে আপাত বিনতি \\(\\delta'\\) ও প্রকৃত বিনতি \\(\\delta\\) এর সম্পর্ক কী?", "answer": "উলম্ব অক্ষে \\(\\alpha\\) কোণে ঘুরালে: \\(\\tan\\delta' = \\frac{\\tan\\delta}{\\sin\\alpha}\\)<br>চৌম্বক মধ্যতলে \\(\\alpha\\) কোণে ঘুরালে: \\(\\tan\\delta' = \\frac{\\tan\\delta}{\\cos\\alpha}\\)", "context": "<b>প্রতীক:<\/b> \\(\\delta\\) = প্রকৃত বিনতি, \\(\\delta'\\) = আপাত বিনতি।<br><b>মনে রাখো:<\/b> যেকোনো দুটি পরস্পর লম্ব তলে আপাত বিনতি \\(\\delta_1, \\delta_2\\) হলে \\(\\cot^2\\delta = \\cot^2\\delta_1 + \\cot^2\\delta_2\\)।", "intuition": "চুম্বক শলাকাকে চৌম্বক মধ্যতল থেকে সরিয়ে অন্য কোনো উলম্ব তলে নিলে উলম্ব উপাংশ \\(V\\) অপরিবর্তিত থাকে কিন্তু আনুভূমিক উপাংশের কেবল প্রক্ষেপণ (\\(H\\cos\\alpha\\)) কার্যকর হয়, ফলে আপাত বিনতি সর্বদা প্রকৃত বিনতির চেয়ে বড় দেখায়।", "trap": "চৌম্বক মধ্যতল থেকে \\(\\alpha\\) কোণে ঘোরালে \\(\\tan\\delta' = \\frac{\\tan\\delta}{\\cos\\alpha}\\) হয় (\\(\\cos\\alpha\\) দিয়ে ভাগ, গুণ নয়)—তাই \\(\\alpha = 90^\\circ\\) হলে আপাত বিনতি সর্বদা \\(90^\\circ\\) হয়!", "quickExample": "কোনো স্থানে প্রকৃত বিনতি \\(\\delta = 45^\\circ\\) হলে চৌম্বক মধ্যতল থেকে \\(\\alpha = 60^\\circ\\) কোণে আনত তলে আপাত বিনতি \\(\\tan\\delta' = \\frac{\\tan 45^\\circ}{\\cos 60^\\circ} = \\frac{1}{0.5} = 2 \\Rightarrow \\delta' = \\tan^{-1}(2) \\approx 63.4^\\circ\\)।"}, {"id": 61, "ch": 4, "chapter": "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", "topic": "চুম্বকত্বের রাশিমালা", "question": "কম্পন ম্যাগনেটোমিটারের দোলনকাল \\(T\\), মেরুশক্তি \\(M\\), চৌম্বক দৈর্ঘ্য, চুম্বকায়ন মাত্রা \\(I\\), চৌম্বক গ্রাহীতা \\(\\chi\\) ও \\(\\mu_r\\) এর সূত্র কী?", "answer": "\\(T = 2\\pi\\sqrt{\\frac{I}{MH}}\\) • \\(M = m\\times 2l\\) • চৌম্বক দৈর্ঘ্য \\(2l = 0.85L\\)<br>\\(I = \\frac{M}{V} = \\frac{m}{A}\\) • \\(\\chi = \\frac{I}{H}\\) • \\(\\mu_r = \\frac{\\mu}{\\mu_0} = \\frac{B}{B_0} = \\frac{F_0}{F} = \\frac{H_0}{H}\\)", "context": "<b>প্রতীক:<\/b> দোলনকালে \\(I\\) = জড়তার ভ্রামক, \\(M\\) = চৌম্বক ভ্রামক, \\(H\\) = ভূ-চৌম্বক ক্ষেত্রের আনুভূমিক উপাংশ।<br><b>তথ্য:<\/b> ডায়াচৌম্বকের \\(\\chi \\lt  0\\), প্যারাচৌম্বকের \\(\\chi\\) ক্ষুদ্র ধনাত্মক, ফেরোচৌম্বকের \\(\\chi \\gg 1\\)।", "intuition": "কম্পন ম্যাগনেটোমিটারের দোলনকাল দণ্ডচুম্বকের জড়তার ভ্রামক ও প্রত্যাবর্তী চৌম্বক টর্কের ভারসাম্যের ওপর নির্ভর করে; আর চৌম্বক গ্রাহীতা \\(\\chi\\) ও আপেক্ষিক প্রবেশ্যতা \\(\\mu_r\\) বলে দেয় কোনো পদার্থ বাহ্যিক চৌম্বক ক্ষেত্রকে কত সহজে গ্রহণ বা প্রতিহত করে।", "trap": "দণ্ডচুম্বকের চৌম্বক দৈর্ঘ্য সর্বদা জ্যামিতিক দৈর্ঘ্যের প্রায় \\(0.85\\) গুণ (\\(2l = 0.85L\\)) হয়, এবং চুম্বকটিকে দৈর্ঘ্যের সমান্তরালে লম্বালম্বি দুই ভাগ করলে মেরুশক্তি অর্ধেক হয় কিন্তু আড়াআড়ি কাটলে মেরুশক্তি অপরিবর্তিত থাকে!", "quickExample": "একটি দণ্ডচুম্বকের জ্যামিতিক দৈর্ঘ্য \\(20\\text{ cm}\\) এবং মেরুশক্তি \\(5\\text{ A m}\\) হলে চৌম্বক দৈর্ঘ্য \\(2l = 0.85 \\times 0.20 = 0.17\\text{ m}\\) এবং চৌম্বক ভ্রামক \\(M = m \\times 2l = 5 \\times 0.17 = 0.85\\text{ A m}^2\\)।"}, {"id": 62, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "ফ্যারাডে ও লেনজের সূত্র", "question": "চৌম্বক ফ্লাক্স \\(\\phi\\), ফ্যারাডের আবেশ সূত্র, লেনজের সূত্র এবং গতিশীল \\(\\text{emf}\\) এর সূত্র কী?", "answer": "\\(\\phi = \\vec{A}\\cdot\\vec{B} = AB\\cos\\theta\\)<br>ফ্যারাডে/লেনজ সূত্র: \\(\\varepsilon = -N\\frac{d\\phi}{dt}\\)<br>গতিশীল \\(\\text{emf}\\): \\(\\varepsilon = Blv\\sin\\theta\\)", "context": "<b>ধারণা:<\/b> ঋণাত্মক চিহ্নটি লেনজের সূত্র নির্দেশ করে—আবিষ্ট প্রবাহ সর্বদা তার সৃষ্টির কারণকে (ফ্লাক্স পরিবর্তনকে) বাধা দেয়; এটি <b>শক্তির সংরক্ষণ<\/b> নীতির প্রকাশ।<br>গতিশীল \\(\\text{emf}\\): \\(l\\) দৈর্ঘ্যের পরিবাহী \\(v\\) বেগে \\(B\\) ক্ষেত্রে চললে এটি সৃষ্টি হয়।", "intuition": "কোনো কুণ্ডলীর মধ্য দিয়ে অতিক্রান্ত চৌম্বক বলরেখার সংখ্যা (ফ্লাক্স) সময়ের সাথে পরিবর্তিত হলেই সেখানে তড়িচ্চালক বল সৃষ্টি হয়; পরিবর্তন যত দ্রুত হয়, আবিষ্ট \\(\\text{emf}\\) তত বেশি হয়। লেনজের সূত্রের ঋণাত্মক চিহ্নটি বোঝায় যে আবিষ্ট প্রবাহ সবসময় ফ্লাক্সের এই পরিবর্তনের বিরোধিতা করে শক্তির সংরক্ষণশীলতা বজায় রাখে।", "trap": "চৌম্বক ফ্লাক্স \\(\\phi = AB\\cos\\theta\\)-এ \\(\\theta\\) হলো তলের অভিলম্ব ও চৌম্বক ক্ষেত্রের মধ্যবর্তী কোণ—প্রশ্নে কুণ্ডলীর তলের সাথে কোণ \\(\\alpha\\) দেওয়া থাকলে \\(\\theta = 90^\\circ - \\alpha\\) বসিয়ে হিসাব করতে হয়।", "quickExample": "\\(50\\) পাকের একটি কুণ্ডলীতে \\(0.2\\text{ s}\\) সময়ে চৌম্বক ফ্লাক্স \\(0.08\\text{ Wb}\\) থেকে \\(0.02\\text{ Wb}\\)-এ নেমে এলে, আবিষ্ট \\(\\text{emf}\\): \\(\\varepsilon = -N\\frac{\\Delta\\phi}{\\Delta t} = -50 \\times \\frac{0.02 - 0.08}{0.2} = +15\\text{ V}\\)।"}, {"id": 63, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "স্বকীয় আবেশ", "question": "ঘূর্ণায়মান কুণ্ডলীতে আবিষ্ট তড়িচ্চালক বল \\(\\varepsilon\\), স্বকীয় আবেশের সূত্র এবং বৃত্তাকার কুণ্ডলী ও সলিনয়েডের স্বকীয় আবেশ গুণাঙ্ক \\(L\\) কত?", "answer": "\\(\\varepsilon = NAB\\omega\\sin\\omega t\\); স্বকীয় আবেশে \\(N\\phi = LI\\) ও \\(\\varepsilon = -L\\frac{dI}{dt}\\)<br>বৃত্তাকার কুণ্ডলী: \\(L = \\frac{\\pi\\mu_0 N^2 r}{2}\\) • সলিনয়েড: \\(L = \\frac{\\pi\\mu_0 N^2 r^2}{l}\\)", "context": "<b>প্রতীক:<\/b> \\(L\\) = স্বকীয় আবেশ গুণাঙ্ক (একক হেনরি, \\(\\text{H}\\)), \\(\\omega = 2\\pi f\\) (কৌণিক কম্পাঙ্ক)।<br><b>ধারণা:<\/b> \\(L\\) কুণ্ডলীর জ্যামিতি ও পাক সংখ্যার বর্গের (\\(N^2\\)) সমানুপাতিক; প্রবাহ \\(I\\)-এর ওপর নির্ভর করে না।", "intuition": "কোনো কুণ্ডলীতে প্রবাহের মান বদলালে এর নিজের ভেতরের চৌম্বক ফ্লাক্সও বদলে যায়, ফলে কুণ্ডলীটি নিজেই প্রবাহ পরিবর্তনের বিরুদ্ধে একটি \\(\\text{emf}\\) তৈরি করে—এটিই তড়িৎ বর্তনীর জড়তা বা স্বকীয় আবেশ। স্বকীয় আবেশ গুণাঙ্ক \\(L\\) কেবল কুণ্ডলীর জ্যামিতি, মাধ্যম ও পাকসংখ্যার বর্গের ওপর নির্ভর করে।", "trap": "শিক্ষার্থীরা প্রায়ই \\(L = \\frac{N\\phi}{I}\\) দেখে ভাবে \\(I\\) দ্বিগুণ করলে \\(L\\) অর্ধেক হবে—আসলে \\(L\\) প্রবাহ \\(I\\)-এর ওপর নির্ভরশীল নয়, বরং পাকসংখ্যা \\(N\\) দ্বিগুণ করলে \\(L\\) চারগুণ হয় (\\(L \\propto N^2\\))।", "quickExample": "\\(0.4\\text{ H}\\) স্বকীয় আবেশ গুণাঙ্কের একটি কুণ্ডলীতে \\(0.05\\text{ s}\\) সময়ে প্রবাহ \\(6\\text{ A}\\) থেকে \\(2\\text{ A}\\)-এ কমে এলে, আবিষ্ট \\(\\text{emf}\\): \\(\\varepsilon = -L\\frac{\\Delta I}{\\Delta t} = -0.4 \\times \\frac{2 - 6}{0.05} = +32\\text{ V}\\)।"}, {"id": 64, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "সঞ্চিত শক্তি ও পারস্পরিক আবেশ", "question": "চৌম্বক আবেশকে সঞ্চিত শক্তি \\(W\\) এবং পারস্পরিক আবেশের সূত্রগুলো কী?", "answer": "সঞ্চিত শক্তি: \\(W = \\frac{1}{2}LI^2\\)<br>পারস্পরিক আবেশ: \\(N\\phi = MI\\) এবং গৌণ কুণ্ডলীতে \\(\\varepsilon = -M\\frac{dI}{dt}\\)", "context": "<b>প্রতীক:<\/b> \\(M\\) = পারস্পরিক আবেশ গুণাঙ্ক (একক হেনরি, \\(\\text{H}\\))।<br><b>তুলনা:<\/b> আবেশকের শক্তি \\(\\frac{1}{2}LI^2\\) অনেকটা গতিশক্তি \\(\\frac{1}{2}mv^2\\) বা ধারকের শক্তি \\(\\frac{1}{2}CV^2\\)-এর মতো।", "intuition": "একটি আবেশকের ভেতর দিয়ে প্রবাহ তৈরি করতে গিয়ে বিপরীত তড়িচ্চালক বলের বিরুদ্ধে যে কাজ করা হয়, তা চৌম্বক ক্ষেত্রের রূপে \\(W = \\frac{1}{2}LI^2\\) শক্তি হিসেবে সঞ্চিত থাকে। আর পাশাপাশি রাখা দুটি কুণ্ডলীর একটিতে প্রবাহ বদলালে তার পরিবর্তনশীল ফ্লাক্স দ্বিতীয় কুণ্ডলীতে তড়িচ্চালক বল আবেশিত করে—এটিই পারস্পরিক আবেশ।", "trap": "পারস্পরিক আবেশে \\(\\varepsilon_s = -M\\frac{dI_p}{dt}\\) সূত্রে প্রবাহের পরিবর্তন মুখ্য কুণ্ডলীর (\\(I_p\\)), কিন্তু তড়িচ্চালক বল আবিষ্ট হয় গৌণ কুণ্ডলীতে (\\(\\varepsilon_s\\))—তাই প্রবাহ স্থির (\\(\\text{DC}\\)) হলে \\(\\frac{dI_p}{dt} = 0\\) হওয়ায় \\(\\varepsilon_s = 0\\) হয়।", "quickExample": "\\(0.5\\text{ H}\\) আবেশকের মধ্য দিয়ে \\(4\\text{ A}\\) প্রবাহ চললে সঞ্চিত চৌম্বক শক্তি \\(W = \\frac{1}{2}LI^2 = \\frac{1}{2} \\times 0.5 \\times 4^2 = 4\\text{ J}\\)।"}, {"id": 65, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "পরিবর্তী প্রবাহ ও ক্ষমতা", "question": "পরিবর্তী তড়িচ্চালক শক্তি \\(\\varepsilon\\), প্রবাহমাত্রা \\(I\\) এবং কার্যকর ক্ষমতা \\(P\\) এর সমীকরণ কী?", "answer": "\\(\\varepsilon = \\varepsilon_0\\sin\\omega t = \\varepsilon_0\\sin 2\\pi ft = \\varepsilon_0\\sin\\left(\\frac{2\\pi}{T}\\right)t\\)<br>\\(I = I_0\\sin\\omega t = I_0\\sin 2\\pi ft = I_0\\sin\\left(\\frac{2\\pi}{T}\\right)t\\)<br>\\(P = \\frac{\\varepsilon^2}{R} = I_{\\text{rms}}^2 R\\)", "context": "<b>প্রতীক:<\/b> \\(\\varepsilon_0, I_0\\) = শীর্ষ মান (Peak value), \\(f\\) = কম্পাঙ্ক (বাংলাদেশে \\(50\\text{ Hz}\\)), \\(T = \\frac{1}{f}\\) = পর্যায়কাল।<br><b>তথ্য:<\/b> \\(50\\text{ Hz}\\) AC প্রতি সেকেন্ডে \\(100\\) বার দিক পরিবর্তন করে।", "intuition": "পরিবর্তী প্রবাহ ও ভোল্টেজ সাইন তরঙ্গের মতো নির্দিষ্ট সময় পরপর মান ও দিক বদলায়, যেখানে কৌণিক কম্পাঙ্ক \\(\\omega = 2\\pi f\\) এর দোলনের দ্রুততা নির্ধারণ করে। প্রবাহের দিক বারবার উল্টে গেলেও রোধের ভেতর উৎপন্ন তাপশক্তি সবসময় ধনাত্মক থাকে, তাই গড় কার্যকর ক্ষমতা \\(I_{\\text{rms}}^2 R\\) দিয়ে হিসাব করা হয়।", "trap": "\\(I = I_0\\sin(\\omega t)\\) সমীকরণ থেকে কম্পাঙ্ক \\(f\\) বের করার সময় অনেকেই \\(\\omega\\)-কেই \\(f\\) ধরে নেয়—মনে রাখতে হবে \\(\\omega = 2\\pi f\\), তাই \\(f = \\frac{\\omega}{2\\pi}\\) এবং প্রতি সেকেন্ডে দিক পরিবর্তনের সংখ্যা \\(2f\\)।", "quickExample": "একটি পরিবর্তী প্রবাহের সমীকরণ \\(I = 10\\sin(100\\pi t)\\text{ A}\\) হলে, \\(\\omega = 2\\pi f = 100\\pi \\implies f = 50\\text{ Hz}\\) এবং পর্যায়কাল \\(T = \\frac{1}{50} = 0.02\\text{ s}\\)।"}, {"id": 66, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "AC গড় ও RMS মান", "question": "পূর্ণ ও অর্ধচক্রের জন্য গড় তড়িচ্চালক বল/প্রবাহ এবং \\(\\text{rms}\\) মানসমূহ কী?", "answer": "• পূর্ণ চক্রের গড় তড়িচ্চালক বল \\(= 0\\text{ V}\\)<br>• অর্ধচক্রের গড়: \\(\\varepsilon_{\\text{av}} = \\frac{2}{\\pi}\\varepsilon_0 = 0.637\\varepsilon_0\\), \\(I_{\\text{av}} = \\frac{2}{\\pi}I_0 = 0.637I_0\\)<br>• \\(\\text{rms}\\) মান: \\(\\varepsilon_{\\text{rms}} = \\frac{\\varepsilon_0}{\\sqrt{2}} = 0.707\\varepsilon_0\\), \\(I_{\\text{rms}} = \\frac{I_0}{\\sqrt{2}} = 0.707I_0\\)", "context": "<b>মনে রাখো:<\/b> বাসার \\(220\\text{ V}\\) AC লাইনের \\(220\\text{ V}\\) হলো <b>\\(\\text{rms}\\) মান<\/b> (শীর্ষ মান \\(\\varepsilon_0 = 220\\sqrt{2} \\approx 311\\text{ V}\\))। অ্যামিটার/ভোল্টমিটার সর্বদা \\(\\text{rms}\\) মান পরিমাপ করে।", "intuition": "পূর্ণ চক্রে পরিবর্তী প্রবাহের ধনাত্মক ও ঋণাত্মক অর্ধচক্র পরস্পরকে নাকচ করে দেওয়ায় পূর্ণ চক্রের গড় শূন্য হয়, তাই গড় মান কেবল অর্ধচক্রের জন্য ধরা হয়। অন্যদিকে \\(\\text{rms}\\) মান হলো সেই সমতুল্য স্থির \\(\\text{DC}\\) মান, যা একই রোধে সমান সময়ে সমপরিমাণ তাপশক্তি উৎপন্ন করে।", "trap": "বাসাবাড়ির লাইনে লেখা \\(220\\text{ V}\\) বা \\(\\text{AC}\\) অ্যামিটার/ভোল্টমিটারের পাঠ হলো \\(\\text{rms}\\) মান, শীর্ষ মান নয়—তাই শীর্ষ মান বের করতে \\(\\sqrt{2}\\) দিয়ে গুণ করতে হয়, ভাগ নয়; আর পূর্ণ চক্রের গড় মান চাইলে উত্তর সবসময় \\(0\\) হবে।", "quickExample": "বাংলাদেশের বাসাবাড়ির \\(\\text{AC}\\) লাইনের \\(\\varepsilon_{\\text{rms}} = 220\\text{ V}\\) হলে, শীর্ষ মান \\(\\varepsilon_0 = \\sqrt{2}\\,\\varepsilon_{\\text{rms}} = 1.414 \\times 220 \\approx 311.1\\text{ V}\\) এবং অর্ধচক্রের গড় মান \\(\\varepsilon_{\\text{av}} = 0.637 \\times 311.1 \\approx 198.2\\text{ V}\\)।"}, {"id": 67, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "আকার ও শীর্ষক গুণাঙ্ক", "question": "পরিবর্তী প্রবাহের আকার গুণাঙ্ক (Form Factor) এবং শীর্ষক গুণাঙ্ক (Peak Factor) এর সূত্র ও মান কত?", "answer": "Form Factor \\(= \\frac{I_{\\text{rms}}}{I_{\\text{av}}} = \\frac{\\pi}{2\\sqrt{2}} = 1.11\\)<br>Peak Factor \\(= \\frac{I_0}{I_{\\text{rms}}} = \\sqrt{2} = 1.41\\)", "context": "<b>ধারণা:<\/b> সাইন তরঙ্গের (Sinusoidal AC) জন্য এই দুটি ধ্রুবক মান (\\(1.11\\) এবং \\(1.414\\)) সর্বদা নির্দিষ্ট এবং এককবিহীন।", "intuition": "আকার গুণাঙ্ক (Form Factor) হলো \\(\\text{rms}\\) মান ও অর্ধচক্রের গড় মানের অনুপাত, যা তরঙ্গটির আকৃতি নির্দেশ করে। আর শীর্ষক গুণাঙ্ক (Peak Factor) হলো শীর্ষ মান ও \\(\\text{rms}\\) মানের অনুপাত, যা জানায় তরঙ্গের চূড়া তার কার্যকর মানের চেয়ে কত গুণ বেশি উঁচু।", "trap": "পরীক্ষায় শিক্ষার্থীরা প্রায়ই Form Factor (\\(1.11\\)) আর Peak Factor (\\(1.414\\))-এর মান ও অনুপাত গুলিয়ে ফেলে—মনে রাখো, \\(\\text{Form Factor} = \\frac{I_{\\text{rms}}}{I_{\\text{av}}} = 1.11\\) এবং \\(\\text{Peak Factor} = \\frac{I_0}{I_{\\text{rms}}} = \\sqrt{2} \\approx 1.414\\)।", "quickExample": "কোনো সাইনুসয়ডাল \\(\\text{AC}\\)-এর অর্ধচক্রের গড় মান \\(I_{\\text{av}} = 10\\text{ A}\\) হলে, Form Factor ব্যবহার করে \\(I_{\\text{rms}} = 1.11 \\times 10 = 11.1\\text{ A}\\) এবং শীর্ষ মান \\(I_0 = 1.414 \\times 11.1 \\approx 15.7\\text{ A}\\)।"}, {"id": 68, "ch": 5, "chapter": "অধ্যায় ৫: তড়িৎচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "topic": "ট্রান্সফরমার", "question": "ট্রান্সফরমারের সমীকরণ, রূপান্তর গুণক (\\(K\\)), ক্ষমতা এবং স্টেপ আপ ও স্টেপ ডাউন ট্রান্সফরমারের শর্ত কী?", "answer": "সমীকরণ: \\(\\frac{E_p}{E_s} = \\frac{I_s}{I_p} = \\frac{n_p}{n_s} = \\sqrt{\\frac{R_p}{R_s}}\\); \\(K = \\frac{E_s}{E_p}\\); \\(P = E_pI_p = E_sI_s\\)<br>স্টেপ আপ: \\(E_p \\lt  E_s\\) ও \\(n_p \\lt  n_s\\) • স্টেপ ডাউন: \\(E_p \\gt  E_s\\) ও \\(n_p \\gt  n_s\\)", "context": "<b>প্রতীক:<\/b> \\(p\\) = মুখ্য কুণ্ডলী (Primary), \\(s\\) = গৌণ কুণ্ডলী (Secondary)।<br><b>ধারণা:<\/b> ট্রান্সফরমার পারস্পরিক আবেশের নীতিতে <b>শুধু AC-তে<\/b> কাজ করে (DC-তে নয়)। স্টেপ আপ ভোল্টেজ বাড়ায় ও কারেন্ট কমায়, কিন্তু ক্ষমতা ও কম্পাঙ্ক অপরিবর্তিত থাকে।", "intuition": "ট্রান্সফরমার পারস্পরিক আবেশের মাধ্যমে \\(\\text{AC}\\) ভোল্টেজকে ইচ্ছামতো বাড়ায় বা কমায়, যাতে দূরপাল্লার তড়িৎ সঞ্চালনে তাপজনিত ক্ষয় কমানো যায়। আদর্শ ট্রান্সফরমারে শক্তি সংরক্ষিত থাকে (\\(E_p I_p = E_s I_s\\)), তাই ভোল্টেজ যত গুণ বাড়ে, প্রবাহ ঠিক তত গুণ কমে যায়।", "trap": "ট্রান্সফরমারে ভোল্টেজ ও পাকসংখ্যার অনুপাত সমানুপাতিক (\\(\\frac{E_p}{E_s} = \\frac{n_p}{n_s}\\)) হলেও প্রবাহের অনুপাত ঠিক উল্টো (\\(\\frac{I_s}{I_p}\\))—এছাড়া ট্রান্সফরমার কখনো \\(\\text{DC}\\)-তে কাজ করে না এবং \\(\\text{AC}\\)-এর কম্পাঙ্ক পরিবর্তন করে না।", "quickExample": "একটি স্টেপ-আপ ট্রান্সফরমারের \\(n_p = 200\\), \\(n_s = 1000\\), \\(E_p = 220\\text{ V}\\) ও \\(I_p = 5\\text{ A}\\) হলে, \\(E_s = E_p \\frac{n_s}{n_p} = 220 \\times \\frac{1000}{200} = 1100\\text{ V}\\) এবং \\(I_s = I_p \\frac{n_p}{n_s} = 5 \\times \\frac{200}{1000} = 1\\text{ A}\\)।"}, {"id": 69, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "স্নেলের সূত্র ও প্রতিসরাঙ্ক", "question": "স্নেলের সূত্র এবং আপেক্ষিক প্রতিসরাঙ্ক \\({}_a\\mu_b\\) ও \\({}_b\\mu_c\\) এর সম্পর্কগুলো কী?", "answer": "\\(\\mu = \\frac{\\sin i}{\\sin r}\\) এবং \\(\\mu_1\\sin\\theta_1 = \\mu_2\\sin\\theta_2\\)<br>\\({}_a\\mu_b = \\frac{1}{{}_b\\mu_a} = \\frac{\\mu_b}{\\mu_a} = \\frac{c_a}{c_b} = \\frac{\\lambda_a}{\\lambda_b} = \\frac{1}{\\sin\\theta_c}\\)<br>\\({}_b\\mu_c = \\frac{{}_a\\mu_c}{{}_a\\mu_b}\\) এবং \\({}_a\\mu_b \\times {}_b\\mu_c \\times {}_c\\mu_a = 1\\)", "context": "<b>প্রতীক:<\/b> \\({}_a\\mu_b\\) = \\(a\\) মাধ্যমের সাপেক্ষে \\(b\\) মাধ্যমের প্রতিসরাঙ্ক।<br><b>মূল তথ্য:<\/b> প্রতিসরণের সময় আলোর বেগ (\\(c\\)) ও তরঙ্গদৈর্ঘ্য (\\(\\lambda\\)) পরিবর্তিত হয়, কিন্তু <b>কম্পাঙ্ক (\\(f\\)) অপরিবর্তিত<\/b> থাকে।", "intuition": "আলো এক মাধ্যম থেকে অন্য মাধ্যমে প্রবেশ করলে এর বেগ ও তরঙ্গদৈর্ঘ্য বদলে যাওয়ায় গতিপথ বেঁকে যায়, আর সেই বেঁকে যাওয়ার পরিমাপই প্রতিসরাঙ্ক। মাধ্যম যত ঘন হয়, আলোর বেগ তত কমে এবং প্রতিসরাঙ্ক তত বাড়ে।", "trap": "প্রতিসরণের সময় আলোর বেগ ও তরঙ্গদৈর্ঘ্য বদলালেও কম্পাঙ্ক অপরিবর্তিত থাকে—ভর্তি পরীক্ষায় অনেকেই ভুল করে কম্পাঙ্ক পরিবর্তিত হয় অথবা \\({}_a\\mu_b = \\frac{\\mu_a}{\\mu_b}\\) লিখে ফেলেন।", "quickExample": "বায়ুর সাপেক্ষে কাচ ও পানির প্রতিসরাঙ্ক যথাক্রমে \\({}_a\\mu_g = 1.5\\) ও \\({}_a\\mu_w = 1.33\\) হলে, পানির সাপেক্ষে কাচের প্রতিসরাঙ্ক \\({}_w\\mu_g = \\frac{{}_a\\mu_g}{{}_a\\mu_w} = \\frac{1.5}{1.33} \\approx 1.13\\)।"}, {"id": 70, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "ক্রান্তি কোণ (SVSL)", "question": "দুটি মাধ্যমের মধ্যে ক্রান্তি কোণ \\(\\theta_c\\) নির্ণয়ের সূত্র কী?", "answer": "\\(\\theta_c = \\sin^{-1}\\left(\\frac{1}{{}_2\\mu_1}\\right) = \\sin^{-1}\\left(\\frac{\\mu_2}{\\mu_1}\\right) = \\sin^{-1}\\left(\\frac{\\text{হালকা মাধ্যমের প্রতিসরাঙ্ক}}{\\text{ঘন মাধ্যমের প্রতিসরাঙ্ক}}\\right)\\)", "context": "<b>শর্ত:<\/b> পূর্ণ অভ্যন্তরীণ প্রতিফলন ও ক্রান্তি কোণের জন্য আলোকে অবশ্যই <b>ঘন থেকে হালকা মাধ্যমে<\/b> যেতে হবে এবং আপতন কোণ \\(i \\gt  \\theta_c\\) হতে হবে।<br><b>উদাহরণ:<\/b> হীরক (\\(\\mu=2.4\\)) ও পানির (\\(\\mu=1.33\\)) ক্ষেত্রে \\(\\theta_c = \\sin^{-1}(1.33/2.4) \\approx 33.65^\\circ\\)।", "intuition": "ঘন মাধ্যম থেকে হালকা মাধ্যমে আলো যাওয়ার সময় আপতন কোণ বাড়াতে থাকলে একপর্যায়ে প্রতিসরিত রশ্মি বিভেদতল ঘেঁষে চলে যায়—এই বিশেষ আপতন কোণই ক্রান্তি কোণ। এর চেয়ে বড় কোণে আলো পড়লে প্রতিসরণ না ঘটে সম্পূর্ণ আলো ঘন মাধ্যমেই ফিরে আসে।", "trap": "ক্রান্তি কোণ ও পূর্ণ অভ্যন্তরীণ প্রতিফলন কেবল ঘন থেকে হালকা মাধ্যমেই সম্ভব, আর সূত্রে ভগ্নাংশটি সবসময় \\(\\frac{\\mu_2}{\\mu_1} \\lt  1\\) (হালকা/ঘন) হবে—উল্টো বসালে \\(\\sin\\theta_c \\gt  1\\) হয়ে অসঙ্গত মান আসে।", "quickExample": "কাচ (\\(\\mu_1 = 1.5\\)) থেকে বায়ুতে (\\(\\mu_2 = 1\\)) আলোর ক্রান্তি কোণ \\(\\theta_c = \\sin^{-1}\\left(\\frac{1}{1.5}\\right) = \\sin^{-1}(0.667) \\approx 41.8^\\circ\\)।"}, {"id": 71, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "আপাত গভীরতা ও পার্শ্ব সরণ", "question": "তরলের প্রতিসরাঙ্ক, আপাত গভীরতা, আপাত সরণ এবং কাচ ফলকের পার্শ্ব সরণ \\(x\\) নির্ণয়ের সূত্র কী?", "answer": "\\(\\mu = \\frac{\\text{প্রকৃত গভীরতা}}{\\text{আপাত গভীরতা}} = \\frac{\\tan\\theta_r}{\\tan\\theta_a}\\) • আপাত গভীরতা \\(= \\frac{\\text{প্রকৃত গভীরতা}}{\\mu}\\)<br>আপাত সরণ \\(= \\text{প্রকৃত গভীরতা} - \\text{আপাত গভীরতা}\\) • পার্শ্ব সরণ: \\(x = \\frac{d\\sin(i - r)}{\\cos r}\\)", "context": "<b>প্রতীক:<\/b> \\(d\\) = কাচ ফলকের পুরুত্ব, \\(i\\) = আপতন কোণ, \\(r\\) = প্রতিসরণ কোণ।<br><b>ধারণা:<\/b> লম্বভাবে (হালকা মাধ্যম থেকে ঘন মাধ্যমে) দেখলে তলদেশ ওপরে উঠে এসেছে বলে মনে হয়; আপাত সরণ \\(= d\\left(1 - \\frac{1}{\\mu}\\right)\\)।", "intuition": "ঘন মাধ্যমের ভেতরের কোনো বস্তু থেকে আলো হালকা মাধ্যমে বের হওয়ার সময় অভিলম্ব থেকে দূরে সরে যায়, ফলে চোখ বস্তুটিকে প্রকৃত অবস্থানের চেয়ে ওপরে দেখতে পায়। সমান্তরাল কাচ ফলকে আলো দুবার বিপরীত দিকে বেঁকে যাওয়ায় নির্গত রশ্মি মূল পথের সমান্তরাল কিন্তু পাশে সরে যায়।", "trap": "প্রশ্নে 'আপাত গভীরতা' (\\(\\frac{d}{\\mu}\\)) নাকি 'আপাত সরণ বা কতটুকু ওপরে উঠেছে' (\\(d - \\frac{d}{\\mu}\\)) চাওয়া হয়েছে তা খেয়াল না করলে ঠিক বিপরীত উত্তর দাগিয়ে ফেলার ঝুঁকি থাকে।", "quickExample": "পানির (\\(\\mu = \\frac{4}{3}\\)) প্রকৃত গভীরতা \\(12\\text{ cm}\\) হলে আপাত গভীরতা \\(= \\frac{12}{4/3} = 9\\text{ cm}\\) এবং আপাত সরণ \\(= 12 - 9 = 3\\text{ cm}\\)।"}, {"id": 72, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "গোলীয় তলে প্রতিসরণ", "question": "গোলীয় তলে প্রতিসরণের সাধারণ, উত্তল ও অবতল প্রতিসারকের সূত্র এবং চিহ্নের প্রথা কী?", "answer": "সাধারণ: \\(\\frac{\\mu_1}{u} + \\frac{\\mu_2}{v} = \\frac{\\mu_2 - \\mu_1}{r}\\)<br>উত্তল (\\(r\\) ধনাত্মক): \\(\\frac{\\mu}{v} + \\frac{1}{u} = \\frac{\\mu - 1}{r}\\) • অবতল (\\(r\\) ঋণাত্মক): \\(\\frac{\\mu}{u} + \\frac{1}{v} = \\frac{1 - \\mu}{r}\\)", "context": "<b>প্রতীক:<\/b> \\(\\mu_1\\) = যে মাধ্যম থেকে আলো আসছে; \\(\\mu_2\\) = যে মাধ্যমে আলো যাচ্ছে; \\(r\\) = বক্রতার ব্যাসার্ধ।<br><b>চিহ্ন প্রথা (PDF অনুযায়ী):<\/b> আলো প্রথমে অবতল পৃষ্ঠে আঘাত করলে \\(r\\) (+ve) এবং উত্তল পৃষ্ঠে আঘাত করলে \\(r\\) (-ve)।", "intuition": "সমতল বিভেদতলের বদলে গোলীয় বক্রতলে আলো পড়লে প্রতিটি বিন্দুতে অভিলম্বের দিক বদলে যায়, ফলে আলোকরশ্মি অভিসারী বা অপসারী হয়ে প্রতিবিম্ব তৈরি করে। এই সূত্রটিই পরবর্তী লেন্স প্রস্তুতকারকের সূত্রের মূল ভিত্তি।", "trap": "গোলীয় তলের সূত্রে \\(\\mu_1\\) হলো যে মাধ্যম থেকে আলো আসছে এবং \\(\\mu_2\\) হলো যে মাধ্যমে প্রবেশ করছে—এই ক্রম উল্টে দিলে বা উত্তল ও অবতল তলের জন্য \\(r\\)-এর চিহ্ন ভুল বসালে উত্তর ভুল হয়ে যায়।", "quickExample": "বায়ু (\\(\\mu_1 = 1\\)) থেকে কাচের (\\(\\mu_2 = 1.5\\)) উত্তল গোলীয় তলে (\\(r = +10\\text{ cm}\\)) অসীম (\\(u = \\infty\\)) থেকে আলো পড়লে \\(\\frac{1}{\\infty} + \\frac{1.5}{v} = \\frac{1.5 - 1}{10} \\Rightarrow \\frac{1.5}{v} = 0.05 \\Rightarrow v = 30\\text{ cm}\\)।"}, {"id": 73, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "লেন্স প্রস্তুতকারক সূত্র ও SVSL", "question": "লেন্স প্রস্তুতকারকের সূত্র কী এবং কাচের লেন্সকে (\\(\\mu = \\frac{3}{2}\\)) পানিতে (\\(\\mu = \\frac{4}{3}\\)) ডুবালে ফোকাস দূরত্ব কত হয়?", "answer": "\\(\\frac{1}{u} + \\frac{1}{v} = (\\mu - 1)\\left(\\frac{1}{r_1} - \\frac{1}{r_2}\\right) = \\left(\\frac{\\mu_{\\text{lens}}}{\\mu_{\\text{surroundings}}} - 1\\right)\\left(\\frac{1}{r_1} - \\frac{1}{r_2}\\right)\\)<br>SVSL: পানিতে ফোকাস দূরত্ব \\(= 4\\times\\) বাতাসে ফোকাস দূরত্ব (\\(f_w = 4f_a\\))", "context": "<b>প্রয়োগ:<\/b> লেন্সের চেয়ে বেশি প্রতিসরাঙ্কের মাধ্যমে ডুবালে লেন্সের প্রকৃতি বদলে যায় (উত্তল অবতলের মতো আচরণ করে)।<br><b>উদাহরণ:<\/b> বাতাসে \\(f_a = 25\\text{ cm}\\) হলে পানিতে \\(f_w = 4\\times 25 = 100\\text{ cm}\\)।", "intuition": "একটি লেন্স আলোকে কতটা বাঁকাবে তা নির্ভর করে লেন্স ও চারপাশের মাধ্যমের প্রতিসরাঙ্কের অনুপাত এবং লেন্সের দুই পৃষ্ঠের বক্রতার ওপর। চারপাশের মাধ্যমের প্রতিসরাঙ্ক লেন্সের কাছাকাছি হলে আলো কম বাঁকে এবং ফোকাস দূরত্ব অনেক বেড়ে যায়।", "trap": "কাচের লেন্সকে (\\(\\mu = 1.5\\)) পানিতে (\\(\\mu = 1.33\\)) ডুবালে ফোকাস দূরত্ব \\(4\\) গুণ হয়, কিন্তু চারপাশের মাধ্যমের প্রতিসরাঙ্ক লেন্সের চেয়ে বেশি হলে উত্তল লেন্স অবতলের মতো আচরণ করে—অনেকেই এই প্রকৃতি পরিবর্তনের বিষয়টি ভুলে যান।", "quickExample": "বায়ুতে একটি কাচের (\\(\\mu = 1.5\\)) উত্তল লেন্সের ফোকাস দূরত্ব \\(f_a = 15\\text{ cm}\\) হলে, পানিতে (\\(\\mu = \\frac{4}{3}\\)) ডুবালে এর ফোকাস দূরত্ব \\(f_w = 4 f_a = 4 \\times 15 = 60\\text{ cm}\\)।"}, {"id": 74, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "প্রিজমে প্রতিসরণ", "question": "প্রিজমের প্রতিসরাঙ্ক \\(\\mu\\), প্রিজম কোণ \\(A\\), বিচ্যুতি \\(\\delta\\), ন্যূনতম বিচ্যুতির শর্ত এবং সরু প্রিজমের বিচ্যুতি \\(\\delta_m\\) কী?", "answer": "\\(\\mu = \\frac{\\sin i}{\\sin r} = \\frac{\\sin\\left(\\frac{A+\\delta_m}{2}\\right)}{\\sin\\left(\\frac{A}{2}\\right)}\\) • \\(A = r_1 + r_2\\) • \\(\\delta = i_1 + i_2 - A\\)<br>ন্যূনতম বিচ্যুতি: \\(i_1 = i_2\\) ও \\(r_1 = r_2 = \\frac{A}{2}\\) • সরু প্রিজম (\\(A \\lt  6^\\circ\\)): \\(\\delta_m = (\\mu - 1)A\\)", "context": "<b>প্রতীক:<\/b> \\(i_1, i_2\\) = আপতন ও নির্গমন কোণ; \\(r_1, r_2\\) = ভেতরের দুটি প্রতিসরণ কোণ; \\(\\delta_m\\) = ন্যূনতম বিচ্যুতি কোণ।<br><b>তথ্য:<\/b> বেগুনি আলোর \\(\\mu\\) বেশি বলে বিচ্যুতি সর্বাধিক, লাল আলোর বিচ্যুতি সর্বনিম্ন।", "intuition": "প্রিজমের দুটি তির্যক তলে আলো পরপর দুবার ভূমির দিকে বেঁকে যাওয়ায় মোট বিচ্যুতি ঘটে। প্রতিসাম্য অবস্থায় (\\(i_1 = i_2\\)) আলোকরশ্মি প্রিজমের ভূমির সমান্তরাল হয়ে চলে এবং বিচ্যুতি সর্বনিম্ন হয়।", "trap": "সরু প্রিজমের সূত্র \\(\\delta_m = (\\mu - 1)A\\) কেবল খুব ছোট প্রিজম কোণের (\\(A \\lt  6^\\circ\\)) জন্য প্রযোজ্য—\\(60^\\circ\\) সমবাহু প্রিজমে এটি বসালে বড় ভুল হয়।", "quickExample": "একটি \\(60^\\circ\\) প্রিজম কোণের প্রিজমের ন্যূনতম বিচ্যুতি \\(\\delta_m = 30^\\circ\\) হলে প্রতিসরাঙ্ক \\(\\mu = \\frac{\\sin\\left(\\frac{60^\\circ + 30^\\circ}{2}\\right)}{\\sin\\left(\\frac{60^\\circ}{2}\\right)} = \\frac{\\sin 45^\\circ}{\\sin 30^\\circ} = \\sqrt{2} \\approx 1.414\\)।"}, {"id": 75, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "লেন্সের সমীকরণ ও চিহ্ন", "question": "লেন্সের ফোকাস দূরত্ব \\(f\\), সাধারণ সমীকরণ, ক্ষমতা \\(P\\), বিবর্ধন \\(m\\) এবং \\(v, m\\) এর চিহ্ন সংক্রান্ত নিয়ম কী?", "answer": "\\(f = \\frac{r}{2} = \\frac{1}{P}\\) • \\(\\frac{1}{v} + \\frac{1}{u} = \\frac{1}{f} = \\frac{2}{r} = P\\) • \\(m = \\frac{l'}{l} = -\\frac{v}{u}\\)<br>• \\(v = +\\text{ve}\\) বাস্তব, \\(v = -\\text{ve}\\) অবাস্তব • \\(m = +\\text{ve}\\) সোজা, \\(m = -\\text{ve}\\) উল্টো<br>• \\(|m|\\gt 1\\) বিবর্ধিত, \\(|m|\\lt 1\\) খর্বিত, \\(|m|=1\\) সমান।", "context": "<b>একক ও চিহ্ন:<\/b> \\(P\\)-এর একক ডায়প্টার (\\(\\text{D} = \\text{m}^{-1}\\)), তাই \\(f\\) অবশ্যই <b>মিটারে<\/b> বসাতে হবে।<br>উত্তল লেন্সের \\(f, P\\) ধনাত্মক (\\(+\\)) এবং অবতল লেন্সের \\(f, P\\) ঋণাত্মক (\\(-\\))।", "intuition": "লেন্সের সমীকরণ বস্তু দূরত্ব, বিম্ব দূরত্ব ও ফোকাস দূরত্বের জ্যামিতিক সম্পর্ক প্রকাশ করে, আর ক্ষমতা \\(P\\) বোঝায় লেন্সটি আলোকে কত তীব্রভাবে অভিসারী বা অপসারী করতে পারে। ফোকাস দূরত্ব যত কম, লেন্সের ক্ষমতা তত বেশি।", "trap": "ক্ষমতা ডায়প্টারে (\\(\\text{D}\\)) বের করতে ফোকাস দূরত্ব অবশ্যই মিটারে বসাতে হবে (সেন্টিমিটারে থাকলে \\(P = \\frac{100}{f}\\)), এবং অবতল লেন্সের \\(f\\) ও \\(P\\) অবশ্যই ঋণাত্মক ধরতে হবে।", "quickExample": "একটি অবতল লেন্সের ফোকাস দূরত্ব \\(f = -20\\text{ cm} = -0.2\\text{ m}\\) হলে এর ক্ষমতা \\(P = \\frac{1}{-0.2} = -5\\text{ D}\\)।"}, {"id": 76, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "প্রতিবিম্বের অবস্থান টেকনিক", "question": "উত্তল লেন্সে বস্তুর অবস্থান কোড (১–৬) ব্যবহার করে প্রতিবিম্বের অবস্থান নির্ণয়ের টেকনিকটি কী?", "answer": "১=অসীম, ২=অসীম ও \\(2F\\)-এর মাঝে, ৩=\\(2F\\), ৪=\\(2F\\) ও \\(F\\)-এর মাঝে, ৫=\\(F\\), ৬=\\(F\\) ও আলোক কেন্দ্রের মাঝে।<br>সূত্র: প্রতিবিম্বের অবস্থান \\(= 6 -\\) বস্তুর অবস্থান", "context": "<b>উদাহরণ:<\/b> বস্তু প্রধান ফোকাসে (কোড ৫) থাকলে প্রতিবিম্ব \\(= 6 - 5 = 1\\) অর্থাৎ অসীমে তৈরি হয়।<br>বস্তু \\(2F\\)-এ (কোড ৩) থাকলে প্রতিবিম্ব \\(= 6 - 3 = 3\\) (\\(2F\\)-এ সমান আকারের)।", "intuition": "উত্তল লেন্সে বস্তু অসীম থেকে ফোকাসের দিকে যত এগিয়ে আসে, বাস্তব প্রতিবিম্ব তত ফোকাস থেকে অসীমের দিকে সরে যায় এবং আকারে বড় হতে থাকে। এই প্রতিসম সম্পর্কের কারণেই ১ থেকে ৫ অবস্থানের ক্ষেত্রে বস্তু ও বিম্বের কোডের যোগফল সর্বদা ৬ হয়।", "trap": "'প্রতিবিম্বের অবস্থান \\(= 6 -\\) বস্তুর অবস্থান' শর্টকাটটি কেবল ১ থেকে ৫ নম্বর অবস্থানের (বাস্তব বিম্ব) জন্য প্রযোজ্য—বস্তু কোড ৬ (\\(F\\) ও আলোক কেন্দ্রের মাঝে) হলে বিম্ব বাস্তব না হয়ে লেন্সের একই পাশে অবাস্তব ও সোজা হয়।", "quickExample": "উত্তল লেন্সে বস্তু অসীম ও \\(2F\\)-এর মাঝে (কোড ২) থাকলে প্রতিবিম্বের অবস্থান \\(= 6 - 2 = 4\\), অর্থাৎ \\(2F\\) ও \\(F\\)-এর মাঝে (বাস্তব, উল্টো ও খর্বিত)।"}, {"id": 77, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "তুল্য লেন্স", "question": "সংস্পর্শে থাকা একাধিক লেন্সের তুল্য ফোকাস দূরত্ব \\(F\\) ও তুল্য ক্ষমতা \\(P\\) কত?", "answer": "\\(\\frac{1}{F} = \\frac{1}{f_1} + \\frac{1}{f_2} + \\dots + \\frac{1}{f_n}\\) এবং \\(P = P_1 + P_2 + \\dots + P_n\\)", "context": "<b>সতর্কতা:<\/b> উত্তল লেন্সের \\(f, P\\) ধনাত্মক এবং অবতল লেন্সের ঋণাত্মক চিহ্নসহ বসাতে হবে। \\(P = 0\\) হলে সমবায়টি সমতল কাচ ফলকের মতো আচরণ করে।", "intuition": "একাধিক পাতলা লেন্স পরস্পরের সংস্পর্শে রাখলে প্রথম লেন্সের তৈরি প্রতিবিম্ব দ্বিতীয় লেন্সের জন্য বস্তু হিসেবে কাজ করে, ফলে তাদের সম্মিলিত আলো বাঁকানোর ক্ষমতা বীজগাণিতিকভাবে যোগ হয়ে যায়।", "trap": "উত্তল ও অবতল লেন্সের সমবায়ে চিহ্ন না বসিয়ে সরাসরি মান যোগ করলে ভুল হয়—যেমন \\(+4\\text{ D}\\) ও \\(-4\\text{ D}\\) লেন্সের সমবায়ের ক্ষমতা \\(0\\) এবং তুল্য ফোকাস দূরত্ব অসীম (\\(\\infty\\))।", "quickExample": "\\(+5\\text{ D}\\) ও \\(-3\\text{ D}\\) ক্ষমতার দুটি লেন্স সংস্পর্শে রাখলে তুল্য ক্ষমতা \\(P = 5 + (-3) = +2\\text{ D}\\) এবং তুল্য ফোকাস দূরত্ব \\(F = \\frac{1}{2} = +0.5\\text{ m} = 50\\text{ cm}\\)।"}, {"id": 78, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "সরল অণুবীক্ষণ যন্ত্র", "question": "সরল অণুবীক্ষণ যন্ত্রের বিবর্ধন \\(m\\) নির্ণয়ের সূত্রগুলো কী?", "answer": "i. \\(m = 1 + \\frac{v}{f}\\) • ii. \\(m = 1 + \\frac{D}{f}\\) • iii. \\(m = 1 + \\frac{D - a}{f}\\) [\\(a\\) = লেন্স ও চোখের দূরত্ব; \\(D\\) = স্পষ্ট দর্শনের ন্যূনতম দূরত্ব]", "context": "<b>মান:<\/b> সুস্থ চোখের জন্য \\(D = 25\\text{ cm} = 0.25\\text{ m}\\)।<br><b>ধারণা:<\/b> এটি একটি স্বল্প ফোকাস দূরত্বের উত্তল লেন্স। বিম্ব অসীমে গঠিত হলে বিবর্ধন \\(m = \\frac{D}{f}\\) হয়।", "intuition": "সরল অণুবীক্ষণ যন্ত্র হলো একটি স্বল্প ফোকাস দূরত্বের উত্তল লেন্স, যার ফোকাসের ভেতরে বস্তু রাখলে চোখ সোজা, অবাস্তব ও বিবর্ধিত প্রতিবিম্ব দেখে। ফোকাস দূরত্ব \\(f\\) যত কম হয়, বস্তু তত কাছে এনে বেশি বিবর্ধন পাওয়া যায়।", "trap": "স্পষ্ট দর্শনের ন্যূনতম দূরত্বে (\\(D = 25\\text{ cm}\\)) বিবর্ধন \\(m = 1 + \\frac{D}{f}\\) হলেও, বিম্ব অসীমে (স্বাভাবিক দর্শন) গঠিত হলে \\(1\\) বাদ গিয়ে \\(m = \\frac{D}{f}\\) হয়—প্রশ্নের শর্ত না পড়ে সূত্র বসালে \\(1\\)-এর পার্থক্যে উত্তর ভুল হয়।", "quickExample": "\\(f = 5\\text{ cm}\\) ফোকাস দূরত্বের একটি সরল অণুবীক্ষণ যন্ত্রে স্পষ্ট দর্শনের ন্যূনতম দূরত্বে (\\(D = 25\\text{ cm}\\)) বিবর্ধন \\(m = 1 + \\frac{25}{5} = 1 + 5 = 6\\)।"}, {"id": 79, "ch": 6, "chapter": "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "topic": "যৌগিক অণুবীক্ষণ ও কৌণিক বিবর্ধন", "question": "যৌগিক অণুবীক্ষণ যন্ত্রের বিবর্ধন \\(m\\) এবং কৌণিক বিবর্ধনের সূত্র কী?", "answer": "\\(m = \\left|\\frac{v_0}{u_0}\\right|\\times\\left|\\frac{v_e}{u_e}\\right| = \\frac{v_0}{u_0}\\left(1 + \\frac{D}{f_e}\\right)\\)<br>কৌণিক বিবর্ধন: \\(m = \\frac{\\text{চোখে বিম্ব কর্তৃক সৃষ্ট কোণ}}{\\text{চোখে বস্তু কর্তৃক সৃষ্ট কোণ}} = \\frac{\\beta}{\\alpha}\\)", "context": "<b>প্রতীক:<\/b> \\(u_0, v_0\\) = অভিলক্ষ্যের (Objective) বস্তু ও বিম্ব দূরত্ব; \\(f_e\\) = অভিনেত্রের (Eyepiece) ফোকাস দূরত্ব।<br><b>তথ্য:<\/b> যৌগিক অণুবীক্ষণে অভিলক্ষ্যের চেয়ে অভিনেত্রের ফোকাস দূরত্ব ও উন্মেষ বড় হয় (\\(f_e \\gt  f_0\\))।", "intuition": "যৌগিক অণুবীক্ষণ যন্ত্রে দুটি উত্তল লেন্স পরপর দুই ধাপে বিবর্ধন ঘটায়—প্রথমে অভিলক্ষ্য বাস্তব ও বিবর্ধিত বিম্ব তৈরি করে, আর অভিনেত্র সেই বিম্বটিকে সরল অণুবীক্ষণের মতো আরও বড় করে দেখায়। তাই মোট বিবর্ধন দুটি লেন্সের বিবর্ধনের গুণফল হয়।", "trap": "যৌগিক অণুবীক্ষণ যন্ত্রে অভিলক্ষ্যের ফোকাস দূরত্ব ছোট এবং অভিনেত্রের ফোকাস দূরত্ব
